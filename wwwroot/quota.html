<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Hạn mức xe</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:900px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .bar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;align-items:center}
  input,button{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .kpis{display:flex;gap:12px;margin:10px 0}.kpi{border:1px solid var(--line);border-radius:12px;padding:10px 14px}.kpi .n{font-size:20px;font-weight:700}.kpi .l{font-size:12px;opacity:.6}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} td.n{text-align:right;font-variant-numeric:tabular-nums} #msg{font-size:13px}
</style></head>
<body>
<h1>Hạn mức phân bổ xe <span class="muted">(port 1:1 FrmMngQuota — Mst_Quota)</span></h1>
<div class="bar">
  <input id="dl" placeholder="Đại lý *" style="width:100px"><input id="md" placeholder="Model *" style="width:100px"><input id="pe" placeholder="Kỳ YYYYMM *" style="width:110px">
  <input id="qt" placeholder="Hạn mức" style="width:90px"><input id="us" placeholder="Đã dùng" style="width:90px">
  <button class="primary" onclick="save()">Lưu</button>
  <span style="flex:1"></span><input id="q" placeholder="Lọc kỳ" oninput="load()" style="width:100px"><span id="msg"></span>
</div>
<div class="kpis" id="kpis"></div>
<table><thead><tr><th>Kỳ</th><th>Đại lý</th><th>Model</th><th class="n">Hạn mức</th><th class="n">Đã dùng</th><th class="n">Còn</th></tr></thead>
<tbody id="rows"><tr><td colspan="6" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t,ok){ F("msg").textContent=t; F("msg").className=ok?"":"r"; }
async function load(){ await token();
  const d=await (await fetch("/api/quotas?period="+encodeURIComponent(F("q").value),{headers:H()})).json();
  F("kpis").innerHTML=[["Tổng HM",d.totalQty||0],["Đã dùng",d.totalUsed||0],["Còn",(d.totalQty||0)-(d.totalUsed||0)]].map(([l,n])=>`<div class="kpi"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("");
  F("rows").innerHTML=(d.rows||[]).map(x=>`<tr><td>${x.period}</td><td><b>${x.dealerCode}</b></td><td>${x.modelCode}</td>
    <td class="n">${x.qty}</td><td class="n">${x.usedQty}</td><td class="n">${x.remain}</td></tr>`).join("")||'<tr><td colspan="6" class="muted">Chưa có.</td></tr>';
}
async function save(){
  const r=await fetch("/api/quotas",{method:"POST",headers:H(),body:JSON.stringify({dealerCode:F("dl").value,modelCode:F("md").value,period:F("pe").value,qty:Number(F("qt").value||0),usedQty:Number(F("us").value||0)})});
  if(r.ok){ msg("Đã lưu.",true); F("qt").value="";F("us").value=""; load(); } else msg("Lỗi: "+((await r.json()).error||r.status),false);
}
load();
</script>
</body></html>
