<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — YC báo giá PT</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--warn:#d97706;--prog:#7c3aed;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1020px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
  .d-P{color:var(--warn)} .d-A{color:var(--accent)} .d-F{color:var(--ok)} .t-Pending{color:var(--warn)} .t-Quoted{color:var(--prog)} .t-Finished{color:var(--ok)}
  #msg{font-size:13px} .det{font-size:12px;opacity:.85}
</style></head>
<body>
<h1>Yêu cầu báo giá phụ tùng <span class="muted">(port 1:1 FrmReq_PartPrice — Req_PartPrice)</span></h1>
<div class="muted">DMS: P→A→F &nbsp;|&nbsp; TST: Chờ → Đã báo giá → Hoàn tất</div>
<div class="card">
  <b>Tạo yêu cầu báo giá</b>
  <table id="ltbl"><thead><tr><th>Mã PT *</th><th>Tên PT</th><th class="n">SL yêu cầu</th><th></th></tr></thead><tbody id="ltb"></tbody></table>
  <div class="bar" style="margin-top:8px"><button class="sm" onclick="addLine()">+ Dòng PT</button><span style="flex:1"></span><button class="primary" onclick="create()">Tạo YC</button><span id="msg"></span></div>
</div>
<div class="bar" style="margin:10px 0"><select id="fd" onchange="load()"><option value="">DMS: tất cả</option><option value="P">Mới tạo</option><option value="A">Đã gửi</option><option value="F">Hoàn tất</option></select>
  <select id="ft" onchange="load()"><option value="">TST: tất cả</option><option value="Pending">Chờ</option><option value="Quoted">Đã báo giá</option><option value="Finished">Hoàn tất</option></select></div>
<table><thead><tr><th>Số YC</th><th>Dòng</th><th class="n">Tổng báo giá</th><th>DMS</th><th>TST</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="6" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const D={P:"Mới tạo",A:"Đã gửi",F:"Hoàn tất"}, T={Pending:"Chờ",Quoted:"Đã báo giá",Finished:"Hoàn tất"}; const n=x=>Number(x||0).toLocaleString("vi-VN");
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
function addLine(){ const tr=document.createElement("tr");
  tr.innerHTML=`<td><input class="pc" style="width:100px"></td><td><input class="pn" style="width:150px"></td><td class="n"><input class="qt" type="number" value="1" style="width:70px;text-align:right"></td><td><button class="sm" onclick="this.closest('tr').remove()">×</button></td>`;
  F("ltb").appendChild(tr); }
async function create(){
  const lines=[...F("ltb").querySelectorAll("tr")].map(tr=>({partCode:tr.querySelector(".pc").value,partName:tr.querySelector(".pn").value,reqQty:Number(tr.querySelector(".qt").value||0)})).filter(l=>l.partCode&&l.reqQty>0);
  const r=await fetch("/api/reqpartprices",{method:"POST",headers:H(),body:JSON.stringify({lines})});
  const j=await r.json();
  if(r.ok){ msg("Đã tạo "+j.reqNo+"."); F("ltb").innerHTML="";addLine(); load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/reqpartprices?dms=${F("fd").value}&tst=${F("ft").value}`,{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(r=>{
    let act="";
    if(r.dmsStatus==="P") act=`<button class="sm" onclick="send('${r.reqNo}')">Gửi TST</button>`;
    else if(r.tstStatus==="Pending") act=`<button class="sm" onclick="quote('${r.reqNo}')">TST báo giá</button>`;
    else if(r.tstStatus==="Quoted") act=`<button class="sm" onclick="finish('${r.reqNo}')">Chấp nhận</button>`;
    return `<tr><td><b>${r.reqNo}</b> <a href="#" class="det" onclick="lines('${r.reqNo}');return false">xem</a></td><td>${r.lines}</td><td class="n">${n(r.quotedTotal)}</td>
      <td><span class="pill d-${r.dmsStatus}">${D[r.dmsStatus]||r.dmsStatus}</span></td><td><span class="pill t-${r.tstStatus}">${T[r.tstStatus]||r.tstStatus}</span></td><td>${act}</td></tr><tr id="x-${r.reqNo}"></tr>`;
  }).join("")||'<tr><td colspan="6" class="muted">Chưa có YC.</td></tr>';
}
async function send(no){ const r=await fetch(`/api/reqpartprices/${no}/send`,{method:"POST",headers:H()}); const j=await r.json(); if(r.ok) load(); else msg("Lỗi: "+(j.error||r.status)); }
async function finish(no){ const r=await fetch(`/api/reqpartprices/${no}/finish`,{method:"POST",headers:H()}); const j=await r.json(); if(r.ok) load(); else msg("Lỗi: "+(j.error||r.status)); }
async function quote(no){
  const d=await (await fetch(`/api/reqpartprices/${no}/lines`,{headers:H()})).json();
  const quotes=[];
  for(const l of (d.lines||[])){ const p=prompt(`Giá cho ${l.partCode} (SL ${l.reqQty}):`,l.quotedPrice||"0"); if(p===null) return; quotes.push({partCode:l.partCode,quotedPrice:Number(p||0)}); }
  const r=await fetch(`/api/reqpartprices/${no}/quote`,{method:"POST",headers:H(),body:JSON.stringify({quotes})});
  const j=await r.json(); if(r.ok){ msg("Đã báo giá "+j.filled+" dòng."); load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function lines(no){
  const row=F("x-"+no); if(row.innerHTML){ row.innerHTML=""; return; }
  const d=await (await fetch(`/api/reqpartprices/${no}/lines`,{headers:H()})).json();
  row.innerHTML=`<td colspan="6"><div class="det">${(d.lines||[]).map(l=>`${l.partCode} ×${l.reqQty} @${n(l.quotedPrice)} = ${n(l.lineTotal)}`).join(" &nbsp;|&nbsp; ")||"—"} &nbsp;<b>Tổng: ${n(d.quotedTotal)}</b></div></td>`;
}
addLine(); load();
</script>
</body></html>
