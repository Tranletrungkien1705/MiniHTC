<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Báo cáo tiến độ sản xuất</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--ok:#16a34a;--warn:#d97706}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1020px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px} h3{font-size:14px;margin:14px 0 4px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:12px 0}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} td.num{text-align:right;font-variant-numeric:tabular-nums} .wrap{overflow-x:auto}
  .kpi{display:flex;gap:10px;flex-wrap:wrap} .box{border:1px solid var(--line);border-radius:10px;padding:8px 12px} .box b{font-size:18px;display:block} .box span{font-size:11px;opacity:.7}
  .bar-mini{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:80px} .bar-mini>i{display:block;height:100%;background:var(--ok)}
  #msg{font-size:13px}
</style></head>
<body>
<h1>Báo cáo tiến độ sản xuất <span class="muted">(port 1:1 báo cáo WO_Schedule — Report)</span></h1>
<p class="muted">Tổng hợp SL đặt / đã sản xuất / còn lại theo model + % hoàn thành. Nguồn = màn Lịch sản xuất / ETA.</p>
<div class="bar">
  <div><label>Model</label><input id="qm" style="width:100px"></div>
  <div><label>Trạng thái lịch</label><select id="qs"><option value="">Tất cả</option><option value="Open">Đang SX</option><option value="Closed">Hoàn thành</option></select></div>
  <button class="primary" onclick="run()">Xem báo cáo</button><span id="msg"></span>
</div>
<div class="kpi" id="kpi" style="margin:8px 0"></div>
<h3>Theo model</h3>
<div class="wrap"><table><thead><tr><th>Model</th><th class="num">SL đặt</th><th class="num">Đã SX</th><th class="num">Còn lại</th><th>% hoàn thành</th></tr></thead><tbody id="mRows"></tbody></table></div>
<h3>Chi tiết lệnh SX</h3>
<div class="wrap"><table><thead><tr><th>Số lệnh SX</th><th>Model</th><th>Đặc tả</th><th>Màu</th><th class="num">SL đặt</th><th class="num">Đã SX</th><th class="num">Còn lại</th><th>%</th></tr></thead><tbody id="rows"><tr><td colspan="8" class="muted">Nhấn "Xem báo cáo".</td></tr></tbody></table></div>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY}; }
function msg(t){ F("msg").textContent=t; }
function pbar(p){ return `<div class="bar-mini"><i style="width:${p}%"></i></div> ${p}%`; }
async function run(){ await token(); msg("");
  const r=await fetch(`/api/report/production?model=${F("qm").value}&status=${F("qs").value}`,{headers:H()});
  const d=await r.json();
  if(!r.ok){ msg("Lỗi: "+(d.error||r.status)); return; }
  F("kpi").innerHTML=`<div class="box"><b>${d.schedules}</b><span>Số lịch SX</span></div><div class="box"><b>${d.totalOrder}</b><span>Tổng đặt</span></div><div class="box"><b>${d.totalProduct}</b><span>Đã SX</span></div><div class="box"><b>${d.totalRemain}</b><span>Còn lại</span></div><div class="box"><b>${d.overallPct}%</b><span>Hoàn thành</span></div>`;
  F("mRows").innerHTML=(d.byModel||[]).map(o=>`<tr><td><b>${o.modelCode}</b></td><td class="num">${o.qtyOrder}</td><td class="num">${o.qtyProduct}</td><td class="num">${o.qtyRemain}</td><td>${pbar(o.completePct)}</td></tr>`).join("")||'<tr><td colspan="5" class="muted">—</td></tr>';
  F("rows").innerHTML=(d.detail||[]).map(o=>`<tr><td><b>${o.workOrderNo}</b></td><td>${o.modelCode||""}</td><td>${o.specCode||""}</td><td>${o.colorCode||""}</td><td class="num">${o.qtyOrder}</td><td class="num">${o.qtyProduct}</td><td class="num">${o.qtyRemain}</td><td>${o.completePct}%</td></tr>`).join("")||'<tr><td colspan="8" class="muted">Không có dữ liệu.</td></tr>';
}
</script>
</body></html>
