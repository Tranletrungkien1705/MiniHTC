<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Chăm sóc KH</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--warn:#d97706;--prog:#7c3aed;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1020px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .bar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;align-items:center}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .p-Pending{color:var(--warn)} .p-Contacted{color:var(--prog)} .p-Closed{color:var(--ok)}
  .kpi{display:inline-block;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-right:8px} #msg{font-size:13px}
</style></head>
<body>
<h1>Chăm sóc khách hàng <span class="muted">(port 1:1 FrmCustomerCare — Ser_CustomerCare)</span></h1>
<div class="bar">
  <select id="ty"><option value="CARE24H">Chăm sóc 24h</option><option value="CARE72H">Chăm sóc 72h</option><option value="DOB">Sinh nhật</option><option value="MAINT">Nhắc bảo dưỡng</option></select>
  <input id="pl" placeholder="Biển số" style="width:100px"><input id="cn" placeholder="Chủ xe" style="width:120px"><input id="cp" placeholder="SĐT *" style="width:110px">
  <input id="ro" placeholder="Số RO (nếu có)" style="width:130px"><input id="cd" type="date" title="Ngày liên hệ dự kiến">
  <button class="primary" onclick="save()">Tạo phiếu CS</button><span id="msg"></span>
</div>
<div class="bar">
  <span class="kpi">Tổng: <b id="kt">0</b></span><span class="kpi">Chờ gọi: <b id="kp">0</b></span>
  <span style="flex:1"></span>
  <select id="fty" onchange="load()"><option value="">Tất cả loại</option><option value="CARE24H">24h</option><option value="CARE72H">72h</option><option value="DOB">Sinh nhật</option><option value="MAINT">Bảo dưỡng</option></select>
  <select id="fst" onchange="load()"><option value="">Tất cả TT</option><option value="Pending">Chờ gọi</option><option value="Contacted">Đã liên hệ</option><option value="Closed">Đã đóng</option></select>
</div>
<table><thead><tr><th>Số phiếu</th><th>Loại</th><th>Biển số</th><th>Chủ xe</th><th>SĐT</th><th>Kết quả</th><th>Trạng thái</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="8" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const TY={CARE24H:"24h",CARE72H:"72h",DOB:"Sinh nhật",MAINT:"Bảo dưỡng"};
const ST={Pending:"Chờ gọi",Contacted:"Đã liên hệ",Closed:"Đã đóng"};
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
async function save(){
  const b={careType:F("ty").value,plateNo:F("pl").value,cusName:F("cn").value,cusPhone:F("cp").value,rONo:F("ro").value,contactDate:F("cd").value||null};
  const r=await fetch("/api/customercares",{method:"POST",headers:H(),body:JSON.stringify(b)});
  const j=await r.json();
  if(r.ok){ msg("Đã tạo "+j.careNo+"."); F("pl").value="";F("cp").value=""; load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/customercares?type=${F("fty").value}&status=${F("fst").value}`,{headers:H()})).json();
  F("kt").textContent=d.count; F("kp").textContent=d.pending;
  F("rows").innerHTML=(d.items||[]).map(c=>{
    let act="";
    if(c.status==="Pending") act=`<button class="sm" onclick="contact('${c.careNo}')">Ghi liên hệ</button>`;
    else if(c.status==="Contacted") act=`<button class="sm" onclick="close_('${c.careNo}')">Đóng</button>`;
    return `<tr><td><b>${c.careNo}</b></td><td><span class="pill">${TY[c.careType]||c.careType}</span></td><td>${c.plateNo||"—"}</td><td>${c.cusName||"—"}</td><td>${c.cusPhone||"—"}</td>
      <td class="muted">${c.result||"—"}</td><td><span class="pill p-${c.status}">${ST[c.status]||c.status}</span></td><td>${act}</td></tr>`;
  }).join("")||'<tr><td colspan="8" class="muted">Chưa có phiếu.</td></tr>';
}
async function contact(no){ const rs=prompt("Kết quả liên hệ "+no+":"); if(rs===null) return;
  const r=await fetch(`/api/customercares/${no}/contact`,{method:"POST",headers:H(),body:JSON.stringify({result:rs})});
  const j=await r.json(); if(r.ok) load(); else msg("Lỗi: "+(j.error||r.status)); }
async function close_(no){ const r=await fetch(`/api/customercares/${no}/close`,{method:"POST",headers:H()}); const j=await r.json(); if(r.ok) load(); else msg("Lỗi: "+(j.error||r.status)); }
load();
</script>
</body></html>
