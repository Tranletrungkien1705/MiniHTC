<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Báo cáo bán hàng HMC</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1040px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:10px 0}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} .wrap{overflow-x:auto} td.mono{font-family:ui-monospace,monospace}
  .kpi{display:flex;gap:10px;flex-wrap:wrap} .box{border:1px solid var(--line);border-radius:10px;padding:8px 12px} .box b{font-size:18px;display:block} .box span{font-size:11px;opacity:.7}
  #msg{font-size:13px}
</style></head>
<body>
<h1>Báo cáo bán hàng HMC <span class="muted">(port 1:1 FrmHMCReport — SalesDealer)</span></h1>
<div class="card">
  <b>Đăng ký bản ghi bán hàng (nguồn báo cáo)</b>
  <div class="bar" style="margin-top:10px">
    <div><label>VIN *</label><input id="vin" style="width:130px"></div>
    <div><label>Đại lý</label><input id="dl" style="width:80px"></div>
    <div><label>Model</label><input id="md" style="width:80px"></div>
    <div><label>Ngày GD *</label><input id="td" type="date" style="width:150px"></div>
    <div><label>Loại giao</label><input id="dt" style="width:90px" value="DLR"></div>
    <div><label>Loại bán (2 ký tự)</label><input id="st" style="width:100px" value="NA" maxlength="2"></div>
    <button class="primary" onclick="save()">Lưu</button><span id="msg"></span>
  </div>
</div>
<div class="bar">
  <div><label>Từ ngày</label><input id="qf" type="date"></div>
  <div><label>Đến ngày</label><input id="qt" type="date"></div>
  <div><label>Đại lý</label><input id="qd" style="width:90px"></div>
  <button class="primary" onclick="run()">Xem báo cáo</button>
</div>
<div class="kpi" id="kpi" style="margin:8px 0"></div>
<div class="wrap"><table><thead><tr><th>Ngày GD</th><th>VIN</th><th>ĐL</th><th>Model</th><th>Loại giao</th><th>Loại bán</th><th>N</th><th>O</th></tr></thead>
<tbody id="rows"><tr><td colspan="8" class="muted">Nhấn "Xem báo cáo".</td></tr></tbody></table></div>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
async function save(){ await token();
  const b={vin:F("vin").value,dealerCode:F("dl").value,modelCode:F("md").value,transactionDate:F("td").value||null,deliveryType:F("dt").value,salesType:F("st").value};
  const r=await fetch("/api/hmcsales",{method:"POST",headers:H(),body:JSON.stringify(b)});
  const j=await r.json();
  if(r.ok){ msg("Đã lưu "+j.vin); F("vin").value=""; } else msg("Lỗi: "+(j.error||r.status));
}
async function run(){ await token();
  const d=await (await fetch(`/api/hmcreport?from=${F("qf").value}&to=${F("qt").value}&dealer=${F("qd").value}`,{headers:H()})).json();
  F("kpi").innerHTML=`<div class="box"><b>${d.total}</b><span>Tổng xe</span></div>`+
    (d.byDelivery||[]).map(x=>`<div class="box"><b>${x.count}</b><span>Giao: ${x.deliveryType}</span></div>`).join("")+
    (d.bySalesType||[]).map(x=>`<div class="box"><b>${x.count}</b><span>Bán: ${x.salesType}</span></div>`).join("");
  F("rows").innerHTML=(d.rows||[]).map(o=>
    `<tr><td class="mono">${o.transactionDate}</td><td><b>${o.VIN||o.vin}</b></td><td>${o.dealerCode||""}</td><td>${o.modelCode||""}</td><td>${o.deliveryType||""}</td><td>${o.salesType||""}</td><td>${o.n||""}</td><td>${o.o||""}</td></tr>`
  ).join("")||'<tr><td colspan="8" class="muted">Không có dữ liệu.</td></tr>';
}
</script>
</body></html>
