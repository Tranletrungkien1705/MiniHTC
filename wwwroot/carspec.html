<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Quy cách xe</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--warn:#d97706;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1080px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-items:end}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit;box-sizing:border-box}
  .grid input{width:100%}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .p-1{color:var(--ok)} .p-0{color:#dc2626}
  #msg{font-size:13px}
</style></head>
<body>
<h1>Quy cách xe (Spec) <span class="muted">(port 1:1 FrmCarSpec — Mst_CarSpec)</span></h1>
<div class="card">
  <b>Thêm quy cách xe</b>
  <div class="grid" style="margin-top:10px">
    <div><label>Mã Spec *</label><input id="sc"></div>
    <div><label>Model</label><input id="md"></div>
    <div><label>Std/Opt</label><input id="so"></div>
    <div><label>Grade</label><input id="gr"></div>
    <div><label>OCN</label><input id="ocn"></div>
    <div><label>Spec gốc (RootSpec) *</label><input id="rs"></div>
    <div><label>Số chỗ</label><input id="ns" type="number"></div>
    <div><label>Mô tả</label><input id="ds"></div>
    <div><label>Lắp ráp</label><select id="as"><option value="">—</option><option value="CKD">CKD</option><option value="CBU">CBU</option></select></div>
    <div><label>Xuất xứ (bắt buộc nếu CBU)</label><input id="on"></div>
    <div><label>Ngày quota</label><input id="qd" type="date"></div>
  </div>
  <div class="bar"><label class="muted"><input type="checkbox" id="amb"> Xe cứu thương</label>
    <label class="muted"><input type="checkbox" id="inv"> Có HĐ nhà máy (bắt buộc nếu CKD)</label>
    <label class="muted"><input type="checkbox" id="dep"> Cần đặt cọc</label>
    <button class="primary" onclick="create()">Lưu Spec</button><span id="msg"></span></div>
</div>
<div class="bar" style="margin:10px 0"><input id="q" placeholder="Tìm mã/mô tả" oninput="load()" style="width:150px"><input id="qm" placeholder="Lọc model" oninput="load()" style="width:100px"><select id="fa" onchange="load()"><option value="">Tất cả</option><option value="1">Hoạt động</option><option value="0">Ngừng</option></select></div>
<table><thead><tr><th>Mã Spec</th><th>Model</th><th>Grade</th><th>OCN</th><th>Số chỗ</th><th>Mô tả</th><th>Cứu thương</th><th>TT</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="9" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
async function create(){
  const body={specCode:F("sc").value,modelCode:F("md").value,stdOptCode:F("so").value,gradeCode:F("gr").value,oCNCode:F("ocn").value,specDesc:F("ds").value,rootSpec:F("rs").value,numberOfSeats:parseInt(F("ns").value)||null,flagAmbulance:F("amb").checked?"1":"0",assemblyStatus:F("as").value,flagInvoiceFactory:F("inv").checked?"1":"0",flagDepositPmt:F("dep").checked?"1":"0",originNo:F("on").value,quotaDate:F("qd").value||null};
  const r=await fetch("/api/carspecs",{method:"POST",headers:H(),body:JSON.stringify(body)});
  const j=await r.json();
  if(r.ok){ msg("Đã lưu "+j.specCode); ["sc","md","so","gr","ocn","rs","ns","ds","on","qd"].forEach(x=>F(x).value=""); load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/carspecs?q=${F("q").value}&model=${F("qm").value}&active=${F("fa").value}`,{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(o=>
    `<tr><td><b>${o.specCode}</b></td><td>${o.modelCode||""}</td><td>${o.gradeCode||""}</td><td>${o.oCNCode||""}</td><td>${o.numberOfSeats||""}</td><td>${o.specDesc||""}</td><td>${o.flagAmbulance==="1"?"✓":""}</td><td><span class="pill p-${o.flagActive}">${o.flagActive==="1"?"HĐ":"Ngừng"}</span></td><td><button class="sm" onclick="toggle('${o.specCode}')">Đổi TT</button></td></tr>`
  ).join("")||'<tr><td colspan="9" class="muted">Chưa có spec.</td></tr>';
}
async function toggle(c){ const r=await fetch(`/api/carspecs/${c}/toggle`,{method:"POST",headers:H()}); const j=await r.json(); if(r.ok) load(); else msg("Lỗi: "+(j.error||r.status)); }
load();
</script>
</body></html>
