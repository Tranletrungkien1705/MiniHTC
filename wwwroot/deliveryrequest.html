<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Đề nghị giao xe</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#4f46e5;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--info:#0891b2}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1000px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px} h3{font-size:14px;margin:14px 0 4px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.link{border:none;background:none;color:var(--accent);padding:2px 6px}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)} th{opacity:.7;font-size:11px;text-transform:uppercase} .wrap{overflow-x:auto}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .s-Draft{color:var(--warn)} .s-Sent{color:var(--info)} .s-Approved{color:var(--ok)} .s-Rejected{color:var(--bad)}
  .msg{font-size:13px;margin-left:6px} textarea{width:100%;min-height:56px}
</style></head>
<body>
<h1>Đề nghị giao xe <span class="muted">(port 1:1 FrmNewDR/FrmHTCMngDR/FrmDRApproved — 2010.HTC/Sales)</span></h1>
<div class="card"><h3 style="margin-top:0">Tạo đề nghị giao xe (đại lý)</h3>
  <div class="row"><div><label>Đại lý</label><input id="hDlr" style="width:120px"></div><div><label>Ngày đề nghị</label><input id="hDate" type="date"></div></div>
  <h3>Xe cần giao (Mã xe/VIN [tab] Model [tab] Ngày giao [tab] Ghi chú — mỗi dòng 1)</h3>
  <textarea id="hCars" placeholder="VIN001&#9;ACCENT&#9;2026-10-01&#9;gap&#10;VIN002&#9;TUCSON&#9;&#9;"></textarea>
  <div class="row" style="margin-top:6px"><button class="primary" onclick="save()">Tạo (Nháp)</button><span id="msg" class="msg"></span></div>
</div>
<div class="row" style="margin:8px 0"><div><label>Trạng thái</label><input id="qS" placeholder="Draft/Sent/Approved" style="width:130px"></div><button onclick="load()">Xem</button></div>
<div class="wrap"><table><thead><tr><th>Số ĐN</th><th>Đại lý</th><th>Ngày</th><th>Số xe</th><th>Trạng thái</th><th>Ghi chú</th><th>Thao tác</th></tr></thead>
<tbody id="rows"><tr><td colspan="7" class="muted">Nhấn "Xem".</td></tr></tbody></table></div>
<div class="card" id="det" style="display:none"><h3 style="margin-top:0">Xe <span id="detName" class="muted"></span></h3><div class="wrap"><table><thead><tr><th>Mã xe</th><th>Model</th><th>Ngày giao</th><th>Ghi chú</th></tr></thead><tbody id="detRows"></tbody></table></div></div>

<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
const ST={Draft:"Nháp",Sent:"Đã gửi",Approved:"Duyệt",Rejected:"Từ chối"};
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(extra){ return Object.assign({"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY}, extra||{}); }
function m(t){ F("msg").textContent=t; setTimeout(()=>{if(F("msg").textContent===t)F("msg").textContent="";},3500); }
function parseCars(){ return F("hCars").value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{ const c=l.split(/\t|,/).map(x=>x.trim()); return {CarId:c[0]||"",ModelCode:c[1]||"",DeliveryStartDate:c[2]||null,Remark:c[3]||""}; }); }
async function save(){ await token();
  const body={DealerCode:F("hDlr").value,RequestDate:F("hDate").value||null,Cars:parseCars()};
  const r=await fetch("/api/deliveryrequests",{method:"POST",headers:H({"Content-Type":"application/json"}),body:JSON.stringify(body)});
  const d=await r.json(); if(!r.ok){ m("Lỗi: "+(d.error||r.status)); return; } m("Đã tạo "+d.dRNo); F("hCars").value=""; load();
}
async function act(id,action){ await token(); let note=null; if(action==="reject"){ note=prompt("Lý do từ chối:"); if(!note) return; }
  const r=await fetch("/api/deliveryrequests/"+id+"/action",{method:"POST",headers:H({"Content-Type":"application/json"}),body:JSON.stringify({Action:action,Note:note})});
  const d=await r.json(); if(!r.ok){ alert(d.error||r.status); return; } load(); }
function acts(o){ let h=`<button class="link" onclick="detail(${o.id},'${esc(o.dRNo)}')">Xe</button>`;
  if(o.status==="Draft") h+=`<button class="link" onclick="act(${o.id},'submit')">Gửi</button>`;
  if(o.status==="Sent") h+=`<button class="link" onclick="act(${o.id},'approve')">Duyệt</button><button class="link" onclick="act(${o.id},'reject')">Từ chối</button>`;
  return h; }
async function detail(id,no){ await token(); const r=await fetch("/api/deliveryrequests/"+id+"/cars",{headers:H()}); const d=await r.json();
  F("det").style.display="block"; F("detName").textContent="— "+no;
  F("detRows").innerHTML=(d.cars||[]).map(o=>`<tr><td><b>${esc(o.carId)}</b></td><td>${esc(o.modelCode)}</td><td>${esc(o.deliveryStartDate)}</td><td>${esc(o.remark)}</td></tr>`).join("")||'<tr><td colspan="4" class="muted">—</td></tr>'; }
async function load(){ await token();
  const r=await fetch("/api/deliveryrequests?status="+F("qS").value,{headers:H()}); const d=await r.json();
  F("rows").innerHTML=(d.items||[]).map(o=>`<tr><td><b>${esc(o.dRNo)}</b></td><td>${esc(o.dealerCode)}</td><td>${esc(o.requestDate)}</td><td>${o.cars}</td><td><span class="pill s-${o.status}">${ST[o.status]||o.status}</span></td><td>${esc(o.note)}</td><td>${acts(o)}</td></tr>`).join("")||'<tr><td colspan="7" class="muted">Chưa có ĐN.</td></tr>';
}
</script>
</body></html>
