<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — KPI dịch vụ</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#4f46e5;--ok:#16a34a;--bad:#dc2626;--warn:#d97706}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:960px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px} h3{font-size:14px;margin:16px 0 6px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:10px 0}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:10px}
  .kpi{border:1px solid var(--line);border-radius:12px;padding:14px} .kpi b{font-size:24px;display:block} .kpi .lbl{font-size:12px;opacity:.7}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)} th{opacity:.7;font-size:11px;text-transform:uppercase} td.num{text-align:right;font-variant-numeric:tabular-nums} .wrap{overflow-x:auto}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
</style></head>
<body>
<h1>KPI dịch vụ tổng hợp <span class="muted">(port 1:1 FrmReportKPI/CollectiveDisplay_KPI/Correct_Repair_Rate — TCMotor)</span></h1>
<p class="muted">Bảng chỉ số điều hành xưởng dịch vụ: số RO, tỉ lệ hoàn tất, doanh thu hóa đơn đã thu, giá trị TB/hóa đơn.</p>
<div class="row">
  <div><label>Từ ngày</label><input id="from" type="date"></div>
  <div><label>Đến ngày</label><input id="to" type="date"></div>
  <button class="primary" onclick="load()">Tải KPI</button>
</div>
<div class="grid" id="kpis"></div>
<h3>Phân bố RO theo trạng thái</h3>
<div class="wrap"><table><thead><tr><th>Trạng thái</th><th class="num">Số RO</th></tr></thead><tbody id="rows"><tr><td colspan="2" class="muted">Nhấn "Tải KPI".</td></tr></tbody></table></div>

<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const M=n=>Math.round(+n||0).toLocaleString("vi-VN"); const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
const ST={HasRO:"Chờ sửa",InGarage:"Đang sửa",Repaired:"Sửa xong",CheckEnd:"Đã kiểm",Paid:"Đã thu",Finished:"Đã giao xe"};
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY}; }
async function load(){ await token();
  const p=new URLSearchParams(); if(F("from").value)p.set("fromDate",F("from").value); if(F("to").value)p.set("toDate",F("to").value);
  const r=await fetch("/api/report/service-kpi?"+p.toString(),{headers:H()}); const d=await r.json();
  F("kpis").innerHTML=`
    <div class="kpi"><b>${M(d.totalRO)}</b><span class="lbl">Tổng lệnh sửa chữa</span></div>
    <div class="kpi"><b style="color:var(--ok)">${M(d.finished)}</b><span class="lbl">Đã giao xe</span></div>
    <div class="kpi"><b style="color:${d.correctRate<80?'var(--warn)':'var(--ok)'}">${d.correctRate}%</b><span class="lbl">Tỉ lệ hoàn tất</span></div>
    <div class="kpi"><b style="color:var(--ok)">${M(d.revenue)}</b><span class="lbl">Doanh thu đã thu</span></div>
    <div class="kpi"><b>${M(d.avgTicket)}</b><span class="lbl">TB/hóa đơn</span></div>
    <div class="kpi"><b>${M(d.paidInvoices)}/${M(d.totalInvoices)}</b><span class="lbl">HĐ đã thu / tổng</span></div>
    <div class="kpi"><b style="color:${d.unpaidInvoices>0?'var(--bad)':'inherit'}">${M(d.unpaidInvoices)}</b><span class="lbl">HĐ chưa thu</span></div>`;
  F("rows").innerHTML=(d.byStatus||[]).map(o=>`<tr><td><span class="pill">${ST[o.status]||o.status}</span></td><td class="num">${M(o.count)}</td></tr>`).join("")||'<tr><td colspan="2" class="muted">Không có RO.</td></tr>';
}
</script>
</body></html>
