<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Đề nghị giấy tờ xe</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--warn:#d97706;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1020px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .p-Draft{color:var(--warn)} .p-Done{color:var(--ok)}
  #msg{font-size:13px} .cars{font-size:12px;opacity:.85} #ctbl td,#ctbl th{padding:4px 6px}
</style></head>
<body>
<h1>Đề nghị giấy tờ xe (DR) <span class="muted">(port 1:1 FrmNewDR — CarDocRequest)</span></h1>
<div class="card">
  <b>Tạo đề nghị giấy tờ xe</b>
  <div class="bar" style="margin:10px 0">
    <input id="dl" placeholder="Đại lý" style="width:100px">
    <input id="rp" placeholder="Người nhận *" style="width:150px">
    <input id="ra" placeholder="Địa chỉ nhận *" style="width:230px">
    <span style="flex:1"></span><button class="primary" onclick="create()">Lưu DR</button><span id="msg"></span>
  </div>
  <table id="ctbl"><thead><tr><th>VIN/CarId *</th><th>Ghi chú</th><th>Ngày giao</th><th></th></tr></thead><tbody id="ctb"></tbody></table>
  <button class="sm" style="margin-top:6px" onclick="addCar()">+ Thêm xe</button>
</div>
<div class="bar" style="margin:10px 0"><select id="fst" onchange="load()"><option value="">Tất cả</option><option value="Draft">Nháp</option><option value="Done">Hoàn tất</option></select><input id="q" placeholder="Lọc đại lý" oninput="load()" style="width:110px"></div>
<table><thead><tr><th>Số DR</th><th>Đại lý</th><th>Người nhận</th><th>Số xe</th><th>Ngày tạo</th><th>Trạng thái</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="7" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const LBL={Draft:"Nháp",Done:"Hoàn tất"}; const day=d=>d? new Date(d).toLocaleString("vi-VN"):"";
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
function addCar(){ const tr=document.createElement("tr");
  tr.innerHTML=`<td><input class="vin" style="width:140px"></td><td><input class="rm" style="width:150px"></td><td><input class="dd" type="date"></td><td><button class="sm" onclick="this.closest('tr').remove()">×</button></td>`;
  F("ctb").appendChild(tr); }
async function create(){
  const cars=[...F("ctb").querySelectorAll("tr")].map(tr=>({carId:tr.querySelector(".vin").value,remark:tr.querySelector(".rm").value,deliveryStartDate:tr.querySelector(".dd").value||null})).filter(c=>c.carId);
  const r=await fetch("/api/cardocrequests",{method:"POST",headers:H(),body:JSON.stringify({dealerCode:F("dl").value,receivedPerson:F("rp").value,receivedAddress:F("ra").value,cars})});
  const j=await r.json();
  if(r.ok){ msg("Đã tạo "+j.requestNo+" ("+j.cars+" xe)."); F("ctb").innerHTML="";addCar(); load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/cardocrequests?status=${F("fst").value}&dealer=${F("q").value}`,{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(o=>{
    let act=o.status==="Draft"?`<button class="sm" onclick="done('${o.requestNo}')">Hoàn tất</button>`:"";
    return `<tr><td><b>${o.requestNo}</b> <a href="#" class="cars" onclick="cars('${o.requestNo}');return false">xem xe</a></td><td>${o.dealerCode||""}</td><td>${o.receivedPerson}</td><td>${o.cars}</td>
      <td>${day(o.createdAt)}</td><td><span class="pill p-${o.status}">${LBL[o.status]||o.status}</span></td><td>${act}</td></tr><tr id="x-${o.requestNo}"></tr>`;
  }).join("")||'<tr><td colspan="7" class="muted">Chưa có DR.</td></tr>';
}
async function done(no){ const r=await fetch(`/api/cardocrequests/${no}/complete`,{method:"POST",headers:H()}); const j=await r.json(); if(r.ok) load(); else msg("Lỗi: "+(j.error||r.status)); }
async function cars(no){
  const row=F("x-"+no); if(row.innerHTML){ row.innerHTML=""; return; }
  const d=await (await fetch(`/api/cardocrequests/${no}/cars`,{headers:H()})).json();
  row.innerHTML=`<td colspan="7"><div class="cars">${(d.cars||[]).map(c=>`Xe <b>${c.carId}</b>${c.remark?" · "+c.remark:""}${c.deliveryStartDate?" · giao "+new Date(c.deliveryStartDate).toLocaleDateString("vi-VN"):""}`).join(" &nbsp;|&nbsp; ")||"—"}</div></td>`;
}
addCar(); load();
</script>
</body></html>
