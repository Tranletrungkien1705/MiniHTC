<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Đề nghị bảo hiểm</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--warn:#d97706;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1080px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} td.num{text-align:right;font-variant-numeric:tabular-nums}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .p-Draft{color:var(--warn)} .p-Confirmed{color:var(--ok)} .p-Cancelled{color:#dc2626}
  #msg{font-size:13px} .cars{font-size:12px;opacity:.85} #ctbl td,#ctbl th{padding:4px 6px}
</style></head>
<body>
<h1>Đề nghị bảo hiểm <span class="muted">(port 1:1 FrmNewInsuranceReq — Ins_InsuranceReq)</span></h1>
<div class="card">
  <b>Tạo đề nghị bảo hiểm</b>
  <div class="bar" style="margin:10px 0"><div><label>Hãng BH *</label><input id="co" style="width:110px"></div><div><label>Loại hình BH *</label><input id="tp" style="width:110px"></div><span style="flex:1"></span><button class="primary" onclick="create()">Lưu ĐN</button><span id="msg"></span></div>
  <table id="ctbl"><thead><tr><th>VIN *</th><th>Ngày BĐ</th><th>Số tiền BH</th><th>Số ngày</th><th>Từ</th><th>Đến</th><th>Phí</th><th>Tỷ lệ</th><th></th></tr></thead><tbody id="ctb"></tbody></table>
  <button class="sm" style="margin-top:6px" onclick="addCar()">+ Thêm xe</button>
</div>
<div class="bar" style="margin:10px 0"><select id="fst" onchange="load()"><option value="">Tất cả</option><option value="Draft">Nháp</option><option value="Confirmed">Đã xác nhận</option><option value="Cancelled">Đã hủy</option></select><input id="q" placeholder="Lọc hãng BH" oninput="load()" style="width:110px"></div>
<table><thead><tr><th>Số ĐN</th><th>Hãng</th><th>Loại</th><th>Số xe</th><th class="num">Tổng tiền BH</th><th>Ngày tạo</th><th>TT</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="8" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const money=n=>(n||0).toLocaleString("vi-VN"); const day=d=>d? new Date(d).toLocaleString("vi-VN"):""; const LBL={Draft:"Nháp",Confirmed:"Đã xác nhận",Cancelled:"Đã hủy"};
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
function addCar(){ const tr=document.createElement("tr");
  tr.innerHTML=`<td><input class="vin" style="width:110px"></td><td><input class="sd" type="date"></td><td><input class="am" type="number" style="width:100px"></td><td><input class="dy" type="number" style="width:55px"></td><td><input class="lf" style="width:55px"></td><td><input class="lt" style="width:55px"></td><td><input class="pr" type="number" style="width:80px"></td><td><input class="rt" type="number" style="width:55px"></td><td><button class="sm" onclick="this.closest('tr').remove()">×</button></td>`;
  F("ctb").appendChild(tr); }
async function create(){
  const cars=[...F("ctb").querySelectorAll("tr")].map(tr=>({vin:tr.querySelector(".vin").value,expectedStartDate:tr.querySelector(".sd").value||null,insAmount:parseFloat(tr.querySelector(".am").value)||0,insuranceDay:parseInt(tr.querySelector(".dy").value)||0,locationFrom:tr.querySelector(".lf").value,locationTo:tr.querySelector(".lt").value,price:parseFloat(tr.querySelector(".pr").value)||0,rate:parseFloat(tr.querySelector(".rt").value)||0})).filter(c=>c.vin);
  const r=await fetch("/api/insurancereqs",{method:"POST",headers:H(),body:JSON.stringify({insCompanyCode:F("co").value,insTypeCode:F("tp").value,cars})});
  const j=await r.json();
  if(r.ok){ msg("Đã tạo "+j.insReqNo+" ("+j.cars+" xe)."); F("ctb").innerHTML="";addCar(); load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/insurancereqs?status=${F("fst").value}&company=${F("q").value}`,{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(o=>{
    let act=o.status==="Draft"?`<button class="sm" onclick="act1('${o.insReqNo}','confirm')">Xác nhận</button> <button class="sm" onclick="act1('${o.insReqNo}','cancel')">Hủy</button>`:"";
    return `<tr><td><b>${o.insReqNo}</b> <a href="#" class="cars" onclick="cars('${o.insReqNo}');return false">xem xe</a></td><td>${o.insCompanyCode}</td><td>${o.insTypeCode}</td><td>${o.cars}</td><td class="num">${money(o.totalAmount)}</td><td>${day(o.createdAt)}</td><td><span class="pill p-${o.status}">${LBL[o.status]||o.status}</span></td><td>${act}</td></tr><tr id="x-${o.insReqNo}"></tr>`;
  }).join("")||'<tr><td colspan="8" class="muted">Chưa có đề nghị.</td></tr>';
}
async function act1(no,a){ const r=await fetch(`/api/insurancereqs/${no}/${a}`,{method:"POST",headers:H()}); const j=await r.json(); if(r.ok) load(); else msg("Lỗi: "+(j.error||r.status)); }
async function cars(no){
  const row=F("x-"+no); if(row.innerHTML){ row.innerHTML=""; return; }
  const d=await (await fetch(`/api/insurancereqs/${no}/cars`,{headers:H()})).json();
  row.innerHTML=`<td colspan="8"><div class="cars">${(d.cars||[]).map(c=>`VIN <b>${c.vin}</b> · ${money(c.insAmount)}đ · ${c.insuranceDay}ngày${c.locationFrom?" · "+c.locationFrom+"→"+(c.locationTo||"?"):""}`).join(" &nbsp;|&nbsp; ")||"—"}</div></td>`;
}
addCar(); load();
</script>
</body></html>
