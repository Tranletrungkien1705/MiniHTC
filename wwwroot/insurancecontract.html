<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Hợp đồng bảo hiểm DV</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#4f46e5;--ok:#16a34a;--warn:#d97706}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:980px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px} h3{font-size:14px;margin:14px 0 4px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0} .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
  input,button,select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit} label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.link{border:none;background:none;color:var(--accent);padding:2px 6px}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px} th,td{text-align:left;padding:5px 7px;border-bottom:1px solid var(--line)} th{opacity:.7;font-size:10.5px;text-transform:uppercase} .wrap{overflow-x:auto}
  .msg{font-size:13px;margin-left:6px} .off{opacity:.5} .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px} .pill{font-size:11px;padding:1px 7px;border-radius:20px;border:1px solid var(--line)} .y{color:var(--ok);border-color:var(--ok)} .n{color:var(--warn);border-color:var(--warn)} .num{text-align:right;font-variant-numeric:tabular-nums}
</style></head>
<body>
<h1>Hợp đồng bảo hiểm dịch vụ <span class="muted">(port 1:1 FrmInsuranceContractCreate/Search — TCMotor DMSCarSv)</span></h1>
<div class="card"><h3 style="margin-top:0">Thêm / sửa</h3>
  <div class="grid4">
    <div><label>Mã HĐ (auto)</label><input id="code" placeholder="để trống = tự sinh"></div>
    <div><label>Số HĐ *</label><input id="no"></div>
    <div><label>Loại thanh toán *</label><input id="pay"></div>
    <div><label>Hãng BH</label><select id="ins"><option value="">— chọn —</option></select></div>
    <div><label>Ngày bắt đầu</label><input id="start" type="date"></div>
    <div><label>Ngày hết hiệu lực</label><input id="finish" type="date"></div>
    <div><label>Hạn mức thanh toán</label><input id="limit" class="num" type="number" min="0"></div>
  </div>
  <div class="row" style="margin-top:8px"><button class="primary" onclick="save()">Lưu</button><button onclick="reset()">Mới</button><span id="msg" class="msg"></span></div>
</div>
<div class="row" style="margin:8px 0"><input id="q" placeholder="Mã / số HĐ / hãng" style="width:220px"><label style="display:flex;align-items:center;gap:4px"><input type="checkbox" id="all" style="width:auto"> Cả đã tắt</label><button onclick="load()">Xem</button></div>
<div class="wrap"><table><thead><tr><th>Mã HĐ</th><th>Số HĐ</th><th>Loại TT</th><th>Hãng BH</th><th>Bắt đầu</th><th>Hết hạn</th><th class="num">Hạn mức</th><th>TT</th><th></th></tr></thead><tbody id="tb"><tr><td colspan="9" class="muted">Nhấn "Xem".</td></tr></tbody></table></div>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id); const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
const nf=n=>(n==null?"":Number(n).toLocaleString("vi-VN")); const dshow=s=>s?String(s).slice(0,10):"";
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function Hh(x){ return Object.assign({"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY}, x||{}); }
function say(t){ F("msg").textContent=t; setTimeout(()=>{if(F("msg").textContent===t)F("msg").textContent="";},3800); }
const v=id=>F(id).value||null;
function reset(){ ["code","no","pay","start","finish","limit"].forEach(i=>F(i).value=""); F("ins").value=""; }
async function loadIns(){ await token();
  const r=await fetch("/api/serinsurances",{headers:Hh()}); const d=await r.json();
  F("ins").innerHTML='<option value="">— chọn —</option>'+(d.items||[]).map(o=>`<option value="${esc(o.insNo)}">${esc(o.insNo)} — ${esc(o.insVieName)}</option>`).join(""); }
async function save(){ await token();
  const body={InContractCode:v("code"),InContractNo:F("no").value,TypePayment:v("pay"),StartDate:v("start"),FinishDate:v("finish"),InsNo:v("ins"),PaymentLimit:Number(F("limit").value||0)};
  const r=await fetch("/api/insurancecontracts",{method:"POST",headers:Hh({"Content-Type":"application/json"}),body:JSON.stringify(body)});
  const d=await r.json(); if(!r.ok){ say("Lỗi: "+(d.error||r.status)); return; } say("Đã lưu "+d.inContractCode); reset(); load();
}
function edit(o){ F("code").value=o.inContractCode; F("no").value=o.inContractNo||""; F("pay").value=o.typePayment||""; F("ins").value=o.insNo||""; F("start").value=dshow(o.startDate); F("finish").value=dshow(o.finishDate); F("limit").value=o.paymentLimit||""; window.scrollTo(0,0); }
async function toggle(id){ await token(); await fetch("/api/insurancecontracts/"+id+"/toggle",{method:"POST",headers:Hh()}); load(); }
async function load(){ await token();
  const r=await fetch("/api/insurancecontracts?all="+(F("all").checked)+"&q="+encodeURIComponent(F("q").value),{headers:Hh()}); const d=await r.json();
  F("tb").innerHTML=(d.items||[]).map(o=>`<tr class="${o.flagActive==='1'?'':'off'}"><td><b>${esc(o.inContractCode)}</b></td><td>${esc(o.inContractNo)}</td><td>${esc(o.typePayment)}</td><td>${esc(o.insNo)}</td><td>${dshow(o.startDate)}</td><td>${dshow(o.finishDate)}</td><td class="num">${nf(o.paymentLimit)}</td><td><span class="pill ${o.flagActive==='1'?'y':'n'}">${o.flagActive==='1'?'Bật':'Tắt'}</span></td><td><button class="link" onclick='edit(${JSON.stringify(o)})'>Sửa</button><button class="link" onclick="toggle(${o.id})">Đổi</button></td></tr>`).join("")||'<tr><td colspan="9" class="muted">Chưa có hợp đồng.</td></tr>';
}
loadIns();
</script>
</body></html>
