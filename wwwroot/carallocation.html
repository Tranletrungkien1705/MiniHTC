<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Phân bổ xe theo vùng</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--warn:#d97706;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:900px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} td.num{text-align:right;font-variant-numeric:tabular-nums}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .p-1{color:var(--ok)} .p-0{color:#dc2626}
  #msg{font-size:13px} #tot{font-size:12px}
</style></head>
<body>
<h1>Phân bổ xe theo vùng miền <span class="muted">(port 1:1 FrmMst_CarAllocationByArea — Mst_CarAllocationByArea)</span></h1>
<div class="card">
  <b>Thiết lập tỷ lệ (tổng 3 miền = 100%)</b>
  <div class="bar" style="margin-top:10px">
    <div><label>Model *</label><input id="md" style="width:100px"></div>
    <div><label>Spec *</label><input id="sp" style="width:100px"></div>
    <div><label>% Miền Bắc</label><input id="mb" type="number" style="width:80px" oninput="tot()"></div>
    <div><label>% Miền Trung</label><input id="mt" type="number" style="width:80px" oninput="tot()"></div>
    <div><label>% Miền Nam</label><input id="mn" type="number" style="width:80px" oninput="tot()"></div>
    <span id="tot" class="muted">Tổng: 0%</span>
    <button class="primary" onclick="create()">Lưu</button><span id="msg"></span>
  </div>
</div>
<div class="bar" style="margin:10px 0"><input id="qm" placeholder="Lọc model" oninput="load()" style="width:110px"><select id="fa" onchange="load()"><option value="">Tất cả</option><option value="1">Hoạt động</option><option value="0">Ngừng</option></select></div>
<table><thead><tr><th>Model</th><th>Spec</th><th class="num">MB%</th><th class="num">MT%</th><th class="num">MN%</th><th>TT</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="7" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
function tot(){ const s=(parseFloat(F("mb").value)||0)+(parseFloat(F("mt").value)||0)+(parseFloat(F("mn").value)||0); F("tot").textContent="Tổng: "+s+"%"; F("tot").style.color=s===100?"var(--ok)":"var(--warn)"; }
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
async function create(){
  const r=await fetch("/api/carallocations",{method:"POST",headers:H(),body:JSON.stringify({modelCode:F("md").value,specCode:F("sp").value,mBPercent:parseFloat(F("mb").value)||0,mTPercent:parseFloat(F("mt").value)||0,mNPercent:parseFloat(F("mn").value)||0})});
  const j=await r.json();
  if(r.ok){ msg((j.updated?"Đã cập nhật ":"Đã thêm ")+j.modelCode+"/"+j.specCode); load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/carallocations?model=${F("qm").value}&active=${F("fa").value}`,{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(o=>
    `<tr><td><b>${o.modelCode}</b></td><td>${o.specCode}</td><td class="num">${o.mBPercent}</td><td class="num">${o.mTPercent}</td><td class="num">${o.mNPercent}</td><td><span class="pill p-${o.flagActive}">${o.flagActive==="1"?"HĐ":"Ngừng"}</span></td><td><button class="sm" onclick="toggle('${o.modelCode}','${o.specCode}')">Đổi</button></td></tr>`
  ).join("")||'<tr><td colspan="7" class="muted">Chưa có.</td></tr>';
}
async function toggle(md,sp){ const r=await fetch(`/api/carallocations/${md}/${sp}/toggle`,{method:"POST",headers:H()}); const j=await r.json(); if(r.ok) load(); else msg("Lỗi: "+(j.error||r.status)); }
tot(); load();
</script>
</body></html>
