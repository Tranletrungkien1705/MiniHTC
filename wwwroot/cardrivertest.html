<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Master xe lái thử</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--warn:#d97706;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1080px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit;box-sizing:border-box}
  .grid input,.grid select{width:100%}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} td.num{text-align:right;font-variant-numeric:tabular-nums}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .p-1{color:var(--ok)} .p-0{color:#dc2626}
  #msg{font-size:13px}
</style></head>
<body>
<h1>Master xe lái thử <span class="muted">(port 1:1 FrmMstCarDriverTestHTC — CarDriverTest)</span></h1>
<div class="card">
  <b>Thêm xe lái thử</b>
  <div class="grid" style="margin-top:10px">
    <div><label>Biển số *</label><input id="pl"></div>
    <div><label>Mã đại lý</label><input id="dl"></div>
    <div><label>VIN</label><input id="vin"></div>
    <div><label>Số máy</label><input id="en"></div>
    <div><label>Model *</label><input id="md"></div>
    <div><label>Spec *</label><input id="sp"></div>
    <div><label>Màu *</label><input id="cl"></div>
    <div><label>GPS</label><input id="gps"></div>
    <div><label>Đơn giá</label><input id="pr" type="number"></div>
    <div><label>Tiền hỗ trợ đợt 1</label><input id="a1" type="number"></div>
    <div><label>Ngày hỗ trợ 1</label><input id="d1" type="date"></div>
    <div><label>Tiền hỗ trợ đợt 2</label><input id="a2" type="number"></div>
    <div><label>Ngày hỗ trợ 2</label><input id="d2" type="date"></div>
    <div><label>Số CV hỗ trợ</label><input id="cn"></div>
    <div><label>Ghi chú</label><input id="rm"></div>
  </div>
  <div class="bar"><button class="primary" onclick="create()">Lưu</button><span id="msg"></span></div>
</div>
<div class="bar" style="margin:10px 0"><input id="q" placeholder="Lọc model" oninput="load()" style="width:120px"><select id="fa" onchange="load()"><option value="">Tất cả</option><option value="1">Hoạt động</option><option value="0">Ngừng</option></select></div>
<table><thead><tr><th>Biển số</th><th>Đại lý</th><th>VIN</th><th>Model</th><th>Spec/Màu</th><th class="num">Đơn giá</th><th>Hỗ trợ</th><th>TT</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="9" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const money=n=>(n||0).toLocaleString("vi-VN"); const day=d=>d? new Date(d).toLocaleDateString("vi-VN"):"";
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
async function create(){
  const body={drvTestPlateNo:F("pl").value,dealerCode:F("dl").value,drvTestVIN:F("vin").value,drvTestEngineNo:F("en").value,modelCode:F("md").value,specCode:F("sp").value,colorCode:F("cl").value,carDrvTestGPS:F("gps").value,price:parseFloat(F("pr").value)||0,amountSupport1:parseFloat(F("a1").value)||0,dateSupport1:F("d1").value||null,amountSupport2:parseFloat(F("a2").value)||0,dateSupport2:F("d2").value||null,claimNoSupport:F("cn").value,remark:F("rm").value,flagActive:"1"};
  const r=await fetch("/api/cardrivertests",{method:"POST",headers:H(),body:JSON.stringify(body)});
  const j=await r.json();
  if(r.ok){ msg(j.message||"OK"); ["pl","vin","en","md","sp","cl"].forEach(x=>F(x).value=""); load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/cardrivertests?model=${F("q").value}&active=${F("fa").value}`,{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(o=>{
    let sup=(o.amountSupport1?"Đ1 "+money(o.amountSupport1)+(o.dateSupport1?" ("+day(o.dateSupport1)+")":""):"")+(o.amountSupport2?" · Đ2 "+money(o.amountSupport2)+(o.dateSupport2?" ("+day(o.dateSupport2)+")":""):"")||"—";
    return `<tr><td><b>${o.drvTestPlateNo}</b></td><td>${o.dealerCode||""}</td><td>${o.drvTestVIN||""}</td><td>${o.modelCode}</td><td>${o.specCode}/${o.colorCode}</td><td class="num">${money(o.price)}</td><td class="muted">${sup}</td><td><span class="pill p-${o.flagActive}">${o.flagActive==="1"?"Hoạt động":"Ngừng"}</span></td><td><button class="sm" onclick="toggle('${o.drvTestPlateNo}')">Đổi TT</button></td></tr>`;
  }).join("")||'<tr><td colspan="9" class="muted">Chưa có xe lái thử.</td></tr>';
}
async function toggle(pl){ const r=await fetch(`/api/cardrivertests/${encodeURIComponent(pl)}/toggle`,{method:"POST",headers:H()}); const j=await r.json(); if(r.ok) load(); else msg("Lỗi: "+(j.error||r.status)); }
load();
</script>
</body></html>
