<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Đề nghị thế chấp xe</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1020px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  button.ok{color:#fff;background:var(--ok);border-color:var(--ok)} button.bad{color:#fff;background:var(--bad);border-color:var(--bad)}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} .wrap{overflow-x:auto}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .s-Draft{color:var(--warn)} .s-Approved{color:var(--ok)} .s-Cancelled{color:var(--bad)}
  #msg{font-size:13px} .carrow input{width:96px}
</style></head>
<body>
<h1>Đề nghị thế chấp xe <span class="muted">(port 1:1 FrmNewRM_ReqMortgage / FrmMngRM_ReqMortgage — Sales/Payment)</span></h1>
<div class="card">
  <b>Tạo đề nghị thế chấp (header + xe)</b>
  <div class="bar" style="margin-top:10px"><div><label>NH nhận thế chấp *</label><input id="bk" style="width:120px"></div><div><label>Đại lý</label><input id="dl" style="width:90px"></div><div><label>Ngày thế chấp</label><input id="md" type="date" style="width:150px"></div></div>
  <table style="margin-top:10px"><thead><tr><th>VIN</th><th>Model</th><th>Số máy</th><th>Số CQ</th><th>Số CO</th><th>Số tờ khai</th><th></th></tr></thead><tbody id="carRows"></tbody></table>
  <div class="bar" style="margin-top:8px"><button class="sm" onclick="addRow()">+ Thêm xe</button><button class="primary" onclick="save()">Tạo đề nghị</button><span id="msg"></span></div>
</div>
<div class="bar" style="margin:10px 0">
  <input id="qb" placeholder="Lọc NH" oninput="load()" style="width:100px">
  <input id="qn" placeholder="Lọc số ĐN" oninput="load()" style="width:120px">
  <select id="qs" onchange="load()"><option value="">Mọi trạng thái</option><option value="Draft">Chờ duyệt</option><option value="Approved">Đã duyệt</option><option value="Cancelled">Đã hủy</option></select>
</div>
<div class="wrap"><table><thead><tr><th>Số ĐN thế chấp</th><th>NH nhận TC</th><th>Đại lý</th><th>Ngày TC</th><th class="num">Số xe</th><th>Trạng thái</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="7" class="muted">Đang tải…</td></tr></tbody></table></div>
<div class="card" id="detCard" style="display:none">
  <b>Chi tiết xe — <span id="detNo"></span></b>
  <div class="wrap"><table><thead><tr><th>VIN</th><th>Model</th><th>Số máy</th><th>Số CQ</th><th>Số CO</th><th>Số tờ khai</th></tr></thead><tbody id="detRows"></tbody></table></div>
</div>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const ST={Draft:"Chờ duyệt",Approved:"Đã duyệt",Cancelled:"Đã hủy"};
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
function addRow(){ const tr=document.createElement("tr"); tr.className="carrow";
  tr.innerHTML=`<td><input class="c-vin"></td><td><input class="c-md"></td><td><input class="c-eng"></td><td><input class="c-cq"></td><td><input class="c-co"></td><td><input class="c-dc"></td><td><button class="sm" onclick="this.closest('tr').remove()">×</button></td>`;
  F("carRows").appendChild(tr); }
function collect(){ return [...document.querySelectorAll("#carRows tr")].map(tr=>({
  vin:tr.querySelector(".c-vin").value, modelCode:tr.querySelector(".c-md").value, engineNo:tr.querySelector(".c-eng").value,
  cQNo:tr.querySelector(".c-cq").value, cONo:tr.querySelector(".c-co").value, declarationNo:tr.querySelector(".c-dc").value})).filter(c=>c.vin.trim()); }
async function save(){
  const b={mortageBankCode:F("bk").value,dealerCode:F("dl").value,mortageDate:F("md").value||null,cars:collect()};
  const r=await fetch("/api/reqmortgages",{method:"POST",headers:H(),body:JSON.stringify(b)});
  const j=await r.json();
  if(r.ok){ msg(`Đã tạo ${j.reqRMNo} (${j.cars} xe)`); F("carRows").innerHTML=""; addRow(); load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/reqmortgages?bank=${F("qb").value}&no=${F("qn").value}&status=${F("qs").value}`,{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(o=>{
    const act=o.status==="Draft"?`<button class="sm ok" onclick="decide('${o.reqRMNo}','approve')">Duyệt</button> <button class="sm bad" onclick="decide('${o.reqRMNo}','cancel')">Hủy</button>`:"";
    return `<tr onclick="detail('${o.reqRMNo}')"><td><b>${o.reqRMNo}</b></td><td>${o.mortageBankCode}</td><td>${o.dealerCode||""}</td><td>${(o.mortageDate||"").substring(0,10)}</td><td class="num">${o.cars}</td><td><span class="pill s-${o.status}">${ST[o.status]||o.status}</span></td><td onclick="event.stopPropagation()">${act}</td></tr>`;
  }).join("")||'<tr><td colspan="7" class="muted">Chưa có đề nghị.</td></tr>';
}
async function detail(no){
  const d=await (await fetch(`/api/reqmortgages/${no}/cars`,{headers:H()})).json();
  F("detCard").style.display=""; F("detNo").textContent=no;
  F("detRows").innerHTML=(d.cars||[]).map(c=>`<tr><td><b>${c.vin}</b></td><td>${c.modelCode||""}</td><td>${c.engineNo||""}</td><td>${c.cQNo||""}</td><td>${c.cONo||""}</td><td>${c.declarationNo||""}</td></tr>`).join("")||'<tr><td colspan="6" class="muted">Không có xe.</td></tr>';
}
async function decide(no,act){
  const r=await fetch(`/api/reqmortgages/${no}/${act}`,{method:"POST",headers:H()});
  const j=await r.json();
  if(r.ok){ msg(`${no}: ${ST[j.status]||j.status}`); load(); } else msg("Lỗi: "+(j.error||r.status));
}
addRow(); load();
</script>
</body></html>
