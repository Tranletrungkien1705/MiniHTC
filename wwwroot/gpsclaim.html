<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Claim GPS</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--ok:#16a34a;--warn:#d97706;--prog:#7c3aed}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1020px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
  .c-Pending{color:var(--warn)} .c-Approved{color:var(--accent)} .r-Progress{color:var(--prog)} .r-Finished{color:var(--ok)} .f-Finished{color:var(--ok)}
  #msg{font-size:13px}
</style></head>
<body>
<h1>Yêu cầu sửa / bảo hành thiết bị GPS <span class="muted">(port 1:1 FrmGPSF_GPSClaimNew / FrmGPSF_GPSClaimMng — GPSF_GPSClaim)</span></h1>
<div class="card">
  <b>Tạo claim mới</b>
  <div class="bar" style="margin:10px 0">
    <input id="dv" placeholder="Số thiết bị GPS *" style="width:150px">
    <input id="bf" placeholder="Tình trạng trước sửa" style="width:200px">
    <input id="rm" placeholder="Ghi chú" style="width:180px">
    <span style="flex:1"></span><button class="primary" onclick="create()">Tạo claim</button><span id="msg"></span>
  </div>
</div>
<div class="bar" style="margin:10px 0">
  <select id="fst" onchange="load()"><option value="">Tất cả claim</option><option value="Pending">Mới tạo</option><option value="Approved">Đã duyệt</option></select>
  <input id="q" placeholder="Lọc thiết bị" oninput="load()" style="width:120px">
</div>
<table><thead><tr><th>Số claim</th><th>Thiết bị</th><th>Claim</th><th>Nhận TB</th><th>Sửa</th><th>Trước sửa</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="7" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const CL={Pending:"Mới tạo",Approved:"Đã duyệt"}, RC={"":"—",Progress:"Đang sửa",Finished:"Đã nhận xong"}, FX={"":"—",Finished:"Đã sửa"};
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
async function create(){
  const r=await fetch("/api/gpsclaims",{method:"POST",headers:H(),body:JSON.stringify({gpsDvNo:F("dv").value,beforeFixRemark:F("bf").value,remark:F("rm").value})});
  const j=await r.json();
  if(r.ok){ msg("Đã tạo "+j.gpsClaimNo+"."); F("dv").value="";F("bf").value="";F("rm").value=""; load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/gpsclaims?claimStatus=${F("fst").value}&device=${encodeURIComponent(F("q").value)}`,{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(g=>{
    let act="";
    if(g.claimStatus==="Pending") act=`<button class="sm" onclick="act('${g.gpsClaimNo}','approve')">Duyệt</button>`;
    else if(g.receivedStatus==="") act=`<button class="sm" onclick="act('${g.gpsClaimNo}','receive')">Nhận TB sửa</button>`;
    else if(g.receivedStatus==="Progress") act=`<button class="sm" onclick="act('${g.gpsClaimNo}','finish')">Hoàn tất sửa</button>`;
    return `<tr><td><b>${g.gpsClaimNo}</b></td><td>${g.gpsDvNo}</td>
      <td><span class="pill c-${g.claimStatus}">${CL[g.claimStatus]||g.claimStatus}</span></td>
      <td><span class="pill r-${g.receivedStatus}">${RC[g.receivedStatus]||g.receivedStatus}</span></td>
      <td><span class="pill f-${g.fixStatus}">${FX[g.fixStatus]||g.fixStatus}</span></td>
      <td class="muted">${g.beforeFixRemark||"—"}</td><td>${act}</td></tr>`;
  }).join("")||'<tr><td colspan="7" class="muted">Chưa có claim.</td></tr>';
}
async function act(no,a){ const r=await fetch(`/api/gpsclaims/${no}/${a}`,{method:"POST",headers:H()}); const j=await r.json(); if(r.ok) load(); else msg("Lỗi: "+(j.error||r.status)); }
load();
</script>
</body></html>
