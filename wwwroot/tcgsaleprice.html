<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Giá bán TCG</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:820px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .bar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;align-items:center}
  input,button{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} td.n,th.n{text-align:right;font-variant-numeric:tabular-nums} #msg{font-size:13px}
</style></head>
<body>
<h1>Giá bán xe TCG theo spec <span class="muted">(port 1:1 FrmMstTCGCarSalePrice — Mst_TCGCarSalePrice)</span></h1>
<div class="bar">
  <input id="sc" placeholder="Mã spec *" style="width:130px"><input id="up" type="number" placeholder="Đơn giá" style="width:150px;text-align:right">
  <button class="primary" onclick="save()">Lưu giá</button>
  <span style="flex:1"></span><input id="q" placeholder="Lọc spec" oninput="load()" style="width:120px"><span id="msg"></span>
</div>
<table><thead><tr><th>Mã spec</th><th class="n">Đơn giá</th><th>Trạng thái</th></tr></thead>
<tbody id="rows"><tr><td colspan="3" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const n=x=>Number(x||0).toLocaleString("vi-VN");
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
async function save(){
  const r=await fetch("/api/tcgsaleprices",{method:"POST",headers:H(),body:JSON.stringify({specCode:F("sc").value,unitPrice:Number(F("up").value||0)})});
  const j=await r.json();
  if(r.ok){ msg("Đã lưu "+j.specCode+" ("+n(j.unitPrice)+")."); F("up").value=""; load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch("/api/tcgsaleprices?spec="+encodeURIComponent(F("q").value),{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(x=>`<tr><td><b>${x.specCode}</b></td><td class="n">${n(x.unitPrice)}</td><td>${x.status==="1"?"HL":"—"}</td></tr>`).join("")||'<tr><td colspan="3" class="muted">Chưa có giá.</td></tr>';
}
load();
</script>
</body></html>
