<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Bảo hành dịch vụ</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:960px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .bar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;align-items:center}
  input,button{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} td.n{text-align:right;font-variant-numeric:tabular-nums} .pill{font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line)}
  .act{color:var(--accent);cursor:pointer;margin-right:8px} .r{color:#dc2626} .g{color:#16a34a} #msg{font-size:13px}
</style></head>
<body>
<h1>Yêu cầu bảo hành dịch vụ <span class="muted">(TCMotor Warranty Claim)</span></h1>
<div class="bar">
  <input id="vin" placeholder="VIN *" style="width:170px"><input id="dl" placeholder="Đại lý" style="width:90px"><input id="ec" placeholder="Mã lỗi" style="width:100px">
  <input id="pc" placeholder="Tiền PT" style="width:110px"><input id="lc" placeholder="Tiền công" style="width:110px">
  <button class="primary" onclick="create()">Tạo claim</button><span id="msg"></span>
</div>
<table><thead><tr><th>Số</th><th>VIN</th><th>ĐL</th><th>Mã lỗi</th><th class="n">PT</th><th class="n">Công</th><th class="n">Tổng</th><th>Trạng thái</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="9" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t,ok){ F("msg").textContent=t; F("msg").className=ok?"":"r"; }
const fmt=n=>Number(n).toLocaleString('vi-VN'); const badge=s=>({Submitted:"Chờ duyệt",Approved:"Đã duyệt",Rejected:"Từ chối",Paid:"Đã QT"}[s]||s);
async function load(){ await token();
  const d=await (await fetch("/api/wclaims",{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(x=>{
    let a="";
    if(x.status==="Submitted") a=`<span class="act g" onclick="act('${x.claimNo}','approve')">Duyệt</span><span class="act r" onclick="act('${x.claimNo}','reject')">Từ chối</span>`;
    else if(x.status==="Approved") a=`<span class="act" onclick="act('${x.claimNo}','pay')">Quyết toán</span>`;
    return `<tr><td><b>${x.claimNo}</b></td><td>${x.vin}</td><td>${x.dealerCode||""}</td><td>${x.errorCode||""}</td>
      <td class="n">${fmt(x.partsCost)}</td><td class="n">${fmt(x.laborCost)}</td><td class="n">${fmt(x.total)}</td>
      <td><span class="pill">${badge(x.status)}</span></td><td>${a}</td></tr>`;
  }).join("")||'<tr><td colspan="9" class="muted">Chưa có claim.</td></tr>';
}
async function create(){
  const r=await fetch("/api/wclaims",{method:"POST",headers:H(),body:JSON.stringify({vin:F("vin").value,dealerCode:F("dl").value,errorCode:F("ec").value,partsCost:Number(F("pc").value||0),laborCost:Number(F("lc").value||0)})});
  if(r.ok){ msg("Đã tạo.",true); F("vin").value="";F("pc").value="";F("lc").value=""; load(); } else msg("Lỗi: "+((await r.json()).error||r.status),false);
}
async function act(no,a){ const r=await fetch(`/api/wclaims/${no}/${a}`,{method:"POST",headers:H()});
  if(r.ok){ msg("OK",true); load(); } else msg("Lỗi",false); }
load();
</script>
</body></html>
