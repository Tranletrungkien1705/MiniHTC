<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Cập nhật ngày mốc SO</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#4f46e5;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1000px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px} h3{font-size:14px;margin:14px 0 4px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
  input,button{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px} th,td{text-align:left;padding:5px 7px;border-bottom:1px solid var(--line)} th{opacity:.7;font-size:11px;text-transform:uppercase} .wrap{overflow-x:auto}
  .msg{font-size:13px;margin-left:6px} input.dt{width:130px}
</style></head>
<body>
<h1>Cập nhật ngày mốc SO <span class="muted">(port 1:1 FrmMng_SO_Approved_Date — 2010.HTC)</span></h1>
<p class="muted">Sửa các ngày mốc của đơn hàng (SO): ngày duyệt, hết hạn nghĩa vụ cọc, hết hạn bảo lãnh, đến hạn giao xe. Ngày đến hạn giao ≥ ngày hết hạn cọc.</p>
<div class="card"><div class="row"><div><label>Đại lý</label><input id="qDealer" style="width:110px"></div><div><label>Số SO</label><input id="qSo" style="width:130px"></div><button onclick="load()">Tải SO</button><span id="msg" class="msg"></span></div></div>
<div class="card" id="editCard" style="display:none"><h3 style="margin-top:0">Danh sách SO</h3>
  <div class="wrap"><table><thead><tr><th>Số SO</th><th>Đại lý</th><th>TT</th><th>Ngày duyệt</th><th>Hết hạn cọc</th><th>Hết hạn BL</th><th>Đến hạn giao</th></tr></thead>
  <tbody id="rows"></tbody></table></div>
  <div class="row" style="margin-top:8px"><button class="primary" onclick="save()">Lưu ngày mốc</button></div>
</div>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id); const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;"); const dt=s=>s?String(s).substring(0,10):"";
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function Hh(x){ return Object.assign({"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY}, x||{}); }
function say(t){ F("msg").textContent=t; setTimeout(()=>{if(F("msg").textContent===t)F("msg").textContent="";},4000); }
async function load(){ await token();
  const qs=new URLSearchParams({dealer:F("qDealer").value,so:F("qSo").value});
  const r=await fetch("/api/salesorders/sodates?"+qs,{headers:Hh()}); const d=await r.json();
  F("editCard").style.display="block";
  F("rows").innerHTML=(d.items||[]).map(o=>`<tr data-so="${esc(o.soCode)}"><td><b>${esc(o.soCode)}</b></td><td>${esc(o.dealerCode)}</td><td>${esc(o.status)}</td><td><input class="dt ap" type="date" value="${dt(o.approvedDate)}"></td><td><input class="dt dp" type="date" value="${dt(o.depositDutyEndDate)}"></td><td><input class="dt gr" type="date" value="${dt(o.grtEndDate)}"></td><td><input class="dt cd" type="date" value="${dt(o.carDueDate)}"></td></tr>`).join("")||'<tr><td colspan="7" class="muted">Không có SO.</td></tr>';
}
async function save(){ await token();
  const lines=[...document.querySelectorAll("#rows tr[data-so]")].map(tr=>({SOCode:tr.getAttribute("data-so"),ApprovedDate:tr.querySelector(".ap").value||null,DepositDutyEndDate:tr.querySelector(".dp").value||null,GrtEndDate:tr.querySelector(".gr").value||null,CarDueDate:tr.querySelector(".cd").value||null}));
  const r=await fetch("/api/salesorders/edit-dates",{method:"POST",headers:Hh({"Content-Type":"application/json"}),body:JSON.stringify({Lines:lines})});
  const d=await r.json(); if(!r.ok){ say("Lỗi: "+(d.error||r.status)); return; }
  const nf=(d.notFound||[]).length?" | Không thấy: "+d.notFound.join(", "):""; say(`Đã cập nhật ${d.updated} SO${nf}`); load();
}
</script>
</body></html>
