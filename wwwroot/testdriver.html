<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Quản lý lái thử</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#4f46e5;--ok:#16a34a;--warn:#d97706;--red:#dc2626}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1080px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
  input,button,select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  button{cursor:pointer} button.link{border:none;background:none;color:var(--accent);padding:2px 6px} button.rej{color:var(--red)}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)} th{opacity:.7;font-size:11px;text-transform:uppercase} .wrap{overflow-x:auto}
  .pill{font-size:11px;padding:1px 7px;border-radius:20px;border:1px solid var(--line)} .p{color:var(--warn);border-color:var(--warn)} .a{color:var(--ok);border-color:var(--ok)} .r{color:var(--red);border-color:var(--red)}
</style></head>
<body>
<h1>Quản lý lái thử <span class="muted">(port 1:1 FrmMngTestDriver — TCMotor)</span></h1>
<p class="muted">Tra cứu lượt khách lái thử + xác nhận khách hàng (chờ → đã xác nhận) hoặc huỷ. Lượt lái thử tạo ở màn "Đăng ký lái thử".</p>
<div class="card"><div class="row">
  <div><label>Đại lý</label><input id="qDealer" style="width:120px"></div>
  <div><label>Model</label><input id="qModel" style="width:120px"></div>
  <div><label>SĐT</label><input id="qPhone" style="width:120px"></div>
  <div><label>Trạng thái</label><select id="qStatus"><option value="">Tất cả</option><option value="P">Chờ</option><option value="A">Đã xác nhận</option><option value="R">Huỷ</option></select></div>
  <button onclick="load()">Xem</button></div>
  <div id="kpi" class="muted" style="margin:6px 0"></div>
  <div class="wrap"><table><thead><tr><th>Mã</th><th>Đại lý</th><th>Loại</th><th>Xe lái thử</th><th>Model quan tâm</th><th>Ngày</th><th>Khách hàng</th><th>SĐT</th><th>Trạng thái</th><th></th></tr></thead>
  <tbody id="rows"><tr><td colspan="10" class="muted">Nhấn "Xem".</td></tr></tbody></table></div>
</div>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id); const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;"); const dt=s=>s?String(s).substring(0,10):"";
const stName={P:['Chờ','p'],A:['Đã xác nhận','a'],R:['Huỷ','r']};
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function Hh(x){ return Object.assign({"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY}, x||{}); }
async function act(code,a){ await token(); const r=await fetch("/api/drivetests/"+code+"/"+a,{method:"POST",headers:Hh()}); const d=await r.json(); if(!r.ok)alert(d.error||r.status); load(); }
// Xoá lượt lái thử — nguồn guard "P,R": đã duyệt (A) thì không xoá được, đã từ chối thì được.
async function del(code){ if(!confirm("Xoá lượt lái thử "+code+"?")) return; await token();
  const r=await fetch("/api/drivetests/"+code,{method:"DELETE",headers:Hh()}); const d=await r.json(); if(!r.ok)alert(d.error||r.status); load(); }
async function load(){ await token();
  const qs=new URLSearchParams({dealer:F("qDealer").value,model:F("qModel").value,phone:F("qPhone").value,status:F("qStatus").value});
  const r=await fetch("/api/drivetests?"+qs,{headers:Hh()}); const d=await r.json();
  F("kpi").textContent=`${d.count} lượt — đang chờ: ${d.pending}`;
  F("rows").innerHTML=(d.items||[]).map(o=>{const s=stName[o.driverTestStatus]||['?',''];return `<tr><td><b>${esc(o.driveTestCode)}</b></td><td>${esc(o.dealerCode)}</td><td>${esc(o.driverTestType)}</td><td>${esc(o.drvTestPlateNo)}</td><td>${esc(o.testModelCode)}</td><td>${dt(o.driveDate)}</td><td>${esc(o.customerName)}</td><td>${esc(o.phoneNo)}</td><td><span class="pill ${s[1]}">${s[0]}</span></td><td>${o.driverTestStatus==='P'?`<button class="link" onclick="act('${esc(o.driveTestCode)}','approve')">Duyệt</button><button class="link rej" onclick="act('${esc(o.driveTestCode)}','reject')">Từ chối</button>`:''}${(o.driverTestStatus==='P'||o.driverTestStatus==='R')?`<button class="link rej" onclick="del('${esc(o.driveTestCode)}')">Xoá</button>`:''}${o.approvedBy?`<div class="muted">${esc(o.approvedBy)}</div>`:''}</td></tr>`;}).join("")||'<tr><td colspan="10" class="muted">Không có lượt lái thử.</td></tr>';
}
</script>
</body></html>
