<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Thống kê bảo hành</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#4f46e5;--ok:#16a34a;--bad:#dc2626;--warn:#d97706}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:960px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:10px 0}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)} th{opacity:.7;font-size:11px;text-transform:uppercase} td.num,th.num{text-align:right;font-variant-numeric:tabular-nums} tfoot td{font-weight:700;border-top:2px solid var(--line)} .wrap{overflow-x:auto}
  .tabs{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap} .tab{padding:6px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer} .tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:10px} .kpi{border:1px solid var(--line);border-radius:10px;padding:10px} .kpi b{font-size:18px;display:block}
  .bar{height:8px;background:var(--accent);border-radius:4px;min-width:2px}
</style></head>
<body>
<h1>Thống kê bảo hành <span class="muted">(port 1:1 FrmChartWarrantyDealer/Month + FrmTK_WarrantyModel — TCMotor)</span></h1>
<p class="muted">Thống kê đề nghị bảo hành theo đại lý / tháng / loại. Đếm số ĐN, tổng tiền, số & tiền đã chấp thuận.</p>
<div class="tabs">
  <div class="tab on" id="tdealer" onclick="pick('dealer')">Theo đại lý</div>
  <div class="tab" id="tmonth" onclick="pick('month')">Theo tháng</div>
  <div class="tab" id="ttype" onclick="pick('type')">Theo loại</div>
</div>
<div class="row">
  <div><label>Từ ngày</label><input id="from" type="date"></div>
  <div><label>Đến ngày</label><input id="to" type="date"></div>
  <button class="primary" onclick="load()">Xem</button>
</div>
<div class="grid2" id="kpis"></div>
<div class="wrap"><table><thead><tr><th id="dimHead">Đại lý</th><th class="num">Số ĐN</th><th class="num">Tổng tiền</th><th class="num">Đã duyệt</th><th class="num">Tiền đã duyệt</th><th>Tỉ trọng</th></tr></thead>
<tbody id="rows"><tr><td colspan="6" class="muted">Nhấn "Xem".</td></tr></tbody>
<tfoot id="foot"></tfoot></table></div>

<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id); let DIM="dealer";
const M=n=>Math.round(+n||0).toLocaleString("vi-VN"); const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
const HEAD={dealer:"Đại lý",month:"Tháng",type:"Loại BH"};
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY}; }
function pick(d){ DIM=d; ["dealer","month","type"].forEach(k=>F("t"+k).className="tab"+(k===d?" on":"")); F("dimHead").textContent=HEAD[d]; load(); }
async function load(){ await token();
  const p=new URLSearchParams(); p.set("dimension",DIM); if(F("from").value)p.set("fromDate",F("from").value); if(F("to").value)p.set("toDate",F("to").value);
  const r=await fetch("/api/report/warranty-stats?"+p.toString(),{headers:H()}); const d=await r.json();
  F("kpis").innerHTML=`<div class="kpi"><b>${d.totalClaims}</b><span class="muted">Tổng ĐN</span></div><div class="kpi"><b>${d.count}</b><span class="muted">Số ${HEAD[DIM].toLowerCase()}</span></div><div class="kpi"><b style="color:var(--ok)">${M(d.grandAmount)}</b><span class="muted">Tổng tiền BH</span></div>`;
  const max=Math.max(1,...(d.rows||[]).map(x=>x.totalAmount));
  F("rows").innerHTML=(d.rows||[]).map(o=>`<tr><td><b>${esc(o.key)}</b></td><td class="num">${o.claims}</td><td class="num">${M(o.totalAmount)}</td><td class="num" style="color:var(--ok)">${o.accepted}</td><td class="num">${M(o.acceptedAmount)}</td><td><div class="bar" style="width:${Math.round(o.totalAmount/max*100)}%"></div></td></tr>`).join("")||'<tr><td colspan="6" class="muted">Không có dữ liệu.</td></tr>';
  F("foot").innerHTML=(d.rows&&d.rows.length)?`<tr><td>TỔNG</td><td class="num">${(d.rows).reduce((s,x)=>s+x.claims,0)}</td><td class="num">${M(d.grandAmount)}</td><td class="num">${(d.rows).reduce((s,x)=>s+x.accepted,0)}</td><td class="num">${M((d.rows).reduce((s,x)=>s+x.acceptedAmount,0))}</td><td></td></tr>`:"";
}
</script>
</body></html>
