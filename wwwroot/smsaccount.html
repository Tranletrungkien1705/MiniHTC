<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Tài khoản SMS</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#4f46e5;--ok:#16a34a;--bad:#dc2626}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:960px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px} h3{font-size:14px;margin:16px 0 4px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.link{border:none;background:none;color:var(--accent);padding:2px 6px}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)} th{opacity:.7;font-size:11px;text-transform:uppercase} td.num{text-align:right;font-variant-numeric:tabular-nums} .wrap{overflow-x:auto}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .t-Topup{color:var(--ok)} .t-Deduct{color:var(--bad)}
  #msg,#msg2{font-size:13px;margin-left:6px}
</style></head>
<body>
<h1>Tài khoản SMS trả trước <span class="muted">(port 1:1 FrmSMSAccountMng — TCMotor)</span></h1>
<p class="muted">Quản lý tài khoản SMS trả trước: số dư và sổ giao dịch nạp/trừ. Trừ không được vượt số dư.</p>
<div class="card"><h3 style="margin-top:0">Tạo tài khoản</h3>
  <div class="row">
    <div><label>Tên tài khoản *</label><input id="fName" style="width:180px"></div>
    <div><label>Số dư khởi tạo</label><input id="fInit" type="number" style="width:130px" value="0"></div>
    <button class="primary" onclick="create2()">Tạo</button><span id="msg"></span>
  </div>
</div>
<div class="row" style="margin:8px 0"><button onclick="load()">Xem tài khoản</button></div>
<div class="wrap"><table><thead><tr><th>Tên</th><th class="num">Số dư</th><th class="num">Số GD</th><th>Nạp/Trừ</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="5" class="muted">Nhấn "Xem tài khoản".</td></tr></tbody></table></div>
<div class="card" id="txCard" style="display:none"><h3 style="margin-top:0">Sổ giao dịch <span id="txName" class="muted"></span></h3><span id="msg2"></span>
  <div class="wrap"><table><thead><tr><th>Loại</th><th class="num">Giá trị</th><th class="num">Số dư sau</th><th>Ghi chú</th><th>Thời gian</th></tr></thead>
  <tbody id="txRows"></tbody></table></div>
</div>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id); let CUR=null;
const M=n=>Math.round(n||0).toLocaleString("vi-VN"); const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
const TT={Topup:"Nạp",Deduct:"Trừ"};
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(extra){ return Object.assign({"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY}, extra||{}); }
function msg(t){ F("msg").textContent=t; setTimeout(()=>{if(F("msg").textContent===t)F("msg").textContent="";},2500); }
function msg2(t){ F("msg2").textContent=t; setTimeout(()=>{if(F("msg2").textContent===t)F("msg2").textContent="";},2500); }
async function create2(){ await token();
  const body={AccountName:F("fName").value,InitBalance:+F("fInit").value||0};
  const r=await fetch("/api/smsaccounts",{method:"POST",headers:H({"Content-Type":"application/json"}),body:JSON.stringify(body)});
  const d=await r.json(); if(!r.ok){ msg("Lỗi: "+(d.error||r.status)); return; }
  msg("Đã tạo "+d.accountName); F("fName").value=""; load();
}
async function tx(name,type){ await token();
  const v=prompt((type==='Topup'?'Nạp':'Trừ')+" số tiền cho "+name+":"); if(!v) return;
  const r=await fetch("/api/smsaccounts/"+encodeURIComponent(name)+"/tx",{method:"POST",headers:H({"Content-Type":"application/json"}),body:JSON.stringify({TRefType:type,Value:+v||0})});
  const d=await r.json(); if(!r.ok){ msg("Lỗi: "+(d.error||r.status)); return; }
  msg("Số dư "+name+": "+M(d.balance)); load(); if(CUR===name) showTx(name);
}
async function showTx(name){ CUR=name; await token();
  const r=await fetch("/api/smsaccounts/"+encodeURIComponent(name)+"/transactions",{headers:H()});
  const d=await r.json(); F("txCard").style.display="block"; F("txName").textContent="— "+name+" (số dư "+M(d.balance)+")";
  F("txRows").innerHTML=(d.transactions||[]).map(o=>`<tr><td><span class="pill t-${o.tRefType}">${TT[o.tRefType]||o.tRefType}</span></td><td class="num">${M(o.value)}</td><td class="num">${M(o.balanceAfter)}</td><td>${esc(o.note)}</td><td>${o.createdDTime}</td></tr>`).join("")||'<tr><td colspan="5" class="muted">Chưa có giao dịch.</td></tr>';
}
async function load(){ await token();
  const r=await fetch("/api/smsaccounts",{headers:H()}); const d=await r.json();
  F("rows").innerHTML=(d.items||[]).map(o=>`<tr><td><b>${esc(o.accountName)}</b></td><td class="num">${M(o.balance)}</td><td class="num">${o.txCount}</td><td><button class="link" onclick="tx('${o.accountName}','Topup')">Nạp</button><button class="link" onclick="tx('${o.accountName}','Deduct')">Trừ</button></td><td><button class="link" onclick="showTx('${o.accountName}')">Sổ GD</button></td></tr>`).join("")||'<tr><td colspan="5" class="muted">Chưa có tài khoản.</td></tr>';
}
</script>
</body></html>
