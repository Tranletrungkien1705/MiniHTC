<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Báo cáo hợp đồng đại lý</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#4f46e5;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:940px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:10px 0}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)} th{opacity:.7;font-size:11px;text-transform:uppercase} td.num,th.num{text-align:right;font-variant-numeric:tabular-nums} tfoot td{font-weight:700;border-top:2px solid var(--line)} .wrap{overflow-x:auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:10px} .kpi{border:1px solid var(--line);border-radius:12px;padding:14px} .kpi b{font-size:22px;display:block} .kpi .lbl{font-size:12px;opacity:.7}
</style></head>
<body>
<h1>Báo cáo hợp đồng đại lý <span class="muted">(port 1:1 FrmContractReportForDealer — 2010.HTC/Report)</span></h1>
<p class="muted">Gộp hợp đồng đại lý theo đại lý = số HĐ + số xe + tổng giá trị (đơn giá). Khác báo cáo bán lẻ (=đơn deal).</p>
<div class="row">
  <div><label>Đại lý</label><input id="dealer" style="width:120px"></div>
  <div><label>Trạng thái</label><input id="status" placeholder="Draft/Approved" style="width:120px"></div>
  <button class="primary" onclick="load()">Xem</button>
</div>
<div class="grid" id="kpis"></div>
<div class="wrap"><table><thead><tr><th>Đại lý</th><th class="num">Số HĐ</th><th class="num">Số xe</th><th class="num">Tổng giá trị</th></tr></thead>
<tbody id="rows"><tr><td colspan="4" class="muted">Nhấn "Xem".</td></tr></tbody>
<tfoot id="foot"></tfoot></table></div>

<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const M=n=>Math.round(+n||0).toLocaleString("vi-VN"); const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY}; }
async function load(){ await token();
  const p=new URLSearchParams(); if(F("dealer").value)p.set("dealer",F("dealer").value); if(F("status").value)p.set("status",F("status").value);
  const r=await fetch("/api/report/dealer-contracts?"+p.toString(),{headers:H()}); const d=await r.json();
  F("kpis").innerHTML=`<div class="kpi"><b>${d.count}</b><span class="lbl">Số đại lý</span></div><div class="kpi"><b>${M(d.totalContracts)}</b><span class="lbl">Tổng HĐ</span></div><div class="kpi"><b>${M(d.totalCars)}</b><span class="lbl">Tổng xe</span></div><div class="kpi"><b style="color:var(--ok)">${M(d.grandValue)}</b><span class="lbl">Tổng giá trị</span></div>`;
  F("rows").innerHTML=(d.rows||[]).map(o=>`<tr><td><b>${esc(o.dealerCode)}</b></td><td class="num">${M(o.contracts)}</td><td class="num">${M(o.cars)}</td><td class="num" style="color:var(--ok)">${M(o.totalValue)}</td></tr>`).join("")||'<tr><td colspan="4" class="muted">Không có dữ liệu.</td></tr>';
  F("foot").innerHTML=(d.rows&&d.rows.length)?`<tr><td>TỔNG</td><td class="num">${M(d.totalContracts)}</td><td class="num">${M(d.totalCars)}</td><td class="num">${M(d.grandValue)}</td></tr>`:"";
}
</script>
</body></html>
