<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Đính kèm khiếu nại đơn PT</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#4f46e5;--ok:#16a34a;--bad:#dc2626}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:900px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:10px 0}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.link{border:none;background:none;color:var(--accent);padding:2px 6px} button.del{color:var(--bad)}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)} th{opacity:.7;font-size:11px;text-transform:uppercase} .wrap{overflow-x:auto}
  .msg{font-size:13px;margin-left:6px}
</style></head>
<body>
<h1>Đính kèm khiếu nại đơn phụ tùng <span class="muted">(port 1:1 FrmSer_OrderComplainAttachment — TCMotor/TST)</span></h1>
<p class="muted">Tra khiếu nại đơn PT theo số, đính kèm file (ảnh chứng minh) theo loại ảnh. Khiếu nại phải tồn tại.</p>
<div class="row">
  <div><label>Số khiếu nại *</label><input id="cNo" style="width:160px"></div><button onclick="loadFiles()">Xem file</button><span id="msg" class="muted"></span>
</div>
<div class="row">
  <div><label>Tên file</label><input id="fName" style="width:180px" placeholder="anh1.jpg"></div>
  <div><label>Loại ảnh</label><input id="fType" style="width:120px"></div>
  <div style="flex:1"><label>Ghi chú</label><input id="fNote" style="width:100%"></div>
  <button class="primary" onclick="addFile()">Thêm</button><span id="msg2" class="msg"></span>
</div>
<div class="wrap"><table><thead><tr><th>ID</th><th>Tên file</th><th>Loại ảnh</th><th>Ghi chú</th><th>Thời gian</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="6" class="muted">Nhập số khiếu nại rồi "Xem file".</td></tr></tbody></table></div>

<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(extra){ return Object.assign({"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY}, extra||{}); }
function m(id,t){ F(id).textContent=t; setTimeout(()=>{if(F(id).textContent===t)F(id).textContent="";},3500); }
async function loadFiles(){ await token(); const no=F("cNo").value.trim(); if(!no){ m("msg","Cần số KN."); return; }
  const r=await fetch("/api/ordercomplains/"+encodeURIComponent(no)+"/attachments",{headers:H()}); const d=await r.json();
  if(!r.ok){ m("msg",d.error||"Không thấy KN "+no); F("rows").innerHTML=""; return; }
  m("msg",d.complainNo+" — "+d.count+" file");
  F("rows").innerHTML=(d.files||[]).map(o=>`<tr><td>${o.id}</td><td><b>${esc(o.fileName)}</b></td><td>${esc(o.imageType)}</td><td>${esc(o.fileNote)}</td><td>${esc(o.createdAt)}</td><td><button class="link del" onclick="delFile('${esc(d.complainNo)}',${o.id})">Xóa</button></td></tr>`).join("")||'<tr><td colspan="6" class="muted">Chưa có file.</td></tr>';
}
async function addFile(){ await token(); const no=F("cNo").value.trim(); if(!no){ m("msg2","Cần số KN."); return; }
  const r=await fetch("/api/ordercomplains/"+encodeURIComponent(no)+"/attachments",{method:"POST",headers:H({"Content-Type":"application/json"}),body:JSON.stringify({FileName:F("fName").value,ImageType:F("fType").value,FileNote:F("fNote").value})});
  const d=await r.json(); if(!r.ok){ m("msg2","Lỗi: "+(d.error||r.status)); return; } m("msg2","Đã thêm "+d.fileName); F("fName").value="";F("fNote").value=""; loadFiles();
}
async function delFile(no,id){ await token(); await fetch("/api/ordercomplains/"+encodeURIComponent(no)+"/attachments/"+id,{method:"DELETE",headers:H()}); loadFiles(); }
</script>
</body></html>
