<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Chiến dịch DV</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--ok:#16a34a;--muted:#6b7280}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1020px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .run{color:var(--ok)} .end{color:var(--muted)}
  #msg{font-size:13px} .det{font-size:12px;opacity:.85}
</style></head>
<body>
<h1>Chiến dịch dịch vụ / chăm sóc <span class="muted">(port 1:1 FrmCampaignCreate — Ser_Campaign)</span></h1>
<div class="card">
  <b>Tạo chiến dịch</b>
  <div class="bar" style="margin:10px 0"><input id="cno" placeholder="Mã CD *" style="width:100px"><input id="cnm" placeholder="Tên CD *" style="width:180px">
    <label class="muted">Từ <input id="sd" type="date"></label><label class="muted">Đến <input id="fd" type="date"></label><input id="ct" placeholder="Nội dung" style="width:150px">
    <span style="flex:1"></span><button class="primary" onclick="create()">Tạo CD</button><span id="msg"></span></div>
  <div class="muted">Danh sách liên hệ (xe/khách):</div>
  <table id="ktbl"><thead><tr><th>Biển số</th><th>Chủ xe</th><th>Địa chỉ</th><th></th></tr></thead><tbody id="ktb"></tbody></table>
  <button class="sm" style="margin-top:6px" onclick="addC()">+ Liên hệ</button>
</div>
<div class="bar" style="margin:10px 0"><label class="muted"><input type="checkbox" id="ac" onchange="load()"> Chỉ đang chạy</label></div>
<table><thead><tr><th>Mã CD</th><th>Tên</th><th>Thời hạn</th><th>Liên hệ</th><th>Trạng thái</th></tr></thead>
<tbody id="rows"><tr><td colspan="5" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const day=d=>d? new Date(d).toLocaleDateString("vi-VN"):"—";
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
function addC(){ const tr=document.createElement("tr");
  tr.innerHTML=`<td><input class="pl" style="width:100px"></td><td><input class="cn" style="width:130px"></td><td><input class="ad" style="width:150px"></td><td><button class="sm" onclick="this.closest('tr').remove()">×</button></td>`;
  F("ktb").appendChild(tr); }
async function create(){
  const contacts=[...F("ktb").querySelectorAll("tr")].map(tr=>({plateNo:tr.querySelector(".pl").value,cusName:tr.querySelector(".cn").value,address:tr.querySelector(".ad").value})).filter(c=>c.plateNo||c.cusName);
  const r=await fetch("/api/campaigns",{method:"POST",headers:H(),body:JSON.stringify({camNo:F("cno").value,camName:F("cnm").value,startDate:F("sd").value||null,finishDate:F("fd").value||null,content:F("ct").value,contacts})});
  const j=await r.json();
  if(r.ok){ msg("Đã tạo "+j.camNo+" ("+j.contacts+" LH)."); F("cno").value="";F("cnm").value="";F("ktb").innerHTML="";addC(); load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch("/api/campaigns?active="+(F("ac").checked?"1":""),{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(c=>`<tr><td><b>${c.camNo}</b> <a href="#" class="det" onclick="contacts('${c.camNo}');return false">xem LH</a></td><td>${c.camName}</td>
    <td>${day(c.startDate)} → ${day(c.finishDate)}</td><td>${c.contacted}/${c.contacts}</td>
    <td><span class="pill ${c.running?'run':'end'}">${c.running?"Đang chạy":"Kết thúc"}</span></td></tr><tr id="x-${c.camNo}"></tr>`).join("")||'<tr><td colspan="5" class="muted">Chưa có CD.</td></tr>';
}
async function contacts(no){
  const row=F("x-"+no); if(row.innerHTML){ row.innerHTML=""; return; }
  const d=await (await fetch(`/api/campaigns/${no}/contacts`,{headers:H()})).json();
  row.innerHTML=`<td colspan="5"><div class="det">${(d.contacts||[]).map(c=>`${c.plateNo||c.cusName||"?"} · ${c.contactStatus==="Contacted"?"✓ đã LH":`<a href="#" onclick="mark(${c.id});return false">Đánh dấu đã LH</a>`}`).join(" &nbsp;|&nbsp; ")||"—"}</div></td>`;
}
async function mark(id){ const r=await fetch(`/api/campaigns/contacts/${id}/contacted`,{method:"POST",headers:H()}); if(r.ok) load(); }
addC(); load();
</script>
</body></html>
