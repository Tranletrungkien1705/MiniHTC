<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Báo cáo dư nợ bảo lãnh</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1040px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:12px 0}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} td.num{text-align:right;font-variant-numeric:tabular-nums} .wrap{overflow-x:auto}
  .kpi{display:flex;gap:10px;flex-wrap:wrap} .box{border:1px solid var(--line);border-radius:10px;padding:8px 12px} .box b{font-size:17px;display:block} .box span{font-size:11px;opacity:.7}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .s-Approved{color:var(--ok)} .s-Draft{color:var(--warn)} .s-Rejected{color:var(--bad)}
  #msg{font-size:13px} h3{font-size:14px;margin:14px 0 4px}
</style></head>
<body>
<h1>Báo cáo dư nợ bảo lãnh <span class="muted">(port 1:1 FrmBaocaoBaolanh — Report)</span></h1>
<p class="muted">Dư nợ BL = tổng giá trị BL đã duyệt, chưa tất toán. Nguồn = màn Bảo lãnh ngân hàng.</p>
<div class="bar">
  <div><label>Số BL</label><input id="qg" style="width:120px"></div>
  <div><label>NH</label><input id="qb" style="width:90px"></div>
  <div><label>Ngày mở từ</label><input id="qf" type="date"></div>
  <div><label>Đến</label><input id="qt" type="date"></div>
  <button class="primary" onclick="run()">Xem báo cáo</button><span id="msg"></span>
</div>
<div class="kpi" id="kpi" style="margin:8px 0"></div>
<h3>Theo ngân hàng</h3>
<div class="wrap"><table><thead><tr><th>NH</th><th class="num">Số BL</th><th class="num">Tổng giá trị</th><th class="num">Dư nợ</th><th class="num">Đã tất toán</th></tr></thead><tbody id="bankRows"></tbody></table></div>
<h3>Chi tiết</h3>
<div class="wrap"><table><thead><tr><th>Số BL</th><th>Đại lý</th><th>NH</th><th>Số BL NH</th><th class="num">Giá trị</th><th>Ngày mở</th><th>Trạng thái</th><th class="num">Dư nợ</th></tr></thead><tbody id="rows"><tr><td colspan="8" class="muted">Nhấn "Xem báo cáo".</td></tr></tbody></table></div>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const ST={Approved:"Đã duyệt",Draft:"Chờ duyệt",Rejected:"Từ chối"};
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY}; }
function money(n){ return (n||0).toLocaleString("vi-VN"); }
function msg(t){ F("msg").textContent=t; }
async function run(){ await token(); msg("");
  const r=await fetch(`/api/report/guarantee?grtNo=${F("qg").value}&bank=${F("qb").value}&openFrom=${F("qf").value}&openTo=${F("qt").value}`,{headers:H()});
  const d=await r.json();
  if(!r.ok){ msg("Lỗi: "+(d.error||r.status)); return; }
  F("kpi").innerHTML=`<div class="box"><b>${d.total}</b><span>Số BL</span></div><div class="box"><b>${money(d.totalDebit)}</b><span>Tổng dư nợ</span></div><div class="box"><b>${money(d.totalAmount)}</b><span>Tổng giá trị</span></div>`+
    (d.byStatus||[]).map(s=>`<div class="box"><b>${s.count}</b><span>${ST[s.status]||s.status}</span></div>`).join("");
  F("bankRows").innerHTML=(d.byBank||[]).map(b=>`<tr><td><b>${b.bankCode}</b></td><td class="num">${b.count}</td><td class="num">${money(b.totalAmount)}</td><td class="num">${money(b.debit)}</td><td class="num">${b.settled}</td></tr>`).join("")||'<tr><td colspan="5" class="muted">—</td></tr>';
  F("rows").innerHTML=(d.detail||[]).map(o=>`<tr><td><b>${o.guaranteeNo}</b></td><td>${o.dealerCode||""}</td><td>${o.bankCode||""}</td><td>${o.bankGuaranteeNo||""}</td><td class="num">${money(o.totalAmount)}</td><td>${o.dateOpen||""}</td><td><span class="pill s-${o.status}">${ST[o.status]||o.status}${o.flagSettled==="1"?" ✓TT":""}</span></td><td class="num">${money(o.debit)}</td></tr>`).join("")||'<tr><td colspan="8" class="muted">Không có dữ liệu.</td></tr>';
}
</script>
</body></html>
