<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Xe thế chấp tại ngân hàng</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--warn:#d97706;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:960px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} .wrap{overflow-x:auto}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .p-1{color:var(--ok)} .p-0{color:#dc2626}
  #msg{font-size:13px}
</style></head>
<body>
<h1>Xe đang thế chấp tại ngân hàng <span class="muted">(port 1:1 FrmBankCarMortage — cụm Bank)</span></h1>
<p class="muted"><a href="/deliveryplan.html">→ Kế hoạch giao xe (FrmDeliveryPlan)</a></p>
<div class="card">
  <b>Đăng ký xe thế chấp (upsert theo VIN)</b>
  <div class="bar" style="margin-top:10px">
    <div><label>Số khung VIN *</label><input id="vin" style="width:140px"></div>
    <div><label>Mã xe</label><input id="cid" style="width:90px"></div>
    <div><label>Số ĐH</label><input id="so" style="width:90px"></div>
    <div><label>Đại lý</label><input id="dl" style="width:90px"></div>
    <div><label>Model</label><input id="md" style="width:80px"></div>
  </div>
  <div class="bar" style="margin-top:8px">
    <div><label>NH nhận thế chấp *</label><input id="mb" style="width:110px"></div>
    <div><label>NH bảo lãnh</label><input id="bk" style="width:100px"></div>
    <div><label>Loại bảo lãnh</label><select id="gt"><option value="0">NH giám sát</option><option value="1">NH phát hành</option></select></div>
    <div><label>Khoảng giao</label><select id="rg"><option value="DlvImmediate">Giao ngay</option><option value="DlvThisWeek">Trong tuần</option><option value="DlvNextWeek">Tuần tới</option></select></div>
    <button class="primary" onclick="save()">Lưu</button><span id="msg"></span>
  </div>
</div>
<div class="bar" style="margin:10px 0">
  <input id="qd" placeholder="Lọc đại lý" oninput="load()" style="width:100px">
  <input id="qb" placeholder="Lọc NH" oninput="load()" style="width:90px">
  <input id="qv" placeholder="Lọc VIN" oninput="load()" style="width:110px">
  <input id="qs" placeholder="Lọc số ĐH" oninput="load()" style="width:90px">
  <select id="qg" onchange="load()"><option value="">Mọi loại BL</option><option value="0">NH giám sát</option><option value="1">NH phát hành</option></select>
  <select id="qa" onchange="load()"><option value="">Tất cả</option><option value="1">Còn thế chấp</option><option value="0">Đã giải chấp</option></select>
</div>
<div class="wrap"><table><thead><tr><th>VIN</th><th>Mã xe</th><th>Số ĐH</th><th>ĐL</th><th>Model</th><th>NH thế chấp</th><th>Loại BL</th><th>Khoảng giao</th><th>TT</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="10" class="muted">Đang tải…</td></tr></tbody></table></div>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const RG={DlvImmediate:"Giao ngay",DlvThisWeek:"Trong tuần",DlvNextWeek:"Tuần tới"};
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
async function save(){
  const b={vin:F("vin").value,carId:F("cid").value,soCode:F("so").value,dealerCode:F("dl").value,modelCode:F("md").value,
    mortageBankCode:F("mb").value,bankCode:F("bk").value,guaranteeType:F("gt").value,deliveryRangeType:F("rg").value};
  const r=await fetch("/api/bankmortages",{method:"POST",headers:H(),body:JSON.stringify(b)});
  const j=await r.json();
  if(r.ok){ msg((j.updated?"Đã cập nhật ":"Đã đăng ký ")+j.vin); load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/bankmortages?dealer=${F("qd").value}&bank=${F("qb").value}&vin=${F("qv").value}&soCode=${F("qs").value}&guaranteeType=${F("qg").value}&active=${F("qa").value}`,{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(o=>
    `<tr><td><b>${o.vin}</b></td><td>${o.carId||""}</td><td>${o.soCode||""}</td><td>${o.dealerCode||""}</td><td>${o.modelCode||""}</td><td>${o.mortageBankCode||""}</td><td>${o.guaranteeType==="1"?"NH phát hành":"NH giám sát"}</td><td>${RG[o.deliveryRangeType]||o.deliveryRangeType}</td><td><span class="pill p-${o.flagActive}">${o.flagActive==="1"?"Còn TC":"Giải chấp"}</span></td><td><button class="sm" onclick="toggle('${o.vin}')">Đổi TT</button></td></tr>`
  ).join("")||'<tr><td colspan="10" class="muted">Chưa có xe thế chấp.</td></tr>';
}
async function toggle(v){ const r=await fetch(`/api/bankmortages/${v}/toggle`,{method:"POST",headers:H()}); if(r.ok) load(); else msg("Lỗi "+r.status); }
load();
</script>
</body></html>
