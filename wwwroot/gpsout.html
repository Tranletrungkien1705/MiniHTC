<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Xuất kho GPS</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:980px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input,button{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} #msg{font-size:13px} .dev{font-size:12px;opacity:.85}
  #dtbl td,#dtbl th{padding:4px 6px}
</style></head>
<body>
<h1>Phiếu xuất kho thiết bị GPS <span class="muted">(port 1:1 FrmStoF_GPSOut / FrmMngStoF_GPSOut — StoF_GPSOut)</span></h1>
<div class="card">
  <b>Tạo phiếu xuất</b> <span class="muted">(xuất để gắn lên xe → đánh dấu đã map)</span>
  <div class="bar" style="margin:10px 0">
    <input id="st" placeholder="Kho GPS *" style="width:120px"><input id="ur" placeholder="Người nhận" style="width:120px"><input id="rm" placeholder="Ghi chú" style="width:180px">
    <span style="flex:1"></span><button class="primary" onclick="create()">Lưu phiếu</button><span id="msg"></span>
  </div>
  <table id="dtbl"><thead><tr><th>Số thiết bị GPS *</th><th>Số hộp</th><th>Ghi chú</th><th></th></tr></thead><tbody id="dtb"></tbody></table>
  <button class="sm" style="margin-top:8px" onclick="addDev()">+ Thêm thiết bị</button>
</div>
<div class="bar" style="margin:10px 0"><input id="q" placeholder="Lọc kho" oninput="load()" style="width:110px"></div>
<table><thead><tr><th>Số phiếu</th><th>Kho</th><th>Người nhận</th><th>SL thiết bị</th><th>Ngày</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="6" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const day=d=>d? new Date(d).toLocaleString("vi-VN"):"";
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
function addDev(){
  const tr=document.createElement("tr");
  tr.innerHTML=`<td><input class="dv" style="width:150px"></td><td><input class="bx" style="width:100px"></td>
    <td><input class="rm" style="width:130px"></td><td><button class="sm" onclick="this.closest('tr').remove()">×</button></td>`;
  F("dtb").appendChild(tr);
}
async function create(){
  const devices=[...F("dtb").querySelectorAll("tr")].map(tr=>({gpsDvNo:tr.querySelector(".dv").value,gpsBoxNo:tr.querySelector(".bx").value,remark:tr.querySelector(".rm").value})).filter(d=>d.gpsDvNo);
  const r=await fetch("/api/gpsouts",{method:"POST",headers:H(),body:JSON.stringify({storageCode:F("st").value,userCodeReceived:F("ur").value,remark:F("rm").value,devices})});
  const j=await r.json();
  if(r.ok){ msg("Đã xuất "+j.sfgpsOutNo+" ("+j.devices+" TB)."); F("dtb").innerHTML="";addDev(); load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch("/api/gpsouts?storage="+encodeURIComponent(F("q").value),{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(g=>`<tr><td><b>${g.sfgpsOutNo}</b> <a href="#" class="dev" onclick="devs('${g.sfgpsOutNo}');return false">xem</a></td>
    <td>${g.storageCode}</td><td>${g.userCodeReceived||"—"}</td><td>${g.devices}</td><td>${day(g.createdAt)}</td>
    <td></td></tr><tr id="x-${g.sfgpsOutNo}"></tr>`).join("")||'<tr><td colspan="6" class="muted">Chưa có phiếu.</td></tr>';
}
async function devs(no){
  const row=F("x-"+no); if(row.innerHTML){ row.innerHTML=""; return; }
  const d=await (await fetch(`/api/gpsouts/${no}/devices`,{headers:H()})).json();
  row.innerHTML=`<td colspan="6"><div class="dev">${(d.devices||[]).map(x=>`TB <b>${x.gpsDvNo}</b>${x.gpsBoxNo?" · hộp "+x.gpsBoxNo:""}${x.mapStatus==="1"?" · đã gắn":""}`).join(" &nbsp;|&nbsp; ")||"—"}</div></td>`;
}
addDev(); load();
</script>
</body></html>
