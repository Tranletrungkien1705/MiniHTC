<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Quản lý Khu vực</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb}
  *{box-sizing:border-box} body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:900px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .bar{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}
  input,button{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:14px} th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:12px;text-transform:uppercase}
  .pill{font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line)}
  .ok{color:#16a34a} .err{color:#dc2626} .act{color:var(--accent);cursor:pointer;margin-right:10px}
  #msg{min-height:18px;font-size:13px}
</style></head>
<body>
<h1>Quản lý Khu vực</h1>
<div class="muted">Port 1:1 <b>FrmArea</b> (2010.HTC / TERP.HTCClient / Admin/Dealer) — Mst_Area. Backend .NET8 + SSO.</div>

<div class="bar">
  <input id="q" placeholder="Tìm mã/tên khu vực..." oninput="load()">
  <span style="flex:1"></span>
  <input id="fCode" placeholder="Mã KV" style="width:90px">
  <input id="fName" placeholder="Tên khu vực" style="width:200px">
  <input id="fRoot" placeholder="Mã KV cha (để trống=gốc)" style="width:160px">
  <select id="fStatus" style="padding:7px;border-radius:8px;border:1px solid var(--line);background:transparent;color:inherit">
    <option value="1">Hiệu lực</option><option value="0">Ngừng</option>
  </select>
  <button class="primary" onclick="save()">Lưu</button>
</div>

<div id="msg"></div>
<table><thead><tr><th>Mã</th><th>Tên khu vực</th><th>KV cha</th><th>Cấp</th><th>Trạng thái</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="6" class="muted">Đang tải…</td></tr></tbody></table>

<script>
let TOKEN = null;
const KEY = "demo-htc";
async function token(){
  if (TOKEN) return TOKEN;
  const r = await fetch("https://minisso.onrender.com/oauth/token", {method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN = (await r.json()).access_token; return TOKEN;
}
function H(){ return {"Authorization":"Bearer "+TOKEN, "X-Api-Key":KEY, "Content-Type":"application/json"}; }
function msg(t, ok){ const m=document.getElementById("msg"); m.textContent=t; m.className=ok?"ok":"err"; }
async function load(){
  await token();
  const q = document.getElementById("q").value;
  const r = await fetch("/api/areas?q="+encodeURIComponent(q), {headers:H()});
  const d = await r.json();
  document.getElementById("rows").innerHTML = (d.items||[]).map(a=>`
    <tr><td><b>${a.areaCode}</b></td><td>${a.areaName}</td>
    <td>${a.areaRootCode||"—"}</td><td>${a.level}</td>
    <td><span class="pill">${a.status==="1"?"Hiệu lực":"Ngừng"}</span></td>
    <td><span class="act" onclick="edit('${a.areaCode}','${a.areaName.replace(/'/g,"\\'")}','${a.areaRootCode||""}','${a.status}')">Sửa</span>
    <span class="act err" onclick="del('${a.areaCode}')">Xoá</span></td></tr>`).join("")
    || '<tr><td colspan="6" class="muted">Chưa có khu vực.</td></tr>';
}
function edit(c,n,root,s){ document.getElementById("fCode").value=c; document.getElementById("fName").value=n; document.getElementById("fRoot").value=root; document.getElementById("fStatus").value=s; }
async function save(){
  const body = JSON.stringify({areaCode:document.getElementById("fCode").value, areaName:document.getElementById("fName").value, areaRootCode:document.getElementById("fRoot").value||null, status:document.getElementById("fStatus").value});
  const r = await fetch("/api/areas", {method:"POST", headers:H(), body});
  if(r.ok){ msg("Đã lưu.", true); document.getElementById("fCode").value=""; document.getElementById("fName").value=""; document.getElementById("fRoot").value=""; load(); }
  else msg("Lỗi: "+((await r.json()).error||r.status), false);
}
async function del(c){
  if(!confirm("Xoá khu vực "+c+"?")) return;
  const r = await fetch("/api/areas/"+encodeURIComponent(c), {method:"DELETE", headers:H()});
  if(r.ok){ msg("Đã xoá "+c, true); load(); } else msg("Không xoá được.", false);
}
load();
</script>
</body></html>
