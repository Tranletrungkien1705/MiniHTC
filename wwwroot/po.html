<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Đơn đặt hàng NCC</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:920px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .bar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;align-items:center}
  input,button{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} td.n{text-align:right;font-variant-numeric:tabular-nums} .pill{font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line)}
  .act{color:var(--accent);cursor:pointer;margin-right:8px} .r{color:#dc2626} #msg{font-size:13px}
</style></head>
<body>
<h1>Đơn đặt hàng nhà cung cấp <span class="muted">(Supplier PO — TCMotor)</span></h1>
<div class="bar">
  <input id="sp" placeholder="Mã NCC *" style="width:120px"><input id="tt" placeholder="Tổng tiền" style="width:130px"><input id="nt" placeholder="Ghi chú" style="width:200px">
  <button class="primary" onclick="create()">Tạo PO</button><span id="msg"></span>
</div>
<table><thead><tr><th>Số PO</th><th>NCC</th><th class="n">Tổng</th><th>Trạng thái</th><th>Ghi chú</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="6" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t,ok){ F("msg").textContent=t; F("msg").className=ok?"":"r"; }
const fmt=n=>Number(n).toLocaleString('vi-VN'); const badge=s=>({Draft:"Nháp",Sent:"Đã gửi",Received:"Đã nhận",Cancelled:"Đã hủy"}[s]||s);
async function load(){ await token();
  const d=await (await fetch("/api/pos",{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(x=>{
    let a="";
    if(x.status==="Draft") a=`<span class="act" onclick="act('${x.poNo}','send')">Gửi NCC</span><span class="act r" onclick="act('${x.poNo}','cancel')">Hủy</span>`;
    else if(x.status==="Sent") a=`<span class="act" onclick="act('${x.poNo}','receive')">Nhận hàng</span>`;
    return `<tr><td><b>${x.poNo}</b></td><td>${x.supplierCode}</td><td class="n">${fmt(x.total)}</td>
      <td><span class="pill">${badge(x.status)}</span></td><td>${x.note||""}</td><td>${a}</td></tr>`;
  }).join("")||'<tr><td colspan="6" class="muted">Chưa có PO.</td></tr>';
}
async function create(){
  const r=await fetch("/api/pos",{method:"POST",headers:H(),body:JSON.stringify({supplierCode:F("sp").value,total:Number(F("tt").value||0),note:F("nt").value})});
  if(r.ok){ msg("Đã tạo.",true); F("tt").value="";F("nt").value=""; load(); } else msg("Lỗi: "+((await r.json()).error||r.status),false);
}
async function act(no,a){ const r=await fetch(`/api/pos/${no}/${a}`,{method:"POST",headers:H()});
  if(r.ok){ msg("OK",true); load(); } else msg("Lỗi",false); }
load();
</script>
</body></html>
