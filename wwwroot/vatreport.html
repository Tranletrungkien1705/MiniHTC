<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Báo cáo hóa đơn VAT</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1060px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px} h3{font-size:14px;margin:14px 0 4px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:12px 0}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} td.num{text-align:right;font-variant-numeric:tabular-nums} .wrap{overflow-x:auto}
  .kpi{display:flex;gap:10px;flex-wrap:wrap} .box{border:1px solid var(--line);border-radius:10px;padding:8px 12px} .box b{font-size:17px;display:block} .box span{font-size:11px;opacity:.7}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .s-Draft{color:var(--warn)} .s-Issued{color:var(--ok)} .s-Deleted{color:var(--bad)}
  #msg{font-size:13px}
</style></head>
<body>
<h1>Báo cáo hóa đơn VAT HTC <span class="muted">(port 1:1 báo cáo VAT_HTCInvoice — Report)</span></h1>
<p class="muted">Tổng hợp hóa đơn VAT theo đại lý / trạng thái / loại (gốc-điều chỉnh). Nguồn = màn Hóa đơn VAT.</p>
<div class="bar">
  <div><label>Đại lý</label><input id="qd" style="width:90px"></div>
  <div><label>Trạng thái</label><select id="qs"><option value="">Tất cả</option><option value="Draft">Nháp</option><option value="Issued">Đã phát hành</option><option value="Deleted">Đã xóa</option></select></div>
  <div><label>Loại</label><select id="qa"><option value="">Gốc + ĐC</option><option value="root">HĐ gốc</option><option value="adj">HĐ điều chỉnh</option></select></div>
  <div><label>Từ ngày</label><input id="qf" type="date"></div>
  <div><label>Đến</label><input id="qt" type="date"></div>
  <button class="primary" onclick="run()">Xem báo cáo</button><span id="msg"></span>
</div>
<div class="kpi" id="kpi" style="margin:8px 0"></div>
<h3>Theo đại lý</h3>
<div class="wrap"><table><thead><tr><th>Đại lý</th><th class="num">Số HĐ</th><th class="num">Số xe</th><th class="num">Tổng giá HĐ</th></tr></thead><tbody id="dRows"></tbody></table></div>
<h3>Chi tiết hóa đơn</h3>
<div class="wrap"><table><thead><tr><th>Mã HĐ</th><th>Số HĐ</th><th>Ký hiệu</th><th>Đại lý</th><th class="num">VAT%</th><th>Loại</th><th class="num">Số xe</th><th class="num">Tổng giá</th><th>Trạng thái</th></tr></thead><tbody id="rows"><tr><td colspan="9" class="muted">Nhấn "Xem báo cáo".</td></tr></tbody></table></div>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const ST={Draft:"Nháp",Issued:"Đã phát hành",Deleted:"Đã xóa"};
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY}; }
function money(n){ return (n||0).toLocaleString("vi-VN"); }
function msg(t){ F("msg").textContent=t; }
async function run(){ await token(); msg("");
  const r=await fetch(`/api/report/vatinvoice?dealer=${F("qd").value}&status=${F("qs").value}&adjType=${F("qa").value}&from=${F("qf").value}&to=${F("qt").value}`,{headers:H()});
  const d=await r.json();
  if(!r.ok){ msg("Lỗi: "+(d.error||r.status)); return; }
  F("kpi").innerHTML=`<div class="box"><b>${d.total}</b><span>Số HĐ</span></div><div class="box"><b>${d.totalCars}</b><span>Số xe</span></div><div class="box"><b>${money(d.totalAmount)}</b><span>Tổng giá</span></div><div class="box"><b>${d.issued}</b><span>Đã phát hành</span></div><div class="box"><b>${d.deleted}</b><span>Đã xóa</span></div>`;
  F("dRows").innerHTML=(d.byDealer||[]).map(o=>`<tr><td><b>${o.dealerCode}</b></td><td class="num">${o.count}</td><td class="num">${o.cars}</td><td class="num">${money(o.amount)}</td></tr>`).join("")||'<tr><td colspan="4" class="muted">—</td></tr>';
  F("rows").innerHTML=(d.detail||[]).map(o=>`<tr><td><b>${o.htcInvoiceCode}</b></td><td>${o.htcInvoiceNo||"—"}</td><td>${o.invoiceIDCode||""}</td><td>${o.dealerCode||""}</td><td class="num">${o.vat}</td><td>${o.invoiceAdjType||"Gốc"}</td><td class="num">${o.cars}</td><td class="num">${money(o.amount)}</td><td><span class="pill s-${o.vatHTCStatus}">${ST[o.vatHTCStatus]||o.vatHTCStatus}</span></td></tr>`).join("")||'<tr><td colspan="9" class="muted">Không có dữ liệu.</td></tr>';
}
</script>
</body></html>
