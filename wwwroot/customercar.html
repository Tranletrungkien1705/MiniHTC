<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Xe khách hàng</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1040px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .bar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;align-items:center}
  input,button{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} #msg{font-size:13px}
</style></head>
<body>
<h1>Xe của khách hàng <span class="muted">(port 1:1 FrmCustomerCar — Ser_Car, registry dịch vụ)</span></h1>
<div class="bar">
  <input id="pl" placeholder="Biển số *" style="width:110px"><input id="vin" placeholder="VIN" style="width:120px">
  <input id="fr" placeholder="Số khung" style="width:100px"><input id="en" placeholder="Số máy" style="width:100px">
  <input id="md" placeholder="Model" style="width:90px"><input id="cl" placeholder="Màu xe" style="width:80px"><input id="pcl" placeholder="Màu biển" style="width:80px">
  <input id="cn" placeholder="Chủ xe" style="width:120px"><input id="cp" placeholder="SĐT" style="width:100px"><input id="sd" type="date" title="Ngày bán">
  <button class="primary" onclick="save()">Lưu xe</button><span id="msg"></span>
</div>
<div class="bar"><input id="qp" placeholder="Tìm biển số" oninput="load()" style="width:130px"><input id="qv" placeholder="Tìm VIN" oninput="load()" style="width:130px"><input id="qc" placeholder="Tìm chủ xe/SĐT" oninput="load()" style="width:150px"></div>
<table><thead><tr><th>Biển số</th><th>VIN</th><th>Model</th><th>Màu</th><th>Số máy</th><th>Chủ xe</th><th>SĐT</th><th>Ngày bán</th></tr></thead>
<tbody id="rows"><tr><td colspan="8" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const day=d=>d? new Date(d).toLocaleDateString("vi-VN"):"—";
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
async function save(){
  const b={plateNo:F("pl").value,vin:F("vin").value,frameNo:F("fr").value,engineNo:F("en").value,modelCode:F("md").value,colorCode:F("cl").value,plateColorCode:F("pcl").value,cusName:F("cn").value,cusPhone:F("cp").value,saleDate:F("sd").value||null};
  const r=await fetch("/api/customercars",{method:"POST",headers:H(),body:JSON.stringify(b)});
  const j=await r.json();
  if(r.ok){ msg("Đã lưu xe "+(j.plateNo||j.vin)+"."); F("pl").value="";F("vin").value=""; load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/customercars?plate=${encodeURIComponent(F("qp").value)}&vin=${encodeURIComponent(F("qv").value)}&cus=${encodeURIComponent(F("qc").value)}`,{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(c=>`<tr><td><b>${c.plateNo}</b>${c.plateColorCode?` <span class="muted">(${c.plateColorCode})</span>`:""}</td><td>${c.vin||"—"}</td>
    <td>${c.modelCode||"—"}</td><td>${c.colorCode||"—"}</td><td>${c.engineNo||"—"}</td><td>${c.cusName||"—"}</td><td>${c.cusPhone||"—"}</td><td>${day(c.saleDate)}</td></tr>`).join("")||'<tr><td colspan="8" class="muted">Chưa có xe.</td></tr>';
}
load();
</script>
</body></html>
