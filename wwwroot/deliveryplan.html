<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Kế hoạch giao xe</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:900px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} td.num{text-align:right;font-variant-numeric:tabular-nums} .wrap{overflow-x:auto}
  .kpi{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
  .box{border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:110px}
  .box b{font-size:22px;display:block;font-variant-numeric:tabular-nums} .box span{font-size:12px;opacity:.7}
  #msg{font-size:13px}
</style></head>
<body>
<h1>Kế hoạch giao xe <span class="muted">(port 1:1 FrmDeliveryPlan — pivot theo khoảng giao × model)</span></h1>
<p class="muted"><a href="/bankmortage.html">← Xe thế chấp tại ngân hàng</a></p>
<div class="card">
  <div class="bar">
    <div><label>Đại lý</label><input id="dl" style="width:100px"></div>
    <div><label>Ngân hàng</label><input id="bk" style="width:100px"></div>
    <div><label>Loại bảo lãnh *</label><select id="gt"><option value="0">NH giám sát</option><option value="1">NH phát hành</option><option value="">Tất cả</option></select></div>
    <button class="primary" onclick="run()">Xem kế hoạch</button><span id="msg"></span>
  </div>
</div>
<div class="kpi" id="kpi"></div>
<div class="wrap"><table><thead><tr><th>Model</th><th class="num">Giao ngay</th><th class="num">Trong tuần</th><th class="num">Tuần tới</th><th class="num">Tổng</th></tr></thead>
<tbody id="rows"><tr><td colspan="5" class="muted">Nhấn "Xem kế hoạch".</td></tr></tbody>
<tfoot id="foot"></tfoot></table></div>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY}; }
async function run(){ await token(); F("msg").textContent="";
  const d=await (await fetch(`/api/bankmortages/deliveryplan?dealer=${F("dl").value}&bank=${F("bk").value}&guaranteeType=${F("gt").value}`,{headers:H()})).json();
  F("kpi").innerHTML=(d.byRange||[]).map(b=>`<div class="box"><b>${b.value}</b><span>${b.key}</span></div>`).join("")+`<div class="box"><b>${d.total}</b><span>Tổng xe</span></div>`;
  const p=d.pivot||[];
  F("rows").innerHTML=p.map(o=>`<tr><td><b>${o.modelCode}</b></td><td class="num">${o.giaoNgay}</td><td class="num">${o.trongTuan}</td><td class="num">${o.tuanToi}</td><td class="num">${o.total}</td></tr>`).join("")||'<tr><td colspan="5" class="muted">Không có dữ liệu.</td></tr>';
  if(p.length){ const s=(k)=>p.reduce((a,o)=>a+o[k],0);
    F("foot").innerHTML=`<tr><th>Tổng cộng</th><td class="num"><b>${s("giaoNgay")}</b></td><td class="num"><b>${s("trongTuan")}</b></td><td class="num"><b>${s("tuanToi")}</b></td><td class="num"><b>${s("total")}</b></td></tr>`;
  } else F("foot").innerHTML="";
}
</script>
</body></html>
