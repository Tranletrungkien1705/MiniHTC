<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Phân công công đoạn RO</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#4f46e5;--ok:#16a34a;--warn:#d97706}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1080px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px} h3{font-size:14px;margin:14px 0 4px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0} .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
  input,button,select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit} label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.link{border:none;background:none;color:var(--accent);padding:2px 6px}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px} th,td{text-align:left;padding:5px 7px;border-bottom:1px solid var(--line)} th{opacity:.7;font-size:10.5px;text-transform:uppercase} .wrap{overflow-x:auto}
  .msg{font-size:13px;margin-left:6px} .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
</style></head>
<body>
<h1>Phân công công đoạn sửa chữa theo RO <span class="muted">(port 1:1 FrmSer_AssignmentWork — TCMotor DMSCarSv/Services)</span></h1>
<div class="card"><h3 style="margin-top:0">Tra cứu / cập nhật công đoạn</h3>
  <div class="row"><input id="ro" placeholder="Số RO" style="width:200px"><button class="primary" onclick="load()">Tra cứu</button><span id="msg" class="msg"></span></div>
</div>
<div class="card" id="stagesCard" style="display:none">
  <h3 style="margin-top:0">7 công đoạn — RO <span id="roShow"></span></h3>
  <div class="wrap"><table><thead><tr><th>Mã CĐ</th><th>Khoang</th><th>KH bắt đầu</th><th>KH kết thúc</th><th>TT bắt đầu</th><th>TT kết thúc</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
</div>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id); const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
const STAGES=["SCC","SCD","SCDB","SCKSC","SCLR","SCN","SCS"];
const dtshow=s=>s?String(s).slice(0,16):""; const dtval=s=>s?String(s).slice(0,16):"";
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function Hh(x){ return Object.assign({"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY}, x||{}); }
function say(t){ F("msg").textContent=t; setTimeout(()=>{if(F("msg").textContent===t)F("msg").textContent="";},4000); }
async function load(){ await token();
  const ro=F("ro").value; if(!ro){ say("Chưa nhập số RO."); return; }
  const r=await fetch("/api/serassignmentworks/"+encodeURIComponent(ro),{headers:Hh()}); const d=await r.json();
  F("roShow").textContent=d.roNo; F("stagesCard").style.display="block";
  const byCode={}; (d.stages||[]).forEach(s=>byCode[s.stageCode]=s);
  F("tb").innerHTML=STAGES.map(sc=>{ const s=byCode[sc]||{}; return `<tr>
    <td><b>${sc}</b></td>
    <td><input class="cav" data-sc="${sc}" style="width:80px" value="${esc(s.cavityId)}"></td>
    <td><input class="ps" data-sc="${sc}" type="datetime-local" value="${dtval(s.planStart)}"></td>
    <td><input class="pf" data-sc="${sc}" type="datetime-local" value="${dtval(s.planFinish)}"></td>
    <td><input class="as" data-sc="${sc}" type="datetime-local" value="${dtval(s.actualStart)}"></td>
    <td><input class="af" data-sc="${sc}" type="datetime-local" value="${dtval(s.actualFinish)}"></td>
    <td><button class="link" onclick="saveStage('${sc}')">Lưu</button></td>
  </tr>`; }).join("");
}
async function saveStage(sc){ await token();
  const tr=[...F("tb").querySelectorAll("tr")].find(r=>r.querySelector(`.cav[data-sc="${sc}"]`));
  const body={StageCode:sc,CavityId:tr.querySelector(".cav").value||null,PlanStart:tr.querySelector(".ps").value||null,PlanFinish:tr.querySelector(".pf").value||null,ActualStart:tr.querySelector(".as").value||null,ActualFinish:tr.querySelector(".af").value||null};
  const r=await fetch("/api/serassignmentworks/"+encodeURIComponent(F("ro").value)+"/stage",{method:"POST",headers:Hh({"Content-Type":"application/json"}),body:JSON.stringify(body)});
  const d=await r.json(); if(!r.ok){ say("Lỗi: "+(d.error||r.status)); return; } say("Đã lưu công đoạn "+d.stageCode);
}
</script>
</body></html>
