<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Đề nghị đăng ký xe lái thử</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--warn:#d97706;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1100px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:12px} th,td{text-align:left;padding:5px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{opacity:.7;font-size:10px;text-transform:uppercase}
  #msg,#dMsg{font-size:13px} .wrap{overflow-x:auto}
</style></head>
<body>
<h1>Đề nghị đăng ký xe lái thử <span class="muted">(port 1:1 FrmNewRegister_TestCar — Car_TestCar, phân bổ VIN làm demo/lái thử)</span></h1>
<div class="card">
  <b>Tạo/sửa đề nghị</b>
  <div class="bar" style="margin:10px 0">
    <div><label>Số đề nghị (để trống = tự sinh; nhập số cũ = sửa)</label><input id="no" style="width:180px"></div>
    <div><label>Mã đại lý</label><input id="dl" style="width:100px"></div>
    <div><label>Ghi chú</label><input id="rm" style="width:220px"></div>
  </div>
  <div class="wrap">
  <table id="tLines"><thead><tr><th>VIN</th><th>Mã xe</th><th>Model</th><th>Spec</th><th>Màu</th><th>Số ĐH</th><th>Hiệu lực từ</th><th>Hiệu lực đến</th><th>Đơn giá</th><th></th></tr></thead><tbody id="lineRows"></tbody></table>
  </div>
  <button class="sm" onclick="addLine()">+ Thêm dòng VIN</button>
  <div class="bar" style="margin-top:10px"><button class="primary" onclick="save()">Lưu đề nghị</button><span id="msg"></span></div>
</div>
<div class="bar" style="margin:10px 0">
  <input id="fdl" placeholder="Lọc đại lý" oninput="load()" style="width:110px">
  <input id="fq" placeholder="Lọc Số đề nghị" oninput="load()" style="width:150px">
</div>
<div class="wrap">
<table><thead><tr><th>Số đề nghị</th><th>Đại lý</th><th>Ghi chú</th><th>Số VIN</th><th>Ngày tạo</th><th>Hành động</th></tr></thead>
<tbody id="rows"><tr><td colspan="6" class="muted">Đang tải…</td></tr></tbody></table>
</div>
<div id="detail" class="card" style="display:none">
  <b id="dTitle"></b> <span id="dMsg"></span>
  <div class="wrap"><table id="dTable"><thead><tr><th>VIN</th><th>Mã xe</th><th>Hiệu lực từ</th><th>Hiệu lực đến</th><th>Đơn giá</th></tr></thead><tbody id="dRows"></tbody></table></div>
</div>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const day=d=>d? new Date(d).toLocaleDateString("vi-VN"):"—"; const money=n=>Number(n||0).toLocaleString("vi-VN");
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
function addLine(){
  const tr=document.createElement("tr");
  tr.innerHTML=`<td><input style="width:110px" class="vin"></td><td><input style="width:70px" class="carid"></td><td><input style="width:80px" class="model"></td><td><input style="width:80px" class="spec"></td>
    <td><input style="width:80px" class="color"></td><td><input style="width:80px" class="so"></td><td><input type="date" class="ds"></td><td><input type="date" class="de"></td>
    <td><input type="number" class="up" style="width:90px" value="0"></td><td><button class="sm" onclick="this.closest('tr').remove()">x</button></td>`;
  F("lineRows").appendChild(tr);
}
addLine();
function collectLines(){
  return [...F("lineRows").querySelectorAll("tr")].map(tr=>({
    vin: tr.querySelector(".vin").value.trim(), carId: tr.querySelector(".carid").value.trim()||null, modelCode: tr.querySelector(".model").value.trim()||null,
    specCode: tr.querySelector(".spec").value.trim()||null, colorCode: tr.querySelector(".color").value.trim()||null, soDonHang: tr.querySelector(".so").value.trim()||null,
    effDateStart: tr.querySelector(".ds").value||null, effDateEnd: tr.querySelector(".de").value||null, unitPriceActual: +tr.querySelector(".up").value||0,
  })).filter(l=>l.vin);
}
async function save(){
  const lines=collectLines();
  if(lines.length===0){ msg("Lưới dữ liệu trống!"); return; }
  const r=await fetch("/api/cartestcars",{method:"POST",headers:H(),body:JSON.stringify({testCarCode:F("no").value||null,dealerCode:F("dl").value||null,remark:F("rm").value||null,lines})});
  const j=await r.json();
  if(r.ok){ msg(`Đã lưu ${j.testCarCode} (${j.lines} xe)`); F("no").value=j.testCarCode; load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/cartestcars?dealer=${F("fdl").value}&q=${F("fq").value}`,{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(o=>
    `<tr><td><b>${o.testCarCode}</b></td><td>${o.dealerCode||"—"}</td><td>${o.remark||"—"}</td><td>${o.lines}</td><td>${day(o.createdAt)}</td><td><button class="sm" onclick="view('${o.testCarCode}')">Xem</button> <button class="sm" onclick="del('${o.testCarCode}')">Xóa</button></td></tr>`
  ).join("")||'<tr><td colspan="6" class="muted">Chưa có đề nghị.</td></tr>';
}
async function view(no){ await token();
  const d=await (await fetch(`/api/cartestcars/${no}`,{headers:H()})).json();
  F("detail").style.display="block"; F("dTitle").textContent=`${d.testCarCode} — ${d.dealerCode||""}`; F("dMsg").textContent="";
  F("dRows").innerHTML=(d.lines||[]).map(l=>`<tr><td>${l.vin}</td><td>${l.carId||"—"}</td><td>${day(l.effDateStart)}</td><td>${day(l.effDateEnd)}</td><td>${money(l.unitPriceActual)}</td></tr>`).join("")||'<tr><td colspan="5" class="muted">—</td></tr>';
}
async function del(no){ if(!confirm("Xóa đề nghị "+no+"?")) return; const r=await fetch(`/api/cartestcars/${no}`,{method:"DELETE",headers:H()}); if(r.ok) load(); else alert("Lỗi xóa"); }
load();
</script>
</body></html>
