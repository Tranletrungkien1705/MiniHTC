<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — KH dịch vụ</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1040px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .bar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;align-items:center}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} #msg{font-size:13px}
</style></head>
<body>
<h1>Khách hàng dịch vụ <span class="muted">(port 1:1 FrmCustomerInfo — Ser_Customer)</span></h1>
<div class="bar">
  <input id="cc" placeholder="Mã KH (trống = tự sinh)" style="width:130px"><input id="cn" placeholder="Họ tên / Tổ chức *" style="width:170px">
  <input id="ty" placeholder="Loại KH" style="width:90px"><input id="mb" placeholder="Di động *" style="width:110px"><input id="tel" placeholder="Cố định" style="width:100px">
  <input id="em" placeholder="Email" style="width:130px"><input id="tx" placeholder="MST" style="width:100px"><input id="ad" placeholder="Địa chỉ" style="width:150px"><input id="dob" type="date" title="Ngày sinh">
  <input id="ctn" placeholder="Người liên hệ (tổ chức)" style="width:150px"><input id="ctm" placeholder="SĐT liên hệ" style="width:110px">
  <button class="primary" onclick="save()">Lưu KH</button><span id="msg"></span>
</div>
<div class="bar"><input id="q" placeholder="Tìm tên/mã/SĐT/MST" oninput="load()" style="width:220px"></div>
<table><thead><tr><th>Mã KH</th><th>Họ tên</th><th>Loại</th><th>Di động</th><th>Email</th><th>MST</th><th>Địa chỉ</th><th>Người LH</th></tr></thead>
<tbody id="rows"><tr><td colspan="8" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
async function save(){
  const b={cusCode:F("cc").value,cusName:F("cn").value,cusTypeID:F("ty").value,mobile:F("mb").value,tel:F("tel").value,email:F("em").value,taxCode:F("tx").value,address:F("ad").value,dob:F("dob").value||null,contName:F("ctn").value,contMobile:F("ctm").value};
  const r=await fetch("/api/servicecustomers",{method:"POST",headers:H(),body:JSON.stringify(b)});
  const j=await r.json();
  if(r.ok){ msg("Đã lưu "+j.cusCode+" — "+j.cusName+"."); F("cc").value="";F("cn").value=""; load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch("/api/servicecustomers?q="+encodeURIComponent(F("q").value),{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(c=>`<tr><td><b>${c.cusCode}</b></td><td>${c.cusName}</td><td>${c.cusTypeID||"—"}</td><td>${c.mobile||"—"}</td>
    <td>${c.email||"—"}</td><td>${c.taxCode||"—"}</td><td class="muted">${c.address||"—"}</td><td>${c.contName?c.contName+(c.contMobile?" ("+c.contMobile+")":""):"—"}</td></tr>`).join("")||'<tr><td colspan="8" class="muted">Chưa có khách hàng.</td></tr>';
}
load();
</script>
</body></html>
