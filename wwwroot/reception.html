<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Tiếp nhận xe</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--warn:#d97706;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1020px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .bar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;align-items:center}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .p-P{color:var(--warn)} .p-A{color:var(--ok)}
  .kpi{display:inline-block;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-right:8px} #msg{font-size:13px} .ro{color:var(--accent)}
</style></head>
<body>
<h1>Phiếu tiếp nhận xe dịch vụ <span class="muted">(port 1:1 FrmSerReceptionFMng — Ser_ReceptionF)</span></h1>
<div class="bar">
  <input id="dl" placeholder="Đại lý *" style="width:90px"><input id="car" placeholder="CarID (Ser_Car) *" style="width:130px"><input id="cus" placeholder="CusID" style="width:90px">
  <input id="pl" placeholder="Biển số" style="width:100px"><input id="km" placeholder="Km" style="width:80px"><input id="fuel" placeholder="Mức nhiên liệu" style="width:110px">
  <select id="lvl" title="Cấp kiểm tra"><option value="1">Cấp KT 1</option><option value="2">Cấp KT 2</option><option value="3">Cấp KT 3</option></select>
  <label><input type="checkbox" id="fApp"> Có hẹn</label><label><input type="checkbox" id="fBack"> Sửa lại</label>
  <label><input type="checkbox" id="fWar"> Bảo hành</label><label><input type="checkbox" id="fIns"> Bảo hiểm</label>
  <input id="cr" placeholder="Yêu cầu KH" style="width:160px"><input id="rm" placeholder="Ghi chú" style="width:140px">
  <button class="primary" onclick="save()">Tiếp nhận</button><span id="msg"></span>
</div>
<div class="bar">
  <span class="kpi">Tổng: <b id="kt">0</b></span><span class="kpi">Đang tiếp nhận: <b id="kp">0</b></span>
  <span style="flex:1"></span>
  <select id="fst" onchange="load()"><option value="">Tất cả</option><option value="P">P — Tiếp nhận</option><option value="A">A — Giao xe</option></select>
  <input id="q" placeholder="Lọc biển số" oninput="load()" style="width:110px">
</div>
<table><thead><tr><th>Số phiếu</th><th>Đại lý</th><th>Biển số / CarID</th><th>Km · NL · Cấp</th><th>Cờ</th><th>Yêu cầu</th><th>RO</th><th>Trạng thái</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="9" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const LBL={P:"Tiếp nhận",A:"Giao xe"};
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
async function save(){
  const r=await fetch("/api/receptions",{method:"POST",headers:H(),body:JSON.stringify({DealerCode:F("dl").value,CarID:F("car").value,CusID:F("cus").value,PlateNo:F("pl").value,Km:F("km").value,FuelLevel:F("fuel").value,
    LevelOfInspection:F("lvl").value,AppStatus:F("fApp").checked?"1":"0",BackRepairStatus:F("fBack").checked?"1":"0",WarrantlyStatus:F("fWar").checked?"1":"0",
    InsuaranceStatus:F("fIns").checked?"1":"0",CusRequest:F("cr").value,Remark:F("rm").value})});
  const j=await r.json();
  if(r.ok){ msg("Đã tiếp nhận "+j.receptionFNo+"."); F("pl").value="";F("cr").value=""; load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/receptions?status=${F("fst").value}&plate=${encodeURIComponent(F("q").value)}`,{headers:H()})).json();
  F("kt").textContent=d.count; F("kp").textContent=d.pending;
  F("rows").innerHTML=(d.items||[]).map(r=>{
    let act="";
    if(r.receptionFStatus==="P"){
      act=(!r.rono?`<button class="sm" onclick="linkro('${r.receptionFNo}')">Gắn RO</button> <button class="sm" onclick="del('${r.receptionFNo}')">Xoá</button> `:"")+`<button class="sm" onclick="deliver('${r.receptionFNo}')">Giao xe</button>`;
    }
    const fl=[r.appStatus==="1"?"Hẹn":"",r.backRepairStatus==="1"?"Sửa lại":"",r.warrantlyStatus==="1"?"BH":"",r.insuaranceStatus==="1"?"BHiểm":""].filter(Boolean).join(", ");
    return `<tr><td><b>${r.receptionFNo}</b></td><td>${r.dealerCode||"—"}</td><td>${r.plateNo||""} <span class="muted">${r.carID||""}</span></td>
      <td class="muted">${r.km??""} · ${r.fuelLevel||""} · ${r.levelOfInspection||""}</td><td class="muted">${fl||"—"}</td><td class="muted">${r.cusRequest||"—"}</td>
      <td class="ro">${r.rono||"—"}</td><td><span class="pill p-${r.receptionFStatus}">${LBL[r.receptionFStatus]||r.receptionFStatus}</span></td><td>${act}</td></tr>`;
  }).join("")||'<tr><td colspan="9" class="muted">Chưa có phiếu.</td></tr>';
}
async function linkro(no){ const ro=prompt("Số RO gắn cho phiếu "+no+":"); if(!ro) return;
  const r=await fetch(`/api/receptions/${no}/linkro`,{method:"POST",headers:H(),body:JSON.stringify({ronO:ro})});
  const j=await r.json(); if(r.ok){ msg("Đã gắn "+j.ronO); load(); } else msg("Lỗi: "+(j.error||r.status)); }
async function deliver(no){ const rm=prompt("Ghi chú giao xe:","")??""; const r=await fetch(`/api/receptions/${no}/deliver`,{method:"POST",headers:H(),body:JSON.stringify({Remark:rm})}); const j=await r.json(); if(r.ok) load(); else msg("Lỗi: "+(j.error||r.status)); }
async function del(no){ if(!confirm("Xoá phiếu "+no+"?")) return; const r=await fetch(`/api/receptions/${no}/delete`,{method:"POST",headers:H()}); const j=await r.json(); if(r.ok) load(); else msg("Lỗi: "+(j.error||r.status)); }
load();
</script>
</body></html>
