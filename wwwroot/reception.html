<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Tiếp nhận xe</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--warn:#d97706;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1020px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .bar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;align-items:center}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .p-Pending{color:var(--warn)} .p-Approved{color:var(--ok)}
  .kpi{display:inline-block;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-right:8px} #msg{font-size:13px} .ro{color:var(--accent)}
</style></head>
<body>
<h1>Phiếu tiếp nhận xe dịch vụ <span class="muted">(port 1:1 FrmSerReceptionFMng — Ser_ReceptionF)</span></h1>
<div class="bar">
  <input id="pl" placeholder="Biển số *" style="width:110px"><input id="mn" placeholder="Model" style="width:100px">
  <input id="cn" placeholder="Chủ xe" style="width:120px"><input id="ph" placeholder="SĐT" style="width:110px"><input id="cr" placeholder="Yêu cầu KH" style="width:160px">
  <button class="primary" onclick="save()">Tiếp nhận</button><span id="msg"></span>
</div>
<div class="bar">
  <span class="kpi">Tổng: <b id="kt">0</b></span><span class="kpi">Đang tiếp nhận: <b id="kp">0</b></span>
  <span style="flex:1"></span>
  <select id="fst" onchange="load()"><option value="">Tất cả</option><option value="Pending">Tiếp nhận</option><option value="Approved">Giao xe</option></select>
  <input id="q" placeholder="Lọc biển số" oninput="load()" style="width:110px">
</div>
<table><thead><tr><th>Số phiếu</th><th>Biển số</th><th>Chủ xe</th><th>Yêu cầu</th><th>RO</th><th>Trạng thái</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="7" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const LBL={Pending:"Tiếp nhận",Approved:"Giao xe"};
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
async function save(){
  const r=await fetch("/api/receptions",{method:"POST",headers:H(),body:JSON.stringify({plateNo:F("pl").value,modelName:F("mn").value,cusName:F("cn").value,cusPhoneNo:F("ph").value,cusRequest:F("cr").value})});
  const j=await r.json();
  if(r.ok){ msg("Đã tiếp nhận "+j.receptionFNo+"."); F("pl").value="";F("cr").value=""; load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/receptions?status=${F("fst").value}&plate=${encodeURIComponent(F("q").value)}`,{headers:H()})).json();
  F("kt").textContent=d.count; F("kp").textContent=d.pending;
  F("rows").innerHTML=(d.items||[]).map(r=>{
    let act="";
    if(r.status==="Pending"){
      act=!r.ronO?`<button class="sm" onclick="linkro('${r.receptionFNo}')">Gắn RO</button>`:`<button class="sm" onclick="deliver('${r.receptionFNo}')">Giao xe</button>`;
    }
    return `<tr><td><b>${r.receptionFNo}</b></td><td>${r.plateNo}</td><td>${r.cusName||"—"}</td><td class="muted">${r.cusRequest||"—"}</td>
      <td class="ro">${r.ronO||"—"}</td><td><span class="pill p-${r.status}">${LBL[r.status]||r.status}</span></td><td>${act}</td></tr>`;
  }).join("")||'<tr><td colspan="7" class="muted">Chưa có phiếu.</td></tr>';
}
async function linkro(no){ const ro=prompt("Số RO gắn cho phiếu "+no+":"); if(!ro) return;
  const r=await fetch(`/api/receptions/${no}/linkro`,{method:"POST",headers:H(),body:JSON.stringify({ronO:ro})});
  const j=await r.json(); if(r.ok){ msg("Đã gắn "+j.ronO); load(); } else msg("Lỗi: "+(j.error||r.status)); }
async function deliver(no){ const r=await fetch(`/api/receptions/${no}/deliver`,{method:"POST",headers:H()}); const j=await r.json(); if(r.ok) load(); else msg("Lỗi: "+(j.error||r.status)); }
load();
</script>
</body></html>
