<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Đề nghị làm hồ sơ đăng ký</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--warn:#d97706;--ok:#16a34a;--sub:#0891b2}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1000px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .p-P{color:var(--warn)} .p-A1{color:#7c3aed} .p-A2{color:var(--ok)} .p-F{color:var(--sub)} .p-R{color:#dc2626} .p-C{color:#64748b}
  #msg{font-size:13px} .cars{font-size:12px;opacity:.85} #ctbl td,#ctbl th{padding:4px 6px}
</style></head>
<body>
<h1>Đề nghị làm hồ sơ đăng ký xe <span class="muted">(port 1:1 FrmNewDocReq — Car_DocReq, DMSales.Foton)</span></h1>
<div class="card">
  <b>Tạo đề nghị làm hồ sơ</b>
  <div class="bar" style="margin:10px 0"><input id="dl" placeholder="Đại lý *" style="width:130px"><span style="flex:1"></span><button class="primary" onclick="create()">Lưu hồ sơ</button><span id="msg"></span></div>
  <table id="ctbl"><thead><tr><th>VIN *</th><th>Model</th><th>Màu</th><th>Số máy</th><th>Thành tiền</th><th></th></tr></thead><tbody id="ctb"></tbody></table>
  <button class="sm" style="margin-top:6px" onclick="addCar()">+ Thêm xe</button>
</div>
<div class="card">
  <b>Sửa ngày/số tờ trình + hỗ trợ vay vốn (port 1:1 FrmUpdateDocReq)</b>
  <div class="bar" style="margin:10px 0">
    <input id="suNo" placeholder="Số hồ sơ *" style="width:130px"><input id="suVin" placeholder="VIN *" style="width:130px">
    <input id="suDate" type="date" title="Ngày tờ trình"><input id="suNoRep" placeholder="Số tờ trình" style="width:110px"><input id="suDay" type="number" placeholder="Số ngày HT vay" style="width:110px">
    <button onclick="editSupport()">Lưu</button><span id="suMsg"></span>
  </div>
</div>
<div class="bar" style="margin:10px 0"><select id="fst" onchange="load()"><option value="">Tất cả</option><option value="P">Chờ duyệt</option><option value="A1">Duyệt C1</option><option value="A2">Duyệt C2</option><option value="F">Hoàn tất</option></select><input id="q" placeholder="Lọc đại lý" oninput="load()" style="width:110px"></div>
<table><thead><tr><th>Số hồ sơ</th><th>Đại lý</th><th>Số xe</th><th>Tổng tiền</th><th>Ngày tạo</th><th>Trạng thái</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="7" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
// Mã theo TConst.Stage: header = Car_DocReqList.DRListStatus, dòng = Car_DocReqDtl.DRDtlStatus
const LBL={P:"Chờ duyệt",A1:"Duyệt C1",A2:"Duyệt C2",F:"Hoàn tất",R:"Từ chối",C:"Huỷ"}; const day=d=>d? new Date(d).toLocaleString("vi-VN"):"";
const money=n=>(n||0).toLocaleString("vi-VN");
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
function addCar(){ const tr=document.createElement("tr");
  tr.innerHTML=`<td><input class="vin" style="width:130px"></td><td><input class="md" style="width:80px"></td><td><input class="cl" style="width:60px"></td><td><input class="en" style="width:90px"></td><td><input class="am" type="number" style="width:100px"></td><td><button class="sm" onclick="this.closest('tr').remove()">×</button></td>`;
  F("ctb").appendChild(tr); }
async function create(){
  const cars=[...F("ctb").querySelectorAll("tr")].map(tr=>({vin:tr.querySelector(".vin").value,modelCode:tr.querySelector(".md").value,colorCode:tr.querySelector(".cl").value,engineNo:tr.querySelector(".en").value,amountTotal:parseFloat(tr.querySelector(".am").value)||0})).filter(c=>c.vin);
  const r=await fetch("/api/docreqs",{method:"POST",headers:H(),body:JSON.stringify({dealerCode:F("dl").value,cars})});
  const j=await r.json();
  if(r.ok){ msg("Đã tạo "+j.docReqNo+" ("+j.cars+" xe)."); F("ctb").innerHTML="";addCar(); load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/docreqs?status=${F("fst").value}&dealer=${F("q").value}`,{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(o=>{
    // Ở HEADER chỉ có Duyệt C1 và Huỷ cả đề nghị (đều chỉ từ "P").
    // Duyệt C2 / từ chối / huỷ từng xe nằm ở bảng "xem xe" — nguồn thao tác theo TỪNG XE.
    let act=o.status==="P"?`<button class="sm" onclick="ap1('${o.docReqNo}')">Duyệt C1</button> <button class="sm" onclick="cancelReq('${o.docReqNo}')">Huỷ đề nghị</button>`:"";
    return `<tr><td><b>${o.docReqNo}</b> <a href="#" class="cars" onclick="cars('${o.docReqNo}');return false">xem xe</a></td><td>${o.dealerCode}</td><td>${o.cars}</td>
      <td>${money(o.total)}</td><td>${day(o.createdAt)}</td><td><span class="pill p-${o.status}">${LBL[o.status]||o.status}</span></td><td>${act}</td></tr><tr id="x-${o.docReqNo}"></tr>`;
  }).join("")||'<tr><td colspan="7" class="muted">Chưa có hồ sơ.</td></tr>';
}
async function ap1(no){ const r=await fetch(`/api/docreqs/${no}/approve1`,{method:"POST",headers:H()}); const j=await r.json();
  if(r.ok){ msg(j.oneStep?"Đề nghị loại thường — đã duyệt thẳng lên cấp 2.":"Đã duyệt cấp 1."); load(); } else msg("Lỗi: "+(j.error||r.status)); }
// Huỷ CẢ đề nghị (nguồn: CarDocReqListCancel) — lan trạng thái "C" xuống mọi xe trong đề nghị.
async function cancelReq(no){ const rm=prompt("Lý do huỷ cả đề nghị:",""); if(rm===null) return;
  const r=await fetch(`/api/docreqs/${no}/cancel`,{method:"POST",headers:H({"Content-Type":"application/json"}),body:JSON.stringify({remark:rm})});
  const j=await r.json(); if(r.ok){ msg(`Đã huỷ đề nghị, ${j.carsCancelled} xe.`+(j.mailQueued?" Đã xếp hàng email thông báo.":"")); load(); } else msg("Lỗi: "+(j.error||r.status)); }
// Hành động theo TỪNG XE (nguồn: CarDocReqDtlApprove2 / Reject / Cancel).
async function carAct(no,vin,action){ let rm=null;
  if(action!=="approve2"){ rm=prompt(action==="reject"?"Lý do từ chối:":"Lý do huỷ:",""); if(rm===null) return; }
  const r=await fetch(`/api/docreqs/${no}/cars/${vin}/${action}`,{method:"POST",headers:H({"Content-Type":"application/json"}),body:JSON.stringify({remark:rm})});
  const j=await r.json(); if(r.ok){ cars(no); load(); } else msg("Lỗi: "+(j.error||r.status)); }
async function cars(no){
  const row=F("x-"+no); if(row.innerHTML){ row.innerHTML=""; return; }
  const d=await (await fetch(`/api/docreqs/${no}/cars`,{headers:H()})).json();
  // Mỗi xe có trạng thái RIÊNG (DRDtlStatus) và nút riêng: duyệt C2 từ A1, từ chối chỉ từ A2, huỷ từ A1/A2.
  row.innerHTML=`<td colspan="7"><div class="cars">${(d.cars||[]).map(c=>{
    const st=c.drDtlStatus||"P";
    const b=st==="A1"?`<button class="sm" onclick="carAct('${no}','${c.vin}','approve2')">Duyệt C2</button> <button class="sm" onclick="carAct('${no}','${c.vin}','cancel')">Huỷ</button>`
      :st==="A2"?`<button class="sm" onclick="carAct('${no}','${c.vin}','reject')">Từ chối</button> <button class="sm" onclick="carAct('${no}','${c.vin}','cancel')">Huỷ</button>`:"";
    return `VIN <b>${c.vin}</b> <span class="pill p-${st}">${LBL[st]||st}</span>${c.modelCode?" · "+c.modelCode:""}${c.engineNo?" · máy "+c.engineNo:""} · ${money(c.amountTotal)}đ${c.letterRepresentationNo?" · tờ trình "+c.letterRepresentationNo:""}${c.loanSupportDay?" · HT vay "+c.loanSupportDay+" ngày":""} ${b}`;
  }).join("<br>")||"—"}</div></td>`;
}
async function editSupport(){
  const no=F("suNo").value.trim(), vin=F("suVin").value.trim();
  if(!no||!vin){ F("suMsg").textContent="Cần số hồ sơ + VIN"; return; }
  const body={rows:[{vin,letterRepresentationDate:F("suDate").value||null,letterRepresentationNo:F("suNoRep").value,loanSupportDay:F("suDay").value?parseInt(F("suDay").value):null}]};
  const r=await fetch(`/api/docreqs/${no}/edit-support`,{method:"POST",headers:H(),body:JSON.stringify(body)});
  const j=await r.json();
  F("suMsg").textContent=r.ok?(j.updated?"Đã lưu.":"Không tìm thấy VIN trong hồ sơ."):("Lỗi: "+(j.error||r.status));
}
addCar(); load();
</script>
</body></html>
