<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Gán kỹ thuật viên</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#4f46e5;--ok:#16a34a;--warn:#d97706}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1080px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px} h3{font-size:14px;margin:14px 0 4px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0} .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
  input,button,select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit} label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.link{border:none;background:none;color:var(--accent);padding:2px 6px}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px} th,td{text-align:left;padding:5px 7px;border-bottom:1px solid var(--line)} th{opacity:.7;font-size:10.5px;text-transform:uppercase} .wrap{overflow-x:auto}
  .msg{font-size:13px;margin-left:6px} .cols{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start}
  .midbtns{display:flex;flex-direction:column;gap:8px;justify-content:center;margin-top:60px}
  tr.picked{cursor:pointer} tr.picked:hover{background:#8881}
</style></head>
<body>
<h1>Gán kỹ thuật viên cho dòng công việc RO <span class="muted">(port 1:1 FrmSerItemEngineerList — TCMotor DMSCarSv/Services)</span></h1>
<div class="card"><h3 style="margin-top:0">Chọn RO / dòng công việc</h3>
  <div class="row">
    <div><label>Số RO</label><input id="ro" placeholder="RO..." style="width:160px"></div>
    <div><label>Mã công việc (SerCode)</label><input id="sc" placeholder="SerCode" style="width:140px"></div>
    <button class="primary" onclick="load()">Tải danh sách</button>
    <div><label>Lọc nhóm SC</label><select id="fg" onchange="search()"><option value="">Tất cả</option></select></div>
    <span id="msg" class="msg"></span>
  </div>
</div>
<div class="card" id="pickCard" style="display:none">
  <div class="cols">
    <div><h3 style="margin-top:0">KTV khả dụng</h3><div class="wrap"><table><thead><tr><th>Mã</th><th>Tên</th><th>Nhóm</th></tr></thead><tbody id="tbAvail"></tbody></table></div></div>
    <div class="midbtns"><button onclick="moveAll('avail','picked')">Chọn tất »</button><button onclick="moveAll('picked','avail')">« Bỏ tất</button></div>
    <div><h3 style="margin-top:0">Đã chọn cho dòng CV</h3><div class="wrap"><table><thead><tr><th>Mã</th><th>Tên</th><th>Nhóm</th></tr></thead><tbody id="tbPicked"></tbody></table></div></div>
  </div>
  <div class="row" style="margin-top:10px"><button class="primary" onclick="save()">Lưu</button></div>
</div>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id); const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
let avail=[], picked=[];
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function Hh(x){ return Object.assign({"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY}, x||{}); }
function say(t){ F("msg").textContent=t; setTimeout(()=>{if(F("msg").textContent===t)F("msg").textContent="";},4000); }
async function loadGroups(){ await token();
  const d=await (await fetch("/api/grouprepairs",{headers:Hh()})).json();
  F("fg").innerHTML='<option value="">Tất cả</option>'+(d.items||[]).map(g=>`<option value="${esc(g.groupRCode)}">${esc(g.groupRName)}</option>`).join(""); }
function renderTbl(id,rows){ F(id).innerHTML=rows.map((e,i)=>`<tr class="picked" onclick="pick('${id}',${i})"><td>${esc(e.engineerNo)}</td><td>${esc(e.engineerName)}</td><td>${esc(e.groupRCode)}</td></tr>`).join(""); }
function render(){ renderTbl("tbAvail",avail); renderTbl("tbPicked",picked); }
function pick(id,i){ if(id==="tbAvail"){ picked.push(avail.splice(i,1)[0]); } else { avail.push(picked.splice(i,1)[0]); } render(); }
function moveAll(from,to){ if(from==="avail"){ picked=picked.concat(avail); avail=[]; } else { avail=avail.concat(picked); picked=[]; } render(); }
async function search(){ await token();
  const g=F("fg").value;
  const d=await (await fetch(`/api/engineers?group=${encodeURIComponent(g)}`,{headers:Hh()})).json();
  const pickedNos=new Set(picked.map(p=>p.engineerNo));
  avail=(d.items||[]).filter(e=>!pickedNos.has(e.engineerNo)); render();
}
async function load(){ await token();
  const ro=F("ro").value.trim(), sc=F("sc").value.trim();
  if(!ro||!sc){ say("Chưa nhập RO / mã công việc."); return; }
  const r=await fetch("/api/repairorders/"+encodeURIComponent(ro),{headers:Hh()});
  if(!r.ok){ say("RO không tồn tại."); return; }
  const d=await r.json();
  const item=(d.services||[]).find(s=>s.serCode===sc);
  if(!item){ say("Không thấy công việc mã "+sc+" trong RO."); return; }
  const curCodes=(item.engineer||"").split(",").map(x=>x.trim()).filter(Boolean);
  const allEng=(await (await fetch("/api/engineers",{headers:Hh()})).json()).items||[];
  picked=allEng.filter(e=>curCodes.includes(e.engineerNo));
  avail=allEng.filter(e=>!curCodes.includes(e.engineerNo));
  render();
  F("pickCard").style.display="block";
}
async function save(){ await token();
  const ro=F("ro").value.trim(), sc=F("sc").value.trim();
  const body={EngineerNos:picked.map(p=>p.engineerNo)};
  const r=await fetch(`/api/repairorders/${encodeURIComponent(ro)}/services/${encodeURIComponent(sc)}/engineers`,{method:"POST",headers:Hh({"Content-Type":"application/json"}),body:JSON.stringify(body)});
  const d=await r.json(); if(!r.ok){ say("Lỗi: "+(d.error||r.status)); return; } say("Đã lưu "+d.engineers.length+" KTV.");
}
loadGroups();
</script>
</body></html>
