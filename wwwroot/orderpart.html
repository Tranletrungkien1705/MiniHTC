<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Đặt phụ tùng NCC</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--warn:#d97706;--prog:#7c3aed;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1020px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .p-Pending{color:var(--warn)} .p-Approved{color:var(--prog)} .p-Finished{color:var(--ok)}
  #msg{font-size:13px} .det{font-size:12px;opacity:.85}
</style></head>
<body>
<h1>Đơn đặt phụ tùng từ NCC <span class="muted">(port 1:1 FrmSer_Order_Part — Ser_Order_Part)</span></h1>
<div class="muted">Quy trình: Mới tạo → Đã gửi NCC → Hoàn thành</div>
<div class="card">
  <b>Tạo đơn đặt</b>
  <div class="bar" style="margin:10px 0"><input id="sp" placeholder="Nhà cung cấp *" style="width:130px"><input id="wh" placeholder="Kho nhận" style="width:100px">
    <span style="flex:1"></span><button class="primary" onclick="create()">Lưu đơn</button><span id="msg"></span></div>
  <table id="ltbl"><thead><tr><th>Mã PT</th><th>Tên PT</th><th class="n">SL đặt</th><th class="n">Đơn giá</th><th></th></tr></thead><tbody id="ltb"></tbody></table>
  <button class="sm" style="margin-top:6px" onclick="addLine()">+ Dòng PT</button>
</div>
<div class="bar" style="margin:10px 0"><select id="fst" onchange="load()"><option value="">Tất cả</option><option value="Pending">Mới tạo</option><option value="Approved">Đã gửi NCC</option><option value="Finished">Hoàn thành</option></select><input id="q" placeholder="Lọc NCC" oninput="load()" style="width:100px"></div>
<table><thead><tr><th>Số đơn</th><th>NCC</th><th>Dòng</th><th class="n">Tổng tiền</th><th>Trạng thái</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="6" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const FLOW=["Pending","Approved","Finished"]; const LBL={Pending:"Mới tạo",Approved:"Đã gửi NCC",Finished:"Hoàn thành"};
const ACT={approve:"Gửi NCC",finish:"Hoàn thành"}; const n=x=>Number(x||0).toLocaleString("vi-VN");
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
function addLine(){ const tr=document.createElement("tr");
  tr.innerHTML=`<td><input class="pc" style="width:90px"></td><td><input class="pn" style="width:130px"></td><td class="n"><input class="qt" type="number" value="1" style="width:70px;text-align:right"></td><td class="n"><input class="pr" type="number" style="width:100px;text-align:right"></td><td><button class="sm" onclick="this.closest('tr').remove()">×</button></td>`;
  F("ltb").appendChild(tr); }
async function create(){
  const lines=[...F("ltb").querySelectorAll("tr")].map(tr=>({partCode:tr.querySelector(".pc").value,partName:tr.querySelector(".pn").value,orderQty:Number(tr.querySelector(".qt").value||0),price:Number(tr.querySelector(".pr").value||0)})).filter(l=>l.partCode&&l.orderQty>0);
  const r=await fetch("/api/orderparts",{method:"POST",headers:H(),body:JSON.stringify({supplierCode:F("sp").value,warehouseCode:F("wh").value,lines})});
  const j=await r.json();
  if(r.ok){ msg("Đã tạo "+j.orderPartNo+" ("+j.lines+" dòng)."); F("ltb").innerHTML="";addLine(); load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/orderparts?status=${F("fst").value}&supplier=${F("q").value}`,{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(o=>{
    const i=FLOW.indexOf(o.orderPartStatus); const next=i>=0&&i<2?FLOW[i+1]:null; const a=next==="Approved"?"approve":next==="Finished"?"finish":null;
    const act=a?`<button class="sm" onclick="adv('${o.orderPartNo}','${a}')">→ ${ACT[a]}</button>`:"";
    return `<tr><td><b>${o.orderPartNo}</b> <a href="#" class="det" onclick="lines('${o.orderPartNo}');return false">xem</a></td><td>${o.supplierCode}</td><td>${o.lines}</td>
      <td class="n">${n(o.total)}</td><td><span class="pill p-${o.orderPartStatus}">${LBL[o.orderPartStatus]||o.orderPartStatus}</span></td><td>${act}</td></tr><tr id="x-${o.orderPartNo}"></tr>`;
  }).join("")||'<tr><td colspan="6" class="muted">Chưa có đơn.</td></tr>';
}
async function adv(no,a){ const r=await fetch(`/api/orderparts/${no}/${a}`,{method:"POST",headers:H()}); const j=await r.json(); if(r.ok) load(); else msg("Lỗi: "+(j.error||r.status)); }
async function lines(no){
  const row=F("x-"+no); if(row.innerHTML){ row.innerHTML=""; return; }
  const d=await (await fetch(`/api/orderparts/${no}/lines`,{headers:H()})).json();
  row.innerHTML=`<td colspan="6"><div class="det">${(d.lines||[]).map(l=>`${l.partCode} ×${l.orderQty} @${n(l.price)} = ${n(l.lineTotal)}`).join(" &nbsp;|&nbsp; ")||"—"} &nbsp;<b>Tổng: ${n(d.total)}</b></div></td>`;
}
addLine(); load();
</script>
</body></html>
