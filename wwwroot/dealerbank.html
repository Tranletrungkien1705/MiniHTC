<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Ngân hàng đại lý</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--warn:#d97706;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1080px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-items:end}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit;box-sizing:border-box}
  .grid input{width:100%}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} td.num{text-align:right;font-variant-numeric:tabular-nums}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .p-1{color:var(--ok)} .p-0{color:#dc2626}
  #msg{font-size:13px} .wrap{overflow-x:auto}
</style></head>
<body>
<h1>Ngân hàng đại lý <span class="muted">(port 1:1 FrmDealerBank — Mst_DealerBank)</span></h1>
<div class="card">
  <b>Thêm NH đại lý</b>
  <div class="grid" style="margin-top:10px">
    <div><label>Mã NH *</label><input id="bk"></div>
    <div><label>Mã đại lý *</label><input id="dl"></div>
    <div><label>Mã chi nhánh NH</label><input id="br"></div>
    <div><label>Tên chi nhánh NH</label><input id="bn"></div>
    <div><label>Số HĐ tín dụng</label><input id="cn"></div>
    <div><label>Ngày HĐ TD</label><input id="cd" type="date"></div>
    <div><label>Hạn mức TD</label><input id="ca" type="number"></div>
    <div class="muted" style="align-self:center"><input type="checkbox" id="fg"> NH bảo lãnh</div>
    <div class="muted" style="align-self:center"><input type="checkbox" id="fp"> NH thanh toán</div>
  </div>
  <div class="bar"><button class="primary" onclick="create()">Lưu</button><span id="msg"></span></div>
</div>
<div class="bar" style="margin:10px 0"><input id="qd" placeholder="Lọc đại lý" oninput="load()" style="width:110px"><input id="qb" placeholder="Lọc NH" oninput="load()" style="width:100px"><select id="fa" onchange="load()"><option value="">Tất cả</option><option value="1">Hoạt động</option><option value="0">Ngừng</option></select></div>
<div class="wrap"><table><thead><tr><th>NH</th><th>Đại lý</th><th>Chi nhánh</th><th>Số HĐTD</th><th class="num">Hạn mức</th><th>BL</th><th>TT</th><th>TT</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="9" class="muted">Đang tải…</td></tr></tbody></table></div>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const money=n=>(n||0).toLocaleString("vi-VN");
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
async function create(){
  const body={bankCode:F("bk").value,dealerCode:F("dl").value,bankBranchCode:F("br").value,bankBranchName:F("bn").value,creditContractNo:F("cn").value,creditContractDate:F("cd").value||null,creditAmount:parseFloat(F("ca").value)||0,flagBankGrt:F("fg").checked?"1":"0",flagBankPmt:F("fp").checked?"1":"0"};
  const r=await fetch("/api/dealerbanks",{method:"POST",headers:H(),body:JSON.stringify(body)});
  const j=await r.json();
  if(r.ok){ msg("Đã lưu "+j.bankCode+"/"+j.dealerCode); ["bk","dl","br","cn","ca"].forEach(x=>F(x).value=""); load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/dealerbanks?dealer=${F("qd").value}&bank=${F("qb").value}&active=${F("fa").value}`,{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(o=>
    `<tr><td><b>${o.bankCode}</b></td><td>${o.dealerCode}</td><td>${o.bankBranchCode||""}</td><td>${o.creditContractNo||""}</td><td class="num">${money(o.creditAmount)}</td><td>${o.flagBankGrt==="1"?"✓":""}</td><td>${o.flagBankPmt==="1"?"✓":""}</td><td><span class="pill p-${o.flagActive}">${o.flagActive==="1"?"HĐ":"Ngừng"}</span></td><td><button class="sm" onclick="toggle('${o.dealerCode}','${o.bankCode}')">Đổi</button></td></tr>`
  ).join("")||'<tr><td colspan="9" class="muted">Chưa có.</td></tr>';
}
async function toggle(dl,bk){ const r=await fetch(`/api/dealerbanks/${dl}/${bk}/toggle`,{method:"POST",headers:H()}); const j=await r.json(); if(r.ok) load(); else msg("Lỗi: "+(j.error||r.status)); }
load();
</script>
</body></html>
