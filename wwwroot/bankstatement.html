<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Sao kê ngân hàng</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#4f46e5;--ok:#16a34a;--warn:#d97706}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1180px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px} h3{font-size:14px;margin:14px 0 4px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button,textarea,select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.link{border:none;background:none;color:var(--accent);padding:2px 6px}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px} th,td{text-align:left;padding:5px 7px;border-bottom:1px solid var(--line)} th{opacity:.7;font-size:11px;text-transform:uppercase} td.num,th.num{text-align:right;font-variant-numeric:tabular-nums} .wrap{overflow-x:auto}
  .msg{font-size:13px;margin-left:6px} textarea{width:100%;min-height:70px} .pill{font-size:11px;padding:1px 7px;border-radius:20px;border:1px solid var(--line)} .y{color:var(--ok);border-color:var(--ok)} .n{color:var(--warn);border-color:var(--warn)}
  .kpi{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0;font-size:13px} .kpi b{font-variant-numeric:tabular-nums}
</style></head>
<body>
<h1>Sao kê ngân hàng <span class="muted">(port 1:1 FrmBank_BankStatement — TCMotor/Sales/Payment)</span></h1>

<div class="card"><h3 style="margin-top:0">Import sao kê (dán từ Excel)</h3>
  <div class="row"><div><label>Số sao kê / lô *</label><input id="iNo" style="width:160px" placeholder="SK-2026-09"></div></div>
  <p class="muted" style="margin:8px 0 2px">Mỗi dòng: <b>Ngày GD [tab] Mã GD [tab] Nợ [tab] Có [tab] Số dư [tab] Nội dung [tab] NH nhận [tab] TK nhận [tab] Người gửi</b></p>
  <textarea id="iLines" placeholder="2026-09-01&#9;TX001&#9;0&#9;5000000&#9;15000000&#9;CK mua xe HD001&#9;VCB&#9;0123456&#9;NGUYEN VAN A"></textarea>
  <div class="row" style="margin-top:8px"><button class="primary" onclick="imp()">Import</button><span id="imsg" class="msg"></span></div>
</div>

<div class="card"><div class="row">
  <div><label>Tìm (nội dung/mã GD/mã TT)</label><input id="q" style="width:220px"></div>
  <div><label>NH nhận</label><input id="fBank" style="width:110px"></div>
  <div><label>Đối soát</label><select id="fMatch"><option value="">Tất cả</option><option value="Y">Đã khớp</option><option value="N">Chưa khớp</option></select></div>
  <div><label>Từ ngày</label><input id="fFrom" style="width:130px" placeholder="2026-09-01"></div>
  <div><label>Đến ngày</label><input id="fTo" style="width:130px" placeholder="2026-09-30"></div>
  <button onclick="load()">Xem</button>
</div>
  <div class="kpi" id="kpi"></div>
  <div class="wrap"><table><thead><tr><th>Ngày GD</th><th>Mã GD</th><th class="num">Nợ</th><th class="num">Có</th><th class="num">Số dư</th><th>Nội dung</th><th>NH nhận</th><th>Người gửi</th><th>Mã TT DMS</th><th>Đối soát</th><th></th></tr></thead>
  <tbody id="rows"><tr><td colspan="11" class="muted">Nhấn "Xem".</td></tr></tbody></table></div>
</div>

<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const M=n=>Math.round(+n||0).toLocaleString("vi-VN"); const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(extra){ return Object.assign({"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY}, extra||{}); }
function say(el,t){ F(el).textContent=t; setTimeout(()=>{if(F(el).textContent===t)F(el).textContent="";},4000); }
function num(x){ return +(String(x||"").replace(/[.,\s]/g,m=>m===","?".":""))||0; }
async function imp(){ await token();
  const rows=F("iLines").value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>l.split(/\t/));
  const lines=rows.map(c=>({TransactionDate:c[0]||"",TransactionCode:c[1]||"",DebitVal:num(c[2]),CreditVal:num(c[3]),BalanceVal:num(c[4]),RemittanceDetail:c[5]||"",BankReceiveCode:c[6]||"",AccountReceiveNo:c[7]||"",AccountSendName:c[8]||""}));
  const r=await fetch("/api/bankstatements/import",{method:"POST",headers:H({"Content-Type":"application/json"}),body:JSON.stringify({BStatementNo:F("iNo").value,Lines:lines})});
  const d=await r.json(); if(!r.ok){ say("imsg","Lỗi: "+(d.error||r.status)); return; }
  say("imsg",`Đã thêm ${d.added}, bỏ trùng ${d.skipped}`); F("iLines").value=""; load();
}
async function match(id,cur){ await token(); const code=prompt("Mã thanh toán DMS để đối soát (để trống = huỷ):",cur||"");
  if(code===null) return; await fetch("/api/bankstatements/"+id+"/match",{method:"POST",headers:H({"Content-Type":"application/json"}),body:JSON.stringify({PaymentCodeDMS:code})}); load();
}
async function del(id){ await token(); if(!confirm("Xoá dòng sao kê này?")) return; await fetch("/api/bankstatements/"+id,{method:"DELETE",headers:H()}); load(); }
async function load(){ await token();
  const qs=new URLSearchParams({q:F("q").value,bankReceive:F("fBank").value,match:F("fMatch").value,dateFrom:F("fFrom").value,dateTo:F("fTo").value});
  const r=await fetch("/api/bankstatements?"+qs,{headers:H()}); const d=await r.json();
  F("kpi").innerHTML=`<span>Dòng: <b>${d.count}</b></span><span>Tổng nợ: <b>${M(d.totDebit)}</b></span><span>Tổng có: <b>${M(d.totCredit)}</b></span><span class="y">Đã khớp: <b>${d.matched}</b></span><span class="n">Chưa: <b>${d.unmatched}</b></span>`;
  F("rows").innerHTML=(d.items||[]).map(o=>`<tr><td>${esc(o.transactionDate)}</td><td>${esc(o.transactionCode)}</td><td class="num">${M(o.debitVal)}</td><td class="num">${M(o.creditVal)}</td><td class="num">${M(o.balanceVal)}</td><td>${esc(o.remittanceDetail)}</td><td>${esc(o.bankReceiveCode)}</td><td>${esc(o.accountSendName)}</td><td>${esc(o.paymentCodeDMS)}</td><td><span class="pill ${o.matchStatus==='Y'?'y':'n'}">${o.matchStatus==='Y'?'Đã khớp':'Chưa'}</span></td><td><button class="link" onclick="match(${o.id},'${esc(o.paymentCodeDMS)}')">Đối soát</button><button class="link" onclick="del(${o.id})">Xoá</button></td></tr>`).join("")||'<tr><td colspan="11" class="muted">Chưa có dòng sao kê.</td></tr>';
}
</script>
</body></html>
