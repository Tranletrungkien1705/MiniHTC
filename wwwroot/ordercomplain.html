<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Khiếu nại đơn PT</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--warn:#d97706;--prog:#7c3aed;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1040px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .bar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;align-items:center}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
  .d-P{color:var(--warn)} .d-A{color:var(--accent)} .t-Processing{color:var(--warn)} .t-Pending{color:var(--prog)} .t-Resolved{color:var(--ok)}
  #msg{font-size:13px}
</style></head>
<body>
<h1>Khiếu nại đơn đặt phụ tùng <span class="muted">(port 1:1 FrmSer_OrderComplain — Ser_OrderComplain)</span></h1>
<div class="muted">DMS: P Mới tạo → A Đã gửi &nbsp;|&nbsp; TST: Chờ duyệt → Đang xử lý → Đã xử lý</div>
<div class="bar">
  <input id="op" placeholder="Số đơn đặt (OP...) *" style="width:170px"><input id="ty" placeholder="Loại KN" style="width:110px"><input id="ct" placeholder="Nội dung" style="width:200px">
  <button class="primary" onclick="save()">Tạo khiếu nại</button><span id="msg"></span>
</div>
<div class="bar">
  <select id="fd" onchange="load()"><option value="">DMS: tất cả</option><option value="P">Mới tạo</option><option value="A">Đã gửi</option></select>
  <select id="ft" onchange="load()"><option value="">TST: tất cả</option><option value="Processing">Chờ duyệt</option><option value="Pending">Đang xử lý</option><option value="Resolved">Đã xử lý</option></select>
</div>
<table><thead><tr><th>Số KN</th><th>Đơn đặt</th><th>Loại</th><th>Nội dung</th><th>DMS</th><th>TST</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="7" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const D={P:"Mới tạo",A:"Đã gửi"}, T={"":"—",Processing:"Chờ duyệt",Pending:"Đang xử lý",Resolved:"Đã xử lý"};
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
async function save(){
  const r=await fetch("/api/ordercomplains",{method:"POST",headers:H(),body:JSON.stringify({orderPartNo:F("op").value,complainType:F("ty").value,content:F("ct").value})});
  const j=await r.json();
  if(r.ok){ msg("Đã tạo "+j.complainNo+"."); F("op").value="";F("ct").value=""; load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/ordercomplains?dms=${F("fd").value}&tst=${F("ft").value}`,{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(c=>{
    let act="";
    if(c.dmsStatus==="P") act=`<button class="sm" onclick="act('${c.complainNo}','send')">Gửi</button>`;
    else if(c.tstStatus==="") act=`<button class="sm" onclick="act('${c.complainNo}','receive')">TST tiếp nhận</button>`;
    else if(c.tstStatus==="Processing") act=`<button class="sm" onclick="act('${c.complainNo}','process')">Xử lý</button>`;
    else if(c.tstStatus==="Pending") act=`<button class="sm" onclick="resolve('${c.complainNo}')">Giải quyết</button>`;
    return `<tr><td><b>${c.complainNo}</b></td><td>${c.orderPartNo}</td><td>${c.complainType||"—"}</td><td class="muted">${c.content||"—"}</td>
      <td><span class="pill d-${c.dmsStatus}">${D[c.dmsStatus]||c.dmsStatus}</span></td>
      <td><span class="pill t-${c.tstStatus}">${T[c.tstStatus]||c.tstStatus}</span></td><td>${act}</td></tr>`;
  }).join("")||'<tr><td colspan="7" class="muted">Chưa có khiếu nại.</td></tr>';
}
async function act(no,a){ const r=await fetch(`/api/ordercomplains/${no}/${a}`,{method:"POST",headers:H(),body:JSON.stringify({})}); const j=await r.json(); if(r.ok) load(); else msg("Lỗi: "+(j.error||r.status)); }
async function resolve(no){ const rs=prompt("Cách giải quyết:"); if(rs===null) return; const r=await fetch(`/api/ordercomplains/${no}/resolve`,{method:"POST",headers:H(),body:JSON.stringify({resolution:rs})}); const j=await r.json(); if(r.ok) load(); else msg("Lỗi: "+(j.error||r.status)); }
load();
</script>
</body></html>
