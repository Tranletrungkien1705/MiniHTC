<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Công nợ khách hàng dịch vụ</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#b45309;--ok:#16a34a;--warn:#d97706}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1040px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px} h3{font-size:14px;margin:16px 0 4px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit;box-sizing:border-box;width:100%}
  button{cursor:pointer;width:auto} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.link{border:none;background:none;color:var(--accent);padding:2px 6px}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} td.num{text-align:right;font-variant-numeric:tabular-nums} .wrap{overflow-x:auto}
  .kpi{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0} .box{border:1px solid var(--line);border-radius:10px;padding:8px 12px} .box b{font-size:16px;display:block} .box span{font-size:11px;opacity:.7}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .s-Open{color:var(--warn)} .s-Paid{color:var(--ok)}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:8px 0} #msg,#msg2{font-size:13px;margin-left:6px}
</style></head>
<body>
<h1>Công nợ khách hàng dịch vụ <span class="muted">(port 1:1 FrmCusDebitCreate + FrmCusPaymentCreate — TCMotor)</span></h1>
<p class="muted">Ghi nhận công nợ khách hàng theo lệnh sửa chữa (RO) và thu tiền dần. Số dư = Nợ − Đã thu. Thu đủ → Đã tất toán.</p>
<div class="card"><h3 style="margin-top:0">Tạo công nợ</h3>
  <div class="grid">
    <div><label>Mã KH</label><input id="fCusId"></div>
    <div><label>Tên KH</label><input id="fCusName"></div>
    <div><label>Số RO</label><input id="fRO"></div>
    <div><label>Số tiền nợ (VND) *</label><input id="fAmount" type="number" step="1000"></div>
    <div><label>Ngày nợ</label><input id="fDate" type="date"></div>
    <div><label>Ghi chú</label><input id="fNote"></div>
  </div>
  <div style="margin-top:8px"><button class="primary" onclick="save()">Tạo công nợ</button><span id="msg"></span></div>
</div>
<div class="kpi" id="kpi"></div>
<div class="bar">
  <div><label>Tìm số/KH/RO</label><input id="qQ" style="width:170px" onkeydown="if(event.key==='Enter')load()"></div>
  <div><label>Trạng thái</label><select id="qStatus" style="padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit"><option value="">Tất cả</option><option value="Open">Còn nợ</option><option value="Paid">Đã tất toán</option></select></div>
  <button onclick="load()">Xem danh sách</button>
</div>
<div class="wrap"><table><thead><tr><th>Số CN</th><th>KH</th><th>RO</th><th class="num">Nợ</th><th class="num">Đã thu</th><th class="num">Còn lại</th><th>TT</th><th>Thu tiền</th></tr></thead>
<tbody id="rows"><tr><td colspan="8" class="muted">Nhấn "Xem danh sách".</td></tr></tbody></table></div>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const M=n=>Math.round(n||0).toLocaleString("vi-VN"); const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
const ST={Open:"Còn nợ",Paid:"Đã tất toán"};
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(extra){ return Object.assign({"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY}, extra||{}); }
function msg(t){ F("msg").textContent=t; setTimeout(()=>{if(F("msg").textContent===t)F("msg").textContent="";},2500); }
async function save(){ await token();
  const body={CusId:F("fCusId").value,CusName:F("fCusName").value,RONo:F("fRO").value,DebitAmount:+F("fAmount").value||0,DebitDate:F("fDate").value||null,Note:F("fNote").value};
  const r=await fetch("/api/cusdebits",{method:"POST",headers:H({"Content-Type":"application/json"}),body:JSON.stringify(body)});
  const d=await r.json(); if(!r.ok){ msg("Lỗi: "+(d.error||r.status)); return; }
  msg("Đã tạo "+d.debitNo); F("fAmount").value=""; load();
}
async function pay(no){ await token();
  const amt=prompt("Số tiền thu cho công nợ "+no+":"); if(!amt) return;
  const r=await fetch("/api/cusdebits/"+encodeURIComponent(no)+"/payments",{method:"POST",headers:H({"Content-Type":"application/json"}),body:JSON.stringify({PaymentAmount:+amt||0})});
  const d=await r.json(); if(!r.ok){ msg("Lỗi: "+(d.error||r.status)); return; }
  msg("Đã thu, còn "+M(d.balance)); load();
}
async function load(){ await token();
  const r=await fetch("/api/cusdebits?q="+encodeURIComponent(F("qQ").value)+"&status="+F("qStatus").value,{headers:H()});
  const d=await r.json();
  F("kpi").innerHTML=`<div class="box"><b>${d.count}</b><span>Số công nợ</span></div><div class="box"><b>${M(d.totalDebit)}</b><span>Tổng nợ</span></div><div class="box"><b>${M(d.totalPaid)}</b><span>Đã thu</span></div><div class="box"><b>${M(d.totalBalance)}</b><span>Còn lại</span></div>`;
  F("rows").innerHTML=(d.items||[]).map(o=>`<tr><td><b>${o.debitNo}</b></td><td>${esc(o.cusName)}</td><td>${esc(o.rONo)}</td><td class="num">${M(o.debitAmount)}</td><td class="num">${M(o.paidAmount)}</td><td class="num">${M(o.balance)}</td><td><span class="pill s-${o.status}">${ST[o.status]||o.status}</span></td><td>${o.status==='Open'?`<button class="link" onclick="pay('${o.debitNo}')">Thu tiền</button>`:''}</td></tr>`).join("")||'<tr><td colspan="8" class="muted">Chưa có công nợ.</td></tr>';
}
</script>
</body></html>
