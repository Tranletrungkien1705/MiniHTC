<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Điều kiện tạo DO tự động</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--warn:#d97706;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1060px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-items:end}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit;box-sizing:border-box}
  .grid input{width:100%} .chkline{display:flex;gap:6px;align-items:center;font-size:13px}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .p-1{color:var(--ok)} .p-0{color:#dc2626}
  #msg{font-size:13px}
</style></head>
<body>
<h1>Điều kiện tạo DO tự động <span class="muted">(port 1:1 FrmNewSetupConditionForDOAuto — Mst_DOATCondition)</span></h1>
<div class="card">
  <b>Thiết lập điều kiện</b>
  <div class="grid" style="margin-top:10px">
    <div><label>Ngày hiệu lực từ *</label><input id="ds" type="date"></div>
    <div><label>Ngày hiệu lực đến *</label><input id="de" type="date"></div>
    <div class="chkline"><input type="checkbox" id="fcq"> <label style="margin:0">ĐK ngày CQ</label></div>
    <div class="chkline"><input type="checkbox" id="ftx"> <label style="margin:0">ĐK ngày nộp thuế</label></div>
  </div>
  <div class="grid" style="margin-top:8px">
    <div class="chkline"><input type="checkbox" id="fptm" onchange="tog()"> <label style="margin:0">% thanh toán cọc</label></div>
    <div><label>% cọc từ</label><input id="pcf" type="number" disabled></div>
    <div><label>% cọc đến</label><input id="pct" type="number" disabled></div>
    <div></div>
    <div class="chkline"><input type="checkbox" id="fdt" onchange="tog()"> <label style="margin:0">% hoàn thành giao xe</label></div>
    <div><label>% HT từ</label><input id="dcf" type="number" disabled></div>
    <div><label>% HT đến</label><input id="dct" type="number" disabled></div>
    <div></div>
    <div class="chkline"><input type="checkbox" id="fmd" onchange="tog()"> <label style="margin:0">Giới hạn model</label></div>
    <div style="grid-column:2/5"><label>Danh sách model (phẩy)</label><input id="mdl" placeholder="H350,H150" disabled></div>
  </div>
  <div class="bar"><button class="primary" onclick="create()">Lưu thiết lập</button><span id="msg"></span></div>
</div>
<div class="bar" style="margin:10px 0"><select id="fa" onchange="load()"><option value="">Tất cả</option><option value="1">Hiệu lực</option><option value="0">Ngừng</option></select></div>
<table><thead><tr><th>Mã ĐK</th><th>Hiệu lực</th><th>% cọc</th><th>% HT</th><th>Model</th><th>Ngày tạo</th><th>TT</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="8" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const day=d=>d? new Date(d).toLocaleDateString("vi-VN"):"";
function tog(){ F("pcf").disabled=F("pct").disabled=!F("fptm").checked; F("dcf").disabled=F("dct").disabled=!F("fdt").checked; F("mdl").disabled=!F("fmd").checked; }
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
async function create(){
  const body={effDateStart:F("ds").value||null,effDateEnd:F("de").value||null,flagCQEndDate:F("fcq").checked?"1":"0",flagTaxPaymentDate:F("ftx").checked?"1":"0",flagPtmCoc:F("fptm").checked?"1":"0",ptmCocFrom:parseFloat(F("pcf").value)||0,ptmCocTo:parseFloat(F("pct").value)||0,flagDutyComplete:F("fdt").checked?"1":"0",dutyCompleteFrom:parseFloat(F("dcf").value)||0,dutyCompleteTo:parseFloat(F("dct").value)||0,flagModel:F("fmd").checked?"1":"0",models:F("mdl").value.split(",").map(s=>s.trim()).filter(Boolean)};
  const r=await fetch("/api/doatconditions",{method:"POST",headers:H(),body:JSON.stringify(body)});
  const j=await r.json();
  if(r.ok){ msg(j.message+" ("+j.dOATConditionCode+")"); load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/doatconditions?active=${F("fa").value}`,{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(o=>
    `<tr><td><b>${o.dOATConditionCode}</b></td><td>${day(o.effDateStart)}–${day(o.effDateEnd)}</td><td>${o.flagPtmCoc==="1"?o.ptmCocFrom+"-"+o.ptmCocTo+"%":"—"}</td><td>${o.flagDutyComplete==="1"?o.dutyCompleteFrom+"-"+o.dutyCompleteTo+"%":"—"}</td><td>${o.flagModel==="1"?o.models+" model":"tất cả"}</td><td>${day(o.createdAt)}</td><td><span class="pill p-${o.flagActive}">${o.flagActive==="1"?"Hiệu lực":"Ngừng"}</span></td><td><button class="sm" onclick="toggle('${o.dOATConditionCode}')">Đổi TT</button></td></tr>`
  ).join("")||'<tr><td colspan="8" class="muted">Chưa có điều kiện.</td></tr>';
}
async function toggle(c){ const r=await fetch(`/api/doatconditions/${c}/toggle`,{method:"POST",headers:H()}); const j=await r.json(); if(r.ok) load(); else msg("Lỗi: "+(j.error||r.status)); }
tog(); load();
</script>
</body></html>
