<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Loại khách hàng dịch vụ</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#7c3aed;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:920px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px} h3{font-size:14px;margin:16px 0 4px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.link{border:none;background:none;color:var(--accent);padding:2px 6px}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} td.num{text-align:right;font-variant-numeric:tabular-nums} .wrap{overflow-x:auto}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .on{color:var(--ok)} .off{opacity:.5}
  #msg{font-size:13px;margin-left:6px}
</style></head>
<body>
<h1>Loại khách hàng dịch vụ <span class="muted">(port 1:1 FrmCusTypeCreate — TCMotor)</span></h1>
<p class="muted">Khai báo loại khách hàng dịch vụ và hệ số giá áp dụng (nhân đơn giá dịch vụ), phân biệt cá nhân/tổ chức. Mỗi mã 1 bản ghi — nhập lại = cập nhật.</p>
<div class="card">
  <h3 style="margin-top:0">Thêm / cập nhật loại KH</h3>
  <div class="row">
    <div><label>Mã loại</label><input id="fCode" style="width:110px" placeholder="(auto)"></div>
    <div style="flex:1;min-width:150px"><label>Tên loại *</label><input id="fName" style="width:100%"></div>
    <div><label>Hệ số giá</label><input id="fFactor" type="number" step="0.01" style="width:100px" value="1"></div>
    <div><label>Đối tượng</label><select id="fPerson"><option value="Personal">Cá nhân</option><option value="Organization">Tổ chức</option></select></div>
    <button class="primary" onclick="save()">Lưu</button><span id="msg"></span>
  </div>
</div>
<div class="row" style="margin:8px 0">
  <div><label>Tìm mã/tên</label><input id="qQ" style="width:160px" onkeydown="if(event.key==='Enter')load()"></div>
  <div><label>Đối tượng</label><select id="qPerson"><option value="">Tất cả</option><option value="Personal">Cá nhân</option><option value="Organization">Tổ chức</option></select></div>
  <button onclick="load()">Xem danh sách</button>
</div>
<div class="wrap"><table><thead><tr><th>Mã</th><th>Tên loại</th><th class="num">Hệ số giá</th><th>Đối tượng</th><th>TT</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="6" class="muted">Nhấn "Xem danh sách".</td></tr></tbody></table></div>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
const PT={Personal:"Cá nhân",Organization:"Tổ chức"};
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(extra){ return Object.assign({"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY}, extra||{}); }
function msg(t){ F("msg").textContent=t; setTimeout(()=>{if(F("msg").textContent===t)F("msg").textContent="";},2500); }
async function save(){ await token();
  const body={CusTypeCode:F("fCode").value,CusTypeName:F("fName").value,CusFactor:parseFloat(F("fFactor").value||"0"),CusPersonType:F("fPerson").value};
  const r=await fetch("/api/customertypes",{method:"POST",headers:H({"Content-Type":"application/json"}),body:JSON.stringify(body)});
  const d=await r.json();
  if(!r.ok){ msg("Lỗi: "+(d.error||r.status)); return; }
  msg(d.updated?"Đã cập nhật "+d.cusTypeCode:"Đã thêm "+d.cusTypeCode); F("fCode").value="";F("fName").value=""; load();
}
async function toggle(c){ await token();
  const r=await fetch("/api/customertypes/"+encodeURIComponent(c)+"/toggle",{method:"POST",headers:H()});
  if(!r.ok){ msg("Lỗi"); return; } load();
}
function edit(o){ F("fCode").value=o.cusTypeCode;F("fName").value=o.cusTypeName||"";F("fFactor").value=o.cusFactor;F("fPerson").value=o.cusPersonType; window.scrollTo(0,0); }
async function load(){ await token();
  const r=await fetch("/api/customertypes?q="+encodeURIComponent(F("qQ").value)+"&personType="+F("qPerson").value,{headers:H()});
  const d=await r.json();
  F("rows").innerHTML=(d.items||[]).map(o=>`<tr><td><b>${o.cusTypeCode}</b></td><td>${esc(o.cusTypeName)}</td><td class="num">${o.cusFactor}</td><td>${PT[o.cusPersonType]||o.cusPersonType}</td><td><span class="pill ${o.flagActive==='1'?'on':'off'}">${o.flagActive==='1'?'BẬT':'TẮT'}</span></td><td><button class="link" onclick='edit(${JSON.stringify(o)})'>Sửa</button><button class="link" onclick="toggle('${o.cusTypeCode}')">Bật/Tắt</button></td></tr>`).join("")||'<tr><td colspan="6" class="muted">Chưa có dữ liệu.</td></tr>';
}
</script>
</body></html>
