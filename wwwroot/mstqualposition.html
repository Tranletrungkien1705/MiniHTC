<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Trình độ &amp; chức vụ</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1000px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} h2{font-size:16px;margin:0 0 8px} .muted{opacity:.65;font-size:13px}
  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px}
  .bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  input,button,select{font:inherit;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit;min-width:0}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase}
</style></head>
<body>
<h1>Danh mục trình độ &amp; chức vụ <span class="muted">(Mst_Qualification · Mst_Position)</span></h1>
<p id="msg" class="muted"></p>
<div class="cols">
  <div class="card"><h2>Trình độ chuyên môn</h2>
    <div class="bar"><input id="qc" placeholder="Mã *" style="width:80px"><input id="qn" placeholder="Tên" style="flex:1"><input id="qr" placeholder="Ghi chú" style="width:100px">
      <select id="qa"><option value="1">1</option><option value="0">0</option></select><button class="primary" onclick="saveQ()">Lưu</button></div>
    <table><thead><tr><th>Mã</th><th>Tên</th><th>Ghi chú</th><th>HĐ</th></tr></thead><tbody id="qrows"></tbody></table></div>
  <div class="card"><h2>Chức vụ</h2>
    <div class="bar"><input id="pc" placeholder="Mã *" style="width:80px"><input id="pd" placeholder="Mô tả" style="flex:1">
      <select id="pa"><option value="1">1</option><option value="0">0</option></select><button class="primary" onclick="saveP()">Lưu</button></div>
    <table><thead><tr><th>Mã</th><th>Mô tả</th><th>HĐ</th></tr></thead><tbody id="prows"></tbody></table></div>
</div>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const esc=s=>(s??"").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;");
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
async function post(url,b){ await token(); const r=await fetch(url,{method:"POST",headers:H(),body:JSON.stringify(b)}); const j=await r.json(); F("msg").textContent=r.ok?"Đã lưu.":"Lỗi: "+(j.error||r.status); load(); }
function saveQ(){ post("/api/mstqualifications",{QualificationCode:F("qc").value,QualificationName:F("qn").value,Remark:F("qr").value,FlagActive:F("qa").value}); }
function saveP(){ post("/api/mstpositions",{PositionCode:F("pc").value,PositionDesc:F("pd").value,FlagActive:F("pa").value}); }
async function load(){ await token();
  const q=await (await fetch("/api/mstqualifications",{headers:H()})).json();
  F("qrows").innerHTML=(q.items||[]).map(o=>`<tr><td><b>${esc(o.qualificationCode)}</b></td><td>${esc(o.qualificationName)}</td><td>${esc(o.remark)}</td><td>${o.flagActive}</td></tr>`).join("")||'<tr><td colspan="4" class="muted">Trống.</td></tr>';
  const p=await (await fetch("/api/mstpositions",{headers:H()})).json();
  F("prows").innerHTML=(p.items||[]).map(o=>`<tr><td><b>${esc(o.positionCode)}</b></td><td>${esc(o.positionDesc)}</td><td>${o.flagActive}</td></tr>`).join("")||'<tr><td colspan="3" class="muted">Trống.</td></tr>';
}
load();
</script>
</body></html>
