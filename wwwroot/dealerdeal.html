<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Giao dịch bán lẻ đại lý</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--warn:#d97706;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1080px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} td.num{text-align:right;font-variant-numeric:tabular-nums}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
  #msg{font-size:13px} .cars{font-size:12px;opacity:.85} #ctbl td,#ctbl th{padding:4px 6px}
</style></head>
<body>
<h1>Giao dịch bán lẻ đại lý <span class="muted">(port 1:1 FrmNewDeal — DealerDeal)</span></h1>
<div class="card">
  <b>Tạo giao dịch bán lẻ</b>
  <div class="bar" style="margin:10px 0">
    <div><label>Mã đại lý *</label><input id="dl" style="width:90px"></div>
    <div><label>Số HĐ bán lẻ user</label><input id="du" style="width:120px"></div>
    <div><label>KH người mua *</label><input id="cb" style="width:100px"></div>
    <div><label>KH người lái</label><input id="cd" style="width:100px"></div>
    <div><label>KH đứng tên</label><input id="ch" style="width:100px"></div>
    <div><label>Kiểu bán lẻ *</label><input id="st" style="width:90px" placeholder="RETAIL"></div>
    <div><label>PDI</label><select id="pdi"><option value="1">Có PDI</option><option value="0">Không PDI</option></select></div>
    <div><label>Lý do không PDI</label><input id="rn" style="width:120px"></div>
    <span style="flex:1"></span><button class="primary" onclick="create()">Lưu GD</button><span id="msg"></span>
  </div>
  <table id="ctbl"><thead><tr><th>Mã xe / VIN *</th><th>Số HĐ khách</th><th>Ngày HĐ</th><th>Giá sau VAT</th><th></th></tr></thead><tbody id="ctb"></tbody></table>
  <button class="sm" style="margin-top:6px" onclick="addCar()">+ Thêm xe</button>
</div>
<div class="card">
  <b>Sửa KH mua/lái/đứng tên (port 1:1 FrmEditDeal_KHGD)</b>
  <div class="bar" style="margin:10px 0">
    <div><label>Mã GD *</label><input id="ekNo" style="width:110px"></div>
    <div><label>KH người mua</label><input id="ekB" style="width:100px"></div>
    <div><label>KH người lái</label><input id="ekD" style="width:100px"></div>
    <div><label>KH đứng tên</label><input id="ekH" style="width:100px"></div>
    <span style="flex:1"></span><button class="primary" onclick="editKhgd()">Lưu</button><span id="ekMsg"></span>
  </div>
</div>
<div class="bar" style="margin:10px 0"><input id="q" placeholder="Lọc mã ĐL" oninput="load()" style="width:100px"><input id="qb" placeholder="Lọc KH mua" oninput="load()" style="width:100px"></div>
<table><thead><tr><th>Mã GD</th><th>HĐ user</th><th>Đại lý</th><th>KH mua</th><th>Kiểu</th><th>PDI</th><th>Số xe</th><th class="num">Tổng (sau VAT)</th><th>Ngày GD</th></tr></thead>
<tbody id="rows"><tr><td colspan="9" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const money=n=>(n||0).toLocaleString("vi-VN"); const day=d=>d? new Date(d).toLocaleString("vi-VN"):"";
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
function addCar(){ const tr=document.createElement("tr");
  tr.innerHTML=`<td><input class="vin" style="width:140px"></td><td><input class="in" style="width:100px"></td><td><input class="dt" type="date"></td><td><input class="pr" type="number" style="width:110px"></td><td><button class="sm" onclick="this.closest('tr').remove()">×</button></td>`;
  F("ctb").appendChild(tr); }
async function create(){
  const cars=[...F("ctb").querySelectorAll("tr")].map(tr=>({carId:tr.querySelector(".vin").value,cusInvoiceNo:tr.querySelector(".in").value,cusInvoiceDate:tr.querySelector(".dt").value||null,priceAFVAT:parseFloat(tr.querySelector(".pr").value)||0})).filter(c=>c.carId);
  const body={dealerCode:F("dl").value,dealNoUser:F("du").value,customerCodeBuyer:F("cb").value,customerCodeDriver:F("cd").value,customerCodeHolder:F("ch").value,salesType:F("st").value,flagPDI:F("pdi").value,reasonNotPDI:F("rn").value,cars};
  const r=await fetch("/api/dealerdeals",{method:"POST",headers:H(),body:JSON.stringify(body)});
  const j=await r.json();
  if(r.ok){ msg("Đã tạo "+j.dealNo+" ("+j.cars+" xe)."); F("ctb").innerHTML="";addCar(); load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/dealerdeals?dealer=${F("q").value}&buyer=${F("qb").value}`,{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(o=>
    `<tr><td><b>${o.dealNo}</b> <a href="#" class="cars" onclick="cars('${o.dealNo}');return false">xem xe</a></td><td>${o.dealNoUser||""}</td><td>${o.dealerCode}</td><td>${o.customerCodeBuyer}</td><td>${o.salesType}</td><td>${o.flagPDI==="1"?"Có":"Không"}</td><td>${o.cars}</td><td class="num">${money(o.total)}</td><td>${day(o.dealDate)}</td></tr><tr id="x-${o.dealNo}"></tr>`
  ).join("")||'<tr><td colspan="9" class="muted">Chưa có giao dịch.</td></tr>';
}
async function cars(no){
  const row=F("x-"+no); if(row.innerHTML){ row.innerHTML=""; return; }
  const d=await (await fetch(`/api/dealerdeals/${no}/cars`,{headers:H()})).json();
  row.innerHTML=`<td colspan="9"><div class="cars">KH lái: ${d.customerCodeDriver||"—"} · KH đứng tên: ${d.customerCodeHolder||"—"}<br>${(d.cars||[]).map(c=>`Xe <b>${c.carId}</b>${c.cusInvoiceNo?" · HĐ "+c.cusInvoiceNo:""} · ${money(c.priceAFVAT)}đ`).join(" &nbsp;|&nbsp; ")||"—"}</div></td>`;
}
async function editKhgd(){
  const no=F("ekNo").value.trim(); if(!no){ F("ekMsg").textContent="Cần mã GD"; return; }
  const body={rows:[{dealNo:no,customerCodeBuyer:F("ekB").value||null,customerCodeHolder:F("ekH").value||null,customerCodeDriver:F("ekD").value||null}]};
  const r=await fetch("/api/dealerdeals/edit-khgd",{method:"POST",headers:H(),body:JSON.stringify(body)});
  const j=await r.json();
  F("ekMsg").textContent=r.ok?(j.updated?"Đã lưu.":"Không tìm thấy GD."):("Lỗi: "+(j.error||r.status));
  if(r.ok && j.updated) load();
}
addCar(); load();
</script>
</body></html>
