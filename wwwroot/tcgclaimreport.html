<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Báo cáo YCBH TCG</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#4f46e5;--ok:#16a34a;--bad:#dc2626}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:960px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px} h3{font-size:14px;margin:16px 0 4px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:10px 0}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)} th{opacity:.7;font-size:11px;text-transform:uppercase} td.num,th.num{text-align:right;font-variant-numeric:tabular-nums} .wrap{overflow-x:auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:10px} .kpi{border:1px solid var(--line);border-radius:12px;padding:14px} .kpi b{font-size:22px;display:block} .kpi .lbl{font-size:12px;opacity:.7}
</style></head>
<body>
<h1>Báo cáo yêu cầu bảo hành TCG <span class="muted">(port 1:1 FrmClaimReport — 2010.HTC/Report)</span></h1>
<p class="muted">Thống kê YCBH (TCG) theo trạng thái + theo đại lý + tỉ lệ chấp thuận.</p>
<div class="row">
  <div><label>Từ ngày</label><input id="from" type="date"></div>
  <div><label>Đến ngày</label><input id="to" type="date"></div>
  <div><label>Đại lý</label><input id="dealer" style="width:110px"></div>
  <button class="primary" onclick="load()">Xem</button>
</div>
<div class="grid" id="kpis"></div>
<h3>Theo trạng thái</h3>
<div class="wrap"><table><thead><tr><th>Trạng thái</th><th class="num">Số YC</th></tr></thead><tbody id="stRows"><tr><td colspan="2" class="muted">—</td></tr></tbody></table></div>
<h3>Theo đại lý</h3>
<div class="wrap"><table><thead><tr><th>Đại lý</th><th class="num">Tổng</th><th class="num">Chấp thuận</th><th class="num">Từ chối</th></tr></thead><tbody id="dlRows"><tr><td colspan="4" class="muted">—</td></tr></tbody></table></div>

<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const M=n=>(+n||0).toLocaleString("vi-VN"); const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY}; }
async function load(){ await token();
  const p=new URLSearchParams(); if(F("from").value)p.set("fromDate",F("from").value); if(F("to").value)p.set("toDate",F("to").value); if(F("dealer").value)p.set("dealer",F("dealer").value);
  const r=await fetch("/api/report/tcg-warranty-claim?"+p.toString(),{headers:H()}); const d=await r.json();
  F("kpis").innerHTML=`<div class="kpi"><b>${M(d.total)}</b><span class="lbl">Tổng YCBH</span></div><div class="kpi"><b style="color:var(--ok)">${M(d.accepted)}</b><span class="lbl">Chấp thuận</span></div><div class="kpi"><b>${d.acceptRate}%</b><span class="lbl">Tỉ lệ duyệt</span></div>`;
  F("stRows").innerHTML=(d.byStatus||[]).map(o=>`<tr><td>${esc(o.status)}</td><td class="num">${M(o.count)}</td></tr>`).join("")||'<tr><td colspan="2" class="muted">Không có.</td></tr>';
  F("dlRows").innerHTML=(d.byDealer||[]).map(o=>`<tr><td><b>${esc(o.dealerCode)}</b></td><td class="num">${M(o.total)}</td><td class="num" style="color:var(--ok)">${M(o.approved)}</td><td class="num" style="color:var(--bad)">${M(o.rejected)}</td></tr>`).join("")||'<tr><td colspan="4" class="muted">Không có.</td></tr>';
}
</script>
</body></html>
