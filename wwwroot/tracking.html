<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Tiến độ xưởng</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--warn:#d97706;--prog:#7c3aed;--ok:#16a34a;--cyan:#0891b2}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1200px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .bar{display:flex;gap:8px;margin:14px 0;align-items:center}
  button{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit;cursor:pointer}
  .board{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
  .col{border:1px solid var(--line);border-radius:12px;padding:8px;min-height:120px}
  .colh{font-size:12px;font-weight:700;text-transform:uppercase;opacity:.85;padding:2px 4px;display:flex;justify-content:space-between}
  .cnt{background:var(--line);border-radius:999px;padding:0 8px;font-size:11px}
  .cardro{border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-top:6px;font-size:12px}
  .cardro b{font-size:13px} .wait{color:var(--warn)} .plate{font-weight:700}
  .s-HasRO .colh{color:var(--warn)} .s-InGarage .colh{color:var(--prog)} .s-Repaired .colh{color:var(--cyan)} .s-CheckEnd .colh{color:var(--accent)} .s-Paid .colh{color:var(--ok)} .s-Finished .colh{color:var(--ok)}
  @media(max-width:900px){ .board{grid-template-columns:repeat(2,1fr)} }
</style></head>
<body>
<h1>Bảng theo dõi tiến độ xưởng dịch vụ <span class="muted">(port 1:1 FrmTrackingProcess — Ser_RO_Stage, kanban RO)</span></h1>
<div class="bar"><span class="muted">Tổng RO: <b id="total">0</b></span><span style="flex:1"></span><button onclick="load()">Làm mới</button></div>
<div class="board" id="board"></div>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const LBL={HasRO:"Mới tạo",InGarage:"Đang sửa",Repaired:"Sửa xong",CheckEnd:"Kiểm tra cuối",Paid:"Đã TT",Finished:"Đã giao xe"};
const day=d=>d? new Date(d).toLocaleDateString("vi-VN"):"";
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
async function load(){ await token();
  const d=await (await fetch("/api/repairorders/board",{headers:H()})).json();
  F("total").textContent=d.total;
  F("board").innerHTML=(d.columns||[]).map(c=>`<div class="col s-${c.status}"><div class="colh"><span>${LBL[c.status]||c.status}</span><span class="cnt">${c.count}</span></div>
    ${(c.items||[]).map(r=>`<div class="cardro"><b class="plate">${r.licensePlate}</b>${r.cusWaiting?' <span class="wait">⏱ chờ</span>':''}<div class="muted">${r.rONo}</div>${r.cusName?`<div>${r.cusName}</div>`:''}${r.planedDeliveryDate?`<div class="muted">Giao: ${day(r.planedDeliveryDate)}</div>`:''}</div>`).join("")||'<div class="muted" style="padding:6px 4px">—</div>'}</div>`).join("");
}
load();
</script>
</body></html>
