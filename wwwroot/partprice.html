<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Giá phụ tùng</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:960px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .bar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;align-items:center}
  input,button{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} td.n,th.n{text-align:right;font-variant-numeric:tabular-nums} #msg{font-size:13px} .ok{color:var(--ok);font-weight:600}
</style></head>
<body>
<h1>Giá bán phụ tùng theo ngày hiệu lực <span class="muted">(port 1:1 FrmPartPriceCreate — Ser_Inv_PartPrice)</span></h1>
<div class="bar">
  <input id="pc" placeholder="Mã PT *" style="width:110px"><input id="pn" placeholder="Tên PT" style="width:140px">
  <input id="pr" type="number" placeholder="Giá bán" style="width:120px;text-align:right"><input id="vat" type="number" placeholder="VAT %" style="width:80px;text-align:right" value="10">
  <input id="ed" type="date" title="Ngày hiệu lực *">
  <button class="primary" onclick="save()">Lưu giá</button><span id="msg"></span>
</div>
<div class="bar">
  <input id="qp" placeholder="Lọc mã PT (bắt buộc để tra giá)" oninput="load()" style="width:220px">
  <span class="muted">Tra giá cho ngày:</span><input id="on" type="date" onchange="load()"><span id="app" class="ok"></span>
</div>
<table><thead><tr><th>Mã PT</th><th>Tên</th><th class="n">Giá bán</th><th class="n">VAT</th><th class="n">Giá gồm VAT</th><th>Hiệu lực</th></tr></thead>
<tbody id="rows"><tr><td colspan="6" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const n=x=>Number(x||0).toLocaleString("vi-VN"); const day=d=>d? new Date(d).toLocaleDateString("vi-VN"):"—";
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
async function save(){
  const b={partCode:F("pc").value,partName:F("pn").value,price:Number(F("pr").value||0),vat:Number(F("vat").value||0),effectiveDate:F("ed").value||null};
  const r=await fetch("/api/partprices",{method:"POST",headers:H(),body:JSON.stringify(b)});
  const j=await r.json();
  if(r.ok){ msg("Đã lưu "+j.partCode+" (gồm VAT "+n(j.priceVAT)+")."); F("pr").value=""; load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/partprices?part=${encodeURIComponent(F("qp").value)}&onDate=${F("on").value||""}`,{headers:H()})).json();
  F("app").textContent=d.applicable?`→ giá áp dụng ${day(d.applicable.effectiveDate)}: ${n(d.applicable.price)} (gồm VAT ${n(d.applicable.priceVAT)})`:"";
  F("rows").innerHTML=(d.items||[]).map(x=>`<tr><td><b>${x.partCode}</b></td><td>${x.partName||"—"}</td><td class="n">${n(x.price)}</td>
    <td class="n">${x.vat}%</td><td class="n"><b>${n(x.priceVAT)}</b></td><td>${day(x.effectiveDate)}</td></tr>`).join("")||'<tr><td colspan="6" class="muted">Chưa có giá.</td></tr>';
}
load();
</script>
</body></html>
