<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Cập nhật giá xe</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--warn:#d97706;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:960px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} td.num{text-align:right;font-variant-numeric:tabular-nums}
  #msg{font-size:13px} #ctbl td,#ctbl th{padding:4px 6px}
</style></head>
<body>
<h1>Cập nhật giá xe thực tế theo VIN <span class="muted">(port 1:1 FrmUpdateCar — CarActualPrice)</span></h1>
<div class="card">
  <b>Cập nhật giá (batch)</b> <span class="muted">— nhập mã xe + giá mới, upsert theo VIN</span>
  <div class="bar" style="margin:10px 0"><span style="flex:1"></span><button class="primary" onclick="save()">Lưu giá</button><span id="msg"></span></div>
  <table id="ctbl"><thead><tr><th>Mã xe / VIN *</th><th>Giá mới *</th><th></th></tr></thead><tbody id="ctb"></tbody></table>
  <button class="sm" style="margin-top:6px" onclick="addRow()">+ Thêm dòng</button>
</div>
<div class="bar" style="margin:10px 0"><input id="q" placeholder="Lọc mã xe" oninput="load()" style="width:150px"></div>
<table><thead><tr><th>Mã xe / VIN</th><th class="num">Giá thực tế</th><th>Cập nhật lúc</th></tr></thead>
<tbody id="rows"><tr><td colspan="3" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const money=n=>(n||0).toLocaleString("vi-VN"); const day=d=>d? new Date(d).toLocaleString("vi-VN"):"";
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
function addRow(){ const tr=document.createElement("tr");
  tr.innerHTML=`<td><input class="vin" style="width:160px"></td><td><input class="pr" type="number" style="width:130px"></td><td><button class="sm" onclick="this.closest('tr').remove()">×</button></td>`;
  F("ctb").appendChild(tr); }
async function save(){
  const rows=[...F("ctb").querySelectorAll("tr")].map(tr=>({carId:tr.querySelector(".vin").value,unitPriceActual:parseFloat(tr.querySelector(".pr").value)||0})).filter(r=>r.carId);
  const r=await fetch("/api/caractualprices",{method:"POST",headers:H(),body:JSON.stringify(rows)});
  const j=await r.json();
  if(r.ok){ msg(`Đã cập nhật ${j.total} xe (thêm ${j.inserted}, sửa ${j.updated}).`); F("ctb").innerHTML="";addRow(); load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/caractualprices?car=${F("q").value}`,{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(o=>
    `<tr><td><b>${o.carId}</b></td><td class="num">${money(o.unitPriceActual)}</td><td>${day(o.updatedAt)}</td></tr>`
  ).join("")||'<tr><td colspan="3" class="muted">Chưa có giá xe.</td></tr>';
}
addRow(); load();
</script>
</body></html>
