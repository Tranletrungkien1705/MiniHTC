<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Chia sẻ phụ tùng đại lý</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#0d9488;--ok:#16a34a;--warn:#d97706}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1020px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px} h3{font-size:14px;margin:16px 0 4px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit;box-sizing:border-box;width:100%}
  button{cursor:pointer;width:auto} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.link{border:none;background:none;color:var(--accent);padding:2px 6px}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} td.num{text-align:right;font-variant-numeric:tabular-nums} .wrap{overflow-x:auto}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .s-Open{color:var(--ok)} .s-Closed{color:var(--warn)}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:8px 0} #msg{font-size:13px;margin-left:6px}
</style></head>
<body>
<h1>Chia sẻ phụ tùng giữa đại lý <span class="muted">(port 1:1 FrmSharePart — TCMotor)</span></h1>
<p class="muted">Đại lý đăng phụ tùng đang tồn kho sẵn sàng chia sẻ/điều chuyển cho đại lý khác. Số lượng chia sẻ không vượt tồn kho. Đóng tin khi không còn chia sẻ.</p>
<div class="card"><h3 style="margin-top:0">Đăng tin chia sẻ</h3>
  <div class="grid">
    <div><label>Đại lý *</label><input id="fDealer" placeholder="DL01"></div>
    <div><label>Mã PT *</label><input id="fPart" placeholder="P001"></div>
    <div><label>Tên PT</label><input id="fName"></div>
    <div><label>ĐVT</label><input id="fUnit" placeholder="Cai"></div>
    <div><label>Tồn kho</label><input id="fStock" type="number"></div>
    <div><label>SL chia sẻ</label><input id="fShare" type="number"></div>
    <div><label>Ghi chú</label><input id="fRemark"></div>
  </div>
  <div style="margin-top:8px"><button class="primary" onclick="save()">Đăng tin</button><span id="msg"></span></div>
</div>
<div class="bar">
  <div><label>Lọc đại lý</label><input id="qDealer" style="width:110px"></div>
  <div><label>Tìm PT</label><input id="qPart" style="width:130px" onkeydown="if(event.key==='Enter')load()"></div>
  <div><label>Trạng thái</label><select id="qStatus" style="padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit"><option value="">Tất cả</option><option value="Open">Đang mở</option><option value="Closed">Đã đóng</option></select></div>
  <button onclick="load()">Xem danh sách</button>
</div>
<div class="wrap"><table><thead><tr><th>Số tin</th><th>Đại lý</th><th>PT</th><th>ĐVT</th><th class="num">Tồn</th><th class="num">SL share</th><th>Ghi chú</th><th>TT</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="9" class="muted">Nhấn "Xem danh sách".</td></tr></tbody></table></div>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;"); const ST={Open:"Đang mở",Closed:"Đã đóng"};
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(extra){ return Object.assign({"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY}, extra||{}); }
function msg(t){ F("msg").textContent=t; setTimeout(()=>{if(F("msg").textContent===t)F("msg").textContent="";},2500); }
async function save(){ await token();
  const body={DealerCode:F("fDealer").value,PartCode:F("fPart").value,PartName:F("fName").value,Unit:F("fUnit").value,InStock:+F("fStock").value||0,QuantityShare:+F("fShare").value||0,Remark:F("fRemark").value};
  const r=await fetch("/api/shareparts",{method:"POST",headers:H({"Content-Type":"application/json"}),body:JSON.stringify(body)});
  const d=await r.json(); if(!r.ok){ msg("Lỗi: "+(d.error||r.status)); return; }
  msg("Đã đăng "+d.shareNo); F("fShare").value=""; load();
}
async function close(no){ await token();
  const r=await fetch("/api/shareparts/"+encodeURIComponent(no)+"/close",{method:"POST",headers:H()});
  const d=await r.json(); if(!r.ok){ msg("Lỗi: "+(d.error||r.status)); return; } load();
}
async function load(){ await token();
  const r=await fetch("/api/shareparts?dealer="+encodeURIComponent(F("qDealer").value)+"&part="+encodeURIComponent(F("qPart").value)+"&status="+F("qStatus").value,{headers:H()});
  const d=await r.json();
  F("rows").innerHTML=(d.items||[]).map(o=>`<tr><td><b>${o.shareNo}</b></td><td>${esc(o.dealerCode)}</td><td>${esc(o.partCode)}${o.partName?" — "+esc(o.partName):""}</td><td>${esc(o.unit)}</td><td class="num">${o.inStock}</td><td class="num">${o.quantityShare}</td><td>${esc(o.remark)}</td><td><span class="pill s-${o.status}">${ST[o.status]||o.status}</span></td><td>${o.status==='Open'?`<button class="link" onclick="close('${o.shareNo}')">Đóng</button>`:''}</td></tr>`).join("")||'<tr><td colspan="9" class="muted">Chưa có tin chia sẻ.</td></tr>';
}
</script>
</body></html>
