<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Cập nhật chứng từ kế toán</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--ok:#16a34a;--warn:#d97706}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:960px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:10px 0}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.sm{padding:4px 9px;font-size:12px} button.ok{color:#fff;background:var(--ok);border-color:var(--ok)}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} td.num{text-align:right;font-variant-numeric:tabular-nums} .wrap{overflow-x:auto}
  #msg{font-size:13px} .ni{width:150px}
</style></head>
<body>
<h1>Cập nhật chứng từ kế toán <span class="muted">(port 1:1 FrmUpdateChungTuKT — số ghi sổ KT trên phiếu TT đã duyệt)</span></h1>
<p class="muted">Chỉ phiếu thanh toán <b>đã duyệt</b> mới cập nhật được số chứng từ (AccountingRecordNo). Ghi old→new.</p>
<div class="bar">
  <input id="qn" placeholder="Lọc số phiếu" oninput="load()" style="width:120px">
  <input id="qd" placeholder="Lọc đại lý" oninput="load()" style="width:100px">
  <span id="msg"></span>
</div>
<div class="wrap"><table><thead><tr><th>Số phiếu</th><th>Đại lý</th><th class="num">Tổng tiền</th><th>Số CT hiện tại</th><th>Số CT mới</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="6" class="muted">Đang tải…</td></tr></tbody></table></div>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
function money(n){ return (n||0).toLocaleString("vi-VN"); }
async function load(){ await token();
  const d=await (await fetch(`/api/bankpms?dealer=${F("qd").value}&pmNo=${F("qn").value}&status=Approved`,{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(o=>
    `<tr><td><b>${o.paymentNo}</b></td><td>${o.dealerCode}</td><td class="num">${money(o.totalAmount)}</td><td>${o.accountingRecordNo||"—"}</td><td><input class="ni" id="n_${o.paymentNo}" placeholder="Số CT mới"></td><td><button class="sm ok" onclick="save('${o.paymentNo}')">Cập nhật</button></td></tr>`
  ).join("")||'<tr><td colspan="6" class="muted">Không có phiếu đã duyệt.</td></tr>';
}
async function save(no){
  const v=F("n_"+no).value.trim(); if(!v){ msg("Chưa nhập số CT mới cho "+no); return; }
  const r=await fetch(`/api/bankpms/${no}/ctkt`,{method:"POST",headers:H(),body:JSON.stringify({newAccountingRecordNo:v})});
  const j=await r.json();
  if(r.ok){ msg(`${no}: ${j.oldAccountingRecordNo||"(rỗng)"} → ${j.newAccountingRecordNo}`); load(); } else msg("Lỗi: "+(j.error||r.status));
}
load();
</script>
</body></html>
