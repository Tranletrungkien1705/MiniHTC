<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Đẩy Sổ Bảo Hành online</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--ok:#16a34a;--warn:#d97706}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1000px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:10px 0}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px} button.ok{color:#fff;background:var(--ok);border-color:var(--ok)}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} td.num{text-align:right;font-variant-numeric:tabular-nums} .wrap{overflow-x:auto}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .s-Pending{color:var(--warn)} .s-Posted{color:var(--ok)}
  #msg{font-size:13px}
</style></head>
<body>
<h1>Đẩy Sổ Bảo Hành lên hệ thống online <span class="muted">(port 1:1 Frm_RePostSBHOnline — SalesDealer)</span></h1>
<div class="card">
  <b>Đăng ký hồ sơ bảo hành (upsert theo VIN)</b>
  <div class="bar" style="margin-top:10px">
    <div><label>VIN *</label><input id="vin" style="width:130px"></div>
    <div><label>Mã xe</label><input id="cid" style="width:90px"></div>
    <div><label>Số GD</label><input id="dn" style="width:110px"></div>
    <div><label>Đại lý</label><input id="dl" style="width:80px"></div>
    <div><label>Ngày giao</label><input id="dd" type="date" style="width:140px"></div>
    <button class="primary" onclick="save()">Lưu</button><span id="msg"></span>
  </div>
</div>
<div class="bar">
  <input id="qn" placeholder="Lọc số GD" oninput="load()" style="width:100px">
  <input id="qv" placeholder="Lọc VIN" oninput="load()" style="width:120px">
  <select id="qs" onchange="load()"><option value="">Tất cả</option><option value="Pending">Chưa đẩy</option><option value="Posted">Đã đẩy</option></select>
  <button class="ok" onclick="pushAll()">Đẩy tất cả (đang lọc)</button>
</div>
<div class="wrap"><table><thead><tr><th>VIN</th><th>Mã xe</th><th>Số GD</th><th>ĐL</th><th>Ngày giao</th><th>Trạng thái</th><th class="num">Số lần đẩy</th><th>Lần đẩy cuối</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="9" class="muted">Đang tải…</td></tr></tbody></table></div>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id); let CURITEMS=[];
const ST={Pending:"Chưa đẩy",Posted:"Đã đẩy"};
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
async function save(){
  const b={vin:F("vin").value,carId:F("cid").value,dealNo:F("dn").value,dealerCode:F("dl").value,deliveryDate:F("dd").value||null};
  const r=await fetch("/api/sbhonline",{method:"POST",headers:H(),body:JSON.stringify(b)});
  const j=await r.json();
  if(r.ok){ msg((j.updated?"Đã cập nhật ":"Đã thêm ")+j.vin); load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/sbhonline?dealNo=${F("qn").value}&vin=${F("qv").value}&status=${F("qs").value}`,{headers:H()})).json();
  CURITEMS=(d.items||[]);
  F("rows").innerHTML=CURITEMS.map(o=>
    `<tr><td><b>${o.vin}</b></td><td>${o.carId||""}</td><td>${o.dealNo||""}</td><td>${o.dealerCode||""}</td><td>${(o.deliveryDate||"").substring(0,10)}</td><td><span class="pill s-${o.postStatus}">${ST[o.postStatus]||o.postStatus}</span></td><td class="num">${o.pushCount}</td><td>${(o.lastPushAt||"").replace("T"," ").substring(0,19)||"—"}</td><td><button class="sm ok" onclick="push('${o.vin}')">${o.postStatus==="Posted"?"Đẩy lại":"Đẩy"}</button></td></tr>`
  ).join("")||'<tr><td colspan="9" class="muted">Chưa có hồ sơ.</td></tr>';
}
async function push(vin){
  const r=await fetch(`/api/sbhonline/${vin}/push`,{method:"POST",headers:H()});
  const j=await r.json(); if(r.ok){ msg(`${vin}: ${j.message} (${j.rePush?"đẩy lại":"đẩy"} lần ${j.pushCount})`); load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function pushAll(){
  const vins=CURITEMS.map(o=>o.vin); if(!vins.length){ msg("Không có hồ sơ để đẩy"); return; }
  const r=await fetch(`/api/sbhonline/pushbatch`,{method:"POST",headers:H(),body:JSON.stringify({vins})});
  const j=await r.json(); if(r.ok){ msg(`${j.message} (${j.pushed} hồ sơ)`); load(); } else msg("Lỗi: "+(j.error||r.status));
}
load();
</script>
</body></html>
