<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Nhà vận tải</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#4f46e5;--ok:#16a34a;--bad:#dc2626}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1000px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px} h3{font-size:14px;margin:14px 0 4px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.link{border:none;background:none;color:var(--accent);padding:2px 6px}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)} th{opacity:.7;font-size:11px;text-transform:uppercase} .wrap{overflow-x:auto}
  .msg{font-size:13px;margin-left:6px} .off{opacity:.5}
</style></head>
<body>
<h1>Nhà vận tải + xe + tài xế <span class="muted">(port 1:1 FrmTransporter/Car/Driver — Admin/Product 2010.HTC)</span></h1>
<div class="card"><h3 style="margin-top:0">Thêm/sửa nhà vận tải</h3>
  <div class="row">
    <div><label>Mã NVT *</label><input id="tCode" style="width:100px"></div>
    <div><label>Tên</label><input id="tName" style="width:200px"></div>
    <div style="flex:1"><label>Địa chỉ</label><input id="tAddr" style="width:100%"></div>
  </div>
  <div class="row" style="margin-top:6px">
    <div><label>Điện thoại</label><input id="tPhone" style="width:120px"></div><div><label>Fax</label><input id="tFax" style="width:110px"></div>
    <div><label>Giám đốc</label><input id="tDir" style="width:150px"></div><div><label>SĐT GĐ</label><input id="tDirP" style="width:120px"></div>
    <button class="primary" onclick="save()">Lưu</button><span id="msg" class="msg"></span>
  </div>
</div>
<div class="row" style="margin:8px 0"><input id="q" placeholder="Mã/tên NVT" style="width:200px"><button onclick="load()">Xem</button></div>
<div class="wrap"><table><thead><tr><th>Mã</th><th>Tên</th><th>ĐT</th><th>Giám đốc</th><th>Xe</th><th>Tài xế</th><th>TT</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="8" class="muted">Nhấn "Xem".</td></tr></tbody></table></div>

<div class="card" id="sub" style="display:none"><h3 style="margin-top:0">Chi tiết <span id="subName" class="muted"></span></h3>
  <div class="row"><div><label>Thêm biển số xe</label><input id="cPlate" style="width:120px"></div><button onclick="addCar()">+ Xe</button>
    <div style="margin-left:14px"><label>Thêm tài xế (mã)</label><input id="dId" style="width:90px"></div><input id="dName" placeholder="Tên" style="width:130px"><input id="dLic" placeholder="GPLX" style="width:100px"><input id="dPhone" placeholder="SĐT" style="width:110px"><button onclick="addDriver()">+ Tài xế</button><span id="msg2" class="msg"></span></div>
  <h3>Xe</h3><div class="wrap"><table><thead><tr><th>Biển số</th><th>TT</th><th></th></tr></thead><tbody id="carRows"></tbody></table></div>
  <h3>Tài xế</h3><div class="wrap"><table><thead><tr><th>Mã</th><th>Tên</th><th>GPLX</th><th>SĐT</th><th>TT</th><th></th></tr></thead><tbody id="drvRows"></tbody></table></div>
</div>

<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id); let CUR=null;
const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(extra){ return Object.assign({"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY}, extra||{}); }
function m(id,t){ F(id).textContent=t; setTimeout(()=>{if(F(id).textContent===t)F(id).textContent="";},3500); }
async function save(){ await token();
  const r=await fetch("/api/transporters",{method:"POST",headers:H({"Content-Type":"application/json"}),body:JSON.stringify({TransporterCode:F("tCode").value,TransporterName:F("tName").value,Address:F("tAddr").value,PhoneNo:F("tPhone").value,FaxNo:F("tFax").value,DirectorFullName:F("tDir").value,DirectorPhoneNo:F("tDirP").value})});
  const d=await r.json(); if(!r.ok){ m("msg","Lỗi: "+(d.error||r.status)); return; } m("msg","Đã lưu "+d.transporterCode); F("tCode").value=""; load();
}
async function toggle(code){ await token(); await fetch("/api/transporters/"+encodeURIComponent(code)+"/toggle",{method:"POST",headers:H()}); load(); }
async function load(){ await token();
  const r=await fetch("/api/transporters?q="+encodeURIComponent(F("q").value),{headers:H()}); const d=await r.json();
  F("rows").innerHTML=(d.items||[]).map(o=>`<tr class="${o.flagActive==='1'?'':'off'}"><td><b>${esc(o.transporterCode)}</b></td><td>${esc(o.transporterName)}</td><td>${esc(o.phoneNo)}</td><td>${esc(o.directorFullName)}</td><td>${o.cars}</td><td>${o.drivers}</td><td>${o.flagActive==='1'?'Bật':'Tắt'}</td><td><button class="link" onclick="openSub('${esc(o.transporterCode)}')">Xe/TX</button><button class="link" onclick="toggle('${esc(o.transporterCode)}')">Đổi</button></td></tr>`).join("")||'<tr><td colspan="8" class="muted">Chưa có NVT.</td></tr>';
}
async function openSub(code){ CUR=code; F("sub").style.display="block"; F("subName").textContent="— "+code; loadCars(); loadDrivers(); }
async function loadCars(){ await token();
  const r=await fetch("/api/transporters/"+encodeURIComponent(CUR)+"/cars",{headers:H()}); const d=await r.json();
  F("carRows").innerHTML=(d.cars||[]).map(o=>`<tr class="${o.flagActive==='1'?'':'off'}"><td><b>${esc(o.plateNo)}</b></td><td>${o.flagActive==='1'?'Bật':'Tắt'}</td><td><button class="link" onclick="toggleCar(${o.id})">Đổi</button></td></tr>`).join("")||'<tr><td colspan="3" class="muted">Chưa có xe.</td></tr>';
}
async function loadDrivers(){ await token();
  const r=await fetch("/api/transporters/"+encodeURIComponent(CUR)+"/drivers",{headers:H()}); const d=await r.json();
  F("drvRows").innerHTML=(d.drivers||[]).map(o=>`<tr class="${o.flagActive==='1'?'':'off'}"><td><b>${esc(o.driverId)}</b></td><td>${esc(o.driverFullName)}</td><td>${esc(o.driverLicenseNo)}</td><td>${esc(o.driverPhoneNo)}</td><td>${o.flagActive==='1'?'Bật':'Tắt'}</td><td><button class="link" onclick="toggleDrv(${o.id})">Đổi</button></td></tr>`).join("")||'<tr><td colspan="6" class="muted">Chưa có tài xế.</td></tr>';
}
async function addCar(){ if(!CUR) return; await token();
  const r=await fetch("/api/transporters/"+encodeURIComponent(CUR)+"/cars",{method:"POST",headers:H({"Content-Type":"application/json"}),body:JSON.stringify({PlateNo:F("cPlate").value})});
  const d=await r.json(); if(!r.ok){ m("msg2","Lỗi: "+(d.error||r.status)); return; } m("msg2","Đã thêm "+d.plate); F("cPlate").value=""; loadCars(); load();
}
async function addDriver(){ if(!CUR) return; await token();
  const r=await fetch("/api/transporters/"+encodeURIComponent(CUR)+"/drivers",{method:"POST",headers:H({"Content-Type":"application/json"}),body:JSON.stringify({DriverId:F("dId").value,DriverFullName:F("dName").value,DriverLicenseNo:F("dLic").value,DriverPhoneNo:F("dPhone").value})});
  const d=await r.json(); if(!r.ok){ m("msg2","Lỗi: "+(d.error||r.status)); return; } m("msg2","Đã thêm "+d.driverId); F("dId").value="";F("dName").value=""; loadDrivers(); load();
}
async function toggleCar(id){ await token(); await fetch("/api/transporters/cars/"+id+"/toggle",{method:"POST",headers:H()}); loadCars(); }
async function toggleDrv(id){ await token(); await fetch("/api/transporters/drivers/"+id+"/toggle",{method:"POST",headers:H()}); loadDrivers(); }
</script>
</body></html>
