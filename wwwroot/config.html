<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Cấu hình hệ thống</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:900px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .bar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;align-items:center}
  input,button{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} code{background:rgba(127,127,127,.15);padding:1px 5px;border-radius:4px}
  .act{color:var(--accent);cursor:pointer} .r{color:#dc2626} #msg{font-size:13px}
</style></head>
<body>
<h1>Cấu hình hệ thống <span class="muted">(port 1:1 FrmMngConfig*/Setup)</span></h1>
<div class="bar">
  <input id="k" placeholder="Khóa (key) *" style="width:200px"><input id="v" placeholder="Giá trị" style="width:200px"><input id="d" placeholder="Mô tả" style="width:200px">
  <button class="primary" onclick="save()">Lưu</button>
  <span style="flex:1"></span><input id="q" placeholder="Tìm key..." oninput="load()" style="width:140px"><span id="msg"></span>
</div>
<table><thead><tr><th>Khóa</th><th>Giá trị</th><th>Mô tả</th><th>Cập nhật</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="5" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t,ok){ F("msg").textContent=t; F("msg").className=ok?"":"r"; }
async function load(){ await token();
  const d=await (await fetch("/api/configs?q="+encodeURIComponent(F("q").value),{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(x=>`<tr><td><code>${x.configKey}</code></td><td>${x.configValue||""}</td><td>${x.description||""}</td>
    <td class="muted">${new Date(x.updatedAt).toLocaleString('vi-VN')}</td>
    <td><span class="act" onclick="edit('${x.configKey}','${(x.configValue||'').replace(/'/g,"\\'")}','${(x.description||'').replace(/'/g,"\\'")}')">Sửa</span>
    <span class="act r" onclick="del('${x.configKey}')">Xoá</span></td></tr>`).join("")||'<tr><td colspan="5" class="muted">Chưa có cấu hình.</td></tr>';
}
function edit(k,v,d){ F("k").value=k; F("v").value=v; F("d").value=d; }
async function save(){
  const r=await fetch("/api/configs",{method:"POST",headers:H(),body:JSON.stringify({configKey:F("k").value,configValue:F("v").value,description:F("d").value})});
  if(r.ok){ msg("Đã lưu.",true); F("k").value="";F("v").value="";F("d").value=""; load(); } else msg("Lỗi: "+((await r.json()).error||r.status),false);
}
async function del(k){ if(!confirm("Xoá cấu hình "+k+"?"))return;
  const r=await fetch("/api/configs/"+encodeURIComponent(k),{method:"DELETE",headers:H()});
  if(r.ok){ msg("Đã xoá.",true); load(); } else msg("Không xoá được.",false); }
load();
</script>
</body></html>
