<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Sửa ngày lập HĐ & kiểm chứng</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#4f46e5;--ok:#16a34a;--bad:#dc2626}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:960px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:10px 0}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)} th{opacity:.7;font-size:11px;text-transform:uppercase} .wrap{overflow-x:auto}
  .msg{font-size:13px;margin-left:6px} .inp{width:130px} .res{margin-top:10px} .err{color:var(--bad)}
  .kc{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line)} .kc-1{color:var(--ok)} .kc-0{opacity:.6}
</style></head>
<body>
<h1>Sửa ngày lập HĐ & cờ kiểm chứng CSKH <span class="muted">(port 1:1 FrmEditDeal_DealDate/FrmEditDeal_KiemChung — 2010.HTC)</span></h1>
<p class="muted">Tra hợp đồng đại lý, sửa ngày lập HĐ (không tương lai) và/hoặc cờ kiểm chứng chăm sóc khách hàng (1=đã kiểm chứng, 0=chưa).</p>
<div class="row">
  <div><label>Số HĐ</label><input id="qNo" style="width:150px"></div>
  <div><label>Đại lý</label><input id="qDlr" style="width:120px"></div>
  <button class="primary" onclick="search()">Tìm</button>
  <button onclick="saveAll()">Lưu</button><span id="msg" class="msg"></span>
</div>
<div class="wrap"><table><thead><tr><th>Số HĐ</th><th>Đại lý</th><th>Ngày lập HT</th><th>Kiểm chứng HT</th><th>Ngày mới</th><th>Kiểm chứng mới</th></tr></thead>
<tbody id="rows"><tr><td colspan="6" class="muted">Nhấn "Tìm".</td></tr></tbody></table></div>
<div class="res" id="res"></div>

<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(extra){ return Object.assign({"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY}, extra||{}); }
function m(t){ F("msg").textContent=t; setTimeout(()=>{if(F("msg").textContent===t)F("msg").textContent="";},4000); }
function kc(v){ return v==="1"?'<span class="kc kc-1">Đã KC</span>':v==="0"?'<span class="kc kc-0">Chưa KC</span>':'-'; }
async function search(){ await token();
  const p=new URLSearchParams(); if(F("qNo").value)p.set("dealNo",F("qNo").value); if(F("qDlr").value)p.set("dealer",F("qDlr").value);
  const r=await fetch("/api/editdeal/dealinfo?"+p.toString(),{headers:H()}); const d=await r.json(); F("res").innerHTML="";
  F("rows").innerHTML=(d.rows||[]).map(o=>`<tr data-id="${o.id}"><td><b>${esc(o.dealNo)}</b></td><td>${esc(o.dealerCode)}</td><td>${esc(o.dealDate)||"-"}</td><td>${kc(o.ctmCareFlag)}</td><td><input type="date" class="inp dd"></td><td><select class="inp kf"><option value="">(giữ)</option><option value="1">Đã KC</option><option value="0">Chưa KC</option></select></td></tr>`).join("")||'<tr><td colspan="6" class="muted">Không thấy HĐ.</td></tr>';
}
async function saveAll(){ await token();
  const fixes=[...F("rows").querySelectorAll("tr[data-id]")].map(tr=>{ const dd=tr.querySelector(".dd").value,kf=tr.querySelector(".kf").value; return (dd||kf)?{Id:+tr.dataset.id,DealDate:dd,CtmCareFlag:kf}:null; }).filter(Boolean);
  if(!fixes.length){ m("Chưa nhập gì."); return; }
  const r=await fetch("/api/editdeal/dealinfo",{method:"POST",headers:H({"Content-Type":"application/json"}),body:JSON.stringify(fixes)});
  const d=await r.json(); if(!r.ok){ m("Lỗi: "+(d.error||r.status)); return; }
  m(`Đã sửa ${d.updated}/${d.total}`);
  F("res").innerHTML=(d.changes&&d.changes.length)?`<div class="wrap"><table><thead><tr><th>Số HĐ</th><th>Ngày cũ</th><th>Ngày mới</th><th>KC cũ</th><th>KC mới</th><th>Ghi chú</th></tr></thead><tbody>${d.changes.map(c=>`<tr><td>${esc(c.dealNo)}</td><td>${esc(c.oldDate)}</td><td>${esc(c.newDate)}</td><td>${esc(c.oldFlag)}</td><td>${esc(c.newFlag)}</td><td class="${c.error?'err':'muted'}">${esc(c.error)||"OK"}</td></tr>`).join("")}</tbody></table></div>`:"";
  search();
}
</script>
</body></html>
