<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Hợp đồng nguyên tắc</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--warn:#d97706;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1000px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit;box-sizing:border-box}
  .grid input{width:100%}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} #msg{font-size:13px}
</style></head>
<body>
<h1>Hợp đồng nguyên tắc <span class="muted">(port 1:1 FrmPrincipleContractNew — PrincipleContract)</span></h1>
<div class="card">
  <b>Tạo HĐ nguyên tắc</b>
  <div class="grid" style="margin-top:10px">
    <div><label>Mã đại lý *</label><input id="dl"></div>
    <div><label>Số HĐ nguyên tắc *</label><input id="no"></div>
    <div><label>Thông tin ngân hàng *</label><input id="bk"></div>
    <div><label>Người đại diện *</label><input id="rp"></div>
    <div><label>Chức danh *</label><input id="jt"></div>
    <div><label>Ngày HĐ *</label><input id="cd" type="date"></div>
    <div><label>Ngày kết thúc *</label><input id="ed" type="date"></div>
  </div>
  <div class="bar"><button class="primary" onclick="create()">Lưu HĐ</button><span id="msg"></span></div>
</div>
<div class="bar" style="margin:10px 0"><input id="q" placeholder="Lọc đại lý" oninput="load()" style="width:120px"></div>
<table><thead><tr><th>Số HĐ</th><th>Đại lý</th><th>Ngân hàng</th><th>Người đại diện</th><th>Chức danh</th><th>Hiệu lực</th></tr></thead>
<tbody id="rows"><tr><td colspan="6" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const day=d=>d? new Date(d).toLocaleDateString("vi-VN"):"";
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
async function create(){
  const body={dealerCode:F("dl").value,principleContractNo:F("no").value,bankInfo:F("bk").value,representative:F("rp").value,jobTitle:F("jt").value,principleContractDate:F("cd").value||null,principleContractExpectedDate:F("ed").value||null};
  const r=await fetch("/api/principlecontracts",{method:"POST",headers:H(),body:JSON.stringify(body)});
  const j=await r.json();
  if(r.ok){ msg("Đã tạo "+j.principleContractNo); ["no","bk","rp","jt"].forEach(x=>F(x).value=""); load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/principlecontracts?dealer=${F("q").value}`,{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(o=>
    `<tr><td><b>${o.principleContractNo}</b></td><td>${o.dealerCode}</td><td>${o.bankInfo}</td><td>${o.representative}</td><td>${o.jobTitle}</td><td>${day(o.principleContractDate)}–${day(o.principleContractExpectedDate)}</td></tr>`
  ).join("")||'<tr><td colspan="6" class="muted">Chưa có hợp đồng.</td></tr>';
}
load();
</script>
</body></html>
