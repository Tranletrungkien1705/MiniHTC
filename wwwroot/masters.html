<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Danh mục</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb}
  *{box-sizing:border-box} body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:900px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .bar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;align-items:center}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:14px} th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:12px;text-transform:uppercase}
  .pill{font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line)}
  .ok{color:#16a34a} .err{color:#dc2626} .act{color:var(--accent);cursor:pointer;margin-right:10px}
  #msg{min-height:18px;font-size:13px}
</style></head>
<body>
<h1>Danh mục hệ thống <span class="muted">(2010.HTC — port 1:1 nhiều màn Frm master)</span></h1>
<div class="bar">
  <label>Danh mục:</label>
  <select id="cat" onchange="load()"></select>
  <input id="q" placeholder="Tìm..." oninput="load()" style="width:160px">
  <span style="flex:1"></span>
  <input id="fCode" placeholder="Mã" style="width:90px">
  <input id="fName" placeholder="Tên" style="width:220px">
  <select id="fStatus"><option value="1">Hiệu lực</option><option value="0">Ngừng</option></select>
  <button class="primary" onclick="save()">Lưu</button>
</div>
<div id="msg"></div>
<table><thead><tr><th>Mã</th><th>Tên</th><th>Trạng thái</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="4" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc";
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t,ok){ const m=document.getElementById("msg"); m.textContent=t; m.className=ok?"ok":"err"; }
async function initCats(){
  await token();
  const d=await (await fetch("/api/master-categories",{headers:H()})).json();
  document.getElementById("cat").innerHTML=(d.items||[]).map(c=>`<option value="${c.cat}">${c.label}</option>`).join("");
  load();
}
async function load(){
  await token();
  const cat=document.getElementById("cat").value, q=document.getElementById("q").value;
  const d=await (await fetch(`/api/master/${cat}?q=`+encodeURIComponent(q),{headers:H()})).json();
  document.getElementById("rows").innerHTML=(d.items||[]).map(m=>`
    <tr><td><b>${m.code}</b></td><td>${m.name}</td>
    <td><span class="pill">${m.status==="1"?"Hiệu lực":"Ngừng"}</span></td>
    <td><span class="act" onclick="edit('${m.code}','${m.name.replace(/'/g,"\\'")}','${m.status}')">Sửa</span>
    <span class="act err" onclick="del('${m.code}')">Xoá</span></td></tr>`).join("")
    || '<tr><td colspan="4" class="muted">Chưa có dữ liệu.</td></tr>';
}
function edit(c,n,s){ document.getElementById("fCode").value=c; document.getElementById("fName").value=n; document.getElementById("fStatus").value=s; }
async function save(){
  const cat=document.getElementById("cat").value;
  const body=JSON.stringify({code:document.getElementById("fCode").value,name:document.getElementById("fName").value,status:document.getElementById("fStatus").value});
  const r=await fetch(`/api/master/${cat}`,{method:"POST",headers:H(),body});
  if(r.ok){ msg("Đã lưu.",true); document.getElementById("fCode").value=""; document.getElementById("fName").value=""; load(); }
  else msg("Lỗi: "+((await r.json()).error||r.status),false);
}
async function del(c){
  const cat=document.getElementById("cat").value;
  if(!confirm("Xoá "+c+"?")) return;
  const r=await fetch(`/api/master/${cat}/`+encodeURIComponent(c),{method:"DELETE",headers:H()});
  if(r.ok){ msg("Đã xoá "+c,true); load(); } else msg("Không xoá được.",false);
}
initCats();
</script>
</body></html>
