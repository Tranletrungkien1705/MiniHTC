<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Biên bản vận chuyển</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1000px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  button.ok{color:#fff;background:var(--ok);border-color:var(--ok)} button.bad{color:#fff;background:var(--bad);border-color:var(--bad)}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} .wrap{overflow-x:auto}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .s-Draft{color:var(--warn)} .s-Approved{color:var(--ok)} .s-Cancel{color:var(--bad)}
  .chk{font-size:12px} .chk.on{color:var(--ok)} .chk.off{opacity:.5}
  #msg{font-size:13px} .carrow input{width:100px}
</style></head>
<body>
<h1>Biên bản vận chuyển xe <span class="muted">(port 1:1 FrmBankTransportMinutes — ký kép ĐL + HTC, cụm Bank)</span></h1>
<div class="card">
  <b>Tạo biên bản (header + xe)</b>
  <div class="bar" style="margin-top:10px"><div><label>Đại lý *</label><input id="dl" style="width:100px"></div><div><label>NH</label><input id="bk" style="width:90px"></div><div><label>NH giám sát</label><input id="bm" style="width:100px"></div></div>
  <table style="margin-top:10px"><thead><tr><th>VIN</th><th>Mã xe</th><th>Số máy</th><th>Số ĐH</th><th>Số BL</th><th>Màu</th><th></th></tr></thead><tbody id="carRows"></tbody></table>
  <div class="bar" style="margin-top:8px"><button class="sm" onclick="addRow()">+ Thêm xe</button><button class="primary" onclick="save()">Tạo biên bản</button><span id="msg"></span></div>
</div>
<div class="bar" style="margin:10px 0">
  <input id="qd" placeholder="Lọc đại lý" oninput="load()" style="width:100px">
  <input id="qn" placeholder="Lọc số BBVC" oninput="load()" style="width:120px">
  <select id="qs" onchange="load()"><option value="">Mọi trạng thái</option><option value="Draft">Chờ ký</option><option value="Approved">Đã ký</option><option value="Cancel">Đã hủy</option></select>
</div>
<div class="wrap"><table><thead><tr><th>Số BBVC</th><th>Đại lý</th><th>NH</th><th class="num">Số xe</th><th>ĐL ký</th><th>HTC ký</th><th>Trạng thái</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="8" class="muted">Đang tải…</td></tr></tbody></table></div>
<div class="card" id="detCard" style="display:none">
  <b>Chi tiết xe — <span id="detNo"></span></b>
  <div class="wrap"><table><thead><tr><th>VIN</th><th>Mã xe</th><th>Số máy</th><th>Số ĐH</th><th>Số BL</th><th>HĐ ĐL</th><th>Màu</th></tr></thead><tbody id="detRows"></tbody></table></div>
</div>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const ST={Draft:"Chờ ký",Approved:"Đã ký",Cancel:"Đã hủy"};
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
function addRow(){ const tr=document.createElement("tr"); tr.className="carrow";
  tr.innerHTML=`<td><input class="c-vin"></td><td><input class="c-cid"></td><td><input class="c-eng"></td><td><input class="c-so"></td><td><input class="c-grt"></td><td><input class="c-col"></td><td><button class="sm" onclick="this.closest('tr').remove()">×</button></td>`;
  F("carRows").appendChild(tr); }
function collect(){ return [...document.querySelectorAll("#carRows tr")].map(tr=>({
  vin:tr.querySelector(".c-vin").value, carId:tr.querySelector(".c-cid").value, engineNo:tr.querySelector(".c-eng").value,
  soCode:tr.querySelector(".c-so").value, guaranteeNo:tr.querySelector(".c-grt").value, colorCode:tr.querySelector(".c-col").value})).filter(c=>c.vin.trim()); }
async function save(){
  const r=await fetch("/api/banktms",{method:"POST",headers:H(),body:JSON.stringify({dealerCode:F("dl").value,bankCode:F("bk").value,bankCodeMonitor:F("bm").value,cars:collect()})});
  const j=await r.json();
  if(r.ok){ msg(`Đã tạo ${j.transportMinutesNo} (${j.cars} xe)`); F("carRows").innerHTML=""; addRow(); load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/banktms?dealer=${F("qd").value}&tmNo=${F("qn").value}&status=${F("qs").value}`,{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(o=>{
    const dl=o.dlApprDateTime?`<span class="chk on">✓ ký</span>`:(o.status==="Cancel"?"—":`<button class="sm ok" onclick="sign('${o.transportMinutesNo}','dealer')">ĐL ký</button>`);
    const ht=o.htcAppr2DateTime?`<span class="chk on">✓ ký</span>`:(o.status==="Cancel"?"—":`<button class="sm ok" onclick="sign('${o.transportMinutesNo}','htc')">HTC ký</button>`);
    const cx=o.status==="Draft"?`<button class="sm bad" onclick="cancel('${o.transportMinutesNo}')">Hủy</button>`:"";
    return `<tr onclick="detail('${o.transportMinutesNo}')"><td><b>${o.transportMinutesNo}</b></td><td>${o.dealerCode}</td><td>${o.bankCode||""}</td><td class="num">${o.cars}</td><td onclick="event.stopPropagation()">${dl}</td><td onclick="event.stopPropagation()">${ht}</td><td><span class="pill s-${o.status}">${ST[o.status]||o.status}</span></td><td onclick="event.stopPropagation()">${cx}</td></tr>`;
  }).join("")||'<tr><td colspan="8" class="muted">Chưa có biên bản.</td></tr>';
}
async function detail(no){
  const d=await (await fetch(`/api/banktms/${no}/cars`,{headers:H()})).json();
  F("detCard").style.display=""; F("detNo").textContent=no;
  F("detRows").innerHTML=(d.cars||[]).map(c=>`<tr><td><b>${c.vin}</b></td><td>${c.carId||""}</td><td>${c.engineNo||""}</td><td>${c.soCode||""}</td><td>${c.guaranteeNo||""}</td><td>${c.dlrCtrNo||""}</td><td>${c.colorCode||""}</td></tr>`).join("")||'<tr><td colspan="7" class="muted">Không có xe.</td></tr>';
}
async function sign(no,side){
  const r=await fetch(`/api/banktms/${no}/sign/${side}`,{method:"POST",headers:H()});
  const j=await r.json(); if(r.ok){ msg(`${no}: ${ST[j.status]||j.status} (ĐL:${j.dlSigned?"✓":"–"} HTC:${j.htcSigned?"✓":"–"})`); load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function cancel(no){
  const r=await fetch(`/api/banktms/${no}/cancel`,{method:"POST",headers:H()});
  const j=await r.json(); if(r.ok){ msg(`${no}: đã hủy`); load(); } else msg("Lỗi: "+(j.error||r.status));
}
addRow(); load();
</script>
</body></html>
