<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Thư tín dụng LC</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--warn:#d97706;--ok:#16a34a;--bad:#dc2626}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1000px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .bar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;align-items:center}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .p-Open{color:var(--accent)} .p-Closed{color:var(--ok)} .exp{color:var(--bad);font-weight:600}
  .kpi{display:inline-block;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-right:8px} #msg{font-size:13px}
</style></head>
<body>
<h1>Thư tín dụng nhập khẩu (LC) <span class="muted">(port 1:1 FrmNewLC — LC)</span></h1>
<div class="bar">
  <input id="lc" placeholder="Số LC *" style="width:120px"><input id="ct" placeholder="Số hợp đồng *" style="width:130px"><input id="bk" placeholder="Ngân hàng *" style="width:150px">
  <input id="am" type="number" placeholder="Số tiền" style="width:130px;text-align:right"><input id="od" type="date" title="Ngày mở"><input id="ed" type="date" title="Ngày hết hạn">
  <button class="primary" onclick="save()">Lưu LC</button><span id="msg"></span>
</div>
<div class="bar"><span class="kpi">Tổng giá trị LC: <b id="tv" class="n">0</b></span><span style="flex:1"></span>
  <select id="fst" onchange="load()"><option value="">Tất cả</option><option value="Open">Đang mở</option><option value="Closed">Đã tất toán</option></select><input id="q" placeholder="Lọc HĐ" oninput="load()" style="width:110px"></div>
<table><thead><tr><th>Số LC</th><th>Hợp đồng</th><th>Ngân hàng</th><th class="n">Số tiền</th><th>Mở</th><th>Hết hạn</th><th>Trạng thái</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="8" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const LBL={Open:"Đang mở",Closed:"Đã tất toán"}; const n=x=>Number(x||0).toLocaleString("vi-VN"); const day=d=>d? new Date(d).toLocaleDateString("vi-VN"):"—";
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
async function save(){
  const b={lCNo:F("lc").value,contractNo:F("ct").value,bankName:F("bk").value,amount:Number(F("am").value||0),openDate:F("od").value||null,expiryDate:F("ed").value||null};
  const r=await fetch("/api/lcs",{method:"POST",headers:H(),body:JSON.stringify(b)});
  const j=await r.json();
  if(r.ok){ msg("Đã lưu "+j.lCNo+"."); F("lc").value="";F("am").value=""; load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/lcs?status=${F("fst").value}&contract=${F("q").value}`,{headers:H()})).json();
  F("tv").textContent=n(d.totalAmount);
  F("rows").innerHTML=(d.items||[]).map(l=>{
    let act=l.status==="Open"?`<button class="sm" onclick="close_('${l.lCNo}')">Tất toán</button>`:"";
    return `<tr><td><b>${l.lCNo}</b></td><td>${l.contractNo}</td><td>${l.bankName}</td><td class="n">${n(l.amount)}</td>
      <td>${day(l.openDate)}</td><td class="${l.expired?'exp':''}">${day(l.expiryDate)}${l.expired?" ⚠":""}</td>
      <td><span class="pill p-${l.status}">${LBL[l.status]||l.status}</span></td><td>${act}</td></tr>`;
  }).join("")||'<tr><td colspan="8" class="muted">Chưa có LC.</td></tr>';
}
async function close_(no){ const r=await fetch(`/api/lcs/${no}/close`,{method:"POST",headers:H()}); const j=await r.json(); if(r.ok) load(); else msg("Lỗi: "+(j.error||r.status)); }
load();
</script>
</body></html>
