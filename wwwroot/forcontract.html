<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Hợp đồng ngoại</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--warn:#d97706;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1000px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase}
  #msg{font-size:13px} .cars{font-size:12px;opacity:.85} #ltbl td,#ltbl th{padding:4px 6px}
</style></head>
<body>
<h1>Hợp đồng ngoại (CO) <span class="muted">(port 1:1 FrmNewCO — ForeignContract)</span></h1>
<div class="card">
  <b>Tạo hợp đồng ngoại</b>
  <div class="bar" style="margin:10px 0"><input id="cno" placeholder="Số hợp đồng ngoại *" style="width:180px"><span style="flex:1"></span><button class="primary" onclick="create()">Lưu HĐ</button><span id="msg"></span></div>
  <table id="ltbl"><thead><tr><th>Số Ref (PI)</th><th>Số LC tạm *</th><th></th></tr></thead><tbody id="ltb"></tbody></table>
  <button class="sm" style="margin-top:6px" onclick="addLine()">+ Thêm LC_Temp</button>
</div>
<div class="bar" style="margin:10px 0"><input id="q" placeholder="Lọc số HĐ" oninput="load()" style="width:150px"></div>
<table><thead><tr><th>Số hợp đồng ngoại</th><th>Số dòng LC</th><th>Ngày tạo</th></tr></thead>
<tbody id="rows"><tr><td colspan="3" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const day=d=>d? new Date(d).toLocaleString("vi-VN"):"";
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
function addLine(){ const tr=document.createElement("tr");
  tr.innerHTML=`<td><input class="rf" style="width:150px"></td><td><input class="lc" style="width:150px"></td><td><button class="sm" onclick="this.closest('tr').remove()">×</button></td>`;
  F("ltb").appendChild(tr); }
async function create(){
  const lines=[...F("ltb").querySelectorAll("tr")].map(tr=>({refNo:tr.querySelector(".rf").value,lcTemp:tr.querySelector(".lc").value})).filter(l=>l.lcTemp);
  const r=await fetch("/api/foreigncontracts",{method:"POST",headers:H(),body:JSON.stringify({contractNo:F("cno").value,lines})});
  const j=await r.json();
  if(r.ok){ msg("Đã tạo "+j.contractNo+" ("+j.lines+" dòng LC)."); F("ltb").innerHTML="";addLine(); F("cno").value=""; load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/foreigncontracts?q=${F("q").value}`,{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(o=>
    `<tr><td><b>${o.contractNo}</b> <a href="#" class="cars" onclick="lines('${o.contractNo}');return false">xem LC</a></td><td>${o.lines}</td><td>${day(o.createdAt)}</td></tr><tr id="x-${o.contractNo}"></tr>`
  ).join("")||'<tr><td colspan="3" class="muted">Chưa có hợp đồng ngoại.</td></tr>';
}
async function lines(no){
  const row=F("x-"+no); if(row.innerHTML){ row.innerHTML=""; return; }
  const d=await (await fetch(`/api/foreigncontracts/${no}/lines`,{headers:H()})).json();
  row.innerHTML=`<td colspan="3"><div class="cars">${(d.lines||[]).map(l=>`LC <b>${l.lcTemp}</b>${l.refNo?" · Ref "+l.refNo:""}`).join(" &nbsp;|&nbsp; ")||"—"}</div></td>`;
}
addLine(); load();
</script>
</body></html>
