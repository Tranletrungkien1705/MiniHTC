<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Chuyển kho</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--warn:#d97706;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1000px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .p-P{color:var(--warn)} .p-A1{color:#2563eb} .p-A2{color:var(--ok)} .p-R{color:#dc2626}
  #msg{font-size:13px} .cars{font-size:12px;opacity:.85} #ctbl td,#ctbl th{padding:4px 6px}
</style></head>
<body>
<h1>Yêu cầu chuyển kho <span class="muted">(port 1:1 FrmNewSC + FrmMngSC (duyệt 2 cấp) — Sto_StorageRearrange)</span></h1>
<div class="card">
  <b>Tạo yêu cầu chuyển kho</b>
  <div class="bar" style="margin:10px 0"><span style="flex:1"></span><button class="primary" onclick="create()">Lưu YC</button><span id="msg"></span></div>
  <table id="ctbl"><thead><tr><th>VIN *</th><th>Kho hiện tại</th><th>Kho đến *</th><th>Ghi chú</th><th></th></tr></thead><tbody id="ctb"></tbody></table>
  <button class="sm" style="margin-top:6px" onclick="addCar()">+ Thêm xe</button>
</div>
<div class="bar" style="margin:10px 0"><select id="fst" onchange="load()"><option value="">Tất cả</option><option value="P">Chờ duyệt</option><option value="A1">Duyệt cấp 1</option><option value="A2">Duyệt cấp 2</option><option value="R">Từ chối</option></select></div>
<table><thead><tr><th>Số YC</th><th>Số xe</th><th>Ngày tạo</th><th>Trạng thái</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="5" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
// Mã TConst.Stage — dùng chung header (RearrangeStatus) và dòng (RearrangeDtlStatus)
const LBL={P:"Chờ duyệt",A1:"Duyệt cấp 1",A2:"Duyệt cấp 2",R:"Từ chối"}; const day=d=>d? new Date(d).toLocaleString("vi-VN"):"";
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
function addCar(){ const tr=document.createElement("tr");
  tr.innerHTML=`<td><input class="vin" style="width:150px"></td><td><input class="sf" style="width:80px"></td><td><input class="st" style="width:80px"></td><td><input class="rm" style="width:120px"></td><td><button class="sm" onclick="this.closest('tr').remove()">×</button></td>`;
  F("ctb").appendChild(tr); }
async function create(){
  const cars=[...F("ctb").querySelectorAll("tr")].map(tr=>({vin:tr.querySelector(".vin").value,storageCodeFrom:tr.querySelector(".sf").value,storageCodeTo:tr.querySelector(".st").value,remark:tr.querySelector(".rm").value})).filter(c=>c.vin);
  const r=await fetch("/api/storagerearranges",{method:"POST",headers:H(),body:JSON.stringify({cars})});
  const j=await r.json();
  if(r.ok){ msg("Đã tạo "+j.sCNo+" ("+j.cars+" xe)."); F("ctb").innerHTML="";addCar(); load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/storagerearranges?status=${F("fst").value}`,{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(o=>{
    // Nguồn chỉ có 2 cấp duyệt (không có "xác nhận"/"huỷ"). Không-duyệt ở cấp 1 = TỪ CHỐI ("R"),
    // còn ở cấp 2 = BỎ DUYỆT, trả phiếu về "P" — hai cấp khác nhau, đúng nguồn.
    let act=o.status==="P"?`<button class="sm" onclick="act1('${o.sCNo}','approve1',true)">Duyệt cấp 1</button> <button class="sm" onclick="act1('${o.sCNo}','approve1',false)">Từ chối</button>`
      :o.status==="A1"?`<button class="sm" onclick="act1('${o.sCNo}','approve2',true)">Duyệt cấp 2</button> <button class="sm" onclick="act1('${o.sCNo}','approve2',false)">Bỏ duyệt</button>`:"";
    return `<tr><td><b>${o.sCNo}</b> <a href="#" class="cars" onclick="cars('${o.sCNo}');return false">xem xe</a></td><td>${o.cars}</td><td>${day(o.createdAt)}</td><td><span class="pill p-${o.status}">${LBL[o.status]||o.status}</span></td><td>${act}</td></tr><tr id="x-${o.sCNo}"></tr>`;
  }).join("")||'<tr><td colspan="5" class="muted">Chưa có yêu cầu.</td></tr>';
}
async function act1(no,a,ok){ let rm=null;
  if(!ok){ rm=prompt(a==="approve1"?"Lý do từ chối:":"Lý do bỏ duyệt:",""); if(rm===null) return; }
  const r=await fetch(`/api/storagerearranges/${no}/${a}`,{method:"POST",headers:H({"Content-Type":"application/json"}),body:JSON.stringify({approve:ok,remark:rm})});
  const j=await r.json(); if(r.ok){ msg(`${no}: ${LBL[j.status]||j.status} (${j.linesUpdated} xe).`); load(); } else msg("Lỗi: "+(j.error||r.status)); }
async function cars(no){
  const row=F("x-"+no); if(row.innerHTML){ row.innerHTML=""; return; }
  const d=await (await fetch(`/api/storagerearranges/${no}/cars`,{headers:H()})).json();
  row.innerHTML=`<td colspan="5"><div class="cars">${(d.cars||[]).map(c=>`VIN <b>${c.vin}</b> · ${c.storageCodeFrom||"?"}→${c.storageCodeTo}${c.remark?" · "+c.remark:""}`).join(" &nbsp;|&nbsp; ")||"—"}</div></td>`;
}
addCar(); load();
</script>
</body></html>
