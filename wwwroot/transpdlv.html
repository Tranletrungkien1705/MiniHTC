<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Xác nhận giao nhận vận chuyển</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--ok:#16a34a;--warn:#d97706}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:980px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px} button.ok{color:#fff;background:var(--ok);border-color:var(--ok)}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} .wrap{overflow-x:auto}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .s-Pending{color:var(--warn)} .s-Confirmed{color:var(--ok)}
  #msg{font-size:13px} .carrow input{width:130px}
</style></head>
<body>
<h1>Nhà vận chuyển xác nhận giao nhận <span class="muted">(port 1:1 FrmMngDlvMinutes — TERP.TranspClient)</span></h1>
<div class="card">
  <b>Tạo biên bản giao nhận (header + xe)</b>
  <div class="bar" style="margin-top:10px"><div><label>Đơn vị vận tải *</label><input id="tp" style="width:120px"></div><div><label>Đại lý nhận</label><input id="dl" style="width:100px"></div></div>
  <table style="margin-top:10px"><thead><tr><th>VIN</th><th>Model</th><th></th></tr></thead><tbody id="carRows"></tbody></table>
  <div class="bar" style="margin-top:8px"><button class="sm" onclick="addRow()">+ Thêm xe</button><button class="primary" onclick="save()">Tạo biên bản</button><span id="msg"></span></div>
</div>
<div class="bar" style="margin:10px 0">
  <input id="qt" placeholder="Lọc ĐVVT" oninput="load()" style="width:110px">
  <input id="qn" placeholder="Lọc số BB" oninput="load()" style="width:120px">
  <select id="qs" onchange="load()"><option value="">Mọi trạng thái</option><option value="Pending">Chờ xác nhận</option><option value="Confirmed">Đã xác nhận</option></select>
</div>
<div class="wrap"><table><thead><tr><th>Số BB giao nhận</th><th>ĐVVT</th><th>Đại lý</th><th class="num">Số xe</th><th>Trạng thái</th><th>Ngày XN</th><th>Ghi chú</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="8" class="muted">Đang tải…</td></tr></tbody></table></div>
<div class="card" id="detCard" style="display:none">
  <b>Chi tiết xe — <span id="detNo"></span></b>
  <div class="wrap"><table><thead><tr><th>VIN</th><th>Model</th></tr></thead><tbody id="detRows"></tbody></table></div>
</div>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const ST={Pending:"Chờ xác nhận",Confirmed:"Đã xác nhận"};
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
function addRow(){ const tr=document.createElement("tr"); tr.className="carrow";
  tr.innerHTML=`<td><input class="c-vin"></td><td><input class="c-md"></td><td><button class="sm" onclick="this.closest('tr').remove()">×</button></td>`;
  F("carRows").appendChild(tr); }
function collect(){ return [...document.querySelectorAll("#carRows tr")].map(tr=>({
  vin:tr.querySelector(".c-vin").value, modelCode:tr.querySelector(".c-md").value})).filter(c=>c.vin.trim()); }
async function save(){
  const r=await fetch("/api/transpdlv",{method:"POST",headers:H(),body:JSON.stringify({transporterCode:F("tp").value,dealerCode:F("dl").value,cars:collect()})});
  const j=await r.json();
  if(r.ok){ msg(`Đã tạo ${j.dlvMinutesNo} (${j.cars} xe)`); F("carRows").innerHTML=""; addRow(); load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/transpdlv?transporter=${F("qt").value}&no=${F("qn").value}&status=${F("qs").value}`,{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(o=>{
    const act=o.confirmStatus==="Pending"?`<button class="sm ok" onclick="confirm1('${o.dlvMinutesNo}')">Xác nhận</button>`:"";
    return `<tr onclick="detail('${o.dlvMinutesNo}')"><td><b>${o.dlvMinutesNo}</b></td><td>${o.transporterCode}</td><td>${o.dealerCode||""}</td><td class="num">${o.cars}</td><td><span class="pill s-${o.confirmStatus}">${ST[o.confirmStatus]||o.confirmStatus}</span></td><td>${(o.confirmDate||"").replace("T"," ").substring(0,16)||"—"}</td><td>${o.remark||""}</td><td onclick="event.stopPropagation()">${act}</td></tr>`;
  }).join("")||'<tr><td colspan="8" class="muted">Chưa có biên bản.</td></tr>';
}
async function detail(no){
  const d=await (await fetch(`/api/transpdlv/${no}/cars`,{headers:H()})).json();
  F("detCard").style.display=""; F("detNo").textContent=no;
  F("detRows").innerHTML=(d.cars||[]).map(c=>`<tr><td><b>${c.vin}</b></td><td>${c.modelCode||""}</td></tr>`).join("")||'<tr><td colspan="2" class="muted">Không có xe.</td></tr>';
}
async function confirm1(no){
  const rm=prompt("Ghi chú xác nhận (tùy chọn):",""); if(rm===null) return;
  const r=await fetch(`/api/transpdlv/${no}/confirm`,{method:"POST",headers:H(),body:JSON.stringify({remark:rm})});
  const j=await r.json(); if(r.ok){ msg(`${no}: đã xác nhận`); load(); } else msg("Lỗi: "+(j.error||r.status));
}
addRow(); load();
</script>
</body></html>
