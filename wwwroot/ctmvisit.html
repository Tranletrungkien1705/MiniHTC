<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Khách thăm showroom</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--warn:#d97706;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:900px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase}
  #msg{font-size:13px}
</style></head>
<body>
<h1>Lượt khách thăm showroom <span class="muted">(port 1:1 FrmCusVisit — CtmVisit)</span></h1>
<div class="card">
  <b>Ghi nhận lượt khách</b>
  <div class="bar" style="margin:10px 0">
    <div><label>Mã đại lý</label><input id="dl" style="width:100px"></div>
    <div><label>Giới tính *</label><select id="gd"><option value="">—</option><option value="0">Nam</option><option value="1">Nữ</option></select></div>
    <div><label>Độ tuổi *</label><select id="ra"><option value="">—</option><option value="18-25">18-25</option><option value="26-35">26-35</option><option value="36-45">36-45</option><option value="46+">46+</option></select></div>
    <div><label>Xe quan tâm *</label><input id="md" style="width:110px" placeholder="Model"></div>
    <span style="flex:1"></span><button class="primary" onclick="create()">Ghi nhận</button><span id="msg"></span>
  </div>
</div>
<div class="bar" style="margin:10px 0"><input id="q" placeholder="Lọc model" oninput="load()" style="width:120px"></div>
<table><thead><tr><th>Mã lượt</th><th>Đại lý</th><th>Giới tính</th><th>Độ tuổi</th><th>Xe quan tâm</th><th>Thời điểm</th></tr></thead>
<tbody id="rows"><tr><td colspan="6" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const day=d=>d? new Date(d).toLocaleString("vi-VN"):""; const GD={"0":"Nam","1":"Nữ"};
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
async function create(){
  const r=await fetch("/api/ctmvisits",{method:"POST",headers:H(),body:JSON.stringify({dealerCode:F("dl").value,gender:F("gd").value,rangeAge:F("ra").value,modelCode:F("md").value})});
  const j=await r.json();
  if(r.ok){ msg(j.message||"OK"); F("md").value=""; load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/ctmvisits?model=${F("q").value}`,{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(o=>
    `<tr><td><b>${o.cusVisitCode}</b></td><td>${o.dealerCode||""}</td><td>${GD[o.gender]||o.gender}</td><td>${o.rangeAge}</td><td>${o.modelCode}</td><td>${day(o.createdAt)}</td></tr>`
  ).join("")||'<tr><td colspan="6" class="muted">Chưa có lượt khách.</td></tr>';
}
load();
</script>
</body></html>
