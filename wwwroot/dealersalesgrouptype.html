<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Nhóm loại bán</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .bar{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
  input,button{font:inherit;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit;min-width:0}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.link{border:0;color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase}
</style></head>
<body>
<h1>Nhóm loại bán của đại lý <span class="muted">(port 1:1 FrmSalesGroupType — Mst_DealerSalesGroupType)</span></h1>
<div class="bar"><input id="c" placeholder="Mã nhóm *" style="width:120px"><input id="n" placeholder="Tên nhóm" style="flex:1">
  <button class="primary" onclick="save()">Lưu</button></div>
<p id="msg" class="muted"></p>
<table><thead><tr><th>Mã</th><th>Tên</th><th></th></tr></thead><tbody id="rows"></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const esc=s=>(s??"").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;");
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
async function post(b){ await token(); const r=await fetch("/api/masters/dealer-salesgroup-types",{method:"POST",headers:H(),body:JSON.stringify(b)}); const j=await r.json(); F("msg").textContent=r.ok?"Đã lưu.":"Lỗi: "+(j.error||r.status); load(); }
function save(){ post({SalesGroupType:F("c").value,SalesGroupTypeName:F("n").value}); }
function del(c){ if(confirm("Xoá nhóm "+c+"?")) post({SalesGroupType:c,FlagIsDelete:"1"}); }
function edit(c,n){ F("c").value=c; F("n").value=n; }
async function load(){ await token();
  const d=await (await fetch("/api/masters/dealer-salesgroup-types",{headers:H()})).json();
  F("rows").innerHTML=(d.Mst_DealerSalesGroupType||d.mst_DealerSalesGroupType||[]).map(o=>`<tr><td><b>${esc(o.salesGroupType)}</b></td><td>${esc(o.salesGroupTypeName)}</td><td><button class="link" onclick="edit('${esc(o.salesGroupType)}','${esc(o.salesGroupTypeName)}')">Sửa</button><button class="link" onclick="del('${esc(o.salesGroupType)}')">Xoá</button></td></tr>`).join("")||'<tr><td colspan="3" class="muted">Trống.</td></tr>';
}
load();
</script>
</body></html>
