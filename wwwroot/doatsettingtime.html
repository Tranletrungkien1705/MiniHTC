<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Khung giờ DOAT</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#4f46e5;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px} h3{font-size:14px;margin:14px 0 4px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
  .row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
  input,button{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)} th{opacity:.7;font-size:11px;text-transform:uppercase}
  .msg{font-size:13px;margin-left:6px} label.chk{display:flex;align-items:center;gap:6px} label.chk input{width:auto} .on{color:var(--ok);font-weight:600}
</style></head>
<body>
<h1>Khung giờ chạy DOAT <span class="muted">(port 1:1 FrmMst_DOATSettingTime — TCMotor)</span></h1>
<p class="muted">Cấu hình 2 khung giờ tự động tạo lệnh giao xe (First / Second run). Mỗi lần lưu tạo bản ghi cấu hình mới với số DOATSTNo tự sinh.</p>
<div class="card"><h3 style="margin-top:0">Cấu hình mới</h3>
  <div class="row"><label class="chk"><input type="checkbox" id="f1"> Bật khung giờ 1 (First run)</label><label class="chk"><input type="checkbox" id="f2"> Bật khung giờ 2 (Second run)</label><button class="primary" onclick="save()">Lưu cấu hình</button><span id="msg" class="msg"></span></div>
</div>
<div class="row" style="margin:8px 0"><button onclick="load()">Xem lịch sử</button><span id="kpi" class="muted"></span></div>
<table><thead><tr><th>DOATSTNo</th><th>Khung giờ 1</th><th>Khung giờ 2</th><th>Tạo lúc</th></tr></thead>
<tbody id="rows"><tr><td colspan="4" class="muted">Nhấn "Xem lịch sử".</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id); const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
const dts=s=>s?String(s).substring(0,16).replace("T"," "):"";
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(x){ return Object.assign({"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY}, x||{}); }
function say(t){ F("msg").textContent=t; setTimeout(()=>{if(F("msg").textContent===t)F("msg").textContent="";},3500); }
const flag=v=>v==='1'?'<span class="on">Bật</span>':'Tắt';
async function save(){ await token();
  const r=await fetch("/api/doatsettingtimes",{method:"POST",headers:H({"Content-Type":"application/json"}),body:JSON.stringify({FlagFirstRunTime:F("f1").checked,FlagSecondRunTime:F("f2").checked})});
  const d=await r.json(); if(!r.ok){ say("Lỗi: "+(d.error||r.status)); return; } say("Đã tạo "+d.doatstNo); load();
}
async function load(){ await token();
  const r=await fetch("/api/doatsettingtimes",{headers:H()}); const d=await r.json();
  F("kpi").textContent=`${d.count} cấu hình`+(d.latest?` — mới nhất: ${d.latest.doatstNo}`:"");
  F("rows").innerHTML=(d.items||[]).map(o=>`<tr><td><b>${esc(o.doatstNo)}</b></td><td>${flag(o.flagFirstRunTime)}</td><td>${flag(o.flagSecondRunTime)}</td><td>${dts(o.createdAt)}</td></tr>`).join("")||'<tr><td colspan="4" class="muted">Chưa có cấu hình.</td></tr>';
}
</script>
</body></html>
