<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Chiết khấu</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1000px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .bar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;align-items:center}
  input,button{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  #msg{font-size:13px} .box{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0} .ok{color:var(--ok);font-weight:600}
</style></head>
<body>
<h1>Biểu chiết khấu / phạt theo ngày hiệu lực <span class="muted">(port 1:1 FrmDiscount — Mst_Discount)</span></h1>
<div class="bar">
  <input id="ed" type="date" title="Ngày hiệu lực *">
  <input id="dp" type="number" step="any" placeholder="% Chiết khấu" style="width:110px">
  <input id="pp" type="number" step="any" placeholder="% Phạt" style="width:90px">
  <input id="pt" type="number" step="any" placeholder="% Phạt TCKT" style="width:110px">
  <input id="fn" type="number" step="any" placeholder="% CP tài chính" style="width:120px">
  <input id="pm" type="number" step="any" placeholder="% CK TT TCG" style="width:110px">
  <button class="primary" onclick="save()">Lưu biểu</button><span id="msg"></span>
</div>
<div class="bar">
  <span class="muted">Xem biểu áp dụng cho ngày:</span><input id="on" type="date" onchange="load()">
  <span id="app" class="ok"></span>
</div>
<table><thead><tr><th>Ngày hiệu lực</th><th class="n">% Chiết khấu</th><th class="n">% Phạt</th><th class="n">% Phạt TCKT</th><th class="n">% CP TC</th><th class="n">% CK TT TCG</th><th>TT</th></tr></thead>
<tbody id="rows"><tr><td colspan="7" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const day=d=>d? new Date(d).toLocaleDateString("vi-VN"):"—";
const pct=x=>Number(x||0)+"%";
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
async function save(){
  const b={effectiveDate:F("ed").value||null,discountPercent:Number(F("dp").value||0),penaltyPercent:Number(F("pp").value||0),penaltyPercentTCKT:Number(F("pt").value||0),fnExpPercent:Number(F("fn").value||0),pmtDsTCGPercent:Number(F("pm").value||0)};
  const r=await fetch("/api/discounts",{method:"POST",headers:H(),body:JSON.stringify(b)});
  const j=await r.json();
  if(r.ok){ msg("Đã lưu biểu "+day(j.effectiveDate)+"."); load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch("/api/discounts?onDate="+(F("on").value||""),{headers:H()})).json();
  F("app").textContent = d.applicable ? `→ áp dụng biểu ${day(d.applicable.effectiveDate)}: CK ${pct(d.applicable.discountPercent)}, phạt ${pct(d.applicable.penaltyPercent)}` : "";
  F("rows").innerHTML=(d.items||[]).map(x=>`<tr><td><b>${day(x.effectiveDate)}</b></td><td class="n">${pct(x.discountPercent)}</td>
    <td class="n">${pct(x.penaltyPercent)}</td><td class="n">${pct(x.penaltyPercentTCKT)}</td><td class="n">${pct(x.fnExpPercent)}</td>
    <td class="n">${pct(x.pmtDsTCGPercent)}</td><td>${x.status==="1"?"HL":"—"}</td></tr>`).join("")||'<tr><td colspan="7" class="muted">Chưa có biểu.</td></tr>';
}
load();
</script>
</body></html>
