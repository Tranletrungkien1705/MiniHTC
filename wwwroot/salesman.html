<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Nhân viên bán hàng</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb}
  *{box-sizing:border-box} body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:980px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit;width:100%}
  button{cursor:pointer;width:auto} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .bar{display:flex;gap:8px;align-items:center;margin:10px 0}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase}
  .act{color:var(--accent);cursor:pointer;margin-right:8px} .err{color:#dc2626} .ok{color:#16a34a} #msg{font-size:13px}
</style></head>
<body>
<h1>Nhân viên bán hàng <span class="muted">(port 1:1 FrmCreateSalesMan — Mst_SalesMan)</span></h1>
<div class="grid">
  <input id="c" placeholder="Mã NV (auto nếu trống)"><input id="n" placeholder="Tên nhân viên *" style="grid-column:span 2"><input id="dl" placeholder="Mã đại lý">
  <input id="dp" placeholder="Bộ phận"><input id="ph" placeholder="Điện thoại"><input id="em" placeholder="Email">
  <select id="st"><option value="1">Đang làm</option><option value="0">Nghỉ</option></select>
</div>
<div class="bar"><button class="primary" onclick="save()">Lưu</button><input id="q" placeholder="Tìm mã/tên..." oninput="load()" style="width:auto;flex:1"><span id="msg"></span></div>
<table><thead><tr><th>Mã</th><th>Tên</th><th>Đại lý</th><th>Bộ phận</th><th>ĐT</th><th>Email</th><th>TT</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="8" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t,ok){ F("msg").textContent=t; F("msg").className=ok?"ok":"err"; }
async function load(){ await token();
  const d=await (await fetch("/api/salesmen?q="+encodeURIComponent(F("q").value),{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(x=>`<tr>
    <td><b>${x.salesManCode}</b></td><td>${x.salesManName}</td><td>${x.dealerCode||""}</td><td>${x.departmentCode||""}</td>
    <td>${x.phone||""}</td><td>${x.email||""}</td><td>${x.status==="1"?"✓":"✕"}</td>
    <td><span class="act" onclick='fill(${JSON.stringify(x)})'>Sửa</span><span class="act err" onclick="del('${x.salesManCode}')">Xoá</span></td></tr>`).join("")
    || '<tr><td colspan="8" class="muted">Chưa có nhân viên.</td></tr>';
}
function fill(x){ F("c").value=x.salesManCode;F("n").value=x.salesManName;F("dl").value=x.dealerCode||"";F("dp").value=x.departmentCode||"";
  F("ph").value=x.phone||"";F("em").value=x.email||"";F("st").value=x.status; }
async function save(){
  const body=JSON.stringify({salesManCode:F("c").value,salesManName:F("n").value,dealerCode:F("dl").value,departmentCode:F("dp").value,phone:F("ph").value,email:F("em").value,status:F("st").value});
  const r=await fetch("/api/salesmen",{method:"POST",headers:H(),body});
  if(r.ok){ msg("Đã lưu.",true); ["c","n","dl","dp","ph","em"].forEach(i=>F(i).value=""); load(); }
  else msg("Lỗi: "+((await r.json()).error||r.status),false);
}
async function del(c){ if(!confirm("Xoá nhân viên "+c+"?"))return;
  const r=await fetch("/api/salesmen/"+encodeURIComponent(c),{method:"DELETE",headers:H()});
  if(r.ok){ msg("Đã xoá "+c,true); load(); } else msg("Không xoá được.",false); }
load();
</script>
</body></html>
