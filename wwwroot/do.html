<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Lệnh giao xe</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--warn:#d97706;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1000px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .p-Draft{color:var(--warn)} .p-Delivered{color:var(--ok)}
  #msg{font-size:13px} .cars{font-size:12px;opacity:.85} #ctbl td,#ctbl th{padding:4px 6px}
</style></head>
<body>
<h1>Lệnh giao xe cho đại lý (Foton) <span class="muted">(port 1:1 FrmNewDO — DeliveryOrder)</span></h1>
<div class="card">
  <b>Tạo lệnh giao</b>
  <div class="bar" style="margin:10px 0"><input id="dl" placeholder="Đại lý nhận *" style="width:130px"><span style="flex:1"></span><button class="primary" onclick="create()">Lưu DO</button><span id="msg"></span></div>
  <table id="ctbl"><thead><tr><th>VIN *</th><th>Model</th><th>Màu</th><th>Kho</th><th>Ngày giao DK</th><th></th></tr></thead><tbody id="ctb"></tbody></table>
  <button class="sm" style="margin-top:6px" onclick="addCar()">+ Thêm xe</button>
</div>
<div class="bar" style="margin:10px 0"><select id="fst" onchange="load()"><option value="">Tất cả</option><option value="Draft">Nháp</option><option value="Delivered">Đã giao</option></select><input id="q" placeholder="Lọc đại lý" oninput="load()" style="width:110px"></div>
<table><thead><tr><th>Số DO</th><th>Đại lý</th><th>Số xe</th><th>Ngày tạo</th><th>Trạng thái</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="6" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const LBL={Draft:"Nháp",Delivered:"Đã giao"}; const day=d=>d? new Date(d).toLocaleString("vi-VN"):"";
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
function addCar(){ const tr=document.createElement("tr");
  tr.innerHTML=`<td><input class="vin" style="width:130px"></td><td><input class="md" style="width:80px"></td><td><input class="cl" style="width:60px"></td><td><input class="st" style="width:70px"></td><td><input class="dd" type="date"></td><td><button class="sm" onclick="this.closest('tr').remove()">×</button></td>`;
  F("ctb").appendChild(tr); }
async function create(){
  const cars=[...F("ctb").querySelectorAll("tr")].map(tr=>({vin:tr.querySelector(".vin").value,modelCode:tr.querySelector(".md").value,colorCode:tr.querySelector(".cl").value,storageCode:tr.querySelector(".st").value,deliveryExpectDate:tr.querySelector(".dd").value||null})).filter(c=>c.vin);
  const r=await fetch("/api/deliveryorders",{method:"POST",headers:H(),body:JSON.stringify({dealerCode:F("dl").value,cars})});
  const j=await r.json();
  if(r.ok){ msg("Đã tạo "+j.doNo+" ("+j.cars+" xe)."); F("ctb").innerHTML="";addCar(); load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/deliveryorders?status=${F("fst").value}&dealer=${F("q").value}`,{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(o=>{
    let act=o.status==="Draft"?`<button class="sm" onclick="deliver('${o.doNo}')">Giao xe</button>`:"";
    return `<tr><td><b>${o.doNo}</b> <a href="#" class="cars" onclick="cars('${o.doNo}');return false">xem xe</a></td><td>${o.dealerCode}</td><td>${o.cars}</td>
      <td>${day(o.createdAt)}</td><td><span class="pill p-${o.status}">${LBL[o.status]||o.status}</span></td><td>${act}</td></tr><tr id="x-${o.doNo}"></tr>`;
  }).join("")||'<tr><td colspan="6" class="muted">Chưa có DO.</td></tr>';
}
async function deliver(no){ const r=await fetch(`/api/deliveryorders/${no}/deliver`,{method:"POST",headers:H()}); const j=await r.json(); if(r.ok) load(); else msg("Lỗi: "+(j.error||r.status)); }
async function cars(no){
  const row=F("x-"+no); if(row.innerHTML){ row.innerHTML=""; return; }
  const d=await (await fetch(`/api/deliveryorders/${no}/cars`,{headers:H()})).json();
  row.innerHTML=`<td colspan="6"><div class="cars">${(d.cars||[]).map(c=>`VIN <b>${c.vin}</b>${c.modelCode?" · "+c.modelCode:""}${c.storageCode?" · kho "+c.storageCode:""}`).join(" &nbsp;|&nbsp; ")||"—"}</div></td>`;
}
addCar(); load();
</script>
</body></html>
