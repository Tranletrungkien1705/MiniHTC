<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Kích hoạt lại xe</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#4f46e5;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:900px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px} h3{font-size:14px;margin:14px 0 4px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
  input,button,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)} th{opacity:.7;font-size:11px;text-transform:uppercase} .wrap{overflow-x:auto}
  .msg{font-size:13px;margin-left:6px} textarea{width:100%;min-height:56px}
</style></head>
<body>
<h1>Kích hoạt lại xe đã hủy <span class="muted">(port 1:1 FrmReactiveCar — TCMotor)</span></h1>
<p class="muted">Nhập danh sách xe (VIN) đã hủy để kích hoạt lại. Nếu xe có lệnh hủy đã duyệt, lệnh đó sẽ chuyển sang "Reactivated".</p>
<div class="card"><h3 style="margin-top:0">Kích hoạt lại</h3>
  <div class="row"><div style="flex:1"><label>Lý do</label><input id="reason" style="width:100%"></div></div>
  <p class="muted" style="margin:8px 0 2px">Xe (mỗi dòng: <b>VIN [tab] Model [tab] Màu</b>)</p>
  <textarea id="cars" placeholder="VIN00001&#9;CRETA&#9;WHITE"></textarea>
  <div class="row" style="margin-top:8px"><button class="primary" onclick="react()">Kích hoạt lại</button><span id="msg" class="msg"></span></div>
</div>
<div class="card"><div class="row"><input id="q" placeholder="VIN" style="width:200px"><button onclick="load()">Xem lịch sử</button><span id="kpi" class="muted"></span></div>
  <div class="wrap"><table><thead><tr><th>VIN</th><th>Model</th><th>Màu</th><th>Lý do</th><th>Bởi</th><th>Thời điểm</th></tr></thead>
  <tbody id="rows"><tr><td colspan="6" class="muted">Nhấn "Xem lịch sử".</td></tr></tbody></table></div>
</div>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id); const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;"); const dts=s=>s?String(s).substring(0,16).replace("T"," "):"";
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function Hh(x){ return Object.assign({"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY}, x||{}); }
function say(t){ F("msg").textContent=t; setTimeout(()=>{if(F("msg").textContent===t)F("msg").textContent="";},4000); }
async function react(){ await token();
  const cars=F("cars").value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const c=l.split(/\t/);return{VIN:(c[0]||"").trim(),ModelCode:(c[1]||"").trim(),ColorCode:(c[2]||"").trim()};});
  const r=await fetch("/api/carreactivations",{method:"POST",headers:Hh({"Content-Type":"application/json"}),body:JSON.stringify({Reason:F("reason").value,Cars:cars})});
  const d=await r.json(); if(!r.ok){ say("Lỗi: "+(d.error||r.status)); return; } say(`Đã kích hoạt lại ${d.reactivated} xe (đảo ${d.cancelReverted} lệnh hủy)`); F("cars").value=""; load();
}
async function load(){ await token();
  const r=await fetch("/api/carreactivations?vin="+encodeURIComponent(F("q").value),{headers:Hh()}); const d=await r.json();
  F("kpi").textContent=`${d.count} lượt kích hoạt lại`;
  F("rows").innerHTML=(d.items||[]).map(o=>`<tr><td><b>${esc(o.vin)}</b></td><td>${esc(o.modelCode)}</td><td>${esc(o.colorCode)}</td><td>${esc(o.reason)}</td><td>${esc(o.reactivatedBy)}</td><td>${dts(o.reactivatedAt)}</td></tr>`).join("")||'<tr><td colspan="6" class="muted">Chưa có lượt kích hoạt lại.</td></tr>';
}
</script>
</body></html>
