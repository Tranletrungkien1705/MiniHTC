<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Khóa đào tạo NVBH</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#4f46e5;--ok:#16a34a;--warn:#d97706}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1040px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px} h3{font-size:14px;margin:14px 0 4px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0} .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
  input,button,select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit} label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.link{border:none;background:none;color:var(--accent);padding:2px 6px}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px} th,td{text-align:left;padding:5px 7px;border-bottom:1px solid var(--line)} th{opacity:.7;font-size:10.5px;text-transform:uppercase} .wrap{overflow-x:auto}
  .msg{font-size:13px;margin-left:6px} .off{opacity:.5} .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px} .pill{font-size:11px;padding:1px 7px;border-radius:20px;border:1px solid var(--line)} .y{color:var(--ok);border-color:var(--ok)} .n{color:var(--warn);border-color:var(--warn)}
</style></head>
<body>
<h1>Khóa đào tạo nhân viên bán hàng <span class="muted">(port 1:1 FrmMst_TrainingCreate/Mng + FrmMst_TrainingDtl — 2010.HTC/Admin)</span></h1>
<div class="card"><h3 style="margin-top:0">Thêm / sửa khóa (theo mã khóa)</h3>
  <div class="grid4">
    <div><label>Mã khóa *</label><input id="code"></div>
    <div style="grid-column:span 2"><label>Tên khóa *</label><input id="name" style="width:100%"></div>
    <div><label>Phòng ban</label><input id="dept"></div>
    <div><label>Đại lý</label><input id="dealer"></div>
    <div><label>Mã giảng viên</label><input id="trcode"></div>
    <div><label>Tên giảng viên</label><input id="trname"></div>
    <div><label>Mô tả</label><input id="desc"></div>
  </div>
  <div class="row" style="margin-top:8px"><button class="primary" onclick="save()">Lưu khóa</button><button onclick="reset()">Mới</button><span id="msg" class="msg"></span></div>
</div>
<div class="row" style="margin:8px 0"><input id="q" placeholder="Mã / tên khóa / GV" style="width:220px"><label style="display:flex;align-items:center;gap:4px"><input type="checkbox" id="all" style="width:auto"> Cả đã tắt</label><button onclick="load()">Xem</button></div>
<div class="wrap"><table><thead><tr><th>Mã khóa</th><th>Tên khóa</th><th>Phòng</th><th>Đại lý</th><th>Giảng viên</th><th>TT</th><th></th></tr></thead><tbody id="tb"><tr><td colspan="7" class="muted">Nhấn "Xem".</td></tr></tbody></table></div>

<div id="pcard" class="card" style="display:none">
  <h3 style="margin-top:0">Danh sách tham gia — khóa <span id="pcode"></span></h3>
  <div class="row">
    <div><label>Mã NVBH *</label><input id="psm"></div>
    <div><label>Ngày tổ chức *</label><input id="pdate" type="date"></div>
    <div><label>Kết quả đầu vào</label><input id="pin"></div>
    <div><label>Kết quả đầu ra</label><input id="pout"></div>
    <button class="primary" onclick="addP()">Thêm</button><span id="pmsg" class="msg"></span>
  </div>
  <div class="wrap"><table><thead><tr><th>NVBH</th><th>Ngày</th><th>KQ vào</th><th>KQ ra</th><th></th></tr></thead><tbody id="pb"></tbody></table></div>
</div>
<script>
let TOKEN=null,CUR=null; const KEY="demo-htc"; const F=id=>document.getElementById(id); const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
const dshow=s=>s?String(s).slice(0,10):"";
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function Hh(x){ return Object.assign({"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY}, x||{}); }
function say(el,t){ F(el).textContent=t; setTimeout(()=>{if(F(el).textContent===t)F(el).textContent="";},3800); }
const v=id=>F(id).value||null;
function reset(){ ["code","name","dept","dealer","trcode","trname","desc"].forEach(i=>F(i).value=""); }
async function save(){ await token();
  const body={TrainingUserCode:F("code").value,TrainingName:F("name").value,Department:v("dept"),DealerCode:v("dealer"),TrainerCode:v("trcode"),TrainerName:v("trname"),Description:v("desc")};
  const r=await fetch("/api/trainingcourses",{method:"POST",headers:Hh({"Content-Type":"application/json"}),body:JSON.stringify(body)});
  const d=await r.json(); if(!r.ok){ say("msg","Lỗi: "+(d.error||r.status)); return; } say("msg","Đã lưu "+d.trainingUserCode); reset(); load();
}
function edit(o){ F("code").value=o.trainingUserCode; F("name").value=o.trainingName||""; F("dept").value=o.department||""; F("dealer").value=o.dealerCode||""; F("trcode").value=o.trainerCode||""; F("trname").value=o.trainerName||""; F("desc").value=o.description||""; window.scrollTo(0,0); }
async function toggle(id){ await token(); await fetch("/api/trainingcourses/"+id+"/toggle",{method:"POST",headers:Hh()}); load(); }
async function load(){ await token();
  const r=await fetch("/api/trainingcourses?all="+(F("all").checked)+"&q="+encodeURIComponent(F("q").value),{headers:Hh()}); const d=await r.json();
  F("tb").innerHTML=(d.items||[]).map(o=>`<tr class="${o.flagActive==='1'?'':'off'}"><td><b>${esc(o.trainingUserCode)}</b></td><td>${esc(o.trainingName)}</td><td>${esc(o.department)}</td><td>${esc(o.dealerCode)}</td><td>${esc(o.trainerName)}</td><td><span class="pill ${o.flagActive==='1'?'y':'n'}">${o.flagActive==='1'?'Bật':'Tắt'}</span></td><td><button class="link" onclick='edit(${JSON.stringify(o)})'>Sửa</button><button class="link" onclick="parts(${o.id},'${esc(o.trainingUserCode)}')">Tham gia</button><button class="link" onclick="toggle(${o.id})">Đổi</button></td></tr>`).join("")||'<tr><td colspan="7" class="muted">Chưa có khóa.</td></tr>';
}
async function parts(id,code){ CUR=id; await token(); F("pcard").style.display="block"; F("pcode").textContent=code; await loadP(); F("pcard").scrollIntoView(); }
async function loadP(){ const r=await fetch("/api/trainingcourses/"+CUR+"/participants",{headers:Hh()}); const d=await r.json();
  F("pb").innerHTML=(d.items||[]).map(o=>`<tr><td><b>${esc(o.sMHyundaiCode)}</b></td><td>${dshow(o.organizeDate)}</td><td>${esc(o.resultIn)}</td><td>${esc(o.resultOut)}</td><td><button class="link" onclick="delP(${o.id})">Xóa</button></td></tr>`).join("")||'<tr><td colspan="5" class="muted">Chưa có người tham gia.</td></tr>';
}
async function addP(){ await token();
  const body={SMHyundaiCode:F("psm").value,OrganizeDate:v("pdate"),ResultIn:v("pin"),ResultOut:v("pout")};
  const r=await fetch("/api/trainingcourses/"+CUR+"/participants",{method:"POST",headers:Hh({"Content-Type":"application/json"}),body:JSON.stringify(body)});
  const d=await r.json(); if(!r.ok){ say("pmsg","Lỗi: "+(d.error||r.status)); return; } say("pmsg","Đã thêm "+d.sMHyundaiCode); ["psm","pin","pout"].forEach(i=>F(i).value=""); loadP();
}
async function delP(pid){ await token(); await fetch("/api/trainingcourses/"+CUR+"/participants/"+pid,{method:"DELETE",headers:Hh()}); loadP(); }
</script>
</body></html>
