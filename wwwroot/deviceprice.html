<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Giá thiết bị</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1020px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .bar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;align-items:center}
  input,button{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} td.n,th.n{text-align:right;font-variant-numeric:tabular-nums} #msg{font-size:13px}
</style></head>
<body>
<h1>Giá thiết bị theo spec xe <span class="muted">(port 1:1 FrmMst_DevicePrice_Spec — Mst_DevicePrice_Spec)</span></h1>
<div class="bar">
  <input id="sc" placeholder="Mã spec *" style="width:100px"><input id="sd" placeholder="Mô tả spec" style="width:130px">
  <input id="dt" placeholder="Loại TB" style="width:80px"><input id="dc" placeholder="Mã TB *" style="width:90px"><input id="dn" placeholder="Tên thiết bị" style="width:140px">
  <input id="pr" type="number" placeholder="Giá" style="width:110px;text-align:right"><input id="vat" type="number" placeholder="VAT %" style="width:80px;text-align:right" value="10">
  <input id="ed" type="date" title="Ngày hiệu lực">
  <button class="primary" onclick="save()">Lưu giá</button><span id="msg"></span>
</div>
<div class="bar"><input id="qs" placeholder="Lọc spec" oninput="load()" style="width:110px"><input id="qd" placeholder="Lọc thiết bị" oninput="load()" style="width:110px"></div>
<table><thead><tr><th>Spec</th><th>Loại TB</th><th>Mã TB</th><th>Tên TB</th><th class="n">Giá</th><th class="n">VAT</th><th class="n">Giá gồm VAT</th><th>Hiệu lực</th></tr></thead>
<tbody id="rows"><tr><td colspan="8" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const n=x=>Number(x||0).toLocaleString("vi-VN");
const day=d=>d? new Date(d).toLocaleDateString("vi-VN"):"—";
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
async function save(){
  const b={specCode:F("sc").value,specDescription:F("sd").value,deviceTypeCode:F("dt").value,deviceCode:F("dc").value,deviceName:F("dn").value,price:Number(F("pr").value||0),vat:Number(F("vat").value||0),effectiveDate:F("ed").value||null};
  const r=await fetch("/api/deviceprices",{method:"POST",headers:H(),body:JSON.stringify(b)});
  const j=await r.json();
  if(r.ok){ msg("Đã lưu "+j.deviceCode+" (giá gồm VAT "+n(j.priceVAT)+")."); F("pr").value=""; load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/deviceprices?spec=${F("qs").value}&device=${encodeURIComponent(F("qd").value)}`,{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(x=>`<tr><td><b>${x.specCode}</b><div class="muted">${x.specDescription||""}</div></td><td>${x.deviceTypeCode||"—"}</td>
    <td>${x.deviceCode}</td><td>${x.deviceName||"—"}</td><td class="n">${n(x.price)}</td><td class="n">${x.vat}%</td>
    <td class="n"><b>${n(x.priceVAT)}</b></td><td>${day(x.effectiveDate)}</td></tr>`).join("")||'<tr><td colspan="8" class="muted">Chưa có giá thiết bị.</td></tr>';
}
load();
</script>
</body></html>
