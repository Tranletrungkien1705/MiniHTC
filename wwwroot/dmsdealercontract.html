<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Hợp đồng đại lý DMS40</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--warn:#d97706;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1040px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .p-NS{color:var(--warn)} .p-S{color:var(--ok)} .p-AJ{color:#2563eb} .p-C{color:#dc2626}
  .sg{font-size:11px;padding:1px 6px;border-radius:6px;border:1px solid var(--line)} .s-S{color:var(--ok)} .s-P{color:var(--warn)}
  #msg{font-size:13px}
</style></head>
<body>
<h1>Hợp đồng đại lý DMS40 (ký 2 bên) <span class="muted">(port 1:1 FrmDMS40_CT_DealerContractHTC_New — DmsDealerContract)</span></h1>
<div class="card">
  <b>Tạo hợp đồng</b>
  <div class="bar" style="margin:10px 0">
    <div><label>Số HĐ (tự sinh nếu trống)</label><input id="no" style="width:150px"></div>
    <div><label>Mã đại lý *</label><input id="dl" style="width:100px"></div>
    <div><label>Ngày HĐ *</label><input id="cd" type="date"></div>
    <span style="flex:1"></span><button class="primary" onclick="create()">Lưu HĐ</button><span id="msg"></span>
  </div>
</div>
<div class="card">
  <b>Chọn ngân hàng phát hành bảo lãnh MD (port 1:1 FrmDMS40_SelectedBankMD)</b>
  <div class="bar" style="margin:10px 0">
    <div><label>Số HĐ *</label><input id="bkNo" style="width:150px"></div>
    <div><label>Mã NH *</label><input id="bkCode" style="width:100px"></div>
    <label><input id="bkAdj" type="checkbox"> HĐ điều chỉnh</label>
    <button onclick="selectBank()">Chọn NH</button><span id="bkMsg"></span>
  </div>
</div>
<div class="bar" style="margin:10px 0"><select id="fst" onchange="load()"><option value="">Tất cả</option><option value="NS">Chưa ký</option><option value="S">Đã ký</option><option value="AJ">Đã điều chỉnh</option><option value="C">Đã hủy</option></select><input id="q" placeholder="Lọc đại lý" oninput="load()" style="width:110px"></div>
<table><thead><tr><th>Số HĐ</th><th>Đại lý</th><th>Ngày HĐ</th><th>Ký bên B (ĐL)</th><th>Ký bên A (HTC)</th><th>NH bảo lãnh MD</th><th>Trạng thái</th><th>Hành động</th></tr></thead>
<tbody id="rows"><tr><td colspan="8" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const day=d=>d? new Date(d).toLocaleDateString("vi-VN"):""; // DlrCtrStatus (TConst.DlrCtrStatus): NS/S/AJ/C — KHÁC DlrCtrStatus1 (P/A/C/F) của HĐ bán lẻ.
const LBL={NS:"Chưa ký",S:"Đã ký",AJ:"Đã điều chỉnh",C:"Đã hủy"};
// Bên B theo TConst.DlrSignStatus (N/P/C/A/A1/A2/F); bên A theo TConst.HTCSignStatus (thêm R).
const SG={N:"—",P:"Chờ",C:"Huỷ",A:"Đã duyệt",A1:"Duyệt C1",A2:"Duyệt C2",F:"Hoàn thành",R:"Từ chối"};
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
async function create(){
  const r=await fetch("/api/dmsdealercontracts",{method:"POST",headers:H(),body:JSON.stringify({dlrCtrNo:F("no").value,dealerCode:F("dl").value,contractDate:F("cd").value||null})});
  const j=await r.json();
  if(r.ok){ msg("Đã tạo "+j.dlrCtrNo); F("no").value=""; load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/dmsdealercontracts?status=${F("fst").value}&dealer=${F("q").value}`,{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(o=>{
    let act="";
    // Luồng nguồn: bên B duyệt P→"A"; bên A duyệt HAI CẤP P→"A1"→"A2" (hoặc từ chối "R").
    // Duyệt cấp 2 chỉ khi hợp đồng còn "NS", và sau đó nguồn VẪN giữ "NS" (không tự chuyển "S").
    if(o.dlrCtrStatus!=="C" && o.dlrCtrStatus!=="S"){
      if(o.dlrSignStatus==="P") act+=`<button class="sm" onclick="dlrAppr('${o.dlrCtrNo}')">ĐL duyệt</button> `;
      if(o.htcSignStatus==="P") act+=`<button class="sm" onclick="htcAppr('${o.dlrCtrNo}',1,false)">HTC duyệt C1</button> `;
      if(o.htcSignStatus==="A1") act+=`<button class="sm" onclick="htcAppr('${o.dlrCtrNo}',2,false)">HTC duyệt C2</button> `;
      if(o.htcSignStatus==="P"||o.htcSignStatus==="A1") act+=`<button class="sm" onclick="htcAppr('${o.dlrCtrNo}',0,true)">HTC từ chối</button> `;
      act+=`<button class="sm" onclick="cancel('${o.dlrCtrNo}')">Hủy</button> `;
      // Tạo bản điều chỉnh — HĐ gốc chỉ thành "AJ" khi đại lý duyệt bản điều chỉnh đó.
      if(!o.dlrCtrNoParent) act+=`<button class="sm" onclick="adjust('${o.dlrCtrNo}')">Điều chỉnh</button>`;
    }
    return `<tr><td><b>${o.dlrCtrNo}</b>${o.dlrCtrNoParent?`<div class="muted">ĐC của ${o.dlrCtrNoParent}</div>`:""}</td><td>${o.dealerCode}</td><td>${day(o.contractDate)}</td><td><span class="sg s-${o.dlrSignStatus}">${SG[o.dlrSignStatus]}</span></td><td><span class="sg s-${o.htcSignStatus}">${SG[o.htcSignStatus]}</span></td><td>${o.bankCodeMD||"—"}${o.flagDlrCtrAdjust==="1"?" (điều chỉnh)":""}</td><td><span class="pill p-${o.dlrCtrStatus}">${LBL[o.dlrCtrStatus]||o.dlrCtrStatus}</span></td><td>${act}</td></tr>`;
  }).join("")||'<tr><td colspan="8" class="muted">Chưa có hợp đồng.</td></tr>';
}
async function dlrAppr(no){ const r=await fetch(`/api/dmsdealercontracts/${no}/dlr-approve`,{method:"POST",headers:H()});
  const j=await r.json(); if(r.ok){ if(j.parentAdjusted) msg(`Đã duyệt. HĐ gốc ${j.parentAdjusted} chuyển sang Đã điều chỉnh (AJ).`); load(); } else msg("Lỗi: "+(j.error||r.status)); }
async function adjust(no){ if(!confirm("Tạo hợp đồng điều chỉnh từ "+no+"?")) return;
  const r=await fetch(`/api/dmsdealercontracts/${no}/adjust`,{method:"POST",headers:H()}); const j=await r.json();
  if(r.ok){ msg(`Đã tạo bản điều chỉnh ${j.dlrCtrNo}.`); load(); } else msg("Lỗi: "+(j.error||r.status)); }
async function htcAppr(no,level,reject){ const r=await fetch(`/api/dmsdealercontracts/${no}/htc-approve`,{method:"POST",headers:H({"Content-Type":"application/json"}),body:JSON.stringify({level,reject})});
  const j=await r.json(); if(r.ok) load(); else msg("Lỗi: "+(j.error||r.status)); }
async function cancel(no){ const r=await fetch(`/api/dmsdealercontracts/${no}/cancel`,{method:"POST",headers:H()}); const j=await r.json(); if(r.ok) load(); else msg("Lỗi: "+(j.error||r.status)); }
async function selectBank(){
  const no=F("bkNo").value.trim(); if(!no||!F("bkCode").value){ F("bkMsg").textContent="Cần Số HĐ + Mã NH"; return; }
  const r=await fetch(`/api/dmsdealercontracts/${no}/selectbankmd`,{method:"POST",headers:H(),body:JSON.stringify({bankCodeMD:F("bkCode").value,flagDlrCtrAdjust:F("bkAdj").checked?"1":"0"})});
  const j=await r.json();
  F("bkMsg").textContent=r.ok?"Đã chọn NH "+j.bankCodeMD:"Lỗi: "+(j.error||r.status);
  if(r.ok) load();
}
load();
</script>
</body></html>
