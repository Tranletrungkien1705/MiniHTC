<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — BH theo phụ tùng chính</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#4f46e5;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:900px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:10px 0}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)} th{opacity:.7;font-size:11px;text-transform:uppercase} td.num,th.num{text-align:right;font-variant-numeric:tabular-nums} tfoot td{font-weight:700;border-top:2px solid var(--line)} .wrap{overflow-x:auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:10px} .kpi{border:1px solid var(--line);border-radius:12px;padding:14px} .kpi b{font-size:22px;display:block} .kpi .lbl{font-size:12px;opacity:.7}
</style></head>
<body>
<h1>Báo cáo bảo hành theo phụ tùng chính <span class="muted">(port 1:1 FrmReportWarranty_MainPart — TCMotor/Warranty)</span></h1>
<p class="muted">Top phụ tùng xuất hiện trong đề nghị bảo hành: số ĐN + tổng tiền + số & tiền đã chấp thuận.</p>
<div class="row">
  <div><label>Từ ngày</label><input id="from" type="date"></div>
  <div><label>Đến ngày</label><input id="to" type="date"></div>
  <div><label>Top N</label><input id="top" type="number" value="30" style="width:80px"></div>
  <button class="primary" onclick="load()">Xem</button>
</div>
<div class="grid" id="kpis"></div>
<div class="wrap"><table><thead><tr><th>Mã PT</th><th class="num">Số ĐN</th><th class="num">Tổng tiền</th><th class="num">Đã duyệt</th><th class="num">Tiền đã duyệt</th></tr></thead>
<tbody id="rows"><tr><td colspan="5" class="muted">Nhấn "Xem".</td></tr></tbody></table></div>

<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const M=n=>Math.round(+n||0).toLocaleString("vi-VN"); const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY}; }
async function load(){ await token();
  const p=new URLSearchParams(); if(F("from").value)p.set("fromDate",F("from").value); if(F("to").value)p.set("toDate",F("to").value); p.set("top",+F("top").value||30);
  const r=await fetch("/api/report/warranty-by-part?"+p.toString(),{headers:H()}); const d=await r.json();
  F("kpis").innerHTML=`<div class="kpi"><b>${d.count}</b><span class="lbl">Số mã PT</span></div><div class="kpi"><b>${M(d.totalClaims)}</b><span class="lbl">Tổng ĐN có PT</span></div><div class="kpi"><b style="color:var(--ok)">${M(d.grandAmount)}</b><span class="lbl">Tổng tiền (top)</span></div>`;
  F("rows").innerHTML=(d.rows||[]).map(o=>`<tr><td><b>${esc(o.partCode)}</b></td><td class="num">${M(o.claims)}</td><td class="num">${M(o.totalAmount)}</td><td class="num" style="color:var(--ok)">${M(o.accepted)}</td><td class="num">${M(o.acceptedAmount)}</td></tr>`).join("")||'<tr><td colspan="5" class="muted">Không có dữ liệu.</td></tr>';
}
</script>
</body></html>
