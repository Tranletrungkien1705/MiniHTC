<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Chính sách bán hàng</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--warn:#d97706;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1040px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit;box-sizing:border-box}
  .grid input,.grid select{width:100%}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} td.num{text-align:right;font-variant-numeric:tabular-nums}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .p-1{color:var(--ok)} .p-0{color:#dc2626}
  #msg{font-size:13px} .cars{font-size:12px;opacity:.85} #dtbl td,#dtbl th{padding:4px 6px}
</style></head>
<body>
<h1>Chính sách bán hàng <span class="muted">(port 1:1 FrmMstPolicy_New — SPL_SalesPolicyMst)</span></h1>
<div class="card">
  <b>Tạo chính sách</b>
  <div class="grid" style="margin-top:10px">
    <div><label>Số hiệu văn bản *</label><input id="no"></div>
    <div><label>Loại chính sách</label><input id="tp"></div>
    <div><label>CS gốc</label><input id="rt"></div>
    <div><label>Hình thức hỗ trợ</label><input id="fb"></div>
    <div><label>Ngày áp dụng từ *</label><input id="sd" type="date"></div>
    <div><label>Ngày áp dụng đến *</label><input id="ed" type="date"></div>
    <div><label>Trạng thái</label><select id="fl"><option value="1">Hiệu lực</option><option value="0">Ngừng</option></select></div>
    <div><label>Ghi chú</label><input id="rm"></div>
  </div>
  <table id="dtbl" style="margin-top:12px"><thead><tr><th>Đại lý</th><th>Năm SX</th><th>Tiền hỗ trợ</th><th>Ghi chú</th><th></th></tr></thead><tbody id="dtb"></tbody></table>
  <div class="bar"><button class="sm" onclick="addLine()">+ Thêm dòng</button><span style="flex:1"></span><button class="primary" onclick="create()">Lưu CS</button><span id="msg"></span></div>
</div>
<div class="bar" style="margin:10px 0"><select id="fst" onchange="load()"><option value="">Tất cả</option><option value="1">Hiệu lực</option><option value="0">Ngừng</option></select><input id="q" placeholder="Lọc loại CS" oninput="load()" style="width:110px"></div>
<table><thead><tr><th>Mã CS</th><th>Số hiệu VB</th><th>Loại</th><th>Hỗ trợ</th><th>Áp dụng</th><th>Dòng</th><th class="num">Tổng hỗ trợ</th><th>TT</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="9" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const money=n=>(n||0).toLocaleString("vi-VN"); const day=d=>d? new Date(d).toLocaleDateString("vi-VN"):"";
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
function addLine(){ const tr=document.createElement("tr");
  tr.innerHTML=`<td><input class="dl" style="width:90px"></td><td><input class="yr" style="width:70px"></td><td><input class="am" type="number" style="width:110px"></td><td><input class="rm" style="width:110px"></td><td><button class="sm" onclick="this.closest('tr').remove()">×</button></td>`;
  F("dtb").appendChild(tr); }
async function create(){
  const details=[...F("dtb").querySelectorAll("tr")].map(tr=>({dealerCode:tr.querySelector(".dl").value,yearOfManufacture:tr.querySelector(".yr").value,amountSupport:parseFloat(tr.querySelector(".am").value)||0,remark:tr.querySelector(".rm").value})).filter(d=>d.dealerCode||d.amountSupport);
  const body={sPNo:F("no").value,sPSRType:F("tp").value,sPSRRoot:F("rt").value,formBusinessSupportCode:F("fb").value,startDate:F("sd").value||null,endDate:F("ed").value||null,flagMstValid:F("fl").value,remark:F("rm").value,details};
  const r=await fetch("/api/salespolicies",{method:"POST",headers:H(),body:JSON.stringify(body)});
  const j=await r.json();
  if(r.ok){ msg("Đã tạo "+j.sPSRCode+" ("+j.details+" dòng)."); F("dtb").innerHTML="";addLine(); F("no").value=""; load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/salespolicies?status=${F("fst").value}&type=${F("q").value}`,{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(o=>
    `<tr><td><b>${o.spsrCode}</b> <a href="#" class="cars" onclick="det('${o.spsrCode}');return false">xem</a></td><td>${o.spNo}</td><td>${o.spsrType||""}</td><td>${o.formBusinessSupportCode||""}</td><td>${day(o.startDate)}–${day(o.endDate)}</td><td>${o.lines}</td><td class="num">${money(o.totalSupport)}</td><td><span class="pill p-${o.flagMstValid}">${o.flagMstValid==="1"?"Hiệu lực":"Ngừng"}</span></td><td><button class="sm" onclick="toggle('${o.spsrCode}')">Đổi TT</button> <button class="sm" onclick="cancelPolicy('${o.spsrCode}')" style="color:#dc2626">Hủy</button></td></tr><tr id="x-${o.spsrCode}"></tr>`
  ).join("")||'<tr><td colspan="9" class="muted">Chưa có chính sách.</td></tr>';
}
async function toggle(c){ const r=await fetch(`/api/salespolicies/${c}/toggle`,{method:"POST",headers:H()}); const j=await r.json(); if(r.ok) load(); else msg("Lỗi: "+(j.error||r.status)); }
async function cancelPolicy(c){
  const r=await fetch("/api/salespolicies/cancel-batch",{method:"POST",headers:H(),body:JSON.stringify({sPSRCodes:[c]})});
  const j=await r.json(); msg((j.deleted||[]).length?"Đã hủy "+c+".":"Lỗi: "+(j.error||r.status)); load();
}
async function det(c){
  const row=F("x-"+c); if(row.innerHTML){ row.innerHTML=""; return; }
  const d=await (await fetch(`/api/salespolicies/${c}/details`,{headers:H()})).json();
  row.innerHTML=`<td colspan="9"><div class="cars">${(d.lines||[]).map(l=>`ĐL <b>${l.dealerCode||"—"}</b>${l.yearOfManufacture?" · "+l.yearOfManufacture:""} · HT ${money(l.amountSupport)}${l.remark?" · "+l.remark:""}`).join(" &nbsp;|&nbsp; ")||"—"}</div></td>`;
}
addLine(); load();
</script>
</body></html>
