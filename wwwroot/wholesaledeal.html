<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Bán buôn xe ĐL→ĐL</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1000px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  button.ok{color:#fff;background:var(--ok);border-color:var(--ok)} button.bad{color:#fff;background:var(--bad);border-color:var(--bad)}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} td.num{text-align:right;font-variant-numeric:tabular-nums} .wrap{overflow-x:auto}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .s-Draft{color:var(--warn)} .s-Confirmed{color:var(--ok)} .s-Cancelled{color:var(--bad)}
  #msg{font-size:13px} .carrow input{width:110px}
</style></head>
<body>
<h1>Giao dịch bán buôn xe ĐL→ĐL <span class="muted">(port 1:1 FrmNewDealToDealer — SalesDealer)</span></h1>
<div class="card">
  <b>Tạo giao dịch (header + xe)</b>
  <div class="bar" style="margin-top:10px"><div><label>Số GD người dùng *</label><input id="du" style="width:130px"></div><div><label>Đại lý mua *</label><input id="bd" style="width:100px"></div><div><label>Mã NVBH</label><input id="sm" style="width:90px"></div></div>
  <table style="margin-top:10px"><thead><tr><th>VIN</th><th>Model</th><th class="num">Đơn giá</th><th></th></tr></thead><tbody id="carRows"></tbody></table>
  <div class="bar" style="margin-top:8px"><button class="sm" onclick="addRow()">+ Thêm xe</button><button class="primary" onclick="save()">Tạo giao dịch</button><span id="msg"></span></div>
</div>
<div class="bar" style="margin:10px 0">
  <input id="qb" placeholder="Lọc ĐL mua" oninput="load()" style="width:100px">
  <input id="qn" placeholder="Lọc số GD" oninput="load()" style="width:120px">
  <select id="qs" onchange="load()"><option value="">Mọi trạng thái</option><option value="Draft">Nháp</option><option value="Confirmed">Đã xác nhận</option><option value="Cancelled">Đã hủy</option></select>
</div>
<div class="wrap"><table><thead><tr><th>Số GD</th><th>Số GD user</th><th>ĐL mua</th><th>NVBH</th><th class="num">Tổng tiền</th><th class="num">Số xe</th><th>Trạng thái</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="8" class="muted">Đang tải…</td></tr></tbody></table></div>
<div class="card" id="detCard" style="display:none">
  <b>Chi tiết xe — <span id="detNo"></span></b>
  <div class="wrap"><table><thead><tr><th>VIN</th><th>Model</th><th class="num">Đơn giá</th></tr></thead><tbody id="detRows"></tbody></table></div>
</div>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const ST={Draft:"Nháp",Confirmed:"Đã xác nhận",Cancelled:"Đã hủy"};
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
function money(n){ return (n||0).toLocaleString("vi-VN"); }
function addRow(){ const tr=document.createElement("tr"); tr.className="carrow";
  tr.innerHTML=`<td><input class="c-vin"></td><td><input class="c-md"></td><td class="num"><input class="c-up" type="number"></td><td><button class="sm" onclick="this.closest('tr').remove()">×</button></td>`;
  F("carRows").appendChild(tr); }
function collect(){ return [...document.querySelectorAll("#carRows tr")].map(tr=>({
  vin:tr.querySelector(".c-vin").value, modelCode:tr.querySelector(".c-md").value, unitPrice:+tr.querySelector(".c-up").value||0})).filter(c=>c.vin.trim()); }
async function save(){
  const b={dealNoUser:F("du").value,buyerDealerCode:F("bd").value,salesManCode:F("sm").value,cars:collect()};
  const r=await fetch("/api/wholesaledeals",{method:"POST",headers:H(),body:JSON.stringify(b)});
  const j=await r.json();
  if(r.ok){ msg(`Đã tạo ${j.dealNo} (${j.cars} xe, tổng ${money(j.totalAmount)})`); F("carRows").innerHTML=""; addRow(); load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/wholesaledeals?buyer=${F("qb").value}&no=${F("qn").value}&status=${F("qs").value}`,{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(o=>{
    const act=o.status==="Draft"?`<button class="sm ok" onclick="decide('${o.dealNo}','confirm')">Xác nhận</button> <button class="sm bad" onclick="decide('${o.dealNo}','cancel')">Hủy</button>`:"";
    return `<tr onclick="detail('${o.dealNo}')"><td><b>${o.dealNo}</b></td><td>${o.dealNoUser}</td><td>${o.buyerDealerCode}</td><td>${o.salesManCode||""}</td><td class="num">${money(o.totalAmount)}</td><td class="num">${o.cars}</td><td><span class="pill s-${o.status}">${ST[o.status]||o.status}</span></td><td onclick="event.stopPropagation()">${act}</td></tr>`;
  }).join("")||'<tr><td colspan="8" class="muted">Chưa có giao dịch.</td></tr>';
}
async function detail(no){
  const d=await (await fetch(`/api/wholesaledeals/${no}/cars`,{headers:H()})).json();
  F("detCard").style.display=""; F("detNo").textContent=no;
  F("detRows").innerHTML=(d.cars||[]).map(c=>`<tr><td><b>${c.vin}</b></td><td>${c.modelCode||""}</td><td class="num">${money(c.unitPrice)}</td></tr>`).join("")||'<tr><td colspan="3" class="muted">Không có xe.</td></tr>';
}
async function decide(no,act){
  const r=await fetch(`/api/wholesaledeals/${no}/${act}`,{method:"POST",headers:H()});
  const j=await r.json(); if(r.ok){ msg(`${no}: ${ST[j.status]||j.status}`); load(); } else msg("Lỗi: "+(j.error||r.status));
}
addRow(); load();
</script>
</body></html>
