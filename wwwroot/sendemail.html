<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Gửi email</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#4f46e5;--ok:#16a34a;--bad:#dc2626;--warn:#d97706}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1000px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px} h3{font-size:14px;margin:16px 0 4px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.link{border:none;background:none;color:var(--accent);padding:2px 6px}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)} th{opacity:.7;font-size:11px;text-transform:uppercase} .wrap{overflow-x:auto}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .s-Sent{color:var(--ok)} .s-Invalid{color:var(--bad)}
  .msg{font-size:13px;margin-left:6px} textarea{width:100%;min-height:60px}
  .tabs{display:flex;gap:6px;margin:10px 0} .tab{padding:6px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer} .tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .cb{display:flex;align-items:center;gap:6px} .cb input{width:auto}
</style></head>
<body>
<h1>Gửi email khách hàng dịch vụ <span class="muted">(port 1:1 FrmSendEmail + FrmAutoSendConfig — TCMotor)</span></h1>
<div class="tabs"><div class="tab on" id="t1" onclick="tab(1)">Gửi email</div><div class="tab" id="t2" onclick="tab(2)">Cấu hình tự động</div></div>

<div id="pane1">
<div class="card"><h3 style="margin-top:0">Soạn & gửi</h3>
  <div class="row">
    <div><label>Loại (mẫu email — để trống nếu nhập tay)</label><input id="fType" style="width:160px" placeholder="MAINT"></div>
    <div style="flex:1"><label>Tiêu đề</label><input id="fSubject" style="width:100%"></div>
  </div>
  <div style="margin-top:8px"><label>Nội dung</label><textarea id="fBody"></textarea></div>
  <div style="margin-top:8px"><label>Người nhận (mỗi email 1 dòng)</label><textarea id="fEmails" placeholder="a@x.com&#10;b@y.com"></textarea></div>
  <div class="row" style="margin-top:8px">
    <label class="cb"><input type="checkbox" id="fAll"> Gửi tất cả KH có email</label>
    <button class="primary" onclick="send()">Gửi</button><span id="msg" class="msg"></span>
  </div>
</div>
<div class="row" style="margin:8px 0"><button onclick="loadLog()">Xem log gửi</button></div>
<div class="wrap"><table><thead><tr><th>Lô</th><th>Email</th><th>Loại</th><th>Tiêu đề</th><th>Trạng thái</th><th>Thời gian</th></tr></thead>
<tbody id="logRows"><tr><td colspan="6" class="muted">Nhấn "Xem log gửi".</td></tr></tbody></table></div>
</div>

<div id="pane2" style="display:none">
<div class="card"><h3 style="margin-top:0">Cấu hình gửi tự động</h3>
  <div class="row">
    <div><label>Loại email *</label><input id="cType" style="width:140px" placeholder="MAINT"></div>
    <div><label>Giờ gửi (HH:mm) *</label><input id="cTime" style="width:100px" placeholder="08:00"></div>
    <div><label>Từ ngày</label><input id="cStart" type="date"></div>
    <div><label>Đến ngày</label><input id="cEnd" type="date"></div>
    <div><label>Chế độ</label><input id="cMode" style="width:120px" placeholder="Daily"></div>
  </div>
  <div style="margin-top:8px"><label>Mô tả</label><input id="cDesc" style="width:100%"></div>
  <div class="row" style="margin-top:8px"><button class="primary" onclick="saveCfg()">Lưu cấu hình</button><span id="msg2" class="msg"></span></div>
</div>
<div class="row" style="margin:8px 0"><button onclick="loadCfg()">Xem cấu hình</button></div>
<div class="wrap"><table><thead><tr><th>Loại</th><th>Giờ</th><th>Từ</th><th>Đến</th><th>Chế độ</th><th>Mô tả</th><th>TT</th><th></th></tr></thead>
<tbody id="cfgRows"><tr><td colspan="8" class="muted">Nhấn "Xem cấu hình".</td></tr></tbody></table></div>
</div>

<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;"); const D=s=>s?String(s).substring(0,10):"";
const ST={Sent:"Đã gửi",Invalid:"Sai email"};
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(extra){ return Object.assign({"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY}, extra||{}); }
function m(id,t){ F(id).textContent=t; setTimeout(()=>{if(F(id).textContent===t)F(id).textContent="";},3500); }
function tab(n){ F("pane1").style.display=n===1?"block":"none"; F("pane2").style.display=n===2?"block":"none"; F("t1").className="tab"+(n===1?" on":""); F("t2").className="tab"+(n===2?" on":""); }
async function send(){ await token();
  const emails=F("fEmails").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const body={EmailType:F("fType").value||null,Subject:F("fSubject").value,Body:F("fBody").value,Emails:emails,ToAllCustomers:F("fAll").checked};
  const r=await fetch("/api/emailsends",{method:"POST",headers:H({"Content-Type":"application/json"}),body:JSON.stringify(body)});
  const d=await r.json(); if(!r.ok){ m("msg","Lỗi: "+(d.error||r.status)); return; }
  m("msg",`Lô ${d.batchNo}: gửi ${d.sent}, sai ${d.invalid}`); loadLog();
}
async function loadLog(){ await token();
  const r=await fetch("/api/emailsends",{headers:H()}); const d=await r.json();
  F("logRows").innerHTML=(d.items||[]).map(o=>`<tr><td>${esc(o.batchNo)}</td><td>${esc(o.email)}</td><td>${esc(o.emailType)}</td><td>${esc(o.subject)}</td><td><span class="pill s-${o.status}">${ST[o.status]||o.status}</span></td><td>${esc(o.sendDate)}</td></tr>`).join("")||'<tr><td colspan="6" class="muted">Chưa có log.</td></tr>';
}
async function saveCfg(){ await token();
  const body={EmailType:F("cType").value,AutoTime:F("cTime").value,StartDate:F("cStart").value||null,EndDate:F("cEnd").value||null,SendMode:F("cMode").value,Description:F("cDesc").value};
  const r=await fetch("/api/emailautoconfigs",{method:"POST",headers:H({"Content-Type":"application/json"}),body:JSON.stringify(body)});
  const d=await r.json(); if(!r.ok){ m("msg2","Lỗi: "+(d.error||r.status)); return; }
  m("msg2","Đã lưu "+d.emailType+" @ "+d.autoTime); loadCfg();
}
async function toggleCfg(id){ await token();
  await fetch("/api/emailautoconfigs/"+id+"/toggle",{method:"POST",headers:H()}); loadCfg();
}
async function loadCfg(){ await token();
  const r=await fetch("/api/emailautoconfigs",{headers:H()}); const d=await r.json();
  F("cfgRows").innerHTML=(d.items||[]).map(o=>`<tr><td><b>${esc(o.emailType)}</b></td><td>${esc(o.autoTime)}</td><td>${D(o.startDate)}</td><td>${D(o.endDate)}</td><td>${esc(o.sendMode)}</td><td>${esc(o.description)}</td><td>${o.flagActive==="1"?"Bật":"Tắt"}</td><td><button class="link" onclick="toggleCfg(${o.id})">Đổi</button></td></tr>`).join("")||'<tr><td colspan="8" class="muted">Chưa có cấu hình.</td></tr>';
}
</script>
</body></html>
