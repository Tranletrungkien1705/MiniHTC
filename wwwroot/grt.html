<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Bảo lãnh / LC</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1000px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
  .p-Pending{color:var(--warn)} .p-Approved{color:var(--ok)} .exp{color:var(--bad);font-weight:600}
  #msg{font-size:13px}
</style></head>
<body>
<h1>Bảo lãnh / Thư tín dụng ngân hàng <span class="muted">(port 1:1 FrmNewGrt / FrmMngGrt — Guarantee)</span></h1>
<div class="card">
  <b>Tạo bảo lãnh mới</b>
  <div class="bar" style="margin:10px 0">
    <input id="bank" placeholder="Ngân hàng *" style="width:120px">
    <input id="bgno" placeholder="Số BL của NH" style="width:130px">
    <select id="type"><option value="BL">BL — Bảo lãnh</option><option value="LCTC">LCTC — LC trả chậm</option><option value="LCUP">LCUP — LC Upas</option><option value="EPLC">EPLC</option></select>
    <input id="val" type="number" placeholder="Giá trị *" style="width:120px;text-align:right">
    <input id="exp" type="date" title="Ngày hết hạn">
    <span style="flex:1"></span><button class="primary" onclick="create()">Tạo</button><span id="msg"></span>
  </div>
</div>
<div class="bar" style="margin:10px 0">
  <select id="fst" onchange="load()"><option value="">Tất cả trạng thái</option><option value="Pending">Mới tạo</option><option value="Approved">Đã duyệt</option></select>
  <select id="fty" onchange="load()"><option value="">Tất cả loại</option><option value="BL">BL</option><option value="LCTC">LCTC</option><option value="LCUP">LCUP</option><option value="EPLC">EPLC</option></select>
  <span style="flex:1"></span><span class="muted">Tổng giá trị: <b id="tv" class="n">0</b></span>
</div>
<table><thead><tr><th>Số BL</th><th>NH</th><th>Loại</th><th class="n">Giá trị</th><th>Hết hạn</th><th>Trạng thái</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="7" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const LBL={Pending:"Mới tạo",Approved:"Đã duyệt"};
const n=x=>Number(x||0).toLocaleString("vi-VN");
const day=d=>d? new Date(d).toLocaleDateString("vi-VN"):"—";
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
async function create(){
  const r=await fetch("/api/grts",{method:"POST",headers:H(),body:JSON.stringify({bankCode:F("bank").value,bankGrtNo:F("bgno").value,grtType:F("type").value,grtValue:Number(F("val").value||0),dateExpired:F("exp").value||null})});
  const j=await r.json();
  if(r.ok){ msg("Đã tạo "+j.grtNo+"."); F("val").value="";F("bgno").value=""; load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/grts?status=${F("fst").value}&type=${F("fty").value}`,{headers:H()})).json();
  F("tv").textContent=n(d.totalValue);
  F("rows").innerHTML=(d.items||[]).map(g=>{
    let act=g.status==="Pending"?`<button class="sm" onclick="approve('${g.grtNo}')">Duyệt</button> `:"";
    act+=`<button class="sm" onclick="editExp('${g.grtNo}')">Sửa HH</button>`;
    return `<tr><td><b>${g.grtNo}</b>${g.bankGrtNo?` <span class="muted">(${g.bankGrtNo})</span>`:""}</td>
      <td>${g.bankCode}</td><td>${g.grtType}</td><td class="n">${n(g.grtValue)}</td>
      <td class="${g.expired?'exp':''}">${day(g.dateExpired)}${g.expired?" ⚠":""}</td>
      <td><span class="pill p-${g.status}">${LBL[g.status]||g.status}</span></td><td>${act}</td></tr>`;
  }).join("")||'<tr><td colspan="7" class="muted">Chưa có bảo lãnh.</td></tr>';
}
async function approve(no){ const r=await fetch(`/api/grts/${no}/approve`,{method:"POST",headers:H()}); const j=await r.json(); if(r.ok) load(); else msg("Lỗi: "+(j.error||r.status)); }
async function editExp(no){
  const v=prompt("Ngày hết hạn mới (YYYY-MM-DD):"); if(!v) return;
  const r=await fetch(`/api/grts/${no}/expiry`,{method:"POST",headers:H(),body:JSON.stringify({dateExpired:v})});
  const j=await r.json(); if(r.ok) load(); else msg("Lỗi: "+(j.error||r.status));
}
load();
</script>
</body></html>
