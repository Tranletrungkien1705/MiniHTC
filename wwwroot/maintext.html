<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Kho BD gia hạn</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--warn:#d97706;--prog:#7c3aed;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1000px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .bar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;align-items:center}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
  .s-NG{color:var(--warn)} .s-IN{color:var(--prog)} .s-OUT{color:var(--ok)}
  .kpi{display:inline-block;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-right:8px} #msg{font-size:13px}
</style></head>
<body>
<h1>Xe kho bảo dưỡng gia hạn <span class="muted">(port 1:1 FrmMaintenanceWarehouse — StoF_MaintainMain)</span></h1>
<div class="bar">
  <input id="vin" placeholder="VIN *" style="width:130px"><input id="md" placeholder="Model" style="width:90px"><input id="st" placeholder="Kho" style="width:90px">
  <input id="rm" placeholder="Ghi chú" style="width:160px">
  <button class="primary" onclick="save()">Đăng ký xe</button><span id="msg"></span>
</div>
<div class="bar">
  <span class="kpi">Tổng: <b id="kt">0</b></span><span class="kpi">Đang BD: <b id="ki">0</b></span><span class="kpi">Đã xong: <b id="kd">0</b></span>
  <span style="flex:1"></span>
  <select id="fst" onchange="load()"><option value="">Tất cả</option><option value="NG">Chưa BD</option><option value="IN">Đang BD gia hạn</option><option value="OUT">Đã xong</option></select>
</div>
<table><thead><tr><th>VIN</th><th>Model</th><th>Kho</th><th>Vào BD</th><th>Ra BD</th><th>Trạng thái</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="7" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const ST={NG:"Chưa BD",IN:"Đang BD gia hạn",OUT:"Đã xong"};
const dt=d=>d? new Date(d).toLocaleString("vi-VN"):"—";
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
async function save(){
  const r=await fetch("/api/maintext",{method:"POST",headers:H(),body:JSON.stringify({vin:F("vin").value,modelCode:F("md").value,storageCode:F("st").value,mtnExtRemark:F("rm").value})});
  const j=await r.json();
  if(r.ok){ msg("Đã đăng ký "+j.vin+"."); F("vin").value="";F("rm").value=""; load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch("/api/maintext?status="+F("fst").value,{headers:H()})).json();
  F("kt").textContent=d.count; F("ki").textContent=d.inProgress; F("kd").textContent=d.done;
  F("rows").innerHTML=(d.items||[]).map(m=>{
    let act="";
    if(m.mtnExtStatusMain==="NG"||m.mtnExtStatusMain==="OUT") act=`<button class="sm" onclick="act('${m.vin}','in')">Vào BD</button>`;
    else if(m.mtnExtStatusMain==="IN") act=`<button class="sm" onclick="act('${m.vin}','out')">Ra BD</button>`;
    return `<tr><td><b>${m.vin}</b></td><td>${m.modelCode||"—"}</td><td>${m.storageCode||"—"}</td>
      <td>${dt(m.mtnExtStartDTime)}</td><td>${dt(m.mtnExtEndDTime)}</td>
      <td><span class="pill s-${m.mtnExtStatusMain}">${ST[m.mtnExtStatusMain]||m.mtnExtStatusMain}</span></td><td>${act}</td></tr>`;
  }).join("")||'<tr><td colspan="7" class="muted">Chưa có xe.</td></tr>';
}
async function act(vin,a){ const r=await fetch(`/api/maintext/${vin}/${a}`,{method:"POST",headers:H()}); const j=await r.json(); if(r.ok) load(); else msg("Lỗi: "+(j.error||r.status)); }
load();
</script>
</body></html>
