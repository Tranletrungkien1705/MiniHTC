<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Bảng giá xe</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:960px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .bar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;align-items:center}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:14px} th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:12px;text-transform:uppercase} td.n{text-align:right;font-variant-numeric:tabular-nums}
  .act{color:var(--accent);cursor:pointer} .err{color:#dc2626} .ok{color:#16a34a} #msg{font-size:13px}
</style></head>
<body>
<h1>Bảng giá xe <span class="muted">(port 1:1 FrmCarPrice — Mst_CarPrice)</span></h1>
<div class="bar">
  <input id="m" placeholder="Model *" style="width:110px"><input id="sp" placeholder="Spec" style="width:90px"><input id="cl" placeholder="Màu" style="width:90px">
  <input id="pr" placeholder="Giá (VND)" style="width:140px"><input id="vt" placeholder="VAT %" value="10" style="width:70px">
  <button class="primary" onclick="save()">Lưu</button>
  <span style="flex:1"></span><input id="q" placeholder="Lọc model" oninput="load()" style="width:120px"><span id="msg"></span>
</div>
<table><thead><tr><th>Model</th><th>Spec</th><th>Màu</th><th class="n">Giá</th><th class="n">VAT</th><th class="n">Giá gồm VAT</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="7" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t,ok){ F("msg").textContent=t; F("msg").className=ok?"ok":"err"; }
const fmt=n=>Number(n).toLocaleString('vi-VN');
async function load(){ await token();
  const d=await (await fetch("/api/carprices?model="+encodeURIComponent(F("q").value),{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(x=>`<tr>
    <td><b>${x.modelCode}</b></td><td>${x.specCode||""}</td><td>${x.colorCode||""}</td>
    <td class="n">${fmt(x.price)}</td><td class="n">${x.vat}%</td><td class="n">${fmt(Math.round(x.priceVat))}</td>
    <td><span class="act err" onclick="del(${x.id})">Xoá</span></td></tr>`).join("")
    || '<tr><td colspan="7" class="muted">Chưa có giá.</td></tr>';
}
async function save(){
  const body=JSON.stringify({modelCode:F("m").value,specCode:F("sp").value,colorCode:F("cl").value,price:Number(F("pr").value||0),vat:Number(F("vt").value||10)});
  const r=await fetch("/api/carprices",{method:"POST",headers:H(),body});
  if(r.ok){ msg("Đã lưu.",true); F("pr").value=""; load(); } else msg("Lỗi: "+((await r.json()).error||r.status),false);
}
async function del(id){ if(!confirm("Xoá dòng giá?"))return;
  const r=await fetch("/api/carprices/"+id,{method:"DELETE",headers:H()});
  if(r.ok){ msg("Đã xoá.",true); load(); } else msg("Không xoá được.",false); }
load();
</script>
</body></html>
