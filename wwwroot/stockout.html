<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Xuất kho PT</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--warn:#d97706;--ok:#16a34a;--bad:#dc2626}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1020px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .p-Draft{color:var(--warn)} .p-Posted{color:var(--ok)} .p-Rejected{opacity:.6}
  #msg{font-size:13px} .det{font-size:12px;opacity:.85}
</style></head>
<body>
<h1>Xuất kho phụ tùng <span class="muted">(port 1:1 FrmStockOutCreate — Ser_Inv_StockOut, TRỪ tồn PartStock)</span></h1>
<div class="muted">Tồn kho quản lý ở trang <a href="stockin.html">stockin.html</a> (tab Tồn kho). Xuất kho sẽ trừ tồn, guard tồn không đủ.</div>
<div class="card">
  <b>Tạo phiếu xuất</b>
  <div class="bar" style="margin:10px 0"><input id="wh" placeholder="Kho *" style="width:100px"><input id="ty" placeholder="Loại xuất" style="width:110px"><input id="rs" placeholder="Lý do" style="width:150px">
    <span style="flex:1"></span><button class="primary" onclick="create()">Lưu phiếu</button><span id="msg"></span></div>
  <table id="ltbl"><thead><tr><th>Mã PT</th><th>Vị trí</th><th class="n">SL xuất</th><th></th></tr></thead><tbody id="ltb"></tbody></table>
  <button class="sm" style="margin-top:6px" onclick="addLine()">+ Dòng PT</button>
</div>
<div class="bar" style="margin:10px 0"><select id="fst" onchange="load()"><option value="">Tất cả</option><option value="Draft">Nháp</option><option value="Posted">Đã ghi sổ</option></select><input id="q" placeholder="Lọc kho" oninput="load()" style="width:100px"></div>
<table><thead><tr><th>Số phiếu</th><th>Kho</th><th>Lý do</th><th>Dòng</th><th>Trạng thái</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="6" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const LBL={Draft:"Nháp",Posted:"Đã ghi sổ",Rejected:"Đã hủy"}; const n=x=>Number(x||0).toLocaleString("vi-VN");
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
function addLine(){ const tr=document.createElement("tr");
  tr.innerHTML=`<td><input class="pc" style="width:100px"></td><td><input class="lo" style="width:80px"></td><td class="n"><input class="qt" type="number" value="1" style="width:70px;text-align:right"></td><td><button class="sm" onclick="this.closest('tr').remove()">×</button></td>`;
  F("ltb").appendChild(tr); }
async function create(){
  const lines=[...F("ltb").querySelectorAll("tr")].map(tr=>({partCode:tr.querySelector(".pc").value,location:tr.querySelector(".lo").value,quantity:Number(tr.querySelector(".qt").value||0)})).filter(l=>l.partCode&&l.quantity>0);
  const r=await fetch("/api/stockouts",{method:"POST",headers:H(),body:JSON.stringify({warehouseCode:F("wh").value,stockOutType:F("ty").value,reason:F("rs").value,lines})});
  const j=await r.json();
  if(r.ok){ msg("Đã tạo "+j.stockOutNo+" ("+j.lines+" dòng)."); F("ltb").innerHTML="";addLine(); load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/stockouts?status=${F("fst").value}&warehouse=${F("q").value}`,{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(s=>{
    let act=s.status==="Draft"?`<button class="sm" onclick="post('${s.stockOutNo}')">Ghi sổ (trừ tồn)</button> <button class="sm" onclick="reject('${s.stockOutNo}')">Hủy</button>`:"";
    return `<tr><td><b>${s.stockOutNo}</b> <a href="#" class="det" onclick="lines('${s.stockOutNo}');return false">xem</a></td><td>${s.warehouseCode}</td><td class="muted">${s.reason||"—"}</td><td>${s.lines}</td>
      <td><span class="pill p-${s.status}">${LBL[s.status]||s.status}</span></td><td>${act}</td></tr><tr id="x-${s.stockOutNo}"></tr>`;
  }).join("")||'<tr><td colspan="6" class="muted">Chưa có phiếu.</td></tr>';
}
async function post(no){ const r=await fetch(`/api/stockouts/${no}/post`,{method:"POST",headers:H()}); const j=await r.json(); if(r.ok){ msg("Đã ghi sổ, trừ tồn "+j.postedLines+" PT."); load(); } else msg("Lỗi: "+(j.error||r.status)); }
async function reject(no){ const rs=prompt("Lý do hủy phiếu xuất:",""); if(rs===null) return;
  const r=await fetch(`/api/stockouts/${no}/reject`,{method:"POST",headers:H(),body:JSON.stringify({reason:rs})});
  const j=await r.json(); if(r.ok){ msg("Đã hủy "+j.stockOutNo); load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function lines(no){
  const row=F("x-"+no); if(row.innerHTML){ row.innerHTML=""; return; }
  const d=await (await fetch(`/api/stockouts/${no}/lines`,{headers:H()})).json();
  row.innerHTML=`<td colspan="6"><div class="det">${(d.lines||[]).map(l=>`${l.partCode}@${l.location||"—"} ×${l.quantity}`).join(" &nbsp;|&nbsp; ")||"—"}</div></td>`;
}
addLine(); load();
</script>
</body></html>
