<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Hợp đồng đại lý</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--warn:#d97706;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1020px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} td.num{text-align:right;font-variant-numeric:tabular-nums}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .p-P{color:var(--warn)} .p-A{color:var(--ok)} .p-R{color:#dc2626} .p-C{color:#64748b} .p-F{color:#2563eb}
  #msg{font-size:13px} .cars{font-size:12px;opacity:.85} #ctbl td,#ctbl th{padding:4px 6px}
</style></head>
<body>
<h1>Hợp đồng đại lý <span class="muted">(port 1:1 FrmNewDC — DealerContract)</span></h1>
<div class="card">
  <b>Tạo hợp đồng đại lý</b>
  <div class="bar" style="margin:10px 0">
    <div><label>Số HĐ (tự sinh nếu trống)</label><input id="no" style="width:130px"></div>
    <div><label>Số HĐ user</label><input id="nu" style="width:110px"></div>
    <div><label>Mã đại lý *</label><input id="dl" style="width:100px"></div>
    <div><label>Ngày HĐ</label><input id="cd" type="date"></div>
    <span style="flex:1"></span><button class="primary" onclick="create()">Lưu HĐ</button><span id="msg"></span>
  </div>
  <table id="ctbl"><thead><tr><th>Xe/CarID *</th><th>Đơn giá</th><th></th></tr></thead><tbody id="ctb"></tbody></table>
  <button class="sm" style="margin-top:6px" onclick="addCar()">+ Thêm xe</button>
</div>
<div class="bar" style="margin:10px 0"><select id="fst" onchange="load()"><option value="">Tất cả</option><option value="P">Chờ duyệt</option><option value="A">Đã duyệt</option><option value="R">Từ chối</option><option value="C">Đã huỷ</option><option value="F">Hoàn thành</option></select><input id="q" placeholder="Lọc đại lý" oninput="load()" style="width:110px"></div>
<table><thead><tr><th>Số HĐ</th><th>HĐ user</th><th>Đại lý</th><th>Số xe</th><th class="num">Tổng tiền</th><th>Ngày tạo</th><th>TT</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="8" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const money=n=>(n||0).toLocaleString("vi-VN"); const day=d=>d? new Date(d).toLocaleString("vi-VN"):""; // Mã TConst.Stage cho CT_DealerContract.ContractStatus
const LBL={P:"Chờ duyệt",A:"Đã duyệt",R:"Từ chối",C:"Đã huỷ",F:"Hoàn thành"};
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
function addCar(){ const tr=document.createElement("tr");
  tr.innerHTML=`<td><input class="ci" style="width:150px"></td><td><input class="up" type="number" style="width:120px"></td><td><button class="sm" onclick="this.closest('tr').remove()">×</button></td>`;
  F("ctb").appendChild(tr); }
async function create(){
  const cars=[...F("ctb").querySelectorAll("tr")].map(tr=>({carId:tr.querySelector(".ci").value,unitPrice:parseFloat(tr.querySelector(".up").value)||0})).filter(c=>c.carId);
  const r=await fetch("/api/dealercontracts",{method:"POST",headers:H(),body:JSON.stringify({dealerContractNo:F("no").value,dealerContractNoUser:F("nu").value,dealerCode:F("dl").value,contractDate:F("cd").value||null,cars})});
  const j=await r.json();
  if(r.ok){ msg("Đã tạo "+j.dealerContractNo+" ("+j.cars+" xe, "+money(j.total)+"đ)."); F("ctb").innerHTML="";addCar(); F("no").value=""; load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/dealercontracts?status=${F("fst").value}&dealer=${F("q").value}`,{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(o=>{
    // Nguồn: duyệt/từ chối chỉ từ "P"; HUỶ chỉ từ "A" (huỷ hợp đồng ĐÃ duyệt, không huỷ HĐ đang chờ).
    let act=o.status==="P"?`<button class="sm" onclick="act1('${o.dealerContractNo}','approve')">Duyệt</button> <button class="sm" onclick="act1('${o.dealerContractNo}','reject')">Từ chối</button>`
      :o.status==="A"?`<button class="sm" onclick="act1('${o.dealerContractNo}','cancel')">Huỷ</button>`:"";
    // Ngày nhận HĐ sửa được khi P/A/F (nguồn ContractDealerContractUpdate guard "A,P,F").
    if(o.status==="P"||o.status==="A"||o.status==="F") act+=` <button class="sm" onclick="receipt('${o.dealerContractNo}')">Ngày nhận HĐ</button>`;
    return `<tr><td><b>${o.dealerContractNo}</b> <a href="#" class="cars" onclick="cars('${o.dealerContractNo}');return false">xem xe</a></td><td>${o.dealerContractNoUser||""}</td><td>${o.dealerCode}</td><td>${o.cars}</td><td class="num">${money(o.totalAmount)}</td><td>${day(o.createdAt)}</td><td><span class="pill p-${o.status}">${LBL[o.status]||o.status}</span></td><td>${act}</td></tr><tr id="x-${o.dealerContractNo}"></tr>`;
  }).join("")||'<tr><td colspan="8" class="muted">Chưa có hợp đồng.</td></tr>';
}
async function act1(no,a){ const rm=prompt(a==="approve"?"Ghi chú duyệt (có thể bỏ trống):":a==="reject"?"Lý do từ chối:":"Lý do huỷ:",""); if(rm===null) return;
  const r=await fetch(`/api/dealercontracts/${no}/${a}`,{method:"POST",headers:H({"Content-Type":"application/json"}),body:JSON.stringify({remark:rm})});
  const j=await r.json(); if(r.ok){ msg(`${no}: ${LBL[j.status]||j.status}`); load(); } else msg("Lỗi: "+(j.error||r.status)); }
async function receipt(no){ const dt=prompt("Ngày nhận hợp đồng (YYYY-MM-DD):",""); if(dt===null) return;
  const r=await fetch(`/api/dealercontracts/${no}/receipt`,{method:"POST",headers:H({"Content-Type":"application/json"}),body:JSON.stringify({receiptContractDate:dt||null})});
  const j=await r.json(); if(r.ok) load(); else msg("Lỗi: "+(j.error||r.status)); }
async function cars(no){
  const row=F("x-"+no); if(row.innerHTML){ row.innerHTML=""; return; }
  const d=await (await fetch(`/api/dealercontracts/${no}/cars`,{headers:H()})).json();
  row.innerHTML=`<td colspan="8"><div class="cars">${(d.cars||[]).map(c=>`Xe <b>${c.carId}</b> · ${money(c.unitPrice)}đ`).join(" &nbsp;|&nbsp; ")||"—"}</div></td>`;
}
addCar(); load();
</script>
</body></html>
