<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Đề nghị nhận xe (PDI)</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--warn:#d97706;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1040px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .p-Draft{color:var(--warn)} .p-Done{color:var(--ok)}
  #msg{font-size:13px} .cars{font-size:12px;opacity:.85} #ctbl td,#ctbl th{padding:4px 6px}
</style></head>
<body>
<h1>Đề nghị nhận xe (PDI) <span class="muted">(port 1:1 FrmNewPDI + FrmMngPDI — HTMV_PDI/PDIDtl)</span></h1>
<div class="card">
  <b>Tạo đề nghị nhận xe</b>
  <div class="bar" style="margin:10px 0"><span style="flex:1"></span><button class="primary" onclick="create()">Lưu ĐN</button><span id="msg"></span></div>
  <table id="ctbl"><thead><tr><th>VIN *</th><th>Spec</th><th>Màu</th><th>LC tạm</th><th>Ref</th><th>Tháng SX</th><th>Số máy</th><th></th></tr></thead><tbody id="ctb"></tbody></table>
  <button class="sm" style="margin-top:6px" onclick="addCar()">+ Thêm xe</button>
</div>
<div class="bar" style="margin:10px 0"><select id="fst" onchange="load()"><option value="">Tất cả</option><option value="Draft">Nháp</option><option value="Done">Hoàn tất</option></select></div>
<table><thead><tr><th>Số PDI</th><th>Số xe</th><th>Ngày tạo</th><th>Trạng thái</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="5" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const LBL={Draft:"Nháp",Done:"Hoàn tất"}; const day=d=>d? new Date(d).toLocaleString("vi-VN"):"";
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
function addCar(){ const tr=document.createElement("tr");
  tr.innerHTML=`<td><input class="vin" style="width:120px"></td><td><input class="sp" style="width:60px"></td><td><input class="cl" style="width:55px"></td><td><input class="lc" style="width:70px"></td><td><input class="rf" style="width:70px"></td><td><input class="pm" style="width:70px"></td><td><input class="en" style="width:80px"></td><td><button class="sm" onclick="this.closest('tr').remove()">×</button></td>`;
  F("ctb").appendChild(tr); }
async function create(){
  const cars=[...F("ctb").querySelectorAll("tr")].map(tr=>({vin:tr.querySelector(".vin").value,specCode:tr.querySelector(".sp").value,colorCode:tr.querySelector(".cl").value,lCTemp:tr.querySelector(".lc").value,refNo:tr.querySelector(".rf").value,productionMonth:tr.querySelector(".pm").value,engineNo:tr.querySelector(".en").value})).filter(c=>c.vin);
  const r=await fetch("/api/htmvpdis",{method:"POST",headers:H(),body:JSON.stringify({cars})});
  const j=await r.json();
  if(r.ok){ msg(j.message+" ("+j.cars+" xe)."); F("ctb").innerHTML="";addCar(); load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/htmvpdis?status=${F("fst").value}`,{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(o=>{
    let act=o.status==="Draft"?`<button class="sm" onclick="done('${o.pdiNo}')">Hoàn tất</button>`:"";
    return `<tr><td><b>${o.pdiNo}</b> <a href="#" class="cars" onclick="cars('${o.pdiNo}');return false">xem xe</a></td><td>${o.cars}</td><td>${day(o.createdAt)}</td><td><span class="pill p-${o.status}">${LBL[o.status]||o.status}</span></td><td>${act}</td></tr><tr id="x-${o.pdiNo}"></tr>`;
  }).join("")||'<tr><td colspan="5" class="muted">Chưa có đề nghị.</td></tr>';
}
async function done(no){ const r=await fetch(`/api/htmvpdis/${no}/complete`,{method:"POST",headers:H()}); const j=await r.json(); if(r.ok) load(); else msg("Lỗi: "+(j.error||r.status)); }
const PDI_R={Pending:"Chờ PDI",Passed:"Đạt PDI",Failed:"Không đạt"};
async function cars(no){
  const row=F("x-"+no); if(row.innerHTML){ row.innerHTML=""; return; }
  const d=await (await fetch(`/api/htmvpdis/${no}/cars`,{headers:H()})).json();
  row.innerHTML=`<td colspan="5"><div class="cars">${(d.cars||[]).map(c=>
    `<label><input type="checkbox" class="pdivin-${no}" value="${c.vin}"> VIN <b>${c.vin}</b>${c.specCode?" · "+c.specCode:""}${c.lCTemp?" · LC "+c.lCTemp:""}${c.engineNo?" · máy "+c.engineNo:""} · <i>${PDI_R[c.pdiResult]||c.pdiResult}</i></label>`
  ).join("<br>")||"—"}
  <div class="bar" style="margin-top:6px"><button class="sm" onclick="pdiCarsAction('${no}','approve')">Xác nhận đạt PDI</button> <button class="sm" onclick="pdiCarsAction('${no}','cancel')">Xác nhận không đạt</button></div></div>`;
}
async function pdiCarsAction(no,action){
  const vins=[...document.querySelectorAll(`.pdivin-${no}:checked`)].map(c=>c.value);
  if(vins.length===0){ msg("Chưa chọn dữ liệu"); return; }
  const r=await fetch(`/api/htmvpdis/${no}/${action}-cars`,{method:"POST",headers:H(),body:JSON.stringify({vins})});
  const j=await r.json();
  if(r.ok){ msg(`Đã cập nhật ${j.updated} xe.`); F("x-"+no).innerHTML=""; cars(no); } else msg("Lỗi: "+(j.error||r.status));
}
addCar(); load();
</script>
</body></html>
