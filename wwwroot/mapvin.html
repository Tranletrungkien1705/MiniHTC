<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Cập nhật VIN thật</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--ok:#16a34a;--bad:#dc2626}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:900px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input,button,textarea{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  textarea{width:100%;min-height:80px;resize:vertical} button{cursor:pointer}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} .ok{color:var(--ok)} .bad{color:var(--bad)} #msg{font-size:13px}
  #ptbl td,#ptbl th{padding:4px 6px}
</style></head>
<body>
<h1>Cập nhật VIN thật (FVIN → RVIN) <span class="muted">(port 1:1 FrmUpdateFVINToRVIN — Sto_TranspPlanMapVinReal)</span></h1>
<div class="card">
  <b>Map VIN kế hoạch → VIN thật</b> <span class="muted">(map lên KH vận chuyển theo VINPlan)</span>
  <table id="ptbl"><thead><tr><th>FVIN (VIN kế hoạch) *</th><th>RVIN (VIN thật) *</th><th></th></tr></thead><tbody id="ptb"></tbody></table>
  <div class="bar" style="margin-top:8px">
    <button class="sm" onclick="addRow()">+ Thêm dòng</button>
    <span style="flex:1"></span><button class="primary" onclick="save()">Lưu map</button><span id="msg"></span>
  </div>
  <div class="muted" style="margin-top:8px">Hoặc dán nhanh (mỗi dòng: <code>FVIN,RVIN</code>): <button class="sm" onclick="F('bulk').style.display=F('bulk').style.display==='none'?'block':'none'">bật/tắt</button></div>
  <textarea id="bulk" style="display:none;margin-top:6px" placeholder="FVIN001,RVIN001&#10;FVIN002,RVIN002"></textarea>
</div>
<table><thead><tr><th>FVIN</th><th>RVIN</th><th>Kết quả</th></tr></thead>
<tbody id="rows"></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
function addRow(f,r){
  const tr=document.createElement("tr");
  tr.innerHTML=`<td><input class="fv" value="${f||''}" style="width:180px"></td><td><input class="rv" value="${r||''}" style="width:180px"></td>
    <td><button class="sm" onclick="this.closest('tr').remove()">×</button></td>`;
  F("ptb").appendChild(tr);
}
async function save(){ await token();
  let pairs=[...F("ptb").querySelectorAll("tr")].map(tr=>({fVIN:tr.querySelector(".fv").value,rVIN:tr.querySelector(".rv").value})).filter(p=>p.fVIN&&p.rVIN);
  if(F("bulk").value.trim()) pairs=pairs.concat(F("bulk").value.trim().split(/\n/).map(l=>{const[a,b]=l.split(",");return{fVIN:(a||"").trim(),rVIN:(b||"").trim()};}).filter(p=>p.fVIN&&p.rVIN));
  if(!pairs.length){ msg("Chưa có cặp FVIN/RVIN."); return; }
  const r=await fetch("/api/transplans/mapvin",{method:"POST",headers:H(),body:JSON.stringify({pairs})});
  const j=await r.json();
  if(r.ok){ msg(`Đã map ${j.mapped}/${j.total} cặp.`);
    F("rows").innerHTML=(j.results||[]).map(x=>`<tr><td><b>${x.fvin}</b></td><td>${x.rvin}</td>
      <td class="${x.ok?'ok':'bad'}">${x.ok?"✓ đã map":"⚠ "+(x.warning||"lỗi")}</td></tr>`).join("");
  } else msg("Lỗi: "+(j.error||r.status));
}
addRow();
</script>
</body></html>
