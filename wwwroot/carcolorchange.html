<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Đổi màu xe</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--warn:#d97706;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1000px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} #ctbl td,#ctbl th{padding:4px 6px}
  #msg{font-size:13px}
</style></head>
<body>
<h1>Đổi màu xe <span class="muted">(port 1:1 FrmChange_CarColor — CarColorChange)</span></h1>
<div class="card">
  <b>Đổi màu (batch)</b> <span class="muted">— nhập VIN + màu cũ + màu mới</span>
  <div class="bar" style="margin:10px 0"><span style="flex:1"></span><button class="primary" onclick="save()">Lưu sửa màu</button><span id="msg"></span></div>
  <table id="ctbl"><thead><tr><th>VIN/CarID *</th><th>Đại lý</th><th>Model</th><th>Spec</th><th>Màu cũ</th><th>Màu mới *</th><th></th></tr></thead><tbody id="ctb"></tbody></table>
  <button class="sm" style="margin-top:6px" onclick="addRow()">+ Thêm xe</button>
</div>
<div class="bar" style="margin:10px 0"><input id="q" placeholder="Lọc VIN" oninput="load()" style="width:150px"></div>
<table><thead><tr><th>VIN</th><th>Đại lý</th><th>Model</th><th>Màu cũ → mới</th><th>Thời điểm</th></tr></thead>
<tbody id="rows"><tr><td colspan="5" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const day=d=>d? new Date(d).toLocaleString("vi-VN"):"";
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
function addRow(){ const tr=document.createElement("tr");
  tr.innerHTML=`<td><input class="vin" style="width:130px"></td><td><input class="dl" style="width:70px"></td><td><input class="md" style="width:65px"></td><td><input class="sp" style="width:55px"></td><td><input class="co" style="width:65px"></td><td><input class="cn" style="width:65px"></td><td><button class="sm" onclick="this.closest('tr').remove()">×</button></td>`;
  F("ctb").appendChild(tr); }
async function save(){
  const rows=[...F("ctb").querySelectorAll("tr")].map(tr=>({carId:tr.querySelector(".vin").value,dealerCode:tr.querySelector(".dl").value,modelCode:tr.querySelector(".md").value,specCode:tr.querySelector(".sp").value,colorCodeOld:tr.querySelector(".co").value,colorCodeNew:tr.querySelector(".cn").value})).filter(r=>r.carId);
  const r=await fetch("/api/carcolorchanges",{method:"POST",headers:H(),body:JSON.stringify(rows)});
  const j=await r.json();
  if(r.ok){ msg(`${j.message} (${j.changed} xe).`); F("ctb").innerHTML="";addRow(); load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/carcolorchanges?car=${F("q").value}`,{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(o=>
    `<tr><td><b>${o.carId}</b></td><td>${o.dealerCode||""}</td><td>${o.modelCode||""}</td><td>${o.colorCodeOld||"—"} → <b>${o.colorCodeNew}</b></td><td>${day(o.changedAt)}</td></tr>`
  ).join("")||'<tr><td colspan="5" class="muted">Chưa có lịch sử đổi màu.</td></tr>';
}
addRow(); load();
</script>
</body></html>
