<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Đề nghị GD ngân hàng</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--warn:#d97706;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1020px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} td.num{text-align:right;font-variant-numeric:tabular-nums}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .p-Draft{color:var(--warn)} .p-Sent{color:#0891b2} .p-Approved{color:var(--ok)} .p-Rejected{color:#dc2626}
  #msg{font-size:13px}
</style></head>
<body>
<h1>Đề nghị giao dịch ngân hàng <span class="muted">(port 1:1 FrmDeNghiGDNganHang — BankingTrans)</span></h1>
<div class="card">
  <b>Tạo đề nghị GD</b>
  <div class="bar" style="margin:10px 0">
    <div><label>Ngân hàng *</label><input id="bk" style="width:110px"></div>
    <div><label>Loại ĐN GD *</label><select id="tp"><option value="">—</option><option value="GNTT">GNTT (giải ngân)</option><option value="BLLC">BLLC (bảo lãnh LC)</option><option value="PHLC">PHLC (phát hành LC)</option></select></div>
    <div><label>Ngày giải ngân</label><input id="dd" type="date"></div>
    <div><label>Số tiền giải ngân *</label><input id="am" type="number" style="width:140px"></div>
    <div><label>Ghi chú</label><input id="rm" style="width:130px"></div>
    <button class="primary" onclick="create()">Lưu ĐN</button><span id="msg"></span>
  </div>
</div>
<div class="bar" style="margin:10px 0">
  <select id="fst" onchange="load()"><option value="">Tất cả TT</option><option value="Draft">Nháp</option><option value="Sent">Đã gửi</option><option value="Approved">Đã duyệt</option><option value="Rejected">Từ chối</option></select>
  <select id="fty" onchange="load()"><option value="">Tất cả loại</option><option value="GNTT">GNTT</option><option value="BLLC">BLLC</option><option value="PHLC">PHLC</option></select>
  <input id="q" placeholder="Lọc ngân hàng" oninput="load()" style="width:110px">
</div>
<table><thead><tr><th>Số ĐN</th><th>Ngân hàng</th><th>Loại</th><th>Ngày GN</th><th class="num">Số tiền</th><th>Ngày tạo</th><th>TT</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="8" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const money=n=>(n||0).toLocaleString("vi-VN"); const day=d=>d? new Date(d).toLocaleString("vi-VN"):""; const dd=d=>d? new Date(d).toLocaleDateString("vi-VN"):"";
const LBL={Draft:"Nháp",Sent:"Đã gửi",Approved:"Đã duyệt",Rejected:"Từ chối"};
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
async function create(){
  const body={bankCode:F("bk").value,transType:F("tp").value,disbursementDate:F("dd").value||null,amountDisbursed:parseFloat(F("am").value)||0,totalAmount:0,remark:F("rm").value};
  const r=await fetch("/api/bankingtrans",{method:"POST",headers:H(),body:JSON.stringify(body)});
  const j=await r.json();
  if(r.ok){ msg("Đã tạo "+j.soDeNghi); F("am").value="";F("rm").value=""; load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/bankingtrans?status=${F("fst").value}&type=${F("fty").value}&bank=${F("q").value}`,{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(o=>{
    let act=o.status==="Draft"?`<button class="sm" onclick="send('${o.soDeNghi}')">Gửi</button>`
      :o.status==="Sent"?`<button class="sm" onclick="act1('${o.soDeNghi}','approve')">Duyệt</button> <button class="sm" onclick="act1('${o.soDeNghi}','reject')">Từ chối</button>`:"";
    return `<tr><td><b>${o.soDeNghi}</b></td><td>${o.bankCode}</td><td>${o.transType}</td><td>${dd(o.disbursementDate)}</td><td class="num">${money(o.amountDisbursed)}</td><td>${day(o.createdAt)}</td><td><span class="pill p-${o.status}">${LBL[o.status]||o.status}</span></td><td>${act}</td></tr>`;
  }).join("")||'<tr><td colspan="8" class="muted">Chưa có đề nghị.</td></tr>';
}
async function send(no){ const r=await fetch(`/api/bankingtrans/${no}/send`,{method:"POST",headers:H()}); const j=await r.json(); if(r.ok) load(); else msg("Lỗi: "+(j.error||r.status)); }
async function act1(no,a){ const r=await fetch(`/api/bankingtrans/${no}/${a}`,{method:"POST",headers:H()}); const j=await r.json(); if(r.ok) load(); else msg("Lỗi: "+(j.error||r.status)); }
load();
</script>
</body></html>
