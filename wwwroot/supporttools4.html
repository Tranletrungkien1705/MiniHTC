<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Sửa HĐ đại lý (NH/loại bán/NVBH)</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#4f46e5;--ok:#16a34a;--warn:#d97706}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:860px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px} h3{font-size:14px;margin:14px 0 4px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0} .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
  input,button,select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit} label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px} th,td{text-align:left;padding:5px 7px;border-bottom:1px solid var(--line)} th{opacity:.7;font-size:10.5px;text-transform:uppercase} .wrap{overflow-x:auto}
  .msg{font-size:13px;margin-left:6px} .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
</style></head>
<body>
<h1>Sửa hợp đồng đại lý theo lô <span class="muted">(port 1:1 FrmSupportDlr_Contract_UpdateBankCode/UpdateSalesType/UpdateSMCode — ERP.V15.2025/Support)</span></h1>
<div class="card"><h3 style="margin-top:0">Sửa 1 trường</h3>
  <div class="grid4">
    <div><label>Số HĐ đại lý *</label><input id="no"></div>
    <div><label>Trường cần sửa</label><select id="field"><option value="bankCode">Mã ngân hàng</option><option value="salesType">Loại bán</option><option value="salesManCode">Mã NVBH</option></select></div>
    <div><label>Giá trị mới *</label><input id="val"></div>
    <button class="primary" onclick="doPatch()">Áp dụng</button>
  </div>
  <div class="row"><span id="msg" class="msg"></span></div>
</div>
<div class="row" style="margin:8px 0"><input id="q" placeholder="Số HĐ / đại lý" style="width:220px"><button onclick="load()">Xem</button></div>
<div class="wrap"><table><thead><tr><th>Số HĐ</th><th>Đại lý</th><th>NVBH</th><th>Loại bán</th><th>TT</th></tr></thead><tbody id="tb"><tr><td colspan="5" class="muted">Nhấn "Xem".</td></tr></tbody></table></div>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id); const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function Hh(x){ return Object.assign({"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY}, x||{}); }
function say(t){ F("msg").textContent=t; setTimeout(()=>{if(F("msg").textContent===t)F("msg").textContent="";},4000); }
async function doPatch(){ await token();
  const no=F("no").value; if(!no){ say("Chưa nhập số HĐ."); return; }
  const r=await fetch("/api/dlrcontracts/"+encodeURIComponent(no)+"/patch",{method:"POST",headers:Hh({"Content-Type":"application/json"}),body:JSON.stringify({Field:F("field").value,Value:F("val").value})});
  const d=await r.json(); if(!r.ok){ say("Lỗi: "+(d.error||r.status)); return; } say("Đã sửa "+d.field+": "+d.oldValue+" → "+d.newValue); F("val").value=""; load();
}
async function load(){ await token();
  const r=await fetch("/api/dlrcontracts?customer="+encodeURIComponent(F("q").value),{headers:Hh()}); const d=await r.json();
  F("tb").innerHTML=(d.items||[]).map(o=>`<tr><td><b>${esc(o.dlrContractNo)}</b></td><td>${esc(o.dealerCode)}</td><td>${esc(o.salesManCode)}</td><td>${esc(o.salesType)}</td><td>${esc(o.status)}</td></tr>`).join("")||'<tr><td colspan="5" class="muted">Không có kết quả — nhập số HĐ ở trên để sửa trực tiếp.</td></tr>';
}
</script>
</body></html>
