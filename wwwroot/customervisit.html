<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Khách xem xe</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#4f46e5;--ok:#16a34a;--warn:#d97706}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:960px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px} h3{font-size:14px;margin:14px 0 4px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0} .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
  input,button,select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit} label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px} th,td{text-align:left;padding:5px 7px;border-bottom:1px solid var(--line)} th{opacity:.7;font-size:10.5px;text-transform:uppercase} .wrap{overflow-x:auto}
  .msg{font-size:13px;margin-left:6px} .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px} .stats{display:flex;gap:24px;flex-wrap:wrap;margin-top:8px} .stat{font-size:13px} .stat b{font-size:16px;display:block}
</style></head>
<body>
<h1>Khách đến xem xe <span class="muted">(port 1:1 FrmCusVisit — 2010.HTC/Sales/RetailContract)</span></h1>
<div class="card"><h3 style="margin-top:0">Ghi nhận khách vãng lai</h3>
  <div class="grid4">
    <div><label>Đại lý</label><input id="dealer"></div>
    <div><label>Giới tính</label><select id="gender"><option value="">—</option><option value="M">Nam</option><option value="F">Nữ</option></select></div>
    <div><label>Độ tuổi</label><input id="range" placeholder="mã độ tuổi"></div>
    <div><label>Model quan tâm *</label><input id="model"></div>
  </div>
  <div class="row" style="margin-top:8px"><button class="primary" onclick="save()">Ghi nhận</button><span id="msg" class="msg"></span></div>
</div>
<div class="row" style="margin:8px 0"><input id="fdealer" placeholder="Lọc đại lý" style="width:180px"><input id="fmodel" placeholder="Lọc model" style="width:160px"><button onclick="load()">Xem</button></div>
<div id="stats" class="stats"></div>
<div class="wrap"><table><thead><tr><th>Mã ghi</th><th>Đại lý</th><th>Giới tính</th><th>Độ tuổi</th><th>Model</th><th>Thời điểm</th></tr></thead><tbody id="tb"><tr><td colspan="6" class="muted">Nhấn "Xem".</td></tr></tbody></table></div>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id); const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
const dtshow=s=>s?String(s).replace('T',' ').slice(0,19):""; const gname=g=>({M:'Nam',F:'Nữ'}[g]||g||'');
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function Hh(x){ return Object.assign({"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY}, x||{}); }
function say(t){ F("msg").textContent=t; setTimeout(()=>{if(F("msg").textContent===t)F("msg").textContent="";},3800); }
const v=id=>F(id).value||null;
async function save(){ await token();
  const body={DealerCode:v("dealer"),Gender:v("gender"),RangeAgeCode:v("range"),ModelCode:F("model").value};
  const r=await fetch("/api/customervisits",{method:"POST",headers:Hh({"Content-Type":"application/json"}),body:JSON.stringify(body)});
  const d=await r.json(); if(!r.ok){ say("Lỗi: "+(d.error||r.status)); return; } say("Đã ghi "+d.cusVisitCode); F("model").value=""; F("range").value=""; F("gender").value=""; load();
}
async function load(){ await token();
  const r=await fetch("/api/customervisits?dealer="+encodeURIComponent(F("fdealer").value)+"&model="+encodeURIComponent(F("fmodel").value),{headers:Hh()}); const d=await r.json();
  F("stats").innerHTML=`<div class="stat">Tổng<b>${d.count}</b></div>`+(d.byModel||[]).slice(0,6).map(m=>`<div class="stat">${esc(m.model)}<b>${m.count}</b></div>`).join("");
  F("tb").innerHTML=(d.items||[]).map(o=>`<tr><td>${esc(o.cusVisitCode)}</td><td>${esc(o.dealerCode)}</td><td>${gname(o.gender)}</td><td>${esc(o.rangeAgeCode)}</td><td><b>${esc(o.modelCode)}</b></td><td>${dtshow(o.createdAt)}</td></tr>`).join("")||'<tr><td colspan="6" class="muted">Chưa có khách.</td></tr>';
}
</script>
</body></html>
