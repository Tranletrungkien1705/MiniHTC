<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Gán GPS↔VIN</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--ok:#16a34a;--off:#dc2626}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1000px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .bar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;align-items:center}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .p-Mapped{color:var(--ok)} .p-Unmapped{color:var(--off)}
  #msg{font-size:13px} .kpi{display:inline-block;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-right:8px}
</style></head>
<body>
<h1>Gán thiết bị GPS ↔ VIN <span class="muted">(port 1:1 FrmMngSto_StoBalanceGPS + FrmUnmapThietBi — Sto_StoBalanceGPS)</span></h1>
<div class="bar">
  <input id="dv" placeholder="Số thiết bị GPS *" style="width:130px"><input id="vin" placeholder="VIN *" style="width:130px">
  <input id="dl" placeholder="Đại lý" style="width:90px"><input id="ad" placeholder="Địa chỉ" style="width:150px">
  <button class="primary" onclick="mapDev()">Gắn lên xe</button>
</div>
<div class="bar">
  <span class="kpi">Tổng: <b id="kt">0</b></span><span class="kpi">Đang gắn: <b id="km">0</b></span>
  <span style="flex:1"></span>
  <select id="fst" onchange="load()"><option value="">Tất cả</option><option value="Mapped">Đang gắn</option><option value="Unmapped">Đã gỡ</option></select>
  <input id="q" placeholder="Lọc thiết bị" oninput="load()" style="width:120px"><span id="msg"></span>
</div>
<table><thead><tr><th>Thiết bị</th><th>VIN</th><th>Đại lý</th><th>Ngày gắn</th><th>Trạng thái</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="6" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const LBL={Mapped:"Đang gắn",Unmapped:"Đã gỡ"};
const dt=d=>d? new Date(d).toLocaleString("vi-VN"):"—";
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
async function mapDev(){
  const r=await fetch("/api/gpsbalance/map",{method:"POST",headers:H(),body:JSON.stringify({gpsDvNo:F("dv").value,vin:F("vin").value,dealerCode:F("dl").value,address:F("ad").value})});
  const j=await r.json();
  if(r.ok){ msg("Đã gắn "+j.gpsDvNo+" → "+j.vin+"."); F("dv").value="";F("vin").value=""; load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/gpsbalance?status=${F("fst").value}&device=${encodeURIComponent(F("q").value)}`,{headers:H()})).json();
  F("kt").textContent=d.count; F("km").textContent=d.mapped;
  F("rows").innerHTML=(d.items||[]).map(g=>{
    let act=g.status==="Mapped"?`<button class="sm" onclick="unmap('${g.gpsDvNo}')">Gỡ map</button>`:"";
    return `<tr><td><b>${g.gpsDvNo}</b></td><td>${g.vin||"—"}</td><td>${g.dealerCode||"—"}</td><td>${dt(g.mapVINDateTime)}</td>
      <td><span class="pill p-${g.status}">${LBL[g.status]||g.status}</span></td><td>${act}</td></tr>`;
  }).join("")||'<tr><td colspan="6" class="muted">Chưa có dữ liệu.</td></tr>';
}
async function unmap(dv){ if(!confirm("Gỡ map thiết bị "+dv+"?")) return; const r=await fetch(`/api/gpsbalance/${dv}/unmap`,{method:"POST",headers:H()}); const j=await r.json(); if(r.ok) load(); else msg("Lỗi: "+(j.error||r.status)); }
load();
</script>
</body></html>
