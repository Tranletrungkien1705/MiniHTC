<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Giám sát phiên</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#4f46e5;--ok:#16a34a;--red:#dc2626}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:960px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px} h3{font-size:14px;margin:14px 0 4px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
  input,button{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.link{border:none;background:none;color:var(--accent);padding:2px 6px} button.warn{border-color:var(--red);color:var(--red)}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)} th{opacity:.7;font-size:11px;text-transform:uppercase} .wrap{overflow-x:auto}
  .msg{font-size:13px;margin-left:6px} tr.exp{opacity:.6} .pill{font-size:11px;padding:1px 7px;border-radius:20px;border:1px solid var(--line)} .e{color:var(--red);border-color:var(--red)} .o{color:var(--ok);border-color:var(--ok)}
</style></head>
<body>
<h1>Giám sát phiên đăng nhập <span class="muted">(port 1:1 FrmMngSession — TCMotor)</span></h1>
<div class="card"><h3 style="margin-top:0">Mở phiên (mô phỏng)</h3>
  <div class="row"><div><label>UserCode *</label><input id="user" style="width:140px"></div><div><label>Partner</label><input id="partner" style="width:120px"></div><button class="primary" onclick="open2()">Mở phiên</button><span id="msg" class="msg"></span></div>
</div>
<div class="card"><div class="row">
  <div><label>Lọc user</label><input id="q" style="width:150px"></div>
  <div><label>Hết hạn sau (phút)</label><input id="mins" type="number" value="30" style="width:90px"></div>
  <button onclick="load()">Xem</button><button class="warn" onclick="killExp()">Kill phiên hết hạn</button></div>
  <div id="kpi" class="muted" style="margin:6px 0"></div>
  <div class="wrap"><table><thead><tr><th>SessionId</th><th>User</th><th>Đăng nhập</th><th>Truy cập cuối</th><th>Ngôn ngữ</th><th>Partner</th><th>TT</th><th></th></tr></thead>
  <tbody id="rows"><tr><td colspan="8" class="muted">Nhấn "Xem".</td></tr></tbody></table></div>
</div>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id); const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;"); const dts=s=>s?String(s).substring(0,19).replace("T"," "):"";
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function Hh(x){ return Object.assign({"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY}, x||{}); }
function say(t){ F("msg").textContent=t; setTimeout(()=>{if(F("msg").textContent===t)F("msg").textContent="";},3500); }
function isExp(last,mins){ return (Date.now()-new Date(last).getTime())/60000 > mins; }
async function open2(){ await token();
  const r=await fetch("/api/sessions",{method:"POST",headers:Hh({"Content-Type":"application/json"}),body:JSON.stringify({UserCode:F("user").value,PartnerCode:F("partner").value})});
  const d=await r.json(); if(!r.ok){ say("Lỗi: "+(d.error||r.status)); return; } say("Đã mở "+d.sessionId); F("user").value=""; load();
}
async function killOne(id){ await token(); await fetch("/api/sessions/"+id+"/kill",{method:"POST",headers:Hh()}); load(); }
async function killExp(){ await token(); const r=await fetch("/api/sessions/kill-expired?expireMinutes="+(+F("mins").value||30),{method:"POST",headers:Hh()}); const d=await r.json(); say("Đã kill "+d.killed+" phiên hết hạn"); load(); }
async function load(){ await token(); const mins=+F("mins").value||30;
  const r=await fetch("/api/sessions?expireMinutes="+mins+"&user="+encodeURIComponent(F("q").value),{headers:Hh()}); const d=await r.json();
  F("kpi").textContent=`${d.count} phiên — hết hạn (>${d.expireMinutes} phút): ${d.expired}`;
  F("rows").innerHTML=(d.items||[]).map(o=>{const ex=isExp(o.dateTimeLastAccess,mins);return `<tr class="${ex?'exp':''}"><td>${esc(o.sessionId)}</td><td><b>${esc(o.userCode)}</b></td><td>${dts(o.dateTimeLogin)}</td><td>${dts(o.dateTimeLastAccess)}</td><td>${esc(o.languageCode)}</td><td>${esc(o.partnerCode)}</td><td><span class="pill ${ex?'e':'o'}">${ex?'Hết hạn':'Đang mở'}</span></td><td><button class="link" onclick="killOne(${o.id})">Kill</button></td></tr>`;}).join("")||'<tr><td colspan="8" class="muted">Không có phiên.</td></tr>';
}
</script>
</body></html>
