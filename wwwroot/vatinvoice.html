<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Hóa đơn VAT HTC</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1060px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  button.ok{color:#fff;background:var(--ok);border-color:var(--ok)} button.bad{color:#fff;background:var(--bad);border-color:var(--bad)}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} td.num{text-align:right;font-variant-numeric:tabular-nums} .wrap{overflow-x:auto}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .s-Draft{color:var(--warn)} .s-Issued{color:var(--ok)} .s-Deleted{color:var(--bad)}
  #msg{font-size:13px} .carrow input{width:96px}
</style></head>
<body>
<h1>Hóa đơn VAT HTC <span class="muted">(port 1:1 FrmMngInvoice — VAT_HTCInvoice header+detail, cụm Bank)</span></h1>
<div class="card">
  <b>Tạo hóa đơn VAT (header + xe)</b>
  <div class="bar" style="margin-top:10px">
    <div><label>Đại lý *</label><input id="dl" style="width:90px"></div>
    <div><label>Ký hiệu HĐ *</label><input id="iid" style="width:100px" value="1C26TAA"></div>
    <div><label>VAT %</label><input id="vat" type="number" style="width:70px" value="10"></div>
    <div><label>Ngân hàng</label><input id="bk" style="width:80px"></div>
    <div><label>Nguồn HĐ</label><input id="src" style="width:100px"></div>
    <div><label>Loại điều chỉnh</label><select id="adj"><option value="">Gốc</option><option value="ADJ">Điều chỉnh</option><option value="REPLACE">Thay thế</option></select></div>
    <div><label>Số HĐ gốc (nếu ĐC)</label><input id="root" style="width:110px"></div>
  </div>
  <table style="margin-top:10px"><thead><tr><th>VIN</th><th>Model</th><th>Số máy</th><th>Nhãn hiệu</th><th>Số HĐ NM</th><th class="num">Đơn giá HĐ</th><th></th></tr></thead><tbody id="carRows"></tbody></table>
  <div class="bar" style="margin-top:8px"><button class="sm" onclick="addRow()">+ Thêm xe</button><button class="primary" onclick="save()">Tạo HĐ</button><span id="msg"></span></div>
</div>
<div class="bar" style="margin:10px 0">
  <input id="qd" placeholder="Lọc đại lý" oninput="load()" style="width:100px">
  <input id="qn" placeholder="Lọc mã/số HĐ" oninput="load()" style="width:120px">
  <select id="qs" onchange="load()"><option value="">Mọi trạng thái</option><option value="Draft">Nháp</option><option value="Issued">Đã phát hành</option><option value="Deleted">Đã xóa</option></select>
  <select id="qa" onchange="load()"><option value="">HĐ gốc + ĐC</option><option value="root">HĐ gốc</option><option value="adj">HĐ điều chỉnh</option></select>
</div>
<div class="wrap"><table><thead><tr><th>Mã HĐ</th><th>Số HĐ</th><th>Ký hiệu</th><th>Đại lý</th><th class="num">VAT%</th><th>Loại</th><th class="num">Tổng giá</th><th class="num">Số xe</th><th>Trạng thái</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="10" class="muted">Đang tải…</td></tr></tbody></table></div>
<div class="card" id="detCard" style="display:none">
  <b>Chi tiết xe — <span id="detNo"></span></b>
  <div class="wrap"><table><thead><tr><th>VIN</th><th>Model</th><th>Đặc tả</th><th>Số máy</th><th>Nhãn hiệu</th><th>Loại xe</th><th>Số HĐ NM</th><th>Năm SX</th><th class="num">Đơn giá HĐ</th></tr></thead><tbody id="detRows"></tbody></table></div>
</div>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const ST={Draft:"Nháp",Issued:"Đã phát hành",Deleted:"Đã xóa"};
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
function money(n){ return (n||0).toLocaleString("vi-VN"); }
function addRow(){ const tr=document.createElement("tr"); tr.className="carrow";
  tr.innerHTML=`<td><input class="c-vin"></td><td><input class="c-md"></td><td><input class="c-eng"></td><td><input class="c-br"></td><td><input class="c-nm"></td><td class="num"><input class="c-up" type="number"></td><td><button class="sm" onclick="this.closest('tr').remove()">×</button></td>`;
  F("carRows").appendChild(tr); }
function collect(){ return [...document.querySelectorAll("#carRows tr")].map(tr=>({
  vin:tr.querySelector(".c-vin").value, modelCode:tr.querySelector(".c-md").value, engineNo:tr.querySelector(".c-eng").value,
  brandName:tr.querySelector(".c-br").value, invoiceNoFactory:tr.querySelector(".c-nm").value, hTCUnitPrice:+tr.querySelector(".c-up").value||0})).filter(c=>c.vin.trim()); }
async function save(){
  const b={dealerCode:F("dl").value,invoiceIDCode:F("iid").value,vat:+F("vat").value||10,bankCode:F("bk").value,sourceInvoiceName:F("src").value,invoiceAdjType:F("adj").value,rootHTCInvoiceNo:F("root").value,cars:collect()};
  const r=await fetch("/api/vatinvoices",{method:"POST",headers:H(),body:JSON.stringify(b)});
  const j=await r.json();
  if(r.ok){ msg(`Đã tạo ${j.hTCInvoiceCode} (${j.cars} xe)`); F("carRows").innerHTML=""; addRow(); load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/vatinvoices?dealer=${F("qd").value}&invNo=${F("qn").value}&status=${F("qs").value}&adjType=${F("qa").value}`,{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(o=>{
    let act="";
    if(o.vatHTCStatus==="Draft") act=`<button class="sm ok" onclick="issue('${o.hTCInvoiceCode}')">Phát hành</button>`;
    else if(o.vatHTCStatus==="Issued") act=`<button class="sm bad" onclick="del('${o.hTCInvoiceCode}')">Xóa</button>`;
    return `<tr onclick="detail('${o.hTCInvoiceCode}')"><td><b>${o.hTCInvoiceCode}</b></td><td>${o.hTCInvoiceNo||"—"}</td><td>${o.invoiceIDCode}</td><td>${o.dealerCode}</td><td class="num">${o.vat}</td><td>${o.invoiceAdjType||"Gốc"}</td><td class="num">${money(o.totalPrice)}</td><td class="num">${o.cars}</td><td><span class="pill s-${o.vatHTCStatus}">${ST[o.vatHTCStatus]||o.vatHTCStatus}</span></td><td onclick="event.stopPropagation()">${act}</td></tr>`;
  }).join("")||'<tr><td colspan="10" class="muted">Chưa có hóa đơn.</td></tr>';
}
async function detail(code){
  const d=await (await fetch(`/api/vatinvoices/${code}/cars`,{headers:H()})).json();
  F("detCard").style.display=""; F("detNo").textContent=code;
  F("detRows").innerHTML=(d.cars||[]).map(c=>`<tr><td><b>${c.vin}</b></td><td>${c.modelCode||""}</td><td>${c.specCode||""}</td><td>${c.engineNo||""}</td><td>${c.brandName||""}</td><td>${c.carType||""}</td><td>${c.invoiceNoFactory||""}</td><td>${c.productionYear||""}</td><td class="num">${money(c.hTCUnitPrice)}</td></tr>`).join("")||'<tr><td colspan="9" class="muted">Không có xe.</td></tr>';
}
async function issue(code){
  const r=await fetch(`/api/vatinvoices/${code}/issue`,{method:"POST",headers:H()});
  const j=await r.json(); if(r.ok){ msg(`${code}: phát hành, số HĐ ${j.hTCInvoiceNo} (${j.oS_HDDT_InvoiceCode})`); load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function del(code){
  const reason=prompt("Lý do xóa hóa đơn:"); if(reason===null) return;
  const r=await fetch(`/api/vatinvoices/${code}/delete?reason=${encodeURIComponent(reason)}`,{method:"POST",headers:H()});
  const j=await r.json(); if(r.ok){ msg(`${code}: đã xóa (${j.deleteReason})`); load(); } else msg("Lỗi: "+(j.error||r.status));
}
addRow(); load();
</script>
</body></html>
