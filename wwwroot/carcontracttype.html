<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Gán loại HĐ cho xe</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#4f46e5;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:960px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px} h3{font-size:14px;margin:14px 0 4px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
  input,button,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)} th{opacity:.7;font-size:11px;text-transform:uppercase} .wrap{overflow-x:auto}
  .msg{font-size:13px;margin-left:6px} textarea{width:100%;min-height:64px}
</style></head>
<body>
<h1>Gán loại hợp đồng cho xe <span class="muted">(port 1:1 FrmUpdContractTypeForCar — TCMotor)</span></h1>
<p class="muted">Cập nhật loại hợp đồng (ContractType) cho xe theo lô (import từ Excel), khớp/upsert theo CarId.</p>
<div class="card"><h3 style="margin-top:0">Import cập nhật</h3>
  <p class="muted" style="margin:2px 0">Mỗi dòng, tab: <b>CarId | Model | Spec | Màu | SO | Loại HĐ mới</b></p>
  <textarea id="rows" placeholder="CAR001&#9;CRETA&#9;CR-2.0&#9;WHITE&#9;SO1&#9;TCG"></textarea>
  <div class="row" style="margin-top:8px"><button class="primary" onclick="doImport()">Cập nhật</button><span id="msg" class="msg"></span></div>
</div>
<div class="card"><div class="row"><div><label>CarId</label><input id="qCar" style="width:160px"></div><div><label>Loại HĐ</label><input id="qType" style="width:120px"></div><button onclick="load()">Xem</button></div>
  <div id="kpi" class="muted" style="margin:6px 0"></div>
  <div class="wrap"><table><thead><tr><th>CarId</th><th>Model</th><th>Spec</th><th>Màu</th><th>SO</th><th>Loại HĐ</th><th>Bởi</th><th>Cập nhật</th></tr></thead>
  <tbody id="tb"><tr><td colspan="8" class="muted">Nhấn "Xem".</td></tr></tbody></table></div>
</div>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id); const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;"); const dts=s=>s?String(s).substring(0,16).replace("T"," "):"";
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function Hh(x){ return Object.assign({"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY}, x||{}); }
function say(t){ F("msg").textContent=t; setTimeout(()=>{if(F("msg").textContent===t)F("msg").textContent="";},4500); }
async function doImport(){ await token();
  const rows=F("rows").value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const c=l.split(/\t/);return{CarId:(c[0]||"").trim(),ModelCode:(c[1]||"").trim(),SpecCode:(c[2]||"").trim(),ColorCode:(c[3]||"").trim(),SOCode:(c[4]||"").trim(),ContractType:(c[5]||"").trim()};});
  const r=await fetch("/api/carcontracttypes/import",{method:"POST",headers:Hh({"Content-Type":"application/json"}),body:JSON.stringify({Rows:rows})});
  const d=await r.json(); if(!r.ok){ say("Lỗi: "+(d.error||r.status)); return; } say(`Thêm ${d.added}, cập nhật ${d.updated}`); F("rows").value=""; load();
}
async function load(){ await token();
  const qs=new URLSearchParams({carId:F("qCar").value,contractType:F("qType").value});
  const r=await fetch("/api/carcontracttypes?"+qs,{headers:Hh()}); const d=await r.json();
  F("kpi").textContent=`${d.count} xe`;
  F("tb").innerHTML=(d.items||[]).map(o=>`<tr><td><b>${esc(o.carId)}</b></td><td>${esc(o.modelCode)}</td><td>${esc(o.specCode)}</td><td>${esc(o.colorCode)}</td><td>${esc(o.soCode)}</td><td>${esc(o.contractType)}</td><td>${esc(o.updatedBy)}</td><td>${dts(o.updatedAt)}</td></tr>`).join("")||'<tr><td colspan="8" class="muted">Chưa có dữ liệu.</td></tr>';
}
</script>
</body></html>
