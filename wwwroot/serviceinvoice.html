<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Hóa đơn DV</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--warn:#d97706;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1000px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .bar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;align-items:center}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .p-Draft{color:var(--warn)} .p-Paid{color:var(--ok)}
  .kpi{display:inline-block;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-right:8px} #msg{font-size:13px}
</style></head>
<body>
<h1>Hóa đơn dịch vụ <span class="muted">(port 1:1 FrmInvoice — Ser_Invoice, thu tiền RO)</span></h1>
<div class="bar">
  <input id="ro" placeholder="Số RO (đã sửa xong) *" style="width:170px"><input id="vat" type="number" placeholder="VAT %" style="width:80px;text-align:right" value="10">
  <input id="dc" type="number" placeholder="Chiết khấu" style="width:120px;text-align:right">
  <select id="pt"><option>Tiền mặt</option><option>Chuyển khoản</option><option>Thẻ</option></select>
  <button class="primary" onclick="create()">Lập HĐ</button><span id="msg"></span>
</div>
<div class="bar"><span class="kpi">Doanh thu (đã TT): <b id="rev" class="n">0</b></span><span style="flex:1"></span>
  <select id="fst" onchange="load()"><option value="">Tất cả</option><option value="Draft">Nháp</option><option value="Paid">Đã TT</option></select><input id="q" placeholder="Lọc RO" oninput="load()" style="width:120px"></div>
<table><thead><tr><th>Số HĐ</th><th>RO</th><th class="n">Tạm tính</th><th class="n">VAT</th><th class="n">CK</th><th class="n">Tổng</th><th>Trạng thái</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="8" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const LBL={Draft:"Nháp",Paid:"Đã TT"}; const n=x=>Number(x||0).toLocaleString("vi-VN");
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
async function create(){
  const r=await fetch("/api/serviceinvoices",{method:"POST",headers:H(),body:JSON.stringify({rONo:F("ro").value,vatPercent:Number(F("vat").value||0),discountAmount:Number(F("dc").value||0),paymentType:F("pt").value})});
  const j=await r.json();
  if(r.ok){ msg("Đã lập "+j.invoiceNo+" (tổng "+n(j.totalAmount)+"đ)."); F("ro").value="";F("dc").value=""; load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/serviceinvoices?status=${F("fst").value}&ro=${F("q").value}`,{headers:H()})).json();
  F("rev").textContent=n(d.totalRevenue);
  F("rows").innerHTML=(d.items||[]).map(i=>{
    let act=i.status==="Draft"?`<button class="sm" onclick="pay('${i.invoiceNo}')">Thanh toán</button>`:"";
    return `<tr><td><b>${i.invoiceNo}</b></td><td>${i.rONo}</td><td class="n">${n(i.subTotal)}</td><td class="n">${n(i.vatAmount)}</td>
      <td class="n">${n(i.discountAmount)}</td><td class="n"><b>${n(i.totalAmount)}</b></td>
      <td><span class="pill p-${i.status}">${LBL[i.status]||i.status}</span></td><td>${act}</td></tr>`;
  }).join("")||'<tr><td colspan="8" class="muted">Chưa có hóa đơn.</td></tr>';
}
async function pay(no){ const r=await fetch(`/api/serviceinvoices/${no}/pay`,{method:"POST",headers:H()}); const j=await r.json(); if(r.ok){ msg(j.roAdvancedTo?("Đã TT + RO → "+j.roAdvancedTo):"Đã TT."); load(); } else msg("Lỗi: "+(j.error||r.status)); }
load();
</script>
</body></html>
