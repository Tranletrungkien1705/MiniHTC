<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Báo cáo đặt hàng sản xuất</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--ok:#16a34a;--warn:#d97706}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1000px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px} h3{font-size:14px;margin:14px 0 4px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:12px 0}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase} td.num{text-align:right;font-variant-numeric:tabular-nums} .wrap{overflow-x:auto}
  .kpi{display:flex;gap:10px;flex-wrap:wrap} .box{border:1px solid var(--line);border-radius:10px;padding:8px 12px} .box b{font-size:18px;display:block} .box span{font-size:11px;opacity:.7}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px} @media(max-width:640px){.cols{grid-template-columns:1fr}}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .s-Draft{color:var(--warn)} .s-Sent{color:var(--ok)}
  #msg{font-size:13px}
</style></head>
<body>
<h1>Báo cáo đơn đặt hàng sản xuất <span class="muted">(port 1:1 báo cáo MnfPl_Order — Report)</span></h1>
<p class="muted">Tổng hợp đơn đặt hàng SX theo loại ĐH / model / trạng thái. Nguồn = màn Đặt hàng sản xuất.</p>
<div class="bar">
  <div><label>Loại ĐH</label><input id="qy" style="width:90px"></div>
  <div><label>Model</label><input id="qm" style="width:90px"></div>
  <div><label>Trạng thái</label><select id="qs"><option value="">Tất cả</option><option value="Draft">Nháp</option><option value="Sent">Đã gửi</option></select></div>
  <button class="primary" onclick="run()">Xem báo cáo</button><span id="msg"></span>
</div>
<div class="kpi" id="kpi" style="margin:8px 0"></div>
<div class="cols">
  <div><h3>Theo model</h3><div class="wrap"><table><thead><tr><th>Model</th><th class="num">Số dòng</th><th class="num">SL</th></tr></thead><tbody id="mRows"></tbody></table></div></div>
  <div><h3>Theo loại ĐH</h3><div class="wrap"><table><thead><tr><th>Loại</th><th class="num">Số ĐH</th></tr></thead><tbody id="yRows"></tbody></table></div></div>
</div>
<h3>Chi tiết đơn hàng</h3>
<div class="wrap"><table><thead><tr><th>Số ĐH</th><th>Loại</th><th class="num">Số dòng</th><th class="num">Tổng SL</th><th>Trạng thái</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="muted">Nhấn "Xem báo cáo".</td></tr></tbody></table></div>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const ST={Draft:"Nháp",Sent:"Đã gửi"};
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY}; }
function msg(t){ F("msg").textContent=t; }
async function run(){ await token(); msg("");
  const r=await fetch(`/api/report/mnfplorder?ordType=${F("qy").value}&model=${F("qm").value}&status=${F("qs").value}`,{headers:H()});
  const d=await r.json();
  if(!r.ok){ msg("Lỗi: "+(d.error||r.status)); return; }
  F("kpi").innerHTML=`<div class="box"><b>${d.orders}</b><span>Số ĐH</span></div><div class="box"><b>${d.lines}</b><span>Số dòng</span></div><div class="box"><b>${d.totalQty}</b><span>Tổng SL</span></div><div class="box"><b>${d.sent}</b><span>Đã gửi</span></div>`;
  F("mRows").innerHTML=(d.byModel||[]).map(o=>`<tr><td><b>${o.modelCode}</b></td><td class="num">${o.lines}</td><td class="num">${o.qty}</td></tr>`).join("")||'<tr><td colspan="3" class="muted">—</td></tr>';
  F("yRows").innerHTML=(d.byType||[]).map(o=>`<tr><td>${o.ordType}</td><td class="num">${o.orders}</td></tr>`).join("")||'<tr><td colspan="2" class="muted">—</td></tr>';
  F("rows").innerHTML=(d.detail||[]).map(o=>`<tr><td><b>${o.orderNo}</b></td><td>${o.ordType||""}</td><td class="num">${o.lines}</td><td class="num">${o.qty}</td><td><span class="pill s-${o.status}">${ST[o.status]||o.status}</span></td></tr>`).join("")||'<tr><td colspan="5" class="muted">Không có dữ liệu.</td></tr>';
}
</script>
</body></html>
