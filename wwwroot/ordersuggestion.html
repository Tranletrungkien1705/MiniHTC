<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Gợi ý đặt hàng</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#4f46e5;--ok:#16a34a;--bad:#dc2626}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:960px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:10px 0}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)} th{opacity:.7;font-size:11px;text-transform:uppercase} td.num,th.num{text-align:right;font-variant-numeric:tabular-nums} tfoot td{font-weight:700;border-top:2px solid var(--line)} .wrap{overflow-x:auto}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:10px} .kpi{border:1px solid var(--line);border-radius:10px;padding:10px} .kpi b{font-size:18px;display:block}
  .sug{color:var(--accent);font-weight:700}
</style></head>
<body>
<h1>Báo cáo gợi ý đặt hàng <span class="muted">(port 1:1 FrmBCGoiYDatHang — 2010.HTC/Sales)</span></h1>
<p class="muted">Gợi ý SL đặt hàng = TB nhu cầu tháng (tổng SL đặt N tháng gần nhất / N) × hệ số. Gom theo đại lý + model + spec.</p>
<div class="row">
  <div><label>Số tháng lịch sử</label><input id="months" type="number" value="6" style="width:100px"></div>
  <div><label>Hệ số</label><input id="factor" type="number" step="0.1" value="1" style="width:90px"></div>
  <div><label>Đại lý</label><input id="dealer" style="width:110px"></div>
  <button class="primary" onclick="load()">Tính gợi ý</button>
</div>
<div class="grid2" id="kpis"></div>
<div class="wrap"><table><thead><tr><th>Đại lý</th><th>Model</th><th>Spec</th><th class="num">Tổng SL đặt</th><th class="num">TB/tháng</th><th class="num">Gợi ý đặt</th></tr></thead>
<tbody id="rows"><tr><td colspan="6" class="muted">Nhấn "Tính gợi ý".</td></tr></tbody>
<tfoot id="foot"></tfoot></table></div>

<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const M=n=>(+n||0).toLocaleString("vi-VN"); const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY}; }
async function load(){ await token();
  const p=new URLSearchParams(); p.set("months",+F("months").value||6); p.set("factor",+F("factor").value||1); if(F("dealer").value)p.set("dealer",F("dealer").value);
  const r=await fetch("/api/report/order-suggestion?"+p.toString(),{headers:H()}); const d=await r.json();
  F("kpis").innerHTML=`<div class="kpi"><b>${d.count}</b><span class="muted">Dòng gợi ý (${d.months} tháng, hệ số ${d.factor})</span></div><div class="kpi"><b class="sug">${M(d.totalSuggest)}</b><span class="muted">Tổng SL gợi ý đặt</span></div>`;
  F("rows").innerHTML=(d.rows||[]).map(o=>`<tr><td><b>${esc(o.dealerCode)}</b></td><td>${esc(o.modelCode)}</td><td>${esc(o.spec)}</td><td class="num">${M(o.totalQty)}</td><td class="num">${M(o.avgMonthly)}</td><td class="num sug">${M(o.suggestOrder)}</td></tr>`).join("")||'<tr><td colspan="6" class="muted">Không có dữ liệu đặt hàng.</td></tr>';
  F("foot").innerHTML=(d.rows&&d.rows.length)?`<tr><td colspan="5">TỔNG GỢI Ý ĐẶT</td><td class="num">${M(d.totalSuggest)}</td></tr>`:"";
}
</script>
</body></html>
