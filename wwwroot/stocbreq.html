<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Đề nghị cân bằng kho</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#4f46e5;--ok:#16a34a;--warn:#d97706;--red:#dc2626}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1000px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px} h3{font-size:14px;margin:14px 0 4px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
  input,button,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.link{border:none;background:none;color:var(--accent);padding:2px 6px} button.rej{color:var(--red)}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)} th{opacity:.7;font-size:11px;text-transform:uppercase} .wrap{overflow-x:auto}
  .msg{font-size:13px;margin-left:6px} textarea{width:100%;min-height:60px} .pill{font-size:11px;padding:1px 7px;border-radius:20px;border:1px solid var(--line)} .d{color:var(--warn);border-color:var(--warn)} .a{color:var(--ok);border-color:var(--ok)} .r{color:var(--red);border-color:var(--red)}
</style></head>
<body>
<h1>Đề nghị cân bằng kho <span class="muted">(port 1:1 FrmMngCBReq — TCMotor/Sales/Purchase)</span></h1>
<div class="card"><h3 style="margin-top:0">Tạo đề nghị</h3>
  <div class="row"><div style="flex:1"><label>Ghi chú</label><input id="remark" style="width:100%"></div></div>
  <p class="muted" style="margin:8px 0 2px">Xe (mỗi dòng: <b>VIN [tab] Model [tab] Spec [tab] Số máy</b>)</p>
  <textarea id="cars" placeholder="VIN00001&#9;CRETA&#9;CR-2.0&#9;ENG123"></textarea>
  <div class="row" style="margin-top:8px"><button class="primary" onclick="create2()">Tạo đề nghị</button><span id="msg" class="msg"></span></div>
</div>
<div class="card"><div class="row"><div><label>Số ĐN</label><input id="qNo" style="width:140px"></div><div><label>Trạng thái</label><select id="qStatus"><option value="">Tất cả</option><option value="Draft">Chờ duyệt</option><option value="Approved">Đã duyệt</option><option value="Rejected">Từ chối</option></select></div><button onclick="load()">Xem</button></div>
  <div id="kpi" class="muted" style="margin:6px 0"></div>
  <div class="wrap"><table><thead><tr><th>Số ĐN</th><th>Ngày</th><th>Xe</th><th>Ghi chú</th><th>Tạo bởi</th><th>Trạng thái</th><th></th></tr></thead>
  <tbody id="rows"><tr><td colspan="7" class="muted">Nhấn "Xem".</td></tr></tbody></table></div>
</div>
<div class="card" id="det" style="display:none"><h3 style="margin-top:0">Xe trong ĐN <span id="detNo" class="muted"></span></h3><div id="detBody" class="wrap"></div></div>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id); const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;"); const dt=s=>s?String(s).substring(0,10):"";
const st={Draft:['Chờ duyệt','d'],Approved:['Đã duyệt','a'],Rejected:['Từ chối','r']};
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function Hh(x){ return Object.assign({"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY}, x||{}); }
function say(t){ F("msg").textContent=t; setTimeout(()=>{if(F("msg").textContent===t)F("msg").textContent="";},4000); }
async function create2(){ await token();
  const cars=F("cars").value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const c=l.split(/\t/);return{VIN:(c[0]||"").trim(),ModelCode:(c[1]||"").trim(),SpecCode:(c[2]||"").trim(),EngineNo:(c[3]||"").trim()};});
  const r=await fetch("/api/stocbreqs",{method:"POST",headers:Hh({"Content-Type":"application/json"}),body:JSON.stringify({Remark:F("remark").value,Cars:cars})});
  const d=await r.json(); if(!r.ok){ say("Lỗi: "+(d.error||r.status)); return; } say(`Đã tạo ${d.cbReqNo} (${d.cars} xe)`); F("cars").value="";F("remark").value=""; load();
}
async function act(no,a){ await token(); const r=await fetch("/api/stocbreqs/"+no+"/"+a,{method:"POST",headers:Hh()}); const d=await r.json(); if(!r.ok)alert(d.error||r.status); load(); }
async function detail(no){ await token(); const r=await fetch("/api/stocbreqs/"+no+"/cars",{headers:Hh()}); const d=await r.json();
  F("det").style.display="block"; F("detNo").textContent="— "+no;
  F("detBody").innerHTML=`<table><thead><tr><th>VIN</th><th>Model</th><th>Spec</th><th>Số máy</th></tr></thead><tbody>${(d.cars||[]).map(c=>`<tr><td>${esc(c.vin)}</td><td>${esc(c.modelCode)}</td><td>${esc(c.specCode)}</td><td>${esc(c.engineNo)}</td></tr>`).join("")||'<tr><td colspan="4" class="muted">—</td></tr>'}</tbody></table>`;
}
async function load(){ await token();
  const qs=new URLSearchParams({no:F("qNo").value,status:F("qStatus").value});
  const r=await fetch("/api/stocbreqs?"+qs,{headers:Hh()}); const d=await r.json();
  F("kpi").textContent=`${d.count} đề nghị`;
  F("rows").innerHTML=(d.items||[]).map(o=>{const s=st[o.cbReqStatus]||['?',''];return `<tr><td><b>${esc(o.cbReqNo)}</b></td><td>${dt(o.createdDate)}</td><td>${o.cars}</td><td>${esc(o.remark)}</td><td>${esc(o.createdBy)}</td><td><span class="pill ${s[1]}">${s[0]}</span></td><td><button class="link" onclick="detail('${esc(o.cbReqNo)}')">Xe</button>${o.cbReqStatus==='Draft'?`<button class="link" onclick="act('${esc(o.cbReqNo)}','approve')">Duyệt</button><button class="link rej" onclick="act('${esc(o.cbReqNo)}','reject')">Từ chối</button>`:''}</td></tr>`;}).join("")||'<tr><td colspan="7" class="muted">Chưa có đề nghị.</td></tr>';
}
</script>
</body></html>
