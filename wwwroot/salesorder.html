<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Đơn đặt hàng</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#2563eb;--warn:#d97706;--ok:#16a34a}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1080px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.sm{padding:4px 9px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{opacity:.7;font-size:11px;text-transform:uppercase}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .p-Draft{color:var(--warn)} .p-Sent{color:#0891b2} .p-Approved1{color:#7c3aed} .p-Approved2{color:var(--ok)} .p-Rejected{color:#dc2626}
  #msg{font-size:13px} .cars{font-size:12px;opacity:.85} #ltbl td,#ltbl th{padding:4px 6px}
</style></head>
<body>
<h1>Đơn đặt hàng (Sales Order) <span class="muted">(port 1:1 FrmOrder — SalesOrder)</span></h1>
<div class="card">
  <b>Tạo đơn đặt hàng</b>
  <div class="bar" style="margin:10px 0">
    <div><label>Đại lý *</label><input id="dl" style="width:110px"></div>
    <div><label>Loại đơn</label><select id="ot"><option value="Plan">Kế hoạch</option><option value="UnPlan">Ngoài KH</option></select></div>
    <div><label>Hình thức TT</label><select id="pt"><option value="">—</option><option value="VONDAILY">Vốn đại lý</option><option value="BAOLANH">Bảo lãnh</option><option value="LC">Thanh toán LC</option></select></div>
    <span style="flex:1"></span><button class="primary" onclick="create()">Gửi đơn hàng</button><span id="msg"></span>
  </div>
  <table id="ltbl"><thead><tr><th>Model *</th><th>Spec</th><th>Loại HĐ</th><th>Năm SX</th><th>SL *</th><th>Ngày cần</th><th>Đơn giá</th><th>Ghi chú ĐL</th><th></th></tr></thead><tbody id="ltb"></tbody></table>
  <button class="sm" style="margin-top:6px" onclick="addLine()">+ Thêm dòng</button>
</div>
<div class="bar" style="margin:10px 0">
  <select id="fst" onchange="load()"><option value="">Tất cả TT</option><option value="Draft">Nháp</option><option value="Sent">Đã gửi</option></select>
  <select id="fty" onchange="load()"><option value="">Tất cả loại</option><option value="Plan">Kế hoạch</option><option value="UnPlan">Ngoài KH</option></select>
  <input id="q" placeholder="Lọc đại lý" oninput="load()" style="width:110px">
</div>
<table><thead><tr><th>Số đơn</th><th>Loại</th><th>Đại lý</th><th>HT thanh toán</th><th>Dòng</th><th>Tổng SL</th><th>Ngày tạo</th><th>Trạng thái</th><th></th></tr></thead>
<tbody id="rows"><tr><td colspan="9" class="muted">Đang tải…</td></tr></tbody></table>
<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const LBL={Draft:"Nháp",Sent:"Đã gửi",Approved1:"Duyệt cấp 1",Approved2:"Duyệt cấp 2",Rejected:"Từ chối"}; const TY={Plan:"Kế hoạch",UnPlan:"Ngoài KH"};
const PY={VONDAILY:"Vốn ĐL",BAOLANH:"Bảo lãnh",LC:"LC"}; const day=d=>d? new Date(d).toLocaleString("vi-VN"):"";
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(){ return {"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY,"Content-Type":"application/json"}; }
function msg(t){ F("msg").textContent=t; }
function addLine(){ const tr=document.createElement("tr");
  tr.innerHTML=`<td><input class="md" style="width:80px"></td><td><input class="sp" style="width:70px"></td><td><input class="ct" style="width:70px"></td><td><input class="yr" style="width:60px"></td><td><input class="qt" type="number" style="width:60px"></td><td><input class="rd" type="date"></td><td><input class="up" type="number" style="width:90px"></td><td><input class="rk" style="width:90px"></td><td><button class="sm" onclick="this.closest('tr').remove()">×</button></td>`;
  F("ltb").appendChild(tr); }
async function create(){
  const lines=[...F("ltb").querySelectorAll("tr")].map(tr=>({modelCode:tr.querySelector(".md").value,specCode:tr.querySelector(".sp").value,contractType:tr.querySelector(".ct").value,yearProduction:tr.querySelector(".yr").value,requestedQuantity:parseInt(tr.querySelector(".qt").value)||0,requestedDate:tr.querySelector(".rd").value||null,unitPrice:parseFloat(tr.querySelector(".up").value)||0,remarkDL:tr.querySelector(".rk").value})).filter(l=>l.modelCode);
  const r=await fetch("/api/salesorders",{method:"POST",headers:H(),body:JSON.stringify({dealerCode:F("dl").value,orderType:F("ot").value,payType:F("pt").value||null,lines})});
  const j=await r.json();
  if(r.ok){ msg("Đã tạo "+j.soCode+" ("+j.lines+" dòng)."); F("ltb").innerHTML="";addLine(); load(); } else msg("Lỗi: "+(j.error||r.status));
}
async function load(){ await token();
  const d=await (await fetch(`/api/salesorders?status=${F("fst").value}&type=${F("fty").value}&dealer=${F("q").value}`,{headers:H()})).json();
  F("rows").innerHTML=(d.items||[]).map(o=>{
    let act=o.status==="Draft"?`<button class="sm" onclick="send('${o.soCode}')">Gửi</button>`
      :o.status==="Sent"?`<button class="sm" onclick="approve1('${o.soCode}')">Duyệt C1</button> <button class="sm" onclick="reject('${o.soCode}')">Từ chối</button>`
      :o.status==="Approved1"?`<button class="sm" onclick="approve2('${o.soCode}')">Duyệt C2</button> <button class="sm" onclick="reject('${o.soCode}')">Từ chối</button>`:"";
    let extra=o.salesPolicy?`<div class="cars">CS: ${o.salesPolicy}${o.expectedMonth?" · DK "+day(o.expectedMonth):""}</div>`:"";
    return `<tr><td><b>${o.soCode}</b> <a href="#" class="cars" onclick="lines('${o.soCode}');return false">xem dòng</a>${extra}</td><td>${TY[o.orderType]||o.orderType}</td><td>${o.dealerCode}</td><td>${PY[o.payType]||""}</td><td>${o.lines}</td><td>${o.qty}</td>
      <td>${day(o.createdAt)}</td><td><span class="pill p-${o.status}">${LBL[o.status]||o.status}</span></td><td>${act}</td></tr><tr id="x-${o.soCode}"></tr>`;
  }).join("")||'<tr><td colspan="9" class="muted">Chưa có đơn hàng.</td></tr>';
}
async function send(no){ const r=await fetch(`/api/salesorders/${no}/send`,{method:"POST",headers:H()}); const j=await r.json(); if(r.ok) load(); else msg("Lỗi: "+(j.error||r.status)); }
async function approve1(no){
  const sp=prompt("Chính sách bán (SPCode):","SP01"); if(sp===null) return;
  const em=prompt("Tháng dự kiến (YYYY-MM-DD):","");
  const r=await fetch(`/api/salesorders/${no}/approve1`,{method:"POST",headers:H(),body:JSON.stringify({salesPolicy:sp,expectedMonth:em||null,productionMonth:null,latestDeliveryDate:null})});
  const j=await r.json(); if(r.ok) load(); else msg("Lỗi: "+(j.error||r.status));
}
async function approve2(no){ const r=await fetch(`/api/salesorders/${no}/approve2`,{method:"POST",headers:H()}); const j=await r.json(); if(r.ok) load(); else msg("Lỗi: "+(j.error||r.status)); }
async function reject(no){ const rs=prompt("Lý do từ chối:",""); if(rs===null) return; const r=await fetch(`/api/salesorders/${no}/reject`,{method:"POST",headers:H(),body:JSON.stringify({reason:rs})}); const j=await r.json(); if(r.ok) load(); else msg("Lỗi: "+(j.error||r.status)); }
async function lines(no){
  const row=F("x-"+no); if(row.innerHTML){ row.innerHTML=""; return; }
  const d=await (await fetch(`/api/salesorders/${no}/lines`,{headers:H()})).json();
  row.innerHTML=`<td colspan="9"><div class="cars">${(d.lines||[]).map(l=>`<b>${l.modelCode}</b>${l.specCode?"/"+l.specCode:""} × ${l.requestedQuantity}${l.unitPrice?" @ "+l.unitPrice.toLocaleString("vi-VN"):""}${l.remarkDL?" · "+l.remarkDL:""}`).join(" &nbsp;|&nbsp; ")||"—"}</div></td>`;
}
addLine(); load();
</script>
</body></html>
