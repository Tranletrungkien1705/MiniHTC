<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHTC — Đính kèm & báo cáo BH</title>
<style>
  :root{color-scheme:light dark;--line:#8883;--accent:#4f46e5;--ok:#16a34a;--bad:#dc2626;--warn:#d97706}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:1000px;margin:24px auto;padding:0 16px;line-height:1.5}
  h1{font-size:20px;margin:0 0 2px} .muted{opacity:.65;font-size:13px} h3{font-size:14px;margin:16px 0 4px}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
  label{font-size:12px;opacity:.7;display:block;margin-bottom:2px}
  input,button,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
  button{cursor:pointer} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.link{border:none;background:none;color:var(--accent);padding:2px 6px} button.del{color:var(--bad)}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)} th{opacity:.7;font-size:11px;text-transform:uppercase} td.num,th.num{text-align:right;font-variant-numeric:tabular-nums} tfoot td{font-weight:700;border-top:2px solid var(--line)} .wrap{overflow-x:auto}
  .tabs{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap} .tab{padding:6px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer} .tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .msg{font-size:13px;margin-left:6px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:10px}
  .kpi{border:1px solid var(--line);border-radius:10px;padding:10px} .kpi b{font-size:18px;display:block}
</style></head>
<body>
<h1>Đính kèm & báo cáo bảo hành <span class="muted">(port 1:1 FrmROAttachment + FrmWarrantyReportAcceptRpt — TCMotor)</span></h1>
<div class="tabs"><div class="tab on" id="tA" onclick="tab('A')">File đính kèm</div><div class="tab" id="tB" onclick="tab('B')">BC chấp thuận</div></div>

<div id="paneA">
  <div class="card"><h3 style="margin-top:0">File đính kèm theo đề nghị BH</h3>
    <div class="row"><div><label>ID đề nghị BH *</label><input id="cId" type="number" style="width:120px"></div><button onclick="loadFiles()">Xem file</button><span id="msg" class="muted"></span></div>
    <div class="row" style="margin-top:8px"><div><label>Tên file</label><input id="fName" style="width:200px" placeholder="anh_loi_1.jpg"></div><div style="flex:1"><label>Ghi chú</label><input id="fNote" style="width:100%"></div><button class="primary" onclick="addFile()">Thêm</button><span id="msg2" class="msg"></span></div>
    <div class="wrap"><table><thead><tr><th>ID</th><th>Tên file</th><th>Ghi chú</th><th>Thời gian</th><th></th></tr></thead><tbody id="fRows"><tr><td colspan="5" class="muted">Nhập ID đề nghị rồi "Xem file".</td></tr></tbody></table></div>
  </div>
</div>

<div id="paneB" style="display:none">
  <div class="row"><div><label>Tháng (YYYY-MM, để trống = tất cả)</label><input id="bMonth" type="month"></div><button class="primary" onclick="repB()">Xem</button></div>
  <div class="grid2" id="bKpi"></div>
  <div class="wrap"><table><thead><tr><th>Đại lý</th><th class="num">Số ĐN chấp thuận</th><th class="num">Tổng tiền BH</th></tr></thead>
  <tbody id="bRows"><tr><td colspan="3" class="muted">Nhấn "Xem".</td></tr></tbody>
  <tfoot id="bFoot"></tfoot></table></div>
</div>

<script>
let TOKEN=null; const KEY="demo-htc"; const F=id=>document.getElementById(id);
const M=n=>Math.round(+n||0).toLocaleString("vi-VN"); const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
async function token(){ if(TOKEN) return TOKEN;
  const r=await fetch("https://minisso.onrender.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=password&client_id=fleet-service&client_secret=service-secret-demo&username=admin@minisso.dev&password=Admin@123&scope=openid profile email roles"});
  TOKEN=(await r.json()).access_token; return TOKEN; }
function H(extra){ return Object.assign({"Authorization":"Bearer "+TOKEN,"X-Api-Key":KEY}, extra||{}); }
function m(id,t){ F(id).textContent=t; setTimeout(()=>{if(F(id).textContent===t)F(id).textContent="";},3500); }
function tab(x){ ["A","B"].forEach(k=>{ F("pane"+k).style.display=k===x?"block":"none"; F("t"+k).className="tab"+(k===x?" on":""); }); }
async function loadFiles(){ await token(); const id=+F("cId").value; if(!id){ m("msg","Cần ID."); return; }
  const r=await fetch("/api/warrantyclaims/"+id+"/attachments",{headers:H()}); const d=await r.json();
  if(!r.ok){ m("msg",d.error||"Không thấy ĐN "+id); F("fRows").innerHTML=""; return; }
  m("msg","ĐN "+d.claimNo+" — "+d.count+" file");
  F("fRows").innerHTML=(d.files||[]).map(o=>`<tr><td>${o.id}</td><td><b>${esc(o.fileName)}</b></td><td>${esc(o.fileNote)}</td><td>${esc(o.createdAt)}</td><td><button class="link del" onclick="delFile(${id},${o.id})">Xóa</button></td></tr>`).join("")||'<tr><td colspan="5" class="muted">Chưa có file.</td></tr>';
}
async function addFile(){ await token(); const id=+F("cId").value; if(!id){ m("msg2","Cần ID đề nghị."); return; }
  const r=await fetch("/api/warrantyclaims/"+id+"/attachments",{method:"POST",headers:H({"Content-Type":"application/json"}),body:JSON.stringify({FileName:F("fName").value,FileNote:F("fNote").value})});
  const d=await r.json(); if(!r.ok){ m("msg2","Lỗi: "+(d.error||r.status)); return; }
  m("msg2","Đã thêm "+d.fileName); F("fName").value="";F("fNote").value=""; loadFiles();
}
async function delFile(id,attId){ await token();
  await fetch("/api/warrantyclaims/"+id+"/attachments/"+attId,{method:"DELETE",headers:H()}); loadFiles();
}
async function repB(){ await token();
  const mo=F("bMonth").value; const r=await fetch("/api/report/warranty-accept"+(mo?"?month="+mo:""),{headers:H()}); const d=await r.json();
  F("bKpi").innerHTML=`<div class="kpi"><b>${d.count}</b><span class="muted">Số đại lý</span></div><div class="kpi"><b style="color:var(--ok)">${M(d.grandTotal)}</b><span class="muted">Tổng tiền BH chấp thuận</span></div>`;
  F("bRows").innerHTML=(d.rows||[]).map(o=>`<tr><td><b>${esc(o.dealerCode)}</b></td><td class="num">${o.claims}</td><td class="num" style="color:var(--ok)">${M(o.totalAmount)}</td></tr>`).join("")||'<tr><td colspan="3" class="muted">Không có dữ liệu.</td></tr>';
  F("bFoot").innerHTML=(d.rows&&d.rows.length)?`<tr><td>TỔNG</td><td class="num">${(d.rows||[]).reduce((s,x)=>s+x.claims,0)}</td><td class="num">${M(d.grandTotal)}</td></tr>`:"";
}
</script>
</body></html>
